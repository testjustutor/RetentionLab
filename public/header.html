    <!-- Header -->
    <header class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-6 p-2 rounded-2xl border border-slate-800 bg-slate-900/70 backdrop-blur">
      <div>
        <div id="headerRoleTitle" class="text-xs uppercase tracking-[0.3em] text-indigo-400 font-semibold" data-label-key="header.roleTitle"></div>
        <h1 id="pageTitle" class="text-2xl font-bold text-white mt-1" data-label-key="header.pageTitle"></h1>
        <p id="pageDescription" class="text-sm text-slate-400 mt-0.5" data-label-key="header.pageDescription"></p>
      </div>
      <div class="flex gap-2 items-center">
        <!-- Header stats -->
        <div id="headerStats" class="hidden flex gap-3 mr-2" data-stats-container="true">
          <div class="text-center">
            <div class="text-lg font-bold text-white" id="hTotalUsers">0</div>
            <div class="text-xs text-slate-500">Accounts</div>
          </div>
          <div class="w-px bg-slate-800"></div>
          <div class="text-center">
            <div class="text-lg font-bold text-indigo-400" id="hTotalMeetings">0</div>
            <div class="text-xs text-slate-500">Meetings</div>
          </div>
        </div>

        <!-- Home button -->

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg>
        </a> -->

        <a id="navEventsBtn" target="_blank" href="#" class="px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 text-sm font-semibold hover:bg-slate-700 transition-colors" data-label-key="nav.events">Events</a>
        <a id="navArchivesBtn" target="_blank" href="#" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-500 transition-colors" data-label-key="nav.archives">Archives</a>
 -->

        <!-- Divider -->
        <div class="w-px h-6 bg-slate-700 mx-1"></div>

        <!-- Profile dropdown -->
        <div class="relative" id="profileMenuWrap">
          <button id="profileBtn" type="button" class="flex items-center gap-2 px-2 py-1.5 rounded-xl bg-slate-800 border border-slate-700 hover:border-slate-600 transition-colors group" aria-haspopup="true" aria-expanded="false">
            <!-- Avatar circle -->
            <div id="profileAvatar" class="w-7 h-7 rounded-lg bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-indigo-300 font-bold text-xs select-none">
            </div>
            <div class="text-left hidden sm:block">
              <div id="profileName" class="text-xs font-semibold text-slate-200 leading-tight max-w-[100px] truncate"></div>
              <div id="profileEmail" class="text-[10px] text-slate-500 leading-tight max-w-[100px] truncate"></div>
            </div>
            <!-- Chevron -->
            <svg id="profileChevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="text-slate-500 transition-transform duration-200"><polyline points="6 9 12 15 18 9"/></svg>
          </button>

          <!-- Dropdown menu -->
          <div id="profileMenu" class="hidden absolute right-0 top-full mt-2 w-52 bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl shadow-black/40 z-50 overflow-hidden py-1">
            <!-- User info strip -->
            <div class="px-4 py-3 border-b border-slate-800">
              <div id="dropdownName" class="text-sm font-semibold text-slate-100 truncate"></div>
              <div id="dropdownEmail" class="text-xs text-slate-500 truncate mt-0.5"></div>
            </div>

            <!-- Menu items -->
            <div class="py-1">
              <a id="navDashboardBtn" href="#" class="flex items-center gap-3 px-4 py-2 text-xs text-slate-300 hover:bg-slate-800/70 hover:text-white transition-colors" data-label-key="profile.home">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg>
                Home / Dashboard
              </a>

              <a id="navProfileBtn" href="#" class="flex items-center gap-3 px-4 py-2 text-xs text-slate-300 hover:bg-slate-800/70 hover:text-white transition-colors" data-label-key="profile.menu.myProfile">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                My Profile
              </a>

              <a id="navSettingsBtn" href="#" class="flex items-center gap-3 px-4 py-2 text-xs text-slate-300 hover:bg-slate-800/70 hover:text-white transition-colors">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Settings
              </a>
            </div>

            <!-- Divider + logout -->
            <div class="border-t border-slate-800 py-1">
              <button id="navLogoutBtn" type="button" class="w-full flex items-center gap-3 px-4 py-2 text-xs text-rose-400 hover:bg-rose-500/10 hover:text-rose-300 transition-colors">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
              </button>
            </div>
          </div>
        </div>

      </div>
    </header>
