<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity & Schedule Intelligence</title>
    
    <!-- Using Tailwind CDN for robust and modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        slate: {
                            850: '#141E33',
                            900: '#0F172A',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(37, 99, 235, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(124, 58, 237, 0.08) 0%, transparent 50%);
            color: #f8fafc;
            min-height: 100vh;
        }

        /* Custom Scrollbar for inner lists */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(71, 85, 105, 0.8);
        }
    </style>
</head>
<body class="antialiased font-sans p-2 sm:p-4">
    <div class="max-w-6xl mx-auto flex flex-col gap-4">
        
        <!-- Header -->
        <header class="flex items-center gap-3 mb-0 bg-slate-900/60 backdrop-blur-md rounded-xl border border-slate-800/80 shadow-md p-3">
            <div class="inline-flex items-center justify-center p-2 bg-indigo-500/10 rounded-lg border border-indigo-500/20 shadow-[0_0_15px_rgba(99,102,241,0.15)] shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="m9 16 2 2 4-4"/></svg>
            </div>
            <div class="flex-1">
                <h1 class="text-lg font-bold tracking-tight text-white mb-0.5 leading-tight">Identity & Schedule Intelligence</h1>
                <p class="text-slate-400 text-xs truncate max-w-full lg:max-w-4xl">Provision distributed integration nodes and monitor heterogeneous schedule networks centralized.</p>
            </div>
            <div class="flex items-center gap-2">
                <a href="/archives.html" class="bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 border border-indigo-500/30 px-3 py-1.5 rounded-lg transition-colors text-xs font-semibold flex items-center gap-2 whitespace-nowrap">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    Archives
                </a>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
            
            <!-- Left Column: Accounts Mgt -->
            <div class="lg:col-span-4 flex flex-col gap-4">
                
                <!-- Connect Section -->
                <div class="bg-slate-900/60 backdrop-blur-md rounded-xl border border-slate-800/80 shadow-md overflow-hidden shrink-0">
                    <div class="px-4 py-2 border-b border-slate-800/60 bg-slate-800/30">
                        <h2 class="text-slate-200 font-semibold flex items-center gap-2 text-[11px] uppercase tracking-wide">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
                            Link Account
                        </h2>
                    </div>
                    <div class="p-3 space-y-3">
                        <div>
                            <input type="email" id="newUserEmail" placeholder="user@company.com" class="w-full bg-slate-950/50 border border-slate-700/80 text-white rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 shadow-inner placeholder-slate-600 transition-all">
                        </div>
                        <button onclick="connectNewUser()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs py-2 px-3 rounded-lg shadow shadow-indigo-500/20 transition-all flex items-center justify-center gap-1.5">
                            <span>Authenticate with Google</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                        </button>
                        <div id="connectMessage" class="hidden rounded-lg p-2 text-xs font-medium border mt-2"></div>
                    </div>
                </div>

                <!-- Accounts List -->
                <div class="bg-slate-900/60 backdrop-blur-md rounded-xl border border-slate-800/80 shadow-md overflow-hidden flex flex-col flex-1 min-h-[300px] lg:h-[calc(100vh-[240px])]">
                    <div class="px-4 py-2 border-b border-slate-800/60 bg-slate-800/30 flex justify-between items-center">
                        <h2 class="text-slate-200 font-semibold flex items-center gap-2 text-[11px] uppercase tracking-wide">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            Active Identities
                        </h2>
                        <span class="bg-slate-800 text-[10px] font-bold text-slate-300 px-1.5 py-0.5 rounded border border-slate-700" id="userCount">0</span>
                    </div>
                    <div id="usersList" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-2">
                        <!-- User Cards dynamic insertion -->
                    </div>
                </div>

            </div>

            <!-- Right Column: Calendar & Controls -->
            <div class="lg:col-span-8">
                
                <div id="userCalendarView" class="hidden bg-slate-900/60 backdrop-blur-md rounded-xl border border-slate-800/80 shadow-md h-[550px] lg:h-[calc(100vh-120px)] flex flex-col overflow-hidden relative">
                    
                    <!-- Decorative glowing orb -->
                    <div class="absolute top-0 right-0 w-64 h-64 bg-indigo-500/10 blur-[80px] pointer-events-none rounded-full"></div>

                    <!-- Header Tools -->
                    <div class="px-4 py-3 border-b border-slate-800/60 bg-slate-800/20 z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shrink-0">
                        <div>
                            <h2 id="currentUserTitle" class="text-base font-bold text-white tracking-tight flex items-center gap-1.5">
                                Calendar Events
                            </h2>
                            <p class="text-[10px] text-slate-400 flex items-center gap-1.5 mt-0.5">
                                <span class="relative flex h-1.5 w-1.5">
                                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                  <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span>
                                </span>
                                Connection Live
                            </p>
                        </div>
                        
                        <div class="flex gap-2">
                            <div class="bg-slate-950/50 flex rounded-lg border border-slate-700/50">
                                <select id="hoursAhead" class="bg-transparent text-[11px] font-medium text-slate-300 px-2 py-1.5 focus:outline-none cursor-pointer border-r border-slate-700/50">
                                    <option value="12">12 Hours</option>
                                    <option value="24" selected>24 Hours</option>
                                    <option value="48">48 Hours</option>
                                    <option value="168">7 Days</option>
                                </select>
                                <select id="platformFilter" class="bg-transparent text-[11px] font-medium text-slate-300 px-2 py-1.5 focus:outline-none cursor-pointer">
                                    <option value="">All Networks</option>
                                    <option value="zoom">Zoom</option>
                                    <option value="teams">Teams</option>
                                    <option value="google-meet">G-Meet</option>
                                </select>
                            </div>
                            <button onclick="fetchUserMeetings()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg p-1.5 transition-colors flex items-center justify-center group" title="Refresh">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400 group-hover:text-white transition" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Bot Action Console -->
                     <div id="quickJoinArea" class="px-3 pt-3 pb-0 z-10 hidden shrink-0">
                         <div id="quickJoinMessage" class="hidden rounded-lg p-2 text-[11px] tracking-wide font-mono border"></div>
                     </div>

                    <!-- Meetings List -->
                    <div class="flex-1 relative z-10 overflow-hidden flex flex-col">
                        <div id="loadingIndicator" class="hidden absolute inset-0 bg-slate-900/80 backdrop-blur-sm flex col items-center justify-center z-20">
                            <div class="w-8 h-8 border-[3px] border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-3"></div>
                            <p class="text-indigo-400 font-medium font-mono text-xs tracking-wider uppercase" id="loadingText">Syncing Calendar...</p>
                        </div>
                        <div id="meetingsList" class="p-3 flex flex-col gap-2 overflow-y-auto custom-scrollbar flex-1">
                            <!-- Meeting Cards -->
                            <div class="flex flex-col items-center justify-center h-full text-slate-500 gap-3 opacity-60 min-h-[200px]">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                                <p class="text-xs">Select an account to view scheduled events</p>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Script Block updated to output Tailwind structured HTML -->
    <script>
        let users = []; 
        let currentUser = null;

        function getStatusClasses(type) {
            if(type === 'success') return 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400';
            if(type === 'error') return 'bg-rose-500/10 border-rose-500/30 text-rose-400';
            return 'bg-blue-500/10 border-blue-500/30 text-blue-400';
        }

        function updateUserList() {
            const countEl = document.getElementById('userCount');
            const listEl = document.getElementById('usersList');
            countEl.textContent = users.length;

            if (users.length === 0) {
                listEl.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-6 text-center px-4 border border-dashed border-slate-800 rounded-lg my-2 opacity-60">
                        <svg class="w-6 h-6 text-slate-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        <p class="text-[11px] text-slate-400 font-medium">No accounts linked</p>
                    </div>`;
                return;
            }

            let html = '';
            users.forEach((user, index) => {
                const isActive = currentUser && currentUser.email === user.email;
                const statusBadge = user.authorized 
                    ? `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-1.5 py-[1px] rounded text-[9px] uppercase font-bold tracking-wider">Active</span>`
                    : `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-1.5 py-[1px] rounded text-[9px] uppercase font-bold tracking-wider">Pending</span>`;

                html += `
                    <div class="bg-slate-950/40 border ${isActive ? 'border-indigo-500/50 shadow-[0_0_15px_rgba(99,102,241,0.1)]' : 'border-slate-800 hover:border-slate-700'} rounded-lg p-2.5 transition duration-200">
                        <div class="flex items-start justify-between mb-2">
                            <div class="flex items-center gap-2 overflow-hidden">
                                <div class="w-6 h-6 rounded-md bg-indigo-500/20 flex items-center justify-center shrink-0 border border-indigo-500/30 text-indigo-300 font-bold text-[10px] uppercase">
                                    ${user.accountName.substring(0, 2)}
                                </div>
                                <div class="min-w-0">
                                    <div class="text-[11px] font-semibold text-slate-200 truncate pr-2">${user.email}</div>
                                </div>
                            </div>
                            <div class="flex pb-1">
                                <button onclick="disconnectUser(${index})" class="text-slate-500 hover:text-rose-400 p-1 rounded hover:bg-rose-500/10 transition" title="Disconnect">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="flex items-center justify-between mt-1 pt-2 border-t border-slate-800/60">
                            ${statusBadge}
                            <div class="flex gap-1.5">
                                <button onclick="selectUser(${index})" class="px-2 py-1 bg-indigo-600/10 hover:bg-indigo-600/20 text-indigo-400 border border-indigo-500/20 rounded text-[10px] font-semibold transition flex items-center gap-1 ${isActive ? 'bg-indigo-600 text-white hover:bg-indigo-500' : ''}">Events</button>
                                <button onclick="checkUserStatus(${index})" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded text-[10px] font-semibold transition flex items-center gap-1">Status</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        async function connectNewUser() {
            const email = document.getElementById('newUserEmail').value.trim();
            if (!email) {
                showMessage('connectMessage', 'error', 'Email is required');
                return;
            }

            if (users.find(u => u.email === email)) {
                showMessage('connectMessage', 'error', 'Identity already exists');
                return;
            }

            try {
                showMessage('connectMessage', 'info', 'Generating secure token...');
                const response = await fetch('/api/calendar/multi/auth', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ email })
                });
                const data = await response.json();

                if (data.status === 'success' && data.url) {

                    const width = 600, height = 700;
                    const left = (window.innerWidth / 2) - (width / 2);
                    const top = (window.innerHeight / 2) - (height / 2);

                    const popup = window.open(
                                    data.url, 
                                    'googleAuth', 
                                    `width=${width},height=${height},left=${left},top=${top}`
                                );
                    if (!popup) {
                        showMessage('connectMessage', 'error', 'Popup blocker intercepted request.');
                        return;
                    }

                    // Add pending user
                    const newUser = { 
                        email: email, 
                        accountName: email.split('@')[0], 
                        authorized: false, 
                        connectedAt: Date.now() 
                    };
                    users.push(newUser);
                    const userIndex = users.length - 1;
                    updateUserList();

                    // Poll status
                    const poll = setInterval(async () => {
                        await checkUserStatus(userIndex);
                        if (users[userIndex].authorized) {
                            clearInterval(poll);
                            showMessage('connectMessage', 'success', 'Identity securely linked.');
                        }
                    }, 3000);
                    setTimeout(() => clearInterval(poll), 60000);

                } else {
                    showMessage('connectMessage', 'error', data.message || 'Authorization failed');
                }
            } catch (err) {
                showMessage('connectMessage', 'error', err.message);
            }
        }

        async function checkUserStatus(index) {
            try {
                const res = await fetch('/api/calendar/multi/users');
                const data = await res.json();
                const remoteUser = data.data.find(u => u.email === users[index].email);
                if (remoteUser && remoteUser.tokenExpiry) {
                    users[index].authorized = true;
                    updateUserList();
                }
            } catch (e) { console.error(e); }
        }

        function selectUser(index) {
            currentUser = users[index];
            document.getElementById('currentUserTitle').innerHTML = `
                <span class="text-indigo-400 font-mono font-medium text-xs leading-none mt-0.5">@</span>
                <span class="truncate max-w-[200px] sm:max-w-xs text-sm">${currentUser.accountName}</span>
            `;
            document.getElementById('userCalendarView').classList.remove('hidden');
            updateUserList(); // Re-render to show active styling
            fetchUserMeetings();
        }

        async function quickJoinMeeting(meetingId, passcode, meetingUrl, platform) {
            try {
                const account = currentUser.email;
                
                document.getElementById('quickJoinArea').classList.remove('hidden');
                showMessage('quickJoinMessage', 'info', 'Initializing Bot Observer deployment sequence...');

                const response = await fetch('/api/bot/start-bot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        platform: platform, 
                        meetingId: meetingId,
                        passcode: passcode,
                        meetingUrl: meetingUrl
                    })
                });

                const data = await response.json();
                console.log(data);
                if (data.success === true) {
                    showMessage('quickJoinMessage', 'success', `[SUCCESS] Bot dispatched. Meeting: ${meetingId} | Origin: ${account}`);
                    setTimeout(() => {
                        document.getElementById('quickJoinArea').classList.add('hidden');
                        // fetchUserMeetings();
                    }, 4000);
                } else {
                    showMessage('quickJoinMessage', 'error', '[FAILED] ' + data.message);
                }
            } catch (err) {
                showMessage('quickJoinMessage', 'error', '[ERROR] ' + err.message);
            }
        }

        function handleQuickJoin(el) {
            const meetingId = el.dataset.id;
            const passcode = el.dataset.pass;
            const meetingUrl = el.dataset.link;
            const platform = el.dataset.platform;
            quickJoinMeeting(meetingId, passcode, meetingUrl, platform);
        }

        async function fetchUserMeetings() {
            if (!currentUser) return;
            try {
                showLoading();
                const hours = document.getElementById('hoursAhead').value;
                const platform = document.getElementById('platformFilter').value;
                let url = '/api/calendar/multi/events';
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: currentUser.email,
                        hoursAhead: hours,
                        platform: platform || ''
                    })
                });
                const data = await res.json();
                hideLoading();
                if (data.status === 'success') {
                    displayMeetings(data.events || data.data?.meetings || []);
                } else {
                    document.getElementById('meetingsList').innerHTML = `<div class="rounded-xl p-4 text-sm font-mono border ${getStatusClasses('error')}">${data.message}</div>`;
                }
            } catch (err) {
                hideLoading();
                document.getElementById('meetingsList').innerHTML = `<div class="rounded-xl p-4 text-sm font-mono border ${getStatusClasses('error')}">Exception: ${err.message}</div>`;
            }
        }

        function getPlatformColor(platform) {
            switch(platform) {
                case 'zoom': return 'text-blue-400 bg-blue-500/10 border-blue-500/20';
                case 'teams': return 'text-indigo-400 bg-indigo-500/10 border-indigo-500/20';
                case 'google-meet': return 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20';
                case 'google': return 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20';
                case 'webex': return 'text-cyan-400 bg-cyan-500/10 border-cyan-500/20';
                default: return 'text-slate-400 bg-slate-500/10 border-slate-500/20';
            }
        }

        function displayMeetings(meetings) {
            let html = '';
            const listEl = document.getElementById('meetingsList');

            if (!meetings || meetings.length === 0) {
                listEl.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-500 gap-2 opacity-60">
                        <svg class="w-8 h-8 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
                        <p class="text-xs font-medium">No schedule data detected</p>
                    </div>`;
                return;
            }

            meetings.sort((a, b) => new Date(a.start) - new Date(b.start));

            meetings.forEach(meeting => {
                const dateObj = new Date(meeting.start);
                const startTime = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const startDate = dateObj.toLocaleDateString([], { month: 'short', day: 'numeric' });

                const platformRaw = (meeting.platform || 'unknown').toLowerCase();
                const platformLabel = platformRaw === 'google-meet' || platformRaw === 'google' ? 'G-Meet' : 
                                      platformRaw === 'zoom' ? 'Zoom' : 
                                      platformRaw === 'teams' ? 'Teams' : platformRaw;
                
                const platformStyle = getPlatformColor(platformRaw);
                
                const meetingId = meeting.meetingId || "";
                const passcode = meeting.passcode || "";
                const meetingLink = meeting.link || "";
                
                const isReady = (platformRaw === 'zoom' || platformRaw === 'google-meet' || platformRaw === 'google' || platformRaw === 'teams');

                html += `
                    <div class="bg-slate-950/40 border border-slate-800 rounded-xl p-2.5 hover:border-slate-700 transition relative overflow-hidden group">
                        <!-- Abstract left accent -->
                        <div class="absolute left-0 top-0 bottom-0 w-0.5 bg-gradient-to-b from-indigo-500/50 to-purple-500/50 opacity-50 group-hover:opacity-100 transition"></div>
                        
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                            
                            <div class="space-y-1.5 flex-1 min-w-0 pl-1.5 pr-2">
                                <div class="flex items-center gap-2">
                                    <h3 class="text-slate-200 font-semibold text-xs leading-none truncate group-hover:text-white">${meeting.title || 'Untitled Session'}</h3>
                                    <span class="px-1 py-[1px] rounded uppercase font-bold tracking-wider border ${platformStyle} text-[9px] shrink-0">
                                        ${platformLabel}
                                    </span>
                                </div>
                                <div class="flex items-center gap-2 text-[10px]">
                                    <span class="flex items-center gap-1 text-slate-400 font-medium tracking-wide">
                                        <svg class="w-3 h-3 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                        ${startDate} • ${startTime}
                                    </span>
                                </div>
                                
                                <div class="bg-slate-900 rounded p-1.5 border border-slate-800 inline-flex flex-wrap items-center gap-2 max-w-full">
                                    <div class="font-mono text-[9px] text-slate-400 flex items-center gap-1 min-w-0">
                                        <svg class="w-2.5 h-2.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                                        ${meetingId ? `<span class="text-slate-300">ID</span><span class="text-emerald-400 truncate">${meetingId}</span>` : 'Link Only'}
                                        ${passcode ? `<span class="mx-0.5 text-slate-600">|</span><span class="text-emerald-400 truncate">${passcode}</span>` : ''}
                                    </div>
                                    ${meetingLink ? `
                                        <a href="${meetingLink}" target="_blank" class="text-indigo-400 hover:text-indigo-300 text-[9px] font-semibold px-1.5 border border-indigo-500/20 py-0.5 rounded bg-indigo-500/10 transition shrink-0 ml-auto flex gap-1 items-center">
                                            App <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
                                        </a>` : ''}
                                </div>
                            </div>

                            <div class="shrink-0 flex items-center justify-end">
                                ${isReady ? `
                                    <button class="bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white shadow shadow-emerald-500/20 font-semibold px-2.5 py-1.5 rounded-md text-[10px] transition flex items-center justify-center gap-1"
                                        data-id="${meetingId}" data-pass="${passcode}" data-link="${meetingLink}" data-platform="${platformRaw}" onclick="handleQuickJoin(this)">
                                        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
                                        Deploy Bot
                                    </button>
                                ` : `
                                    <button class="bg-slate-800 text-slate-500 cursor-not-allowed font-semibold px-2.5 py-1.5 rounded-md text-[10px] flex items-center justify-center gap-1 border border-slate-700">
                                        Unsupported
                                    </button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        function disconnectUser(index) {
            if (!confirm(`Are you sure you want to disconnect ${users[index].email}?`)) return;

            const email = users[index].email;

            fetch('/api/calendar/multi/users/disconnect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            }).then(() => {
                users = users.filter(u => u.email !== email);
                if (currentUser?.email === email) {
                    currentUser = null;
                    document.getElementById('userCalendarView').classList.add('hidden');
                }
                updateUserList();
            });
        }

        function showMessage(id, type, msg) {
            const el = document.getElementById(id);
            el.classList.remove('hidden');
            el.className = `p-3 rounded-xl text-xs font-mono font-medium border mt-3 ${getStatusClasses(type)}`;
            el.textContent = msg;
        }

        function showLoading() {
            document.getElementById('loadingIndicator').classList.remove('hidden');
            document.getElementById('meetingsList').classList.add('opacity-30', 'pointer-events-none');
        }

        function hideLoading() {
            document.getElementById('loadingIndicator').classList.add('hidden');
            document.getElementById('meetingsList').classList.remove('opacity-30', 'pointer-events-none');
        }

        window.addEventListener('load', async () => {
            try {
                const res = await fetch('/api/calendar/multi/users');
                const data = await res.json();
                if (data.status === 'success') {
                    users = data.data.map(u => ({
                        email: u.email,
                        authorized: u.tokenExpiry !== null,
                        accountName: u.email.split('@')[0]
                    }));
                }
                updateUserList();
            } catch (err) {
                console.error('Failed to load users:', err);
            }
        });
    </script>
</body>
</html>
