<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="dashboard-role" content="reviewer">
    <title>Review Queue - Reviewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        slate: { 850: '#141E33', 900: '#0F172A', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/shared.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <div class="flex-1 flex flex-col overflow-hidden">
        <div id="header-placeholder"></div>
    <div class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
        <div class="max-w-7xl mx-auto">
            <!-- Header -->
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h1 class="text-xl font-bold text-white">Review Queue</h1>
                    <p class="text-slate-400 text-xs mt-0.5">Select instructor to review sessions</p>
                </div>
                <div class="flex items-center gap-2">
                    <!-- Search -->
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Search..."
                            class="w-48 pl-8 pr-3 py-1.5 bg-slate-800/60 border border-slate-700/60 rounded-md text-xs text-slate-300 placeholder-slate-500 focus:outline-none focus:border-violet-500/60 transition-colors">
                        <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </div>
                    <button onclick="reload()" class="p-1.5 bg-slate-800/60 border border-slate-700/60 rounded-md hover:bg-slate-700/60 transition-colors" title="Refresh">
                        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path d="M1 4v6h6M23 20v-6h-6M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Instructor Dropdown -->
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg border border-slate-800/80 shadow-md p-3 mb-4">
                <div class="flex items-center gap-3">
                    <div class="flex-1">
                        <label for="instructorSelect" class="block text-[10px] font-semibold uppercase tracking-wider text-slate-500 mb-1">Instructor</label>
                        <div class="relative">
                            <select id="instructorSelect" class="w-full sm:w-80 px-3 py-1.5 bg-slate-800/60 border border-slate-700/60 rounded-md text-xs text-slate-300 focus:outline-none focus:border-violet-500/60 transition-colors appearance-none cursor-pointer">
                                <option value="">— Select —</option>
                            </select>
                            <svg class="absolute right-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-500 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path d="M6 9l6 6 6-6"/>
                            </svg>
                        </div>
                    </div>
                    <div class="text-[10px] text-slate-500 pt-4" id="instructorInfo">
                        <span>Waiting...</span>
                    </div>
                </div>
            </div>

            <!-- Status Filter Tabs (shown after instructor selected) -->
            <div class="flex gap-1.5 mb-4 hidden" id="filterTabsWrapper">
                <button data-status="all" class="filter-btn active px-3 py-1.5 rounded-md text-xs font-medium bg-violet-600/20 text-violet-300 border border-violet-500/30 hover:bg-violet-600/30 transition-all">All</button>
                <button data-status="pending" class="filter-btn px-3 py-1.5 rounded-md text-xs font-medium bg-slate-800/60 text-slate-400 border border-slate-700/60 hover:bg-slate-700/60 transition-all">Pending</button>
                <button data-status="in_progress" class="filter-btn px-3 py-1.5 rounded-md text-xs font-medium bg-slate-800/60 text-slate-400 border border-slate-700/60 hover:bg-slate-700/60 transition-all">Active</button>
                <button data-status="completed" class="filter-btn px-3 py-1.5 rounded-md text-xs font-medium bg-slate-800/60 text-slate-400 border border-slate-700/60 hover:bg-slate-700/60 transition-all">Done</button>
            </div>

            <!-- Summary Cards (shown after instructor selected) -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-2 mb-4 hidden" id="summaryCardsWrapper">
                <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-2.5">
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider">Total</p>
                    <p id="countTotal" class="text-lg font-bold text-white mt-0.5">-</p>
                </div>
                <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-2.5">
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider">Unassigned</p>
                    <p id="countUnassigned" class="text-lg font-bold text-slate-400 mt-0.5">-</p>
                </div>
                <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-2.5">
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider">Pending</p>
                    <p id="countPending" class="text-lg font-bold text-amber-400 mt-0.5">-</p>
                </div>
                <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-2.5">
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider">Active</p>
                    <p id="countInProgress" class="text-lg font-bold text-blue-400 mt-0.5">-</p>
                </div>
                <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-2.5">
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider">Done</p>
                    <p id="countCompleted" class="text-lg font-bold text-emerald-400 mt-0.5">-</p>
                </div>
            </div>

            <!-- Sessions Table (shown after instructor selected) -->
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg border border-slate-800/80 shadow-md overflow-hidden" id="tableWrapper">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-slate-800 bg-slate-900/40">
                                <th class="text-left px-3 py-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500">Session</th>
                                <th class="text-left px-3 py-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500">Platform</th>
                                <th class="text-left px-3 py-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500">Date</th>
                                <th class="text-left px-3 py-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500">Duration</th>
                                <th class="text-left px-3 py-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500">Score</th>
                                <th class="text-left px-3 py-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500">Review</th>
                                <th class="text-right px-3 py-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500">Action</th>
                            </tr>
                        </thead>
                        <tbody id="sessionsTableBody">
                            <tr>
                                <td colspan="7" class="px-3 py-10 text-center">
                                    <div class="flex flex-col items-center gap-2">
                                        <svg class="w-8 h-8 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                            <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                                        </svg>
                                        <p class="text-slate-500 text-xs">Select an instructor to view sessions</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            </div>
        </div>
    </div>

    <!-- Complete Review Modal -->
    <div id="completeModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 w-full max-w-lg mx-4 shadow-2xl">
            <h3 class="text-base font-semibold text-white mb-3">Complete Review</h3>
            <p class="text-xs text-slate-400 mb-3" id="completeModalTitle">Add your review comments below.</p>
            <textarea id="reviewComments" rows="3" class="w-full px-3 py-2 bg-slate-800/60 border border-slate-700/60 rounded-md text-xs text-slate-300 placeholder-slate-500 focus:outline-none focus:border-violet-500/60 transition-colors resize-none" placeholder="Enter review comments..."></textarea>
            <div class="flex justify-end gap-2 mt-3">
                <button onclick="closeCompleteModal()" class="px-3 py-1.5 text-xs text-slate-400 bg-slate-800/60 border border-slate-700/60 rounded-md hover:bg-slate-700/60 transition-colors">Cancel</button>
                <button onclick="submitComplete()" class="px-3 py-1.5 text-xs font-medium bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 rounded-md hover:bg-emerald-600/30 transition-all">Complete</button>
            </div>
        </div>
    </div>

    <script type="module" src="/js/auth.js"></script>
    <script src="../js/load-components.js"></script>
    <script>
        let currentFilter = 'all';
        let sessionsData = [];
        let selectedInstructorId = null;
        let completingMeetingId = null;

        // Status badge colors
        function getReviewBadge(status) {
            const map = {
                'unassigned': 'bg-slate-800/60 text-slate-500 border-slate-700/50',
                'pending': 'bg-amber-900/40 text-amber-300 border-amber-700/50',
                'in_progress': 'bg-blue-900/40 text-blue-300 border-blue-700/50',
                'in-progress': 'bg-blue-900/40 text-blue-300 border-blue-700/50',
                'completed': 'bg-emerald-900/40 text-emerald-300 border-emerald-700/50'
            };
            const label = {
                'unassigned': 'Unassigned',
                'pending': 'Pending',
                'in_progress': 'In Progress',
                'in-progress': 'In Progress',
                'completed': 'Completed'
            };
            return {
                class: map[status] || 'bg-slate-800/60 text-slate-400 border-slate-700/50',
                label: label[status] || status
            };
        }

        function getPlatformIcon(platform) {
            const icons = {
                'google-meet': `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M22.54 6.42a2.78 2.78 0 00-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 00-1.94 2A29 29 0 001 12a29 29 0 00.46 5.58 2.78 2.78 0 001.94 2C5.12 20 12 20 12 20s6.88 0 8.6-.46a2.78 2.78 0 001.94-2A29 29 0 0023 12a29 29 0 00-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98" fill="#0F172A"/></svg>`,
                'zoom': `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z" fill="#0F172A"/></svg>`,
                'teams': `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15l-5-5 1.41-1.41L11 14.17l7.59-7.59L20 8l-9 9z"/></svg>`,
                'unknown': `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>`
            };
            return icons[platform] || icons['unknown'];
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            const now = new Date();
            const diff = now - d;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            if (days === 0) return 'Today';
            if (days === 1) return 'Yesterday';
            if (days < 7) return `${days}d`;
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function formatDuration(minutes) {
            if (!minutes) return '-';
            if (minutes < 60) return `${minutes}m`;
            const h = Math.floor(minutes / 60);
            const m = minutes % 60;
            return m ? `${h}h${m}m` : `${h}h`;
        }

        function renderSessions() {
            const tbody = document.getElementById('sessionsTableBody');
            
            let filtered = sessionsData;
            if (currentFilter !== 'all') {
                if (currentFilter === 'in_progress') {
                    filtered = sessionsData.filter(s => s.review_status === 'in_progress' || s.review_status === 'in-progress');
                } else {
                    filtered = sessionsData.filter(s => s.review_status === currentFilter);
                }
            }

            if (!filtered.length) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="px-6 py-16 text-center">
                            <div class="flex flex-col items-center gap-2">
                                <svg class="w-10 h-10 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                    <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                                </svg>
                                <p class="text-slate-500 text-sm">No sessions found</p>
                                <p class="text-slate-600 text-xs">${currentFilter === 'all' ? 'No sessions available for this instructor' : `No ${currentFilter} sessions`}</p>
                            </div>
                        </td>
                    </tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(s => {
                const badge = getReviewBadge(s.review_status);
                
                return `
                <tr class="border-b border-slate-800/50 hover:bg-slate-800/20 transition-colors">
                    <td class="px-3 py-2">
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 rounded bg-slate-800 border border-slate-700/60 flex items-center justify-center text-slate-500 flex-shrink-0">
                                ${getPlatformIcon(s.platform)}
                            </div>
                            <div class="min-w-0">
                                <p class="text-xs font-medium text-white truncate">${s.title}</p>
                                <p class="text-[10px] text-slate-500 mt-0.5 truncate">${s.calendar_account || 'No account'}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-3 py-2">
                        <span class="text-[10px] text-slate-400 capitalize">${s.platform.replace('-', ' ')}</span>
                    </td>
                    <td class="px-3 py-2">
                        <span class="text-xs text-slate-400">${formatDate(s.start_time)}</span>
                        ${s.days_since_meeting > 30 ? '<br><span class="text-[10px] text-slate-600">' + s.days_since_meeting + 'd</span>' : ''}
                    </td>
                    <td class="px-3 py-2">
                        <span class="text-xs text-slate-400">${formatDuration(s.duration)}</span>
                    </td>
                    <td class="px-3 py-2">
                        ${s.avg_score ? `
                        <div class="flex items-center gap-1.5">
                            <div class="w-12 h-1 bg-slate-700 rounded-full overflow-hidden">
                                <div class="h-full rounded-full ${s.avg_score >= 7 ? 'bg-emerald-500' : s.avg_score >= 4 ? 'bg-amber-500' : 'bg-red-500'}" style="width: ${s.avg_score * 10}%"></div>
                            </div>
                            <span class="text-xs font-medium ${s.avg_score >= 7 ? 'text-emerald-400' : s.avg_score >= 4 ? 'text-amber-400' : 'text-red-400'}">${s.avg_score}</span>
                        </div>
                        ` : '<span class="text-[10px] text-slate-600">-</span>'}
                    </td>
                    <td class="px-3 py-2">
                        <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium border ${badge.class}">
                            ${badge.label}
                        </span>
                        ${s.assigned_by && s.assigned_by !== '-' ? `<p class="text-[10px] text-slate-600 mt-0.5">by ${s.assigned_by}</p>` : ''}
                    </td>
                    <td class="px-3 py-2 text-right">
                        ${s.review_status === 'completed' ? `
                        <button onclick="viewReview('${s.meeting_id}')" class="px-2 py-1 text-[10px] font-medium bg-slate-800/60 text-slate-400 border border-slate-700/60 rounded hover:bg-slate-700/60 transition-all">View</button>
                        ` : s.review_status === 'in_progress' || s.review_status === 'in-progress' ? `
                        <div class="flex items-center justify-end gap-1">
                            <button onclick="openCompleteModal('${s.meeting_id}', '${s.title.replace(/'/g, "\\'")}')" class="px-2 py-1 text-[10px] font-medium bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 rounded hover:bg-emerald-600/30 transition-all">Done</button>
                            <button onclick="viewSession('${s.meeting_id}')" class="px-2 py-1 text-[10px] font-medium bg-blue-600/20 text-blue-300 border border-blue-500/30 rounded hover:bg-blue-600/30 transition-all">Review</button>
                        </div>
                        ` : `
                        <button onclick="startReview('${s.meeting_id}')" class="px-2 py-1 text-[10px] font-medium bg-violet-600/20 text-violet-300 border border-violet-500/30 rounded hover:bg-violet-600/30 transition-all">Start</button>
                        `}
                    </td>
                </tr>`;
            }).join('');
        }

        // Load instructors
        async function loadInstructors() {
            try {
                const res = await fetch('/api/reviewer-reviews/instructors', { credentials: 'include' });
                const data = await res.json();
                if (data.success && data.instructors) {
                    const select = document.getElementById('instructorSelect');
                    select.innerHTML = '<option value="">— Choose an instructor —</option>' + 
                        data.instructors.map(i => 
                            `<option value="${i.id}">${i.first_name || ''} ${i.last_name || ''} (${i.email})</option>`
                        ).join('');
                }
            } catch (err) {
                console.error('Failed to load instructors:', err);
            }
        }

        // Load sessions for selected instructor
        async function loadSessions() {
            if (!selectedInstructorId) return;

            try {
                document.getElementById('sessionsTableBody').innerHTML = `
                    <tr>
                        <td colspan="7" class="px-6 py-12 text-center">
                            <div class="flex flex-col items-center gap-2">
                                <svg class="w-8 h-8 text-slate-600 animate-spin" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                                </svg>
                                <p class="text-slate-500 text-sm">Loading sessions...</p>
                            </div>
                        </td>
                    </tr>`;

                const search = document.getElementById('searchInput').value.trim();
                let url = `/api/reviewer-reviews/instructor-sessions?instructor_id=${selectedInstructorId}`;
                if (currentFilter !== 'all') url += `&status=${currentFilter}`;
                if (search) url += `&search=${encodeURIComponent(search)}`;

                const res = await fetch(url, { credentials: 'include' });
                if (!res.ok) throw new Error('Failed to load sessions');
                const data = await res.json();

                if (data.success && data.sessions) {
                    sessionsData = data.sessions;
                    renderSessions();
                    
                    document.getElementById('countTotal').textContent = data.counts.total;
                    document.getElementById('countUnassigned').textContent = data.counts.unassigned;
                    document.getElementById('countPending').textContent = data.counts.pending;
                    document.getElementById('countInProgress').textContent = data.counts.in_progress;
                    document.getElementById('countCompleted').textContent = data.counts.completed;
                }
            } catch (err) {
                document.getElementById('sessionsTableBody').innerHTML = `
                    <tr>
                        <td colspan="7" class="px-6 py-12 text-center">
                            <div class="flex flex-col items-center gap-2">
                                <svg class="w-10 h-10 text-red-500/50" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                    <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
                                </svg>
                                <p class="text-slate-500 text-sm">Failed to load sessions</p>
                                <p class="text-slate-600 text-xs">${err.message}</p>
                                <button onclick="loadSessions()" class="mt-2 px-4 py-2 text-xs bg-slate-800/60 text-slate-400 border border-slate-700/60 rounded-lg hover:bg-slate-700/60">Retry</button>
                            </div>
                        </td>
                    </tr>`;
            }
        }

        // Instructor select change
        document.getElementById('instructorSelect').addEventListener('change', function() {
            selectedInstructorId = this.value;
            if (selectedInstructorId) {
                document.getElementById('filterTabsWrapper').classList.remove('hidden');
                document.getElementById('summaryCardsWrapper').classList.remove('hidden');
                document.getElementById('instructorInfo').innerHTML = `<span class="text-emerald-400">● Viewing sessions</span>`;
                currentFilter = 'all';
                // Reset filter tabs
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('active', 'bg-violet-600/20', 'text-violet-300', 'border-violet-500/30');
                    b.classList.add('bg-slate-800/60', 'text-slate-400', 'border-slate-700/60');
                });
                document.querySelector('.filter-btn[data-status="all"]').classList.add('active', 'bg-violet-600/20', 'text-violet-300', 'border-violet-500/30');
                document.querySelector('.filter-btn[data-status="all"]').classList.remove('bg-slate-800/60', 'text-slate-400', 'border-slate-700/60');
                loadSessions();
            } else {
                document.getElementById('filterTabsWrapper').classList.add('hidden');
                document.getElementById('summaryCardsWrapper').classList.add('hidden');
                document.getElementById('instructorInfo').innerHTML = `<span>Waiting for selection...</span>`;
                document.getElementById('sessionsTableBody').innerHTML = `
                    <tr>
                        <td colspan="7" class="px-6 py-16 text-center">
                            <div class="flex flex-col items-center gap-3">
                                <svg class="w-12 h-12 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                                    <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                                </svg>
                                <p class="text-slate-500 text-sm">Select an instructor above to view their sessions</p>
                            </div>
                        </td>
                    </tr>`;
            }
        });

        // Filter tabs
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if (!selectedInstructorId) return;
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('active', 'bg-violet-600/20', 'text-violet-300', 'border-violet-500/30');
                    b.classList.add('bg-slate-800/60', 'text-slate-400', 'border-slate-700/60');
                });
                this.classList.add('active', 'bg-violet-600/20', 'text-violet-300', 'border-violet-500/30');
                this.classList.remove('bg-slate-800/60', 'text-slate-400', 'border-slate-700/60');
                currentFilter = this.dataset.status;
                loadSessions();
            });
        });

        // Search with debounce
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                if (selectedInstructorId) loadSessions();
            }, 400);
        });

        // Start review
        async function startReview(meetingId) {
            try {
                const res = await fetch(`/api/reviewer-reviews/${meetingId}/start`, {
                    method: 'PUT',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (data.success) {
                    loadSessions();
                } else {
                    alert(data.error || 'Failed to start review');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        // Complete review modal
        function openCompleteModal(meetingId, title) {
            completingMeetingId = meetingId;
            document.getElementById('completeModalTitle').textContent = `Complete review for: ${title}`;
            document.getElementById('reviewComments').value = '';
            document.getElementById('completeModal').classList.remove('hidden');
            document.getElementById('completeModal').classList.add('flex');
        }

        function closeCompleteModal() {
            completingMeetingId = null;
            document.getElementById('completeModal').classList.add('hidden');
            document.getElementById('completeModal').classList.remove('flex');
        }

        async function submitComplete() {
            if (!completingMeetingId) return;
            const comments = document.getElementById('reviewComments').value.trim();
            
            try {
                const res = await fetch(`/api/reviewer-reviews/${completingMeetingId}/complete`, {
                    method: 'PUT',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ comments: comments || null })
                });
                const data = await res.json();
                if (data.success) {
                    closeCompleteModal();
                    loadSessions();
                } else {
                    alert(data.error || 'Failed to complete review');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        function viewReview(meetingId) {
            window.location.href = `/reviewer/evaluations?meeting_id=${meetingId}`;
        }

        function viewSession(meetingId) {
            window.location.href = `/reviewer/evaluations?meeting_id=${meetingId}`;
        }

        function reload() {
            if (selectedInstructorId) loadSessions();
        }

        // Close modal on backdrop click
        document.getElementById('completeModal').addEventListener('click', function(e) {
            if (e.target === this) closeCompleteModal();
        });

        // Init
        document.addEventListener('DOMContentLoaded', loadInstructors);
    </script>
</body>
</html>
