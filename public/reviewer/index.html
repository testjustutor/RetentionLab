<!DOCTYPE html>
<html lang="en">
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="dashboard-role" content="reviewer">
  <title>Reviewer — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css">
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="mx-auto p-4">    <div id="header-placeholder"></div>
<section class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div class="card">
        <h2 class="text-lg font-semibold mb-2">Reviewer</h2>
        <dl class="info-dl">
          <div><dt class="text-[12px]">Name</dt><dd id="userName" class="text-xs">—</dd></div>
          <div><dt class="text-[12px]">Email</dt><dd id="userEmail" class="text-xs">—</dd></div>
          <div><dt class="text-[12px]">Role</dt><dd id="userRole" class="text-xs">—</dd></div>
        </dl>
      </div>

      <div class="card">
        <h2 class="text-lg font-semibold mb-2">Actions</h2>
        <div class="flex flex-col gap-2">
          <a href="/reviewer/score" class="link-button-secondary block rounded-lg px-3 py-2 text-xs">Review Scores</a>
          <a href="/archives" class="link-button-secondary block rounded-lg px-3 py-2 text-xs">Archives</a>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="/js/auth.js"></script>
  <script src="../js/load-components.js"></script>
</body>
</html>
