<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="dashboard-role" content="reviewer">
    <title>Reviewer Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        slate: { 850: '#141E33', 900: '#0F172A', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/shared.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <div class="flex-1 flex flex-col overflow-hidden">
        <div id="header-placeholder"></div>
    <div class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
        <div class="flex-1 overflow-auto custom-scrollbar relative">
            <div class="p-4">
                <h1 class="text-xl font-bold text-white mb-3">Reviewer Dashboard</h1>
                <p class="text-slate-400 text-xs mb-4">Overview of assigned reviews and workload.</p>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4">
                    <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-2.5">
                        <h3 class="text-[10px] font-medium text-slate-400 mb-1">Pending</h3>
                        <p id="pendingCount" class="text-lg font-bold text-white">-</p>
                    </div>
                    <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-2.5">
                        <h3 class="text-[10px] font-medium text-slate-400 mb-1">In Progress</h3>
                        <p id="inProgressCount" class="text-lg font-bold text-white">-</p>
                    </div>
                    <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-2.5">
                        <h3 class="text-[10px] font-medium text-slate-400 mb-1">Completed</h3>
                        <p id="completedCount" class="text-lg font-bold text-white">-</p>
                    </div>
                    <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-2.5">
                        <h3 class="text-[10px] font-medium text-slate-400 mb-1">Avg Time</h3>
                        <p id="avgTime" class="text-lg font-bold text-white">-</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
                    <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-3">
                        <h3 class="text-sm font-semibold text-white mb-2">Recent Assignments</h3>
                        <div id="recentAssignments" class="text-slate-400 text-xs">
                            <p>No recent assignments</p>
                        </div>
                    </div>
                    <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-3">
                        <h3 class="text-sm font-semibold text-white mb-2">Overdue Reviews</h3>
                        <div id="overdueReviews" class="text-slate-400 text-xs">
                            <p>No overdue reviews</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
    <script type="module" src="/js/auth.js"></script>
    <script src="../js/load-components.js"></script>
    <script>
        // Fetch dashboard stats
        async function loadDashboardData() {
            try {
                const res = await fetch('/api/reviewer-dashboard/stats', {
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (!res.ok) throw new Error('Failed to fetch stats');
                const data = await res.json();
                
                document.getElementById('pendingCount').textContent = data.pending;
                document.getElementById('inProgressCount').textContent = data.inProgress;
                document.getElementById('completedCount').textContent = data.completed;
                document.getElementById('avgTime').textContent = data.avgReviewTime || 'N/A';
            } catch (err) {
                console.error('Dashboard load error:', err);
            }
        }

        // Fetch recent assignments
        async function loadRecentAssignments() {
            try {
                const res = await fetch('/api/reviewer-dashboard/recent-assignments?limit=5', {
                    credentials: 'include'
                });
                if (!res.ok) throw new Error('Failed');
                const data = await res.json();
                
                const container = document.getElementById('recentAssignments');
                if (!data.length) {
                    container.innerHTML = '<p>No recent assignments</p>';
                    return;
                }
                
                container.innerHTML = data.map(a => `
                    <div class="flex items-center justify-between py-1.5 border-b border-slate-700/50 last:border-0">
                        <div class="min-w-0">
                            <p class="text-white text-xs font-medium truncate">${a.meeting_title || 'Untitled Meeting'}</p>
                            <p class="text-[10px] text-slate-500">${new Date(a.assigned_at).toLocaleDateString()}</p>
                        </div>
                        <span class="text-[10px] px-1.5 py-0.5 rounded ml-2 flex-shrink-0 ${a.review_status === 'completed' ? 'bg-emerald-900/50 text-emerald-400' : a.review_status === 'in_progress' ? 'bg-amber-900/50 text-amber-400' : 'bg-slate-700/50 text-slate-400'}">${a.review_status}</span>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Recent assignments error:', err);
            }
        }

        // Fetch overdue reviews
        async function loadOverdueReviews() {
            try {
                const res = await fetch('/api/reviewer-dashboard/overdue', {
                    credentials: 'include'
                });
                if (!res.ok) throw new Error('Failed');
                const data = await res.json();
                
                const container = document.getElementById('overdueReviews');
                if (!data.length) {
                    container.innerHTML = '<p class="text-emerald-400">No overdue reviews</p>';
                    return;
                }
                
                container.innerHTML = data.map(r => `
                    <div class="flex items-center justify-between py-1.5 border-b border-slate-700/50 last:border-0">
                        <div class="min-w-0">
                            <p class="text-white text-xs font-medium truncate">${r.meeting_title || 'Untitled Meeting'}</p>
                            <p class="text-[10px] text-slate-500">Assigned: ${new Date(r.assigned_at).toLocaleDateString()}</p>
                        </div>
                        <span class="text-[10px] text-red-400 ml-2 flex-shrink-0">⚠ Overdue</span>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Overdue reviews error:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadDashboardData();
            loadRecentAssignments();
            loadOverdueReviews();
        });
    </script>
</body>
</html>
