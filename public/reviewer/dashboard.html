<!DOCTYPE html>
<html lang="en" class="dark">
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="dashboard-role" content="reviewer">
  <title>Reviewer Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css">
  <script src="../js/reviewer/tailwind-config.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex-1 flex flex-col overflow-hidden">
    <div id="header-placeholder"></div>
    <div class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
      <div class="flex-1 overflow-auto custom-scrollbar relative">
        <div class="p-4">
 <h1 class="text-xl font-bold mb-3">Reviewer Dashboard</h1>
          <p class="text-slate-400 text-xs mb-4">Overview of assigned reviews and workload.</p>
          
          <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4">
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-2.5">
              <h3 class="text-[12px] font-medium text-slate-400 mb-1">Pending</h3>
 <p id="pendingCount" class="text-lg font-bold ">-</p>
            </div>
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-2.5">
              <h3 class="text-[12px] font-medium text-slate-400 mb-1">In Progress</h3>
 <p id="inProgressCount" class="text-lg font-bold ">-</p>
            </div>
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-2.5">
              <h3 class="text-[12px] font-medium text-slate-400 mb-1">Completed</h3>
 <p id="completedCount" class="text-lg font-bold ">-</p>
            </div>
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-2.5">
              <h3 class="text-[12px] font-medium text-slate-400 mb-1">Avg Time</h3>
 <p id="avgTime" class="text-lg font-bold ">-</p>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-3">
 <h3 class="text-sm font-semibold mb-2">Recent Assignments</h3>
              <div id="recentAssignments" class="text-slate-400 text-xs">
                <p>No recent assignments</p>
              </div>
            </div>
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-md p-3">
 <h3 class="text-sm font-semibold mb-2">Overdue Reviews</h3>
              <div id="overdueReviews" class="text-slate-400 text-xs">
                <p>No overdue reviews</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
    <script type="module" src="/js/auth.js"></script>
    <script src="../js/load-components.js"></script>
    <script src="../js/reviewer/dashboard.js"></script>
  </body>
</html>
