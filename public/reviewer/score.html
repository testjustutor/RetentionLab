<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="dashboard-role" content="reviewer">
  <title>Review Scores</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css">
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="mx-auto p-4 max-w-6xl">
    <div id="header-placeholder"></div>

    <section class="grid grid-cols-1 lg:grid-cols-[280px_1fr] gap-3 mt-4">
      <aside class="rounded-lg border border-slate-800 bg-slate-900 p-3">
 <h1 class="text-lg font-semibold mb-1.5">Review Scores</h1>
        <p class="text-slate-400 text-xs leading-relaxed">Save session-level rubric scores. Values are stored in the session score table via the Node.js route.</p>
        <div class="mt-4 space-y-2 text-xs text-slate-300">
          <div>
            <strong>Note:</strong> Use <code class="text-[12px]">meeting_id</code> and <code class="text-[12px]">session_id</code> to store in <code class="text-[12px]">meeting_session_scores</code>.
          </div>
          <div>
            API: <code class="text-[12px]">POST /api/scores/session</code>
          </div>
        </div>
      </aside>

      <main class="space-y-4">
        <section class="rounded-lg border border-slate-800 bg-slate-900 p-3">
 <h2 class="text-base font-semibold mb-3">Store Session Score</h2>
          <form id="scoreForm" class="grid gap-3">
            <div class="grid gap-1.5">
              <label class="text-slate-300 text-xs" for="meetingId">Meeting ID</label>
              <input id="meetingId" name="meetingId" class="input-field" placeholder="meeting_uuid_here" required>
            </div>
            <div class="grid gap-1.5">
              <label class="text-slate-300 text-xs" for="sessionId">Session ID</label>
              <input id="sessionId" name="sessionId" type="number" class="input-field" placeholder="1" required>
            </div>
            <div class="grid gap-1.5">
              <label class="text-slate-300 text-xs" for="indicatorId">Indicator ID</label>
              <input id="indicatorId" name="indicatorId" class="input-field" placeholder="engagement" required>
            </div>
            <div class="grid gap-1.5">
              <label class="text-slate-300 text-xs" for="score">Score</label>
              <input id="score" name="score" type="number" min="0" max="100" class="input-field" placeholder="85" required>
            </div>
            <div class="grid gap-1.5">
              <label class="text-slate-300 text-xs" for="comment">Comment</label>
              <textarea id="comment" name="comment" rows="2" class="input-field" placeholder="Optional feedback"></textarea>
            </div>
            <button type="submit" class="inline-flex items-center justify-center rounded-lg bg-violet-600 px-3 py-2 text-xs font-semibold text-white hover:bg-violet-500 transition">Save Score</button>
          </form>
          <div id="saveStatus" class="mt-3 text-xs"></div>
        </section>

        <section class="rounded-lg border border-slate-800 bg-slate-900 p-3">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-3">
 <h2 class="text-base font-semibold ">Lookup Scores</h2>
            <button id="refreshScores" class="rounded-lg bg-slate-800 px-3 py-1.5 text-xs text-slate-200 hover:bg-slate-700 transition">Refresh</button>
          </div>
          <form id="lookupForm" class="grid gap-3 sm:grid-cols-2">
            <div class="grid gap-1.5">
              <label class="text-slate-300 text-xs" for="lookupMeetingId">Meeting ID</label>
              <input id="lookupMeetingId" class="input-field" placeholder="meeting_uuid_here">
            </div>
            <div class="grid gap-1.5">
              <label class="text-slate-300 text-xs" for="lookupSessionId">Session ID</label>
              <input id="lookupSessionId" type="number" class="input-field" placeholder="1">
            </div>
          </form>
          <div id="loader" class="mt-3 text-xs text-slate-400 hidden">Loading scores…</div>
          <div id="scoresResult" class="mt-3 space-y-3"></div>
        </section>
      </main>
    </section>
  </div>

  <script type="module" src="/js/auth.js"></script>
  <script src="/js/load-components.js"></script>
  <script type="module" src="/reviewer/js/score.js"></script>
</body>
</html>
