<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <title>Roles | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
          <div><h1 class="text-xl font-bold text-white">Roles</h1><p class="text-xs text-slate-400 mt-1">View role-page assignments from the database</p></div>
        </div>

        <div class="space-y-3" id="rolesContainer">
          <div class="py-8 text-center text-slate-500">Loading roles...</div>
        </div>

      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script>
    let allRoleData = [];
    const COLORS = { reviewer: 'violet', instructor: 'emerald' };

    async function loadRoles() {
      const container = document.getElementById('rolesContainer');
      try {
        const json = await apiFetch('/api/roles');
        // Controller returns { success, data: [...] }
        const roles = json.data || [];

        // For each role, fetch its pages
        allRoleData = await Promise.all(roles.map(async r => {
          try {
            const pagesJson = await apiFetch('/api/roles/' + r.id + '/pages');
            const pagesArr = pagesJson.data || [];
            const pages = {};
            pagesArr.forEach(p => { pages[p.pageKey] = p; });
            return { ...r, pages, pageCount: pagesArr.length };
          } catch { return { ...r, pages: {}, pageCount: 0 }; }
        }));

        renderRoles(allRoleData);
      } catch (err) {
        container.innerHTML = '<div class="py-8 text-center text-red-400">Failed to load roles</div>';
      }
    }

    function renderRoles(data) {
      const container = document.getElementById('rolesContainer');
      if (!data.length) { container.innerHTML = '<div class="py-8 text-center text-slate-500">No roles found</div>'; return; }

      container.innerHTML = data.map(r => {
        const color = COLORS[r.role_name] || 'slate';
        const name = (r.role_name || '').charAt(0).toUpperCase() + (r.role_name || '').slice(1).replace(/_/g, ' ');
        const pagesArr = Object.entries(r.pages).sort((a, b) => a[1].title.localeCompare(b[1].title));
        const activeCount = pagesArr.filter(([, p]) => p.isActive).length;
        const activeLabel = activeCount + ' / ' + r.pageCount + ' active';

        let pageList = '<div class="text-[10px] text-slate-500 mt-1.5">No pages assigned</div>';
        if (pagesArr.length > 0) {
          pageList = '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-1 mt-1.5">' +
            pagesArr.map(([key, p]) =>
              '<label class="flex items-center gap-1.5 text-[10px] text-slate-300 bg-slate-950 rounded px-2 py-1 cursor-pointer hover:bg-slate-800/50 transition-colors">' +
                '<input type="checkbox" class="role-page-toggle accent-' + color + '-500" data-role-id="' + r.id + '" data-page-key="' + key + '" ' + (p.isActive ? 'checked' : '') + ' onchange="togglePage(this, ' + r.id + ', \'' + key + '\')">' +
                '<span class="truncate">' + escHtml(p.title || key) + '</span>' +
              '</label>'
            ).join('') + '</div>';
        }

        return '<div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden role-card">' +
          '<div class="p-3 cursor-pointer hover:bg-slate-800/30 transition-colors flex items-center gap-3" onclick="this.parentElement.classList.toggle(\'expanded\')">' +
            '<div class="w-8 h-8 rounded-md bg-' + color + '-500/10 border border-' + color + '-500/20 flex items-center justify-center flex-shrink-0 text-' + color + '-400 font-bold text-xs">' + name[0] + '</div>' +
            '<div class="flex-1"><h3 class="text-xs font-semibold text-white">' + name + '</h3><p class="text-[10px] text-slate-500">' + (r.description || '') + '</p></div>' +
            '<div class="text-right flex-shrink-0"><span class="inline-block px-1.5 py-0.5 rounded-full text-[10px] font-medium bg-' + color + '-500/10 text-' + color + '-400 border border-' + color + '-500/20">' + activeLabel + '</span></div>' +
            '<svg class="w-3.5 h-3.5 text-slate-500 chevron-icon flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>' +
          '</div>' +
          '<div class="hidden expanded-content border-t border-slate-800 px-3 py-2 bg-slate-900/50">' +
            '<h4 class="text-[10px] text-slate-400 uppercase mb-1.5">Pages (' + activeLabel + ')</h4>' + pageList +
            '<div class="mt-2 pt-2 border-t border-slate-800 flex gap-1.5">' +
              '<button onclick="activateAllPages(' + r.id + ')" class="text-[10px] px-2 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white transition-colors">Activate All</button>' +
              '<button onclick="deactivateAllPages(' + r.id + ')" class="text-[10px] px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-300 transition-colors">Deactivate All</button>' +
            '</div>' +
          '</div></div>';
      }).join('');

      document.querySelectorAll('.role-card').forEach(card => {
        const chevron = card.querySelector('.chevron-icon');
        const content = card.querySelector('.expanded-content');
        new MutationObserver(() => {
          if (card.classList.contains('expanded')) { content.classList.remove('hidden'); chevron.style.transform = 'rotate(180deg)'; }
          else { content.classList.add('hidden'); chevron.style.transform = ''; }
        }).observe(card, { attributes: true, attributeFilter: ['class'] });
      });
    }

    // ── Toggle single page ──
    window.togglePage = async function(cb, roleId, pageKey) {
      const isActive = cb.checked;
      try {
        await apiFetch('/api/header-config/pages/role/' + roleId + '/' + pageKey, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ isActive })
        });
        showToast(isActive ? 'Page activated' : 'Page deactivated');
        setTimeout(loadRoles, 500);
      } catch (err) { cb.checked = !isActive; showToast(err.message, true); }
    };

    window.activateAllPages = async function(roleId) {
      const role = allRoleData.find(r => r.id === roleId);
      if (!role) return;
      try {
        await Promise.all(Object.keys(role.pages).map(k =>
          apiFetch('/api/header-config/pages/role/' + roleId + '/' + k + '/upsert', {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: role.pages[k].title || k, isActive: true })
          })
        ));
        showToast('All pages activated');
        loadRoles();
      } catch (err) { showToast(err.message, true); }
    };

    window.deactivateAllPages = async function(roleId) {
      const role = allRoleData.find(r => r.id === roleId);
      if (!role) return;
      try {
        await Promise.all(Object.keys(role.pages).map(k =>
          apiFetch('/api/header-config/pages/role/' + roleId + '/' + k, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ isActive: false })
          })
        ));
        showToast('All pages deactivated');
        loadRoles();
      } catch (err) { showToast(err.message, true); }
    };

    loadRoles();
  </script>
  <style>.role-card .chevron-icon { transition: transform 0.2s; }</style>
</body>
</html>
