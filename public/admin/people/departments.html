<!doctype html>
<html lang="en">
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="peopleDepartments">
  <title>Teams | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">

        <!-- Action Section -->
        <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-200 rounded-lg shadow-md p-3 mb-3">
          <div class="flex items-center justify-between gap-3">
            <h2 class="text-sm font-bold text-violet-900">Departments Management</h2>
            <button id="openDeptModalBtn" class="bg-violet-600 hover:bg-violet-700 text-white text-xs font-semibold px-3 py-1.5 rounded-md transition-colors shadow-sm whitespace-nowrap">Create Department</button>
          </div>
        </div>

        <!-- Data Display Section -->
        <div class="bg-gradient-to-br from-slate-50 to-gray-100 border-2 border-slate-300 rounded-lg shadow-md overflow-hidden">
          <div class="px-4 py-3 border-b-2 border-slate-300 bg-slate-200">
            <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wide">Departments List</h3>
          </div>
          <div id="deptsContainer" class="p-4">
            <div class="py-8 text-center text-slate-700 font-medium">Loading departments...</div>
          </div>
        </div>

        <!-- Department Modal -->
        <div id="deptModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
          <div class="bg-white border-2 border-violet-300 rounded-xl p-4 w-full max-w-md mx-4 shadow-2xl">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-base font-bold text-violet-950" id="deptModalTitle">Create Department</h2>
              <button id="closeDeptModalBtn" class="text-violet-500 hover:text-violet-900 text-lg leading-none">&times;</button>
            </div>
            <form id="deptForm" class="space-y-2">
              <input type="hidden" id="editDeptId">
              <div><label class="block text-xs text-violet-900 mb-1 font-semibold">Name</label>
                <input id="deptName" type="text" required class="w-full rounded-md bg-violet-50 border-2 border-violet-300 px-3 py-1.5 text-xs text-slate-950 placeholder-slate-500 focus:border-violet-500 outline-none" placeholder="e.g. Engineering">
              </div>
              <div><label class="block text-xs text-violet-900 mb-1 font-semibold">Description</label>
                <input id="deptDesc" type="text" class="w-full rounded-md bg-violet-50 border-2 border-violet-300 px-3 py-1.5 text-xs text-slate-950 placeholder-slate-500 focus:border-violet-500 outline-none" placeholder="Optional description">
              </div>
              <div id="deptFormMsg" class="text-xs min-h-[1.25rem]"></div>
              <div class="flex justify-end gap-2">
                <button type="button" id="cancelDeptModalBtn" class="px-3 py-1.5 rounded-md bg-slate-100 border-2 border-slate-300 text-xs text-slate-700 hover:text-slate-900 transition-colors">Cancel</button>
                <button type="submit" id="deptSubmitBtn" class="px-3 py-1.5 rounded-md bg-violet-600 hover:bg-violet-700 text-white text-xs font-semibold transition-colors shadow-sm">Create</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Add Member Modal -->
        <div id="memberModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
          <div class="bg-white border-2 border-violet-300 rounded-xl p-4 w-full max-w-md mx-4 shadow-2xl">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-base font-bold text-violet-950">Add Member</h2>
              <button id="closeMemberModalBtn" class="text-violet-500 hover:text-violet-900 text-lg leading-none">&times;</button>
            </div>
            <div class="space-y-2">
              <input type="hidden" id="addMemberDeptId">
              <div><label class="block text-xs text-violet-900 mb-1 font-semibold">Select User</label>
                <select id="memberUserSelect" class="w-full rounded-md bg-violet-50 border-2 border-violet-300 px-3 py-1.5 text-xs text-slate-950 focus:border-violet-500 outline-none">
                  <option value="">Loading users...</option>
                </select>
              </div>
              <div class="flex justify-end gap-2">
                <button id="cancelMemberModalBtn" class="px-3 py-1.5 rounded-md bg-slate-100 border-2 border-slate-300 text-xs text-slate-700 hover:text-slate-900 transition-colors">Cancel</button>
                <button onclick="addMember()" class="px-3 py-1.5 rounded-md bg-violet-600 hover:bg-violet-700 text-white text-xs font-semibold transition-colors shadow-sm">Add</button>
              </div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <!-- FIX: this page-specific logic used to be an inline <script type="module">
       block here; extracted to js/admin/people/departments.js to match the
       one-external-file-per-page convention used everywhere else (and to
       fill in what was previously an empty 50-byte stub at that path). -->
  <script type="module" src="../../js/admin/people/departments.js"></script>
</body>
</html>
