<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="peopleUsers">
  <title>Users | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
          <div id="header-buttons-container"></div>
          <div class="flex gap-2">
            <input type="text" id="userSearch" placeholder="Search users..." class="bg-white border border-slate-300 rounded-md px-3 py-1.5 text-xs text-slate-950 placeholder-slate-400 w-56 focus:outline-none focus:border-violet-500" oninput="filterTable()">
            <button id="openUserModalBtn" class="bg-violet-600 hover:bg-violet-500 text-white text-xs font-medium px-3 py-1.5 rounded-md transition-colors">Add User</button>
          </div>
        </div>

        <!-- Add / Edit User Modal -->
        <div id="userModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
          <div class="bg-white border border-slate-200 rounded-xl p-4 w-full max-w-md mx-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-base font-bold text-slate-950" id="modalTitle">Add User</h2>
              <button id="closeUserModalBtn" class="text-slate-500 hover:text-slate-900 text-lg leading-none">&times;</button>
            </div>
            <form id="userForm" class="space-y-2">
              <input type="hidden" id="editUserId">
              
              <!-- Role selection comes first -->
              <div><label for="formRole" class="block text-xs text-slate-600 mb-1">Role <span class="text-red-500">*</span></label>
                <select id="formRole" class="w-full rounded-md bg-slate-100 border border-slate-300 px-3 py-1.5 text-xs text-slate-950 focus:border-violet-500 outline-none">
                  <option value="">Select a role...</option>
                </select>
              </div>

              <!-- Fields shown for reviewer (and other non-instructor roles) -->
              <div id="reviewerFields" class="hidden space-y-2">
                <div><label for="formFirstName" class="block text-xs text-slate-600 mb-1">Full Name <span class="text-red-500">*</span></label>
                  <input id="formFirstName" type="text" class="w-full rounded-md bg-slate-100 border border-slate-300 px-3 py-1.5 text-xs text-slate-950 placeholder-slate-500 focus:border-violet-500 outline-none" placeholder="e.g. Jane Doe">
                </div>
                <div><label for="formEmail" class="block text-xs text-slate-600 mb-1">Email <span class="text-red-500">*</span></label>
                  <input id="formEmail" type="email" class="w-full rounded-md bg-slate-100 border border-slate-300 px-3 py-1.5 text-xs text-slate-950 placeholder-slate-500 focus:border-violet-500 outline-none" placeholder="user@company.com">
                </div>
                <div id="passwordField"><label for="formPassword" class="block text-xs text-slate-600 mb-1">Password <span class="text-red-500">*</span></label>
                  <input id="formPassword" type="password" class="w-full rounded-md bg-slate-100 border border-slate-300 px-3 py-1.5 text-xs text-slate-950 placeholder-slate-500 focus:border-violet-500 outline-none" placeholder="Choose a strong password">
                </div>
              </div>

              <!-- Fields shown for instructor -->
              <div id="instructorFields" class="hidden space-y-2">
                <div class="bg-violet-50 border border-violet-200 rounded-md px-3 py-2">
                  <p class="text-xs text-violet-700">For instructors, a name and email are required. A password can be set later.</p>
                </div>
                <div><label for="instFirstName" class="block text-xs text-slate-600 mb-1">Full Name <span class="text-red-500">*</span></label>
                  <input id="instFirstName" type="text" class="w-full rounded-md bg-slate-100 border border-slate-300 px-3 py-1.5 text-xs text-slate-950 placeholder-slate-500 focus:border-violet-500 outline-none" placeholder="e.g. Jane Doe">
                </div>
                <div><label for="instEmail" class="block text-xs text-slate-600 mb-1">Email <span class="text-red-500">*</span></label>
                  <input id="instEmail" type="email" class="w-full rounded-md bg-slate-100 border border-slate-300 px-3 py-1.5 text-xs text-slate-950 placeholder-slate-500 focus:border-violet-500 outline-none" placeholder="instructor@company.com">
                </div>
              </div>

              <div id="formMessage" class="text-xs min-h-[1.25rem]"></div>
              <div class="flex justify-end gap-2">
                <button type="button" id="cancelUserModalBtn" class="px-3 py-1.5 rounded-md bg-slate-100 border border-slate-300 text-xs text-slate-700 hover:text-slate-900 transition-colors">Cancel</button>
                <button type="submit" id="submitBtn" class="px-3 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold transition-colors">Create User</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Users Table -->
        <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead><tr class="border-b border-slate-200 bg-slate-100">
                <th class="py-2 px-3 text-[12px] text-slate-500 uppercase">Name</th>
                <th class="py-2 px-3 text-[12px] text-slate-500 uppercase">Email</th>
                <th class="py-2 px-3 text-[12px] text-slate-500 uppercase">Role</th>
                <th class="py-2 px-3 text-[12px] text-slate-500 uppercase">Calendar</th>
                <th class="py-2 px-3 text-[12px] text-slate-500 uppercase">Status</th>
                <th class="py-2 px-3 text-[12px] text-slate-500 uppercase text-right">Actions</th>
              </tr></thead>
              <tbody class="divide-y divide-slate-200" id="usersTableBody">
                <tr><td colspan="6" class="py-6 text-center text-slate-500">Loading users...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="flex items-center justify-between px-3 py-2 border-t border-slate-200">
            <span class="text-[12px] text-slate-500" id="usersCount">Showing 0 users</span>
          </div>
        </div>

      </main>
    </div>
  </div>
  <script src="../../js/common-ui.js"></script>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script type="module" src="../../js/admin/people/users.js"></script>
</body>
</html>
