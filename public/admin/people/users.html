<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <title>Users | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
          <div><h1 class="text-xl font-bold text-white">Users</h1><p class="text-xs text-slate-400 mt-1">Manage organization users and roles</p></div>
          <div class="flex gap-2">
            <input type="text" id="userSearch" placeholder="Search users..." class="bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-white placeholder-slate-500 w-56 focus:outline-none focus:border-violet-500" oninput="filterTable()">
            <button id="openUserModalBtn" class="bg-violet-600 hover:bg-violet-500 text-white text-xs font-medium px-3 py-1.5 rounded-md transition-colors">Add User</button>
          </div>
        </div>

        <!-- Add / Edit User Modal -->
        <div id="userModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
          <div class="bg-slate-900 border border-slate-700 rounded-xl p-4 w-full max-w-md mx-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-base font-bold text-white" id="modalTitle">Add User</h2>
              <button id="closeUserModalBtn" class="text-slate-400 hover:text-white text-lg leading-none">&times;</button>
            </div>
            <form id="userForm" class="space-y-2">
              <input type="hidden" id="editUserId">
              <div><label for="formFirstName" class="block text-xs text-slate-300 mb-1">Full Name</label>
                <input id="formFirstName" type="text" required class="w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:border-violet-500 outline-none" placeholder="e.g. Jane Doe">
              </div>
              <div><label for="formEmail" class="block text-xs text-slate-300 mb-1">Email</label>
                <input id="formEmail" type="email" required class="w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:border-violet-500 outline-none" placeholder="user@company.com">
              </div>
              <div id="passwordField"><label for="formPassword" class="block text-xs text-slate-300 mb-1">Password</label>
                <input id="formPassword" type="password" class="w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:border-violet-500 outline-none" placeholder="Choose a strong password">
              </div>
              <div><label for="formRole" class="block text-xs text-slate-300 mb-1">Role</label>
                <select id="formRole" class="w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-1.5 text-xs text-white focus:border-violet-500 outline-none">
                  <option value="">Loading...</option>
                </select>
              </div>
              <div id="formMessage" class="text-xs min-h-[1.25rem]"></div>
              <div class="flex justify-end gap-2">
                <button type="button" id="cancelUserModalBtn" class="px-3 py-1.5 rounded-md bg-slate-800 border border-slate-700 text-xs text-slate-300 hover:text-white transition-colors">Cancel</button>
                <button type="submit" id="submitBtn" class="px-3 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold transition-colors">Create User</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Users Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead><tr class="border-b border-slate-800 bg-slate-900/50">
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Name</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Email</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Role</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Calendar</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Status</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase text-right">Actions</th>
              </tr></thead>
              <tbody class="divide-y divide-slate-800" id="usersTableBody">
                <tr><td colspan="6" class="py-6 text-center text-slate-500">Loading users...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="flex items-center justify-between px-3 py-2 border-t border-slate-800">
            <span class="text-[10px] text-slate-500" id="usersCount">Showing 0 users</span>
          </div>
        </div>

      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script>
    // ── State ──
    let allUsers = [], editingUserId = null, calendarMap = {};

    // ── Modal setup ──
    setupModal('userModal', 'openUserModalBtn', ['closeUserModalBtn', 'cancelUserModalBtn']);

    // ── Load role options ──
    async function loadRoleOptions() {
      const sel = document.getElementById('formRole');
      try {
        const json = await apiFetch('/api/roles');
        // Controller already returns { success, data }
        const roles = json.data || [];
        sel.innerHTML = roles.map(r => '<option value="' + r.id + '">' + r.role_name + '</option>').join('');
      } catch { sel.innerHTML = '<option value="">Failed</option>'; }
    }

    // ── Load calendar connections ──
    async function loadCalendarConnections() {
      try {
        const json = await apiFetch('/api/instructor-calendar/connections');
        const connections = json.data || [];
        connections.forEach(c => {
          if (c.email) calendarMap[c.email.toLowerCase()] = c.status === 'active' ? 'connected' : 'pending';
        });
      } catch { /* ignore - calendar connections optional */ }
    }

    // ── Load users ──
    async function loadUsers() {
      try {
        // Get current user to exclude self
        const [meJson, usersJson] = await Promise.all([
          apiFetch('/api/auth/me'),
          apiFetch('/api/users')
        ]);
        const myId = (meJson.user || meJson).id;
        allUsers = (usersJson.data || []).filter(u => u.id !== myId);
        loadCalendarConnections().then(() => renderTable(allUsers));
      } catch (err) { console.error(err); }
    }

    function renderTable(users) {
      const tbody = document.getElementById('usersTableBody');
      document.getElementById('usersCount').textContent = 'Showing ' + users.length + ' users';
      if (!users.length) { tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-slate-500">No users found</td></tr>'; return; }
      tbody.innerHTML = users.map(u => {
        const isActive = u.status === 'active';
        const emailKey = (u.email || '').toLowerCase();
        const calStatus = calendarMap[emailKey] || 'none';
        const isInstructor = (u.role_name || '').toLowerCase() === 'instructor';

        let calCell = '<span class="text-[10px] text-slate-600">-</span>';
        let calAction = '';
        if (isInstructor) {
          if (calStatus === 'connected') {
            calCell = '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Connected</span>';
            calAction = '<button onclick="disconnectCalendar(\'' + escHtml(u.email) + '\')" class="text-xs text-red-400 hover:text-red-300 px-2 py-1 rounded hover:bg-slate-800 transition-colors">Disconnect</button>';
          } else if (calStatus === 'pending') {
            calCell = '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">Pending</span>';
            calAction = '<button onclick="sendVerification(\'' + escHtml(u.email) + '\')" class="text-xs text-violet-400 hover:text-violet-300 px-2 py-1 rounded hover:bg-slate-800 transition-colors">Resend</button>';
          } else {
            calCell = '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-slate-800 text-slate-400 border border-slate-700">Not Connected</span>';
            calAction = '<button onclick="sendVerification(\'' + escHtml(u.email) + '\')" class="text-xs text-emerald-400 hover:text-emerald-300 px-2 py-1 rounded hover:bg-slate-800 transition-colors">Connect</button>';
          }
        }

        return '<tr class="hover:bg-slate-800/30 transition-colors">' +
          '<td class="py-3 px-4 font-medium text-white">' + escHtml(u.first_name || '--') + '</td>' +
          '<td class="py-3 px-4 text-slate-400 text-xs font-mono">' + escHtml(u.email || '--') + '</td>' +
          '<td class="py-3 px-4"><span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-medium bg-violet-500/10 text-violet-400 border border-violet-500/20">' + escHtml(u.role_name || 'user') + '</span></td>' +
          '<td class="py-3 px-4">' + calCell + '</td>' +
          '<td class="py-3 px-4"><span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium ' + (isActive ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-red-500/10 text-red-400 border-red-500/20') + '">' + (isActive ? 'Active' : 'Disabled') + '</span></td>' +
          '<td class="py-3 px-4 text-right space-x-1">' +
            calAction +
            '<button onclick="editUser(' + u.id + ')" class="text-xs text-violet-400 hover:text-violet-300 px-2 py-1 rounded hover:bg-slate-800 transition-colors">Edit</button>' +
            '<button onclick="toggleUser(' + u.id + ',\'' + (isActive ? 'inactive' : 'active') + '\')" class="text-xs ' + (isActive ? 'text-amber-400 hover:text-amber-300' : 'text-emerald-400 hover:text-emerald-300') + ' px-2 py-1 rounded hover:bg-slate-800 transition-colors">' + (isActive ? 'Deactivate' : 'Activate') + '</button>' +
            '<button onclick="deleteUser(' + u.id + ')" class="text-xs text-red-400 hover:text-red-300 px-2 py-1 rounded hover:bg-slate-800 transition-colors">Delete</button>' +
          '</td></tr>';
      }).join('');
    }

    function filterTable() {
      const q = document.getElementById('userSearch').value.toLowerCase();
      renderTable(q ? allUsers.filter(u => (u.first_name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q)) : allUsers);
    }

    // ── Edit ──
    window.editUser = function(id) {
      const u = allUsers.find(x => x.id === id);
      if (!u) return;
      editingUserId = u.id;
      document.getElementById('modalTitle').textContent = 'Edit User';
      document.getElementById('submitBtn').textContent = 'Update User';
      document.getElementById('editUserId').value = u.id;
      document.getElementById('formFirstName').value = u.first_name || '';
      document.getElementById('formEmail').value = u.email || '';
      document.getElementById('formPassword').value = '';
      document.getElementById('passwordField').style.display = 'none';
      if (u.role_id) document.getElementById('formRole').value = u.role_id;
      document.getElementById('formMessage').textContent = '';
      openModal('userModal');
    };

    // ── Toggle ──
    window.toggleUser = async function(id, newStatus) {
      try {
        await apiFetch('/api/users/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: newStatus }) });
        showToast(newStatus === 'active' ? 'User activated' : 'User deactivated');
        loadUsers();
      } catch (err) { showToast(err.message, true); }
    };

    // ── Delete ──
    window.deleteUser = async function(id) {
      if (!confirm('Are you sure you want to delete this user?')) return;
      try {
        await apiFetch('/api/users/' + id, { method: 'DELETE' });
        showToast('User deleted');
        loadUsers();
      } catch (err) { showToast(err.message, true); }
    };

    // ── Submit form ──
    document.getElementById('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgEl = document.getElementById('formMessage');
      msgEl.textContent = '';
      const firstName = document.getElementById('formFirstName').value.trim();
      const email = document.getElementById('formEmail').value.trim();
      const password = document.getElementById('formPassword').value;
      const roleId = parseInt(document.getElementById('formRole').value);

      if (!firstName || !email) { msgEl.textContent = 'Name and email are required.'; msgEl.className = 'text-sm text-red-400'; return; }
      if (!editingUserId && !password) { msgEl.textContent = 'Password is required.'; msgEl.className = 'text-sm text-red-400'; return; }

      try {
        if (editingUserId) {
          await apiFetch('/api/users/' + editingUserId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ first_name: firstName, email, role_id: roleId }) });
        } else {
          await apiFetch('/api/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ first_name: firstName, email, password_hash: password, role_id: roleId }) });
        }
        msgEl.textContent = editingUserId ? 'User updated!' : 'User created!';
        msgEl.className = 'text-sm text-emerald-400';
        document.getElementById('userForm').reset();
        loadUsers();
        setTimeout(() => closeModal('userModal'), 3000);
      } catch (err) { msgEl.textContent = err.message; msgEl.className = 'text-sm text-red-400'; }
    });

    // Add mode
    document.getElementById('openUserModalBtn').addEventListener('click', () => {
      editingUserId = null;
      document.getElementById('modalTitle').textContent = 'Add User';
      document.getElementById('submitBtn').textContent = 'Create User';
      document.getElementById('editUserId').value = '';
      document.getElementById('userForm').reset();
      document.getElementById('passwordField').style.display = '';
      document.getElementById('formMessage').textContent = '';
      // closeModal is handled by setupModal
    });

    // ── Calendar connect/disconnect ──
    window.sendVerification = async function(email) {
      try {
        await apiFetch('/api/instructor-calendar/send-verification', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        showToast('Verification link sent to ' + email);
        calendarMap[email.toLowerCase()] = 'pending';
        renderTable(allUsers);
      } catch (err) { showToast(err.message, true); }
    };

    window.disconnectCalendar = async function(email) {
      if (!confirm('Disconnect Google Calendar for ' + email + '?')) return;
      try {
        await apiFetch('/api/instructor-calendar/disconnect', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        showToast('Calendar disconnected');
        delete calendarMap[email.toLowerCase()];
        renderTable(allUsers);
      } catch (err) { showToast(err.message, true); }
    };

    loadUsers();
    loadRoleOptions();
  </script>
</body>
</html>
