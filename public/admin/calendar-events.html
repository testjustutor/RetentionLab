<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="events">
  <title>Calendar Events | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css">
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
<!-- Content -->
    <div class="rounded-lg border border-slate-800 bg-slate-900/70 overflow-hidden m-4">
      <div class="p-3 border-b border-slate-800 flex flex-col lg:flex-row lg:items-center justify-between gap-2">
        <div>
 <h2 id="currentUserTitle" class="text-base font-bold ">Select an email</h2>
          <p class="text-[12px] text-slate-400 mt-0.5">This page only displays meeting data.</p>
        </div>
        <div class="flex gap-2">
          <select id="hoursAhead" class="bg-slate-100 border border-slate-700 rounded-md px-2 py-1.5 text-xs text-slate-200">
            <option value="24" selected>24 Hours</option>
            <option value="48">48 Hours</option>
            <option value="168">7 Days</option>
          </select>
          <button onclick="fetchUserMeetings()" class="px-2.5 py-1.5 rounded-md bg-slate-800 border border-slate-700 text-xs text-white hover:bg-slate-700 transition-colors">Refresh</button>
        </div>
      </div>
      <div id="meetingsList" class="p-3 space-y-2 min-h-[70vh] scroll overflow-y-auto">
        <div class="text-slate-500 text-xs">No email provided. Use <code>?email=user@company.com</code> in the URL.</div>
      </div>
    </main>
    </div>
  </div>
  <script type="module" src="../js/auth.js"></script>
  <script src="../js/load-components.js"></script>
</body>
</html>
