<!-- root/public/admin/calendar-events.html -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar Events</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body{background:radial-gradient(circle at top left,#0f172a 0%,#020617 45%),#020617;color:#e2e8f0;min-height:100vh}
    .scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:#334155;border-radius:999px}
  </style>
</head>
<body class="font-sans">
  <div class="mx-auto p-4 lg:p-4">

    <!-- Header -->    <div id="header-placeholder"></div>
<!-- Content -->
    <div class="rounded-2xl border border-slate-800 bg-slate-900/70 overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex flex-col lg:flex-row lg:items-center justify-between gap-3">
        <div>
          <h2 id="currentUserTitle" class="text-lg font-bold text-white">Select an email</h2>
          <p class="text-xs text-slate-400 mt-1">This page only displays meeting data.</p>
        </div>
        <div class="flex gap-2">
          <select id="hoursAhead" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
            <option value="24" selected>24 Hours</option>
            <option value="48">48 Hours</option>
            <option value="168">7 Days</option>
          </select>
          <button onclick="fetchUserMeetings()" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm text-slate-200 hover:bg-slate-700 transition-colors">Refresh</button>
        </div>
      </div>
      <div id="meetingsList" class="p-4 space-y-3 min-h-[70vh] scroll overflow-y-auto">
        <div class="text-slate-500 text-sm">No email provided. Use <code>?email=user@company.com</code> in the URL.</div>
      </div>
    </div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const email  = params.get('email') || '';
    const currentUserTitle = document.getElementById('currentUserTitle');
    if (currentUserTitle) {
      currentUserTitle.textContent = email ? `Meetings for ${email}` : 'Select an email';
    }

    const updatePageTitle = () => {
      const pageTitleEl = document.getElementById('pageTitle');
      if (pageTitleEl) {
        pageTitleEl.textContent = email ? `Calendar Events — ${email}` : 'Calendar Events';
      }
    };

    if (window.__rlHeaderReady) {
      window.__rlHeaderReady.then(updatePageTitle).catch(() => updatePageTitle());
    } else {
      updatePageTitle();
    }

    /* ── Platform badge color ─────────────────────────── */
    const platformColors = {
      meet:  { bg: 'rgba(34,197,94,0.1)',  border: 'rgba(34,197,94,0.25)',  text: '#4ade80',  label: 'Google Meet' },
      zoom:  { bg: 'rgba(99,102,241,0.1)', border: 'rgba(99,102,241,0.25)', text: '#818cf8',  label: 'Zoom'        },
      teams: { bg: 'rgba(59,130,246,0.1)', border: 'rgba(59,130,246,0.25)', text: '#60a5fa',  label: 'Teams'       },
    };
    function platformStyle(p) {
      const k = (p || '').toLowerCase();
      return platformColors[k] || { bg: 'rgba(100,116,139,0.1)', border: 'rgba(100,116,139,0.25)', text: '#94a3b8', label: p || 'Unknown' };
    }

    /* ── Build one meeting card ────────────────────────── */
    function buildMeetingCard(m, idx) {
      const ps      = platformStyle(m.platform);
      const cardId  = `card-${idx}`;
      const btnId   = `bot-btn-${idx}`;
      const statusId= `bot-status-${idx}`;
      const start   = m.start ? new Date(m.start) : null;
      const timeStr = start ? start.toLocaleString(undefined, { weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';

      return `
        <div id="${cardId}" class="flex items-start gap-4 p-4 rounded-2xl border border-slate-800 bg-slate-950/40 hover:border-slate-700 transition-colors">

          <!-- Left: meeting info -->
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-white font-semibold text-sm truncate">${m.title || 'Untitled Meeting'}</span>
              <span style="background:${ps.bg};border:1px solid ${ps.border};color:${ps.text}" class="text-[10px] font-semibold px-2 py-0.5 rounded-full uppercase tracking-wide shrink-0">${ps.label}</span>
            </div>
            <div class="flex items-center gap-2 mt-1.5 flex-wrap">
              <span class="text-xs text-slate-400 flex items-center gap-1">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                ${timeStr}
              </span>
              ${m.meetingId ? `<span class="text-[10px] text-slate-600 font-mono">ID: ${m.meetingId}</span>` : ''}
            </div>
            ${m.link ? `<div class="text-[11px] text-slate-600 mt-1.5 truncate font-mono">${m.link}</div>` : ''}
            <!-- Per-card status message -->
            <div id="${statusId}" class="hidden mt-2"></div>
          </div>

          <!-- Right: Join Bot button -->
          <div class="shrink-0 flex flex-col items-end gap-2 pt-0.5">
            <button
              id="${btnId}"
              onclick="startBot(this, '${statusId}', ${JSON.stringify(m).replace(/</g,'\u003c').replace(/"/g,'&quot;')})"
              class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold
                     bg-indigo-600 hover:bg-indigo-500 active:scale-95
                     text-white border border-indigo-500/50
                     transition-all duration-150 shadow-sm shadow-indigo-900/30"
            >
              <!-- Bot icon -->
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><line x1="12" y1="7" x2="12" y2="11"/><line x1="8" x2="8" y1="15" x2="8" y2="17"/><line x1="16" y1="15" x2="16" y2="17"/></svg>
              Join Bot
            </button>
          </div>

        </div>
      `;
    }

    /* ── Start bot ─────────────────────────────────────── */
    async function startBot(btn, statusId, m) {
      const statusEl = document.getElementById(statusId);

      // Derive fields the API needs
      const payload = {
        platform:   (m.platform || '').toLowerCase(),
        meetingId:  m.meetingId  || m.id || m.meeting_id || '',
        passcode:   m.passcode   || m.password || '',
        meetingUrl: m.link       || m.meetingUrl || m.url || '',
        webhookUrl: ''
      };

      if (!payload.meetingId || !payload.platform) {
        showBotStatus(statusEl, 'error', 'Missing meetingId or platform on this event.');
        return;
      }

      // Loading state
      btn.disabled = true;
      btn.innerHTML = `
        <svg class="animate-spin" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg>
        Launching…`;
      btn.classList.replace('bg-indigo-600', 'bg-slate-700');
      btn.classList.replace('hover:bg-indigo-500', 'hover:bg-slate-700');
      showBotStatus(statusEl, 'info', 'Sending bot to meeting…');

      try {
        const res  = await fetch('/api/bot/start-bot', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(payload)
        });
        const data = await res.json();

        if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

        if (data.success) {
          btn.innerHTML = `
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
            Joined`;
          btn.classList.replace('bg-slate-700', 'bg-emerald-600');
          btn.classList.add('cursor-default');
          showBotStatus(statusEl, 'success', data.message || 'Bot successfully joined the meeting.');
        } else {
          throw new Error(data.message || 'Bot failed to join.');
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><line x1="12" y1="7" x2="12" y2="11"/><line x1="8" x2="8" y1="15" x2="8" y2="17"/><line x1="16" y1="15" x2="16" y2="17"/></svg>
          Retry`;
        btn.classList.replace('bg-slate-700', 'bg-rose-600');
        btn.classList.replace('hover:bg-slate-700', 'hover:bg-rose-500');
        btn.classList.remove('cursor-default');
        showBotStatus(statusEl, 'error', err.message);
      }
    }

    /* ── Status message helper ─────────────────────────── */
    function showBotStatus(el, type, msg) {
      const styles = {
        info:    'background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.25);color:#818cf8',
        success: 'background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);color:#34d399',
        error:   'background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.25);color:#fb7185',
      };
      el.setAttribute('style', `${styles[type]};border-radius:8px;padding:6px 10px;font-size:11px;font-weight:500`);
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    /* ── Render grid ───────────────────────────────────── */
    async function fetchUserMeetings() {
      if (!email) return;
      const res  = await fetch('/api/calendar/multi/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, hoursAhead: document.getElementById('hoursAhead').value })
      });
      const data     = await res.json();
      const listEl   = document.getElementById('meetingsList');
      const meetings = data.events || [];
      if (!meetings.length) {
        listEl.innerHTML = '<div class="text-slate-500 text-sm">No meetings found.</div>';
        return;
      }
      listEl.innerHTML = meetings.map((m, i) => buildMeetingCard(m, i)).join('');
    }

    if (email) fetchUserMeetings();
  </script>

  <script>
    /* ── Common header: profile dropdown ─────────────── */
    function toggleProfileMenu() {
      const menu    = document.getElementById('profileMenu');
      const chevron = document.getElementById('profileChevron');
      const isOpen  = !menu.classList.contains('hidden');
      menu.classList.toggle('hidden', isOpen);
      chevron.style.transform = isOpen ? '' : 'rotate(180deg)';
    }

    document.addEventListener('click', function(e) {
      const wrap = document.getElementById('profileMenuWrap');
      if (wrap && !wrap.contains(e.target)) {
        document.getElementById('profileMenu').classList.add('hidden');
        document.getElementById('profileChevron').style.transform = '';
      }
    });

    function initProfileMenu() {
      try {
        const raw  = localStorage.getItem('rl_user') || sessionStorage.getItem('rl_user');
        const user = raw ? JSON.parse(raw) : null;
        if (user) {
          const name     = user.name  || user.email?.split('@')[0] || 'Admin';
          const email    = user.email || 'admin@local';
          const initials = name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
          document.getElementById('profileAvatar').textContent = initials;
          document.getElementById('profileName').textContent   = name;
          document.getElementById('profileEmail').textContent  = email;
          document.getElementById('dropdownName').textContent  = name;
          document.getElementById('dropdownEmail').textContent = email;
        }
      } catch(_) {}
    }

    async function handleLogout() {
      localStorage.removeItem('rl_user');
      localStorage.removeItem('rl_token');
      sessionStorage.clear();
      try {
        await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      } catch(_) {}
      window.location.href = '/login.html';
    }

    window.addEventListener('load', initProfileMenu);
  </script>

  <script type="module" src="/js/auth.js"></script>
  <script src="../js/load-components.js"></script>
</body>
</html>
