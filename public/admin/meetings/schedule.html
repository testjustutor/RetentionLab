<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="meetingsSchedule">
  <title>Meeting Schedule | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        
        <!-- Header Section -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
          <div>

            <!-- Stats Cards -->
            <div id="statsBar" class="grid grid-cols-2 gap-3 mb-0">
              <div class="bg-white border border-slate-200 rounded-lg p-2 shadow-sm">
                <div class="flex items-center justify-between">
                  <div>
                    <p class="text-xs text-slate-500 uppercase tracking-wider mb-1">Connected Instructors</p>
                    <p class="text-xl font-bold text-violet-600" id="statUsers">-</p>
                  </div>
                  <div class="w-10 h-10 rounded-lg bg-violet-50 flex items-center justify-center">
                    <svg class="w-5 h-5 text-violet-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8z"/></svg>
                  </div>
                </div>
              </div>
              <div class="bg-white border border-slate-200 rounded-lg p-2 shadow-sm">
                <div class="flex items-center justify-between">
                  <div>
                    <p class="text-xs text-slate-500 uppercase tracking-wider mb-1">Total Meetings</p>
                    <p class="text-xl font-bold text-emerald-600" id="statMeetings">-</p>
                  </div>
                  <div class="w-10 h-10 rounded-lg bg-emerald-50 flex items-center justify-center">
                    <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <select id="hoursSelect" class="bg-white border border-slate-300 rounded-md px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-violet-500 cursor-pointer">
              <option value="6">Next 6 Hours</option>
              <option value="12">Next 12 Hours</option>
              <option value="24" selected>Next 24 Hours</option>
              <option value="48">Next 48 Hours</option>
              <option value="168">Next 7 Days</option>
            </select>
            <button onclick="doSync()" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-500 text-white text-sm font-medium transition-colors shadow-sm">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
              Sync Now
            </button>
          </div>
        </div>


        <!-- Schedule Container -->
        <div id="scheduleContainer">
          <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            <div class="bg-white border border-slate-200 rounded-lg p-4 animate-pulse"><div class="h-3 bg-slate-200 rounded w-1/2 mb-2"></div><div class="h-2.5 bg-slate-200 rounded w-3/4 mb-1.5"></div><div class="h-2.5 bg-slate-200 rounded w-2/3"></div></div>
            <div class="bg-white border border-slate-200 rounded-lg p-4 animate-pulse"><div class="h-3 bg-slate-200 rounded w-1/2 mb-2"></div><div class="h-2.5 bg-slate-200 rounded w-3/4 mb-1.5"></div><div class="h-2.5 bg-slate-200 rounded w-2/3"></div></div>
            <div class="bg-white border border-slate-200 rounded-lg p-4 animate-pulse"><div class="h-3 bg-slate-200 rounded w-1/2 mb-2"></div><div class="h-2.5 bg-slate-200 rounded w-3/4 mb-1.5"></div><div class="h-2.5 bg-slate-200 rounded w-2/3"></div></div>
          </div>
        </div>

      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/meetings/schedule.js"></script>
</body>
</html>
