<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="meetingsCalendar">
  <title>Calendar Connections | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">

        <!-- Filter Bar -->
        <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-200 rounded-lg shadow-md p-3 mb-4">
          <div class="flex items-center justify-end">
            <input type="text" id="searchInput" placeholder="Search by email or provider..." class="w-full max-w-xs bg-white border border-violet-300 rounded-md px-2 py-1 text-[11px] text-slate-900 placeholder-slate-400 focus:outline-none focus:border-violet-500">
          </div>
        </div>

        <!-- Stats -->
        <div id="statsBar" class="grid grid-cols-3 gap-3 mb-3">
          <div class="bg-gradient-to-br from-emerald-50 to-teal-100 border-2 border-emerald-200 rounded-lg p-3 shadow-md flex items-center justify-between gap-2">
            <p class="text-[11px] font-bold text-emerald-900 uppercase tracking-wider truncate">Connected</p>
            <p class="text-xl font-bold text-emerald-950 flex-shrink-0" id="statActive">-</p>
          </div>
          <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-200 rounded-lg p-3 shadow-md flex items-center justify-between gap-2">
            <p class="text-[11px] font-bold text-violet-900 uppercase tracking-wider truncate">Total</p>
            <p class="text-xl font-bold text-violet-950 flex-shrink-0" id="statTotal">-</p>
          </div>
          <div class="bg-gradient-to-br from-amber-50 to-orange-100 border-2 border-amber-200 rounded-lg p-3 shadow-md flex items-center justify-between gap-2">
            <p class="text-[11px] font-bold text-amber-900 uppercase tracking-wider truncate">Providers</p>
            <p class="text-xl font-bold text-amber-950 flex-shrink-0" id="statProviders">-</p>
          </div>
        </div>

        <!-- Table -->
        <div class="bg-gradient-to-br from-slate-50 to-gray-100 border-2 border-slate-200 rounded-lg shadow-md overflow-hidden">
          <div id="connectionsContainer">
            <div class="overflow-x-auto overflow-y-auto max-h-96 custom-scrollbar">
              <table class="w-full">
                <thead class="sticky top-0">
                  <tr class="text-[10px] font-bold text-slate-950 uppercase border-b-2 border-slate-300 bg-slate-200">
                    <th class="py-2 px-3 text-left font-bold tracking-wide">Instructor</th>
                    <th class="py-2 px-3 text-left font-bold tracking-wide">Provider</th>
                    <th class="py-2 px-3 text-left font-bold tracking-wide">Status</th>
                    <th class="py-2 px-3 text-left font-bold tracking-wide">Calendar Connected</th>
                    <th class="py-2 px-3 text-left font-bold tracking-wide">Last Resync</th>
                    <th class="py-2 px-3 text-left font-bold tracking-wide">Role</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200" id="connectionsBody">
                  <tr>
                    <td colspan="6" class="px-4 py-12">
                      <div class="flex items-center justify-center">
                        <div class="w-6 h-6 border-2 border-violet-500 border-t-transparent rounded-full animate-spin"></div>
                        <span class="ml-3 text-sm text-slate-500">Loading...</span>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Table Footer with Pagination -->
          <div id="connectionsPagination" class="border-t border-slate-200 bg-slate-200 px-4 py-2.5 flex justify-end"></div>
        </div>

      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/meetings/calendar.js"></script>
</body></html>
