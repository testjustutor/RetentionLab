<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="meetingsCalendar">
  <title>Calendar | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
          <div></div>
          <button onclick="loadConnections()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-white text-xs font-medium transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
            Refresh
          </button>
        </div>

        <div id="statsBar" class="grid grid-cols-3 gap-2 mb-3">
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-center"><p class="text-xl font-bold text-emerald-400" id="statActive">-</p><p class="text-[12px] text-slate-500 uppercase mt-0.5">Connected</p></div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-center"><p class="text-xl font-bold text-violet-400" id="statTotal">-</p><p class="text-[12px] text-slate-500 uppercase mt-0.5">Total</p></div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-center"><p class="text-xl font-bold text-amber-800" id="statProviders">-</p><p class="text-[12px] text-slate-500 uppercase mt-0.5">Providers</p></div>
        </div>

        <div id="connectionsContainer">
          <div class="space-y-2">
            <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 animate-pulse"><div class="h-3 bg-slate-800 rounded w-1/3 mb-2"></div><div class="h-2.5 bg-slate-800 rounded w-1/2"></div></div>
            <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 animate-pulse"><div class="h-3 bg-slate-800 rounded w-1/3 mb-2"></div><div class="h-2.5 bg-slate-800 rounded w-1/2"></div></div>
          </div>
        </div>

      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/meetings/calendar.js"></script>
</body></html>
