<!doctype html>
<html lang="en">
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="meetingsCompleted">
  <title>Completed Sessions | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">

        <!-- Filter Bar -->
        <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-200 rounded-lg shadow-md p-3 mb-4">
          <div class="flex flex-wrap items-end gap-3">
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">From Date</label>
              <input type="date" id="filterFromDate" class="bg-white border border-violet-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-violet-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">To Date</label>
              <input type="date" id="filterToDate" class="bg-white border border-violet-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-violet-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">Instructor</label>
              <div id="instructorFilterContainer"></div>
            </div>
            <button onclick="loadCompleted()" class="px-4 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold transition-colors shadow-sm flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
              Get Data
            </button>
          </div>
        </div>

        <!-- Stats -->
        <div id="statsBar" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-3">
          <div class="bg-gradient-to-br from-emerald-50 to-teal-100 border-2 border-emerald-200 rounded-lg p-3 shadow-md flex items-center justify-between gap-2">
            <p class="text-[11px] font-bold text-emerald-900 uppercase tracking-wider truncate">Connected</p>
            <p class="text-xl font-bold text-emerald-950 flex-shrink-0" id="statConnected">-</p>
          </div>
          <div class="bg-gradient-to-br from-sky-50 to-blue-100 border-2 border-sky-200 rounded-lg p-3 shadow-md flex items-center justify-between gap-2">
            <p class="text-[11px] font-bold text-sky-900 uppercase tracking-wider truncate">Meetings</p>
            <p class="text-xl font-bold text-sky-950 flex-shrink-0" id="statMeetingsTotal">-</p>
          </div>
          <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-200 rounded-lg p-3 shadow-md flex items-center justify-between gap-2">
            <p class="text-[11px] font-bold text-violet-900 uppercase tracking-wider truncate">Sessions</p>
            <p class="text-xl font-bold text-violet-950 flex-shrink-0" id="statMeetings">-</p>
          </div>
          <div class="bg-gradient-to-br from-emerald-50 to-teal-100 border-2 border-emerald-200 rounded-lg p-3 shadow-md flex items-center justify-between gap-2">
            <p class="text-[11px] font-bold text-emerald-900 uppercase tracking-wider truncate">Completed</p>
            <p class="text-xl font-bold text-emerald-950 flex-shrink-0" id="statCompleted">-</p>
          </div>
          <div class="bg-gradient-to-br from-amber-50 to-orange-100 border-2 border-amber-200 rounded-lg p-3 shadow-md flex items-center justify-between gap-2">
            <p class="text-[11px] font-bold text-amber-900 uppercase tracking-wider truncate">Duration</p>
            <p class="text-xl font-bold text-amber-950 flex-shrink-0" id="statDuration">-</p>
          </div>
        </div>

        <div class="bg-gradient-to-br from-slate-50 to-gray-100 border-2 border-slate-200 rounded-lg shadow-md overflow-hidden">
          <div id="completedContainer">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 p-4">
              <div class="border border-slate-200 rounded-lg p-4 animate-pulse"><div class="h-3 bg-slate-100 rounded w-1/3 mb-3"></div><div class="h-2.5 bg-slate-100 rounded w-2/3 mb-2"></div><div class="h-2.5 bg-slate-100 rounded w-1/2"></div></div>
              <div class="border border-slate-200 rounded-lg p-4 animate-pulse"><div class="h-3 bg-slate-100 rounded w-1/3 mb-3"></div><div class="h-2.5 bg-slate-100 rounded w-2/3 mb-2"></div><div class="h-2.5 bg-slate-100 rounded w-1/2"></div></div>
            </div>
          </div>

          <!-- Table Footer with Pagination -->
          <div id="completedPagination" class="border-t border-slate-200 bg-slate-200 px-4 py-2.5 flex justify-end"></div>
        </div>

      </main>
    </div>
  </div>

  <!-- Asset Modal (Recording / Transcript / Summary) -->
  <div id="asset-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/75">
    <div class="bg-white rounded-xl shadow-xl max-w-5xl w-full mx-4 max-h-[90vh] overflow-hidden flex flex-col">
      <div class="flex items-center justify-between p-4 border-b border-slate-200">
        <h3 id="modal-asset-title" class="text-base font-semibold text-slate-900">Recording</h3>
        <button id="close-asset-modal" class="text-slate-500 hover:text-slate-700 p-1 rounded-lg hover:bg-slate-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="p-4 overflow-y-auto flex-1">
        <div class="mb-4 grid grid-cols-2 gap-4 text-sm">
          <div>
            <span class="font-semibold text-slate-700">Meeting:</span>
            <span id="modal-asset-meeting" class="text-slate-600 ml-1"></span>
          </div>
          <div>
            <span class="font-semibold text-slate-700">Instructor:</span>
            <span id="modal-asset-instructor" class="text-slate-600 ml-1"></span>
          </div>
          <div>
            <span class="font-semibold text-slate-700">Date:</span>
            <span id="modal-asset-date" class="text-slate-600 ml-1"></span>
          </div>
          <div>
            <span class="font-semibold text-slate-700">Platform:</span>
            <span id="modal-asset-platform" class="text-slate-600 ml-1"></span>
          </div>
        </div>
        <div class="border-t border-slate-200 pt-4">
          <div id="modal-asset-audio-wrap" class="hidden">
            <audio id="modal-asset-audio" controls preload="none" class="w-full"></audio>
          </div>
          <iframe id="modal-asset-iframe" src="" class="w-full h-[60vh] rounded-lg border border-slate-200"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/common-ui.js"></script>
  <script src="../../js/admin/meetings/completed.js"></script>
</body></html>
