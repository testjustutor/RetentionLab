<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <title>Completed Sessions | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
  <style>
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .animate-fade-up{animation:fadeUp .4s ease-out}
    .status-badge{transition:all .2s}
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
          <div><h1 class="text-xl font-bold text-white">Completed Sessions</h1><p class="text-xs text-slate-400 mt-1">Review finished meetings with full details</p></div>
          <div class="flex items-center gap-2">
            <select id="hoursSelect" class="bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-white focus:outline-none focus:border-violet-500 cursor-pointer">
              <option value="24">Last 24 Hours</option>
              <option value="48">Last 48 Hours</option>
              <option value="168" selected>Last 7 Days</option>
              <option value="720">Last 30 Days</option>
            </select>
            <button onclick="loadCompleted()" class="flex items-center gap-2 px-4 py-2.5 rounded-lg bg-violet-600 hover:bg-violet-500 text-white text-sm font-medium transition-colors shadow-md shadow-violet-600/10">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
              Refresh
            </button>
          </div>
        </div>

        <!-- Stats -->
        <div id="statsBar" class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-center"><p class="text-xl font-bold text-emerald-400" id="statConnected">-</p><p class="text-[10px] text-slate-500 uppercase tracking-wider mt-0.5">Connected</p></div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-center"><p class="text-xl font-bold text-violet-400" id="statMeetings">-</p><p class="text-[10px] text-slate-500 uppercase tracking-wider mt-0.5">Sessions</p></div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-center"><p class="text-xl font-bold text-emerald-400" id="statCompleted">-</p><p class="text-[10px] text-slate-500 uppercase tracking-wider mt-0.5">Completed</p></div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-center"><p class="text-xl font-bold text-amber-400" id="statDuration">-</p><p class="text-[10px] text-slate-500 uppercase tracking-wider mt-0.5">Duration</p></div>
        </div>

        <div id="completedContainer">
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
            <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 animate-pulse"><div class="h-3 bg-slate-800 rounded w-1/3 mb-3"></div><div class="h-2.5 bg-slate-800 rounded w-2/3 mb-2"></div><div class="h-2.5 bg-slate-800 rounded w-1/2"></div></div>
            <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 animate-pulse"><div class="h-3 bg-slate-800 rounded w-1/3 mb-3"></div><div class="h-2.5 bg-slate-800 rounded w-2/3 mb-2"></div><div class="h-2.5 bg-slate-800 rounded w-1/2"></div></div>
          </div>
        </div>

      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script>
    var COL = ['violet','emerald','amber','rose','sky'];
    var PLAT = { 'google-meet':'Google Meet', 'zoom':'Zoom', 'teams':'Teams' };

    function fmtTime(iso) { if (!iso) return '--'; var d = new Date(iso); return d.toLocaleDateString([],{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
    function fmtDuration(start, end) { if (!start||!end) return '--'; var m = Math.round((new Date(end)-new Date(start))/60000); if (m<60) return m+'m'; var h=Math.floor(m/60); m=m%60; return h+'h'+ (m>0?' '+m+'m':''); }

    async function loadCompleted() {
      var c = document.getElementById('completedContainer');
      c.innerHTML = '<div class="flex items-center justify-center py-20"><div class="w-6 h-6 border-2 border-violet-500 border-t-transparent rounded-full animate-spin"></div><span class="ml-3 text-sm text-slate-400">Loading completed sessions...</span></div>';
      try {
        var json = await apiFetch('/api/meeting-schedule/completed?hours='+document.getElementById('hoursSelect').value);
        var users = json.users || [];
        var total = json.totalEvents || 0;
        var totalDur = 0;
        var completedCount = 0;
        users.forEach(function(u){ u.events.forEach(function(e){ if(e.start&&e.end) totalDur += Math.round((new Date(e.end)-new Date(e.start))/60000); }); });
        document.getElementById('statConnected').textContent = json.connectedUsers || 0;
        document.getElementById('statMeetings').textContent = total;
        document.getElementById('statCompleted').textContent = total;
        document.getElementById('statDuration').textContent = totalDur >= 60 ? Math.floor(totalDur/60)+'h '+totalDur%60+'m' : totalDur+'m';

        if (!total) { c.innerHTML = '<div class="flex flex-col items-center justify-center py-20 text-slate-500"><div class="w-16 h-16 rounded-full bg-slate-800 flex items-center justify-center mb-4"><svg class="w-8 h-8 text-slate-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div><p class="text-sm">No completed sessions in this period</p></div>'; return; }

        var html = '';
        for (var i = 0; i < users.length; i++) {
          var u = users[i]; var color = COL[i%COL.length]; var events = (u.events||[]).sort(function(a,b){return new Date(b.start)-new Date(a.start);});
          html += '<div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden animate-fade-up" style="animation-delay:'+(i*80)+'ms">';
          html += '<div class="p-3 border-b border-slate-800 flex items-center gap-2 bg-'+color+'-500/5">';
          html += '<div class="w-8 h-8 rounded-md bg-'+color+'-500/10 border border-'+color+'-500/20 flex items-center justify-center text-'+color+'-400 font-bold text-[10px]">'+(u.email||'?').charAt(0).toUpperCase()+'</div>';
          html += '<div class="flex-1 min-w-0"><p class="text-xs font-semibold text-white truncate">'+escHtml(u.email)+'</p><p class="text-[10px] text-slate-500">'+escHtml(u.role_name||'instructor')+' &middot; '+events.length+' completed</p></div>';
          html += '<span class="inline-block px-1.5 py-0.5 rounded-full text-[10px] font-medium bg-'+color+'-500/10 text-'+color+'-400 border border-'+color+'-500/20">'+events.length+'</span></div>';
          html += '<div class="overflow-x-auto"><table class="w-full text-left text-xs"><thead><tr class="border-b border-slate-800 text-[10px] text-slate-500 uppercase tracking-wider"><th class="py-2 px-3">Meeting</th><th class="py-2 px-3">Date & Time</th><th class="py-2 px-3">Duration</th><th class="py-2 px-3">Platform</th><th class="py-2 px-3 text-right">Status</th></tr></thead><tbody class="divide-y divide-slate-800/50">';

          for (var j = 0; j < events.length; j++) {
            var e = events[j]; var dur = fmtDuration(e.start, e.end); var status = e.status || 'completed';
            var statusCls = status==='completed'?'bg-emerald-500/10 text-emerald-400 border-emerald-500/20':status==='failed'?'bg-red-500/10 text-red-400 border-red-500/20':'bg-amber-500/10 text-amber-400 border-amber-500/20';
            var platName = PLAT[e.platform] || (e.platform||'Unknown');
            html += '<tr class="hover:bg-slate-800/30 transition-colors">';
            html += '<td class="py-2 px-3"><p class="text-white font-medium truncate max-w-[150px]">'+escHtml(e.title||'Untitled')+'</p></td>';
            html += '<td class="py-2 px-3 text-slate-400">'+fmtTime(e.start)+'</td>';
            html += '<td class="py-2 px-3 text-slate-400">'+dur+'</td>';
            html += '<td class="py-2 px-3"><span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">'+escHtml(platName)+'</span></td>';
            html += '<td class="py-2 px-3 text-right"><span class="inline-flex px-1.5 py-0.5 rounded-full text-[10px] font-medium '+statusCls+'">'+status+'</span></td>';
            html += '</tr>';
          }
          html += '</tbody></table></div></div>';
        }
        c.innerHTML = html;
      } catch(err) { c.innerHTML = '<div class="flex flex-col items-center justify-center py-20 text-red-400"><p>Failed to load</p><p class="text-xs mt-1">'+escHtml(err.message)+'</p></div>'; }
    }

    document.getElementById('hoursSelect').addEventListener('change', loadCompleted);
    loadCompleted();
  </script>
</body></html>
