<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="meetingsCompleted">
  <title>Completed Sessions | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">

        <!-- Filter Bar -->
        <div class="bg-white border border-slate-200 rounded-lg p-3 mb-4">
          <div class="flex flex-wrap items-end gap-3">
            <div>
              <label class="block text-[10px] text-slate-500 uppercase tracking-wide mb-1">From Date</label>
              <input type="date" id="filterFromDate" class="bg-white border border-slate-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-violet-500">
            </div>
            <div>
              <label class="block text-[10px] text-slate-500 uppercase tracking-wide mb-1">To Date</label>
              <input type="date" id="filterToDate" class="bg-white border border-slate-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-violet-500">
            </div>
            <div>
              <label class="block text-[10px] text-slate-500 uppercase tracking-wide mb-1">Instructor</label>
              <div id="instructorFilterContainer"></div>
            </div>
            <button onclick="loadCompleted()" class="px-4 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-white text-xs font-medium transition-colors shadow-sm flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
              Get Data
            </button>
          </div>
        </div>

        <!-- Stats -->
        <div id="statsBar" class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
          <div class="bg-white border border-slate-200 rounded-lg p-2.5 text-center"><p class="text-xl font-bold text-emerald-700" id="statConnected">-</p><p class="text-[12px] text-slate-500 uppercase tracking-wider mt-0.5">Connected</p></div>
          <div class="bg-white border border-slate-200 rounded-lg p-2.5 text-center"><p class="text-xl font-bold text-violet-700" id="statMeetings">-</p><p class="text-[12px] text-slate-500 uppercase tracking-wider mt-0.5">Sessions</p></div>
          <div class="bg-white border border-slate-200 rounded-lg p-2.5 text-center"><p class="text-xl font-bold text-emerald-700" id="statCompleted">-</p><p class="text-[12px] text-slate-500 uppercase tracking-wider mt-0.5">Completed</p></div>
          <div class="bg-white border border-slate-200 rounded-lg p-2.5 text-center"><p class="text-xl font-bold text-amber-700" id="statDuration">-</p><p class="text-[12px] text-slate-500 uppercase tracking-wider mt-0.5">Duration</p></div>
        </div>

        <div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
          <div id="completedContainer">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 p-4">
              <div class="border border-slate-200 rounded-lg p-4 animate-pulse"><div class="h-3 bg-slate-100 rounded w-1/3 mb-3"></div><div class="h-2.5 bg-slate-100 rounded w-2/3 mb-2"></div><div class="h-2.5 bg-slate-100 rounded w-1/2"></div></div>
              <div class="border border-slate-200 rounded-lg p-4 animate-pulse"><div class="h-3 bg-slate-100 rounded w-1/3 mb-3"></div><div class="h-2.5 bg-slate-100 rounded w-2/3 mb-2"></div><div class="h-2.5 bg-slate-100 rounded w-1/2"></div></div>
            </div>
          </div>

          <!-- Table Footer with Pagination -->
          <div id="completedPagination" class="border-t border-slate-200 bg-slate-200 px-4 py-2.5 flex justify-end"></div>
        </div>

      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/common-ui.js"></script>
  <script src="../../js/admin/meetings/completed.js"></script>
</body></html>
