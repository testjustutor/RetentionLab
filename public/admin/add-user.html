<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="dashboard-role" content="admin" />
  <meta name="header-page" content="addUser" />
  <title>Add Reviewer — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
        <div class="max-w-3xl mx-auto">
          <h2 class="text-xl font-bold text-white mb-1.5">Add Reviewer</h2>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
            <form id="addReviewerForm" class="space-y-2">
              <div>
                <label for="name" class="block text-xs font-medium text-slate-300">Full Name</label>
                <input id="name" name="name" type="text" required class="mt-1 block w-full rounded-md bg-slate-950 border border-slate-800 px-2.5 py-1.5 text-xs text-white focus:border-violet-500 focus:ring-violet-500/20 outline-none" placeholder="e.g. Jane Doe" />
              </div>
              <div>
                <label for="email" class="block text-xs font-medium text-slate-300">Email</label>
                <input id="email" name="email" type="email" required class="mt-1 block w-full rounded-md bg-slate-950 border border-slate-800 px-2.5 py-1.5 text-xs text-white focus:border-violet-500 focus:ring-violet-500/20 outline-none" placeholder="reviewer@company.com" />
              </div>
              <div>
                <label for="password" class="block text-xs font-medium text-slate-300">Password</label>
                <input id="password" name="password" type="password" required class="mt-1 block w-full rounded-md bg-slate-950 border border-slate-800 px-2.5 py-1.5 text-xs text-white focus:border-violet-500 focus:ring-violet-500/20 outline-none" placeholder="Choose a strong password" />
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-300">Role</label>
                <div class="mt-1 rounded-md border border-slate-800 bg-slate-950 px-2.5 py-1.5 text-xs text-slate-200">
                  Reviewer
                </div>
              </div>
              <div id="formMessage" class="text-xs min-h-[1.25rem]"></div>
              <button type="submit" class="inline-flex items-center justify-center rounded-md bg-violet-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-violet-500 transition">Create Reviewer</button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/load-components.js"></script>
  <script>
    let reviewerRoleId = null;

    async function loadReviewerRole() {
      try {
        const response = await fetch('/api/roles/reviewer', { credentials: 'include' });
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Unable to load reviewer role');
        }
        const role = await response.json();
        reviewerRoleId = role.id;
      } catch (err) {
        document.getElementById('formMessage').textContent = err.message;
        document.getElementById('formMessage').className = 'text-sm text-red-400';
      }
    }

    async function submitReviewerForm(event) {
      event.preventDefault();
      const messageEl = document.getElementById('formMessage');
      messageEl.textContent = '';

      if (!reviewerRoleId) {
        messageEl.textContent = 'Reviewer role not loaded. Please refresh.';
        messageEl.className = 'text-sm text-red-400';
        return;
      }

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!name || !email || !password) {
        messageEl.textContent = 'Name, email, and password are required.';
        messageEl.className = 'text-sm text-red-400';
        return;
      }

      const payload = {
        first_name: name,
        email,
        password_hash: password,
        role_id: reviewerRoleId
      };

      try {
        const res = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const error = await res.json();
          throw new Error(error.error || 'Failed to create reviewer');
        }

        const created = await res.json();
        messageEl.textContent = `Reviewer ${created.email} created successfully.`;
        messageEl.className = 'text-sm text-emerald-400';
        event.target.reset();
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = 'text-sm text-red-400';
      }
    }

    document.getElementById('addReviewerForm').addEventListener('submit', submitReviewerForm);
    window.addEventListener('load', loadReviewerRole);
  </script>
</body>
</html>
