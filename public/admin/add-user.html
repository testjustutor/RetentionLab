<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="dashboard-role" content="admin" />
  <title>Add Reviewer — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        <div class="max-w-3xl mx-auto">
 <h2 class="text-xl font-bold mb-1.5">Add Reviewer</h2>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
            <form id="addReviewerForm" class="space-y-2">
              <div>
                <label for="name" class="block text-xs font-medium text-slate-300">Full Name</label>
 <input id="name" name="name" type="text" required class="mt-1 block w-full rounded-md bg-slate-100 border border-slate-800 px-2.5 py-1.5 text-xs focus:border-violet-500 focus:ring-violet-500/20 outline-none" placeholder="e.g. Jane Doe" />
              </div>
              <div>
                <label for="email" class="block text-xs font-medium text-slate-300">Email</label>
 <input id="email" name="email" type="email" required class="mt-1 block w-full rounded-md bg-slate-100 border border-slate-800 px-2.5 py-1.5 text-xs focus:border-violet-500 focus:ring-violet-500/20 outline-none" placeholder="reviewer@company.com" />
              </div>
              <div>
                <label for="password" class="block text-xs font-medium text-slate-300">Password</label>
 <input id="password" name="password" type="password" required class="mt-1 block w-full rounded-md bg-slate-100 border border-slate-800 px-2.5 py-1.5 text-xs focus:border-violet-500 focus:ring-violet-500/20 outline-none" placeholder="Choose a strong password" />
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-300">Role</label>
                <div class="mt-1 rounded-md border border-slate-800 bg-slate-100 px-2.5 py-1.5 text-xs text-slate-200">
                  Reviewer
                </div>
              </div>
              <div id="formMessage" class="text-xs min-h-[1.25rem]"></div>
              <button type="submit" class="inline-flex items-center justify-center rounded-md bg-violet-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-violet-500 transition">Create Reviewer</button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/load-components.js"></script>
  <script src="../js/admin/add-user.js"></script>
</body>
</html>
