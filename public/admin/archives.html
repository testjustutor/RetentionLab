<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <title>Archives | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
          <div><h1 class="text-xl font-bold text-white">Archives</h1><p class="text-xs text-slate-400 mt-1">Historical storage for meetings, reviews, and reports</p></div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
          <table class="w-full text-left text-xs"><thead><tr class="border-b border-slate-800"><th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Item</th><th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Type</th><th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Date</th><th class="py-2 px-3 text-[10px] text-slate-400 uppercase text-right">Actions</th></tr></thead>
          <tbody class="divide-y divide-slate-800"><tr class="hover:bg-slate-800/30"><td class="py-2 px-3 text-xs text-white">Q1 Retrospective</td><td class="py-2 px-3 text-[10px] text-slate-400">Meeting</td><td class="py-2 px-3 text-[10px] text-slate-400">Mar 31, 2026</td><td class="py-2 px-3 text-right"><button class="text-[10px] text-violet-400 hover:text-violet-300 px-1.5">Restore</button></td></tr></tbody></table>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/auth.js"></script>
  <script src="../js/load-components.js"></script>
</body>
</html>
