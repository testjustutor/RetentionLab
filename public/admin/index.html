<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <title>Dashboard | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
          <div><h1 class="text-xl font-bold text-white">Dashboard</h1><p class="text-xs text-slate-400 mt-1">Main operational overview</p></div>
        </div>
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2 mb-2">
          <div class="p-3 rounded-lg bg-slate-900 border border-slate-800"><p class="text-[10px] text-slate-400 font-medium tracking-wide uppercase">Today's Meetings</p><h3 class="text-xl font-bold text-white mt-1">--</h3></div>
          <div class="p-3 rounded-lg bg-slate-900 border border-slate-800"><p class="text-[10px] text-slate-400 font-medium tracking-wide uppercase">Pending Reviews</p><h3 class="text-xl font-bold text-amber-400 mt-1">--</h3></div>
          <div class="p-3 rounded-lg bg-slate-900 border border-slate-800"><p class="text-[10px] text-slate-400 font-medium tracking-wide uppercase">Average Score</p><h3 class="text-xl font-bold text-violet-400 mt-1">--</h3></div>
          <div class="p-3 rounded-lg bg-slate-900 border border-slate-800"><p class="text-[10px] text-slate-400 font-medium tracking-wide uppercase">Active Users</p><h3 class="text-xl font-bold text-emerald-400 mt-1">--</h3></div>
        </section>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-3 mb-2">
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 lg:col-span-1"><h2 class="text-xs font-semibold text-white mb-2">Active Session</h2><p class="text-[10px] text-slate-500">Session info will appear here.</p></div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 lg:col-span-2"><h2 class="text-xs font-semibold text-white mb-2">Recent Activity</h2><p class="text-[10px] text-slate-500">Loading activity...</p></div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-3"><h2 class="text-xs font-semibold text-white mb-3">Meeting Trends</h2><p class="text-[10px] text-slate-500">Chart placeholder</p></div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/auth.js"></script>
  <script src="../js/load-components.js"></script>
</body>
</html>
