<!doctype html>
<html lang="en">
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="reportsTeams">
  <title>Team Reports | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="../../js/common-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        <div class="bg-gradient-to-br from-violet-50 to-purple-100 border border-violet-200 rounded-lg p-3 mb-4 shadow-sm">
          <div class="flex flex-wrap items-end gap-3">
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">From Date</label>
              <input type="date" id="filterFromDate" class="w-full md:w-auto bg-white border border-violet-300 rounded-md px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-violet-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">To Date</label>
              <input type="date" id="filterToDate" class="w-full md:w-auto bg-white border border-violet-300 rounded-md px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-violet-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">Instructor</label>
              <div id="instructorFilterContainer" class="min-w-52"></div>
            </div>
            <div class="flex items-end gap-2 ml-auto">
              <button id="getDataBtn" class="px-4 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold transition-colors shadow-sm">Get Data</button>
              <select id="teamFilter" class="bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs focus:border-violet-500 outline-none">
                <option value="">All Teams</option>
              </select>
              <button onclick="exportTeamReport()" class="px-3 py-1.5 rounded-md bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition-colors">Export CSV</button>
            </div>
          </div>
        </div>

        <!-- Team Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-2 mb-4" id="statsCards">
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-violet-500/10 border border-violet-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
              </div>
 <div><p class="text-[12px] text-slate-700 font-bold-600">Teams</p><p class="text-base font-bold " id="totalTeams">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-blue-500/10 border border-blue-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path>
                </svg>
              </div>
 <div><p class="text-[12px] text-slate-700 font-bold-600">Members</p><p class="text-base font-bold " id="totalMembers">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
              </div>
 <div><p class="text-[12px] text-slate-700 font-bold-600">Avg Score</p><p class="text-base font-bold " id="avgPerformance">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-amber-500/10 border border-amber-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-amber-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                </svg>
              </div>
 <div><p class="text-[12px] text-slate-700 font-bold-600">Growth</p><p class="text-base font-bold " id="growthRate">-</p></div>
            </div>
          </div>
        </div>

        <!-- Team Performance Chart -->
        <div class="bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-200 rounded-lg p-3 mb-4 shadow-md">
          <h3 class="text-sm font-bold text-blue-900 mb-2">Team Performance Comparison</h3>
          <div class="h-56">
            <canvas id="teamChart"></canvas>
          </div>
        </div>

                <!-- Team Details Cards -->
        <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-200 rounded-lg p-3 shadow-md">
          <h3 class="text-[13px] font-bold text-violet-900 mb-2 uppercase tracking-wide">Team Performance Details</h3>
          <div id="teamCards" class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <div class="animate-pulse space-y-3">
              <div class="h-28 bg-slate-100 rounded-lg"></div>
              <div class="h-28 bg-slate-100 rounded-lg"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/reports/teams.js"></script>
</body></html>
