<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <title>Audit Reports | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
          <div><h1 class="text-xl font-bold text-white">Audit Reports</h1><p class="text-xs text-slate-400 mt-1">Compliance, review quality, and AI accuracy</p></div>
          <div class="flex gap-2">
            <select id="auditTypeFilter" class="bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-white focus:border-violet-500 outline-none">
              <option value="">All Types</option>
              <option value="accuracy">AI Accuracy</option>
              <option value="quality">Review Quality</option>
              <option value="compliance">Compliance</option>
            </select>
            <select id="daysFilter" class="bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-white focus:border-violet-500 outline-none">
              <option value="7">7 days</option>
              <option value="30" selected>30 days</option>
              <option value="90">90 days</option>
              <option value="365">1 year</option>
            </select>
            <button onclick="exportCsv()" class="px-3 py-1.5 rounded-md bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition-colors">Export CSV</button>
          </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-2 mb-4" id="statsCards">
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-violet-500/10 border border-violet-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
              </div>
              <div><p class="text-[10px] text-slate-500">Total</p><p class="text-base font-bold text-white" id="totalAudits">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
              </div>
              <div><p class="text-[10px] text-slate-500">Passed</p><p class="text-base font-bold text-white" id="passedCount">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-red-500/10 border border-red-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </div>
              <div><p class="text-[10px] text-slate-500">Failed</p><p class="text-base font-bold text-white" id="failedCount">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-amber-500/10 border border-amber-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </div>
              <div><p class="text-[10px] text-slate-500">Pass Rate</p><p class="text-base font-bold text-white" id="passRate">-</p></div>
            </div>
          </div>
        </div>

        <!-- Charts Row -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 mb-4">
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
            <h3 class="text-xs font-semibold text-white mb-2">Pass / Fail Distribution</h3>
            <div class="h-48"><canvas id="passRateChart"></canvas></div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
            <h3 class="text-xs font-semibold text-white mb-2">Audits by Category</h3>
            <div class="h-48"><canvas id="categoriesChart"></canvas></div>
          </div>
        </div>

        <!-- Audit Data Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead><tr class="border-b border-slate-800 bg-slate-800/30">
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Type</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Category</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Description</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Findings</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Score</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Max</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Status</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Date</th>
              </tr></thead>
              <tbody class="divide-y divide-slate-800" id="auditBody">
                <tr><td class="py-6 px-3 text-slate-500 text-center" colspan="8">Loading audit data...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script>
    let allAudits = [];
    let stats = {};
    let passChart = null, catChart = null;

    (async () => {
      ['auditTypeFilter','daysFilter'].forEach(id => {
        document.getElementById(id).addEventListener('change', loadAudits);
      });
      await loadAudits();
    })();

    async function loadAudits() {
      document.getElementById('auditBody').innerHTML = '<tr><td class="py-8 px-4 text-slate-500 text-center" colspan="8">Loading...</td></tr>';
      try {
        const days = document.getElementById('daysFilter').value;
        const data = await apiFetch(`/api/audit-reports/summary?days=${days}`);
        allAudits = data.audits || [];
        stats = data.stats || {};
        render();
      } catch(e) {
        console.error('Failed to load audit reports:', e);
        document.getElementById('auditBody').innerHTML = `<tr><td class="py-8 px-4 text-red-400 text-center" colspan="8">Error: ${e.message}</td></tr>`;
      }
    }

    function render() {
      updateStats();
      renderTable();
      renderCharts();
    }

    function updateStats() {
      document.getElementById('totalAudits').textContent = stats.total || 0;
      document.getElementById('passedCount').textContent = stats.passed || 0;
      document.getElementById('failedCount').textContent = stats.failed || 0;
      document.getElementById('passRate').textContent = stats.passRate ? stats.passRate + '%' : '0%';
    }

    function renderTable() {
      const tbody = document.getElementById('auditBody');
      const filterType = document.getElementById('auditTypeFilter').value;
      const filtered = filterType ? allAudits.filter(a => a.type === filterType) : allAudits;

      if (!filtered.length) {
        tbody.innerHTML = '<tr><td class="py-8 px-4 text-slate-500 text-center" colspan="8">No audit entries found for this period</td></tr>';
        return;
      }

      let html = '';
      filtered.forEach(a => {
        const typeColor = a.type === 'accuracy' ? 'bg-amber-500/10 text-amber-400' :
                          a.type === 'quality' ? 'bg-violet-500/10 text-violet-400' :
                          'bg-blue-500/10 text-blue-400';
        const statusColor = a.status === 'pass' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' :
                            'bg-red-500/10 text-red-400 border border-red-500/20';
        const scoreColor = +a.score >= 4 ? 'text-emerald-400' : +a.score >= 3 ? 'text-blue-400' : 'text-amber-400';

        html += `<tr class="hover:bg-slate-800/30">
          <td class="py-2 px-3"><span class="text-[10px] px-1.5 py-0.5 rounded ${typeColor} font-medium">${a.type}</span></td>
          <td class="py-2 px-3 text-[10px] text-slate-300">${escapeHtml(a.category || '-')}</td>
          <td class="py-2 px-3 text-xs text-white max-w-[150px] truncate">${escapeHtml(a.description || '-')}</td>
          <td class="py-2 px-3 text-[10px] text-slate-400 max-w-[200px] truncate">${escapeHtml(a.findings || '-')}</td>
          <td class="py-2 px-3 text-xs font-bold ${scoreColor}">${a.score || '-'}</td>
          <td class="py-2 px-3 text-[10px] text-slate-500">${a.maxScore || '-'}</td>
          <td class="py-2 px-3"><span class="text-[10px] px-1.5 py-0.5 rounded ${statusColor}">${a.status === 'pass' ? 'Pass' : 'Fail'}</span></td>
          <td class="py-2 px-3 text-[10px] text-slate-500">${formatDate(a.date)}</td>
        </tr>`;
      });
      tbody.innerHTML = html;
    }

    function renderCharts() {
      // Destroy existing charts
      if (passChart) { passChart.destroy(); passChart = null; }
      if (catChart) { catChart.destroy(); catChart = null; }

      const filterType = document.getElementById('auditTypeFilter').value;
      const filtered = filterType ? allAudits.filter(a => a.type === filterType) : allAudits;

      // Pass Rate Doughnut
      const passed = filtered.filter(a => a.status === 'pass').length;
      const failed = filtered.filter(a => a.status === 'fail').length;
      
      if (document.getElementById('passRateChart')) {
        passChart = new Chart(document.getElementById('passRateChart').getContext('2d'), {
          type: 'doughnut',
          data: {
            labels: ['Passed', 'Failed'],
            datasets: [{
              data: [passed, failed],
              backgroundColor: ['rgba(34, 197, 94, 0.6)', 'rgba(239, 68, 68, 0.6)'],
              borderColor: ['rgba(34, 197, 94, 1)', 'rgba(239, 68, 68, 1)'],
              borderWidth: 2
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { color: '#e2e8f0' } } }
          }
        });
      }

      // Categories Bar
      const catCounts = {};
      filtered.forEach(a => { catCounts[a.type] = (catCounts[a.type] || 0) + 1; });
      const catLabels = Object.keys(catCounts);
      const catData = Object.values(catCounts);
      const catColors = {
        accuracy: { bg: 'rgba(245, 158, 11, 0.3)', border: 'rgba(245, 158, 11, 1)' },
        quality: { bg: 'rgba(139, 92, 246, 0.3)', border: 'rgba(139, 92, 246, 1)' },
        compliance: { bg: 'rgba(59, 130, 246, 0.3)', border: 'rgba(59, 130, 246, 1)' }
      };

      if (document.getElementById('categoriesChart')) {
        catChart = new Chart(document.getElementById('categoriesChart').getContext('2d'), {
          type: 'bar',
          data: {
            labels: catLabels,
            datasets: [{
              label: 'Count',
              data: catData,
              backgroundColor: catLabels.map(l => (catColors[l] || catColors.accuracy).bg),
              borderColor: catLabels.map(l => (catColors[l] || catColors.accuracy).border),
              borderWidth: 1
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
              y: { beginAtZero: true, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
            }
          }
        });
      }
    }

    function exportCsv() {
      const filterType = document.getElementById('auditTypeFilter').value;
      const filtered = filterType ? allAudits.filter(a => a.type === filterType) : allAudits;
      if (!filtered.length) { showToast('No data to export', true); return; }

      const headers = ['Type','Category','Description','Findings','Score','Max Score','Status','Date'];
      const csv = [headers.join(',')].concat(filtered.map(a => [
        a.type, `"${(a.category||'').replace(/"/g,'""')}"`, `"${(a.description||'').replace(/"/g,'""')}"`,
        `"${(a.findings||'').replace(/"/g,'""')}"`, a.score||'', a.maxScore||'', a.status, formatDate(a.date)
      ].join(','))).join('\n');

      const blob = new Blob([csv], { type:'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `audit-report-${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      showToast('Exported');
    }

    function formatDate(d) { if (!d) return 'N/A'; return new Date(d).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); }
    function escapeHtml(s) { if (!s) return ''; const div = document.createElement('div'); div.textContent = String(s); return div.innerHTML; }
  </script>
</body></html>
