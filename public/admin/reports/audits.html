<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="reportsAudits">
  <title>Audit Reports | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="../../js/common-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        <!-- Filters Section -->
                <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-4">
          <div class="flex flex-wrap items-end gap-3">
            <div>
              <label class="block text-[12px] text-slate-400 mb-1">Start Date</label>
              <input type="date" id="startDate" class="w-full md:w-auto bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs focus:border-violet-500 outline-none">
            </div>
            <div>
              <label class="block text-[12px] text-slate-400 mb-1">End Date</label>
              <input type="date" id="endDate" class="w-full md:w-auto bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs focus:border-violet-500 outline-none">
            </div>
                        <div>
              <label class="block text-[12px] text-slate-400 mb-1">Instructor</label>
              <div id="instructorFilterContainer" class="min-w-52"></div>
            </div>
            <div>
              <label class="block text-[12px] text-slate-400 mb-1">Type</label>
              <select id="auditTypeFilter" class="w-full md:w-auto bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs focus:border-violet-500 outline-none">
                <option value="">All Types</option>
                <option value="accuracy">AI Accuracy</option>
                <option value="quality">Review Quality</option>
                <option value="compliance">Compliance</option>
              </select>
            </div>
            <div class="flex items-end gap-2">
              <button onclick="loadAudits()" class="px-4 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold transition-colors">Get Data</button>
              <button onclick="exportCsv()" class="px-3 py-1.5 rounded-md bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition-colors">Export CSV</button>
            </div>
          </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-2 mb-4" id="statsCards">
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-violet-500/10 border border-violet-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
              </div>
              <div><p class="text-[12px] text-slate-500">Total</p><p class="text-base font-bold " id="totalAudits">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
              </div>
              <div><p class="text-[12px] text-slate-500">Passed</p><p class="text-base font-bold " id="passedCount">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-red-500/10 border border-red-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </div>
              <div><p class="text-[12px] text-slate-500">Failed</p><p class="text-base font-bold " id="failedCount">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-amber-500/10 border border-amber-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-amber-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </div>
              <div><p class="text-[12px] text-slate-500">Pass Rate</p><p class="text-base font-bold " id="passRate">-</p></div>
            </div>
          </div>
        </div>

        <!-- Charts Row -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 mb-4">
          <div class="bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-200 rounded-lg p-3 shadow-md">
            <h3 class="text-[13px] font-bold text-blue-900 mb-2 uppercase tracking-wide">Pass / Fail Distribution</h3>
            <div class="h-48"><canvas id="passRateChart"></canvas></div>
          </div>
          <div class="bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-200 rounded-lg p-3 shadow-md">
            <h3 class="text-[13px] font-bold text-blue-900 mb-2 uppercase tracking-wide">Audits by Category</h3>
            <div class="h-48"><canvas id="categoriesChart"></canvas></div>
          </div>
        </div>

        <!-- Audit Data Table -->
        <div class="bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-200 rounded-lg overflow-hidden">
          <h3 class="text-sm font-bold text-black px-3 pt-3 pb-1">Audit Records</h3>
          <div class="overflow-x-auto overflow-y-auto max-h-96 custom-scrollbar">
            <table class="w-full text-left text-xs">
              <thead><tr class="border-b-2 border-blue-300 bg-blue-200">
                <th class="py-2 px-3 text-[12px] text-blue-950 uppercase">Type</th>
                <th class="py-2 px-3 text-[12px] text-blue-950 uppercase">Category</th>
                <th class="py-2 px-3 text-[12px] text-blue-950 uppercase">Description</th>
                <th class="py-2 px-3 text-[12px] text-blue-950 uppercase">Findings</th>
                <th class="py-2 px-3 text-[12px] text-blue-950 uppercase">Score</th>
                <th class="py-2 px-3 text-[12px] text-blue-950 uppercase">Max</th>
                <th class="py-2 px-3 text-[12px] text-blue-950 uppercase">Status</th>
                <th class="py-2 px-3 text-[12px] text-blue-950 uppercase">Date</th>
              </tr></thead>
              <tbody id="auditBody">
                <tr><td class="py-8 px-4 text-blue-700 text-center" colspan="8">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/reports/audits.js"></script>
</body></html>
