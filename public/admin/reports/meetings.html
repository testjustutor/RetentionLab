<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="reportsMeetings">
  <title>Meeting Reports | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">

        <!-- Meeting Reports Filters (#meeting-reports-filters) -->
        <div id="meeting-reports-filters" class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-200 rounded-lg shadow-md p-3 mb-4 insight-section filters-section">
          <div class="flex flex-wrap items-end gap-3">
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">From Date</label>
              <input type="date" id="filterFromDate" class="w-full md:w-auto bg-white border border-violet-300 rounded-md px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-violet-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">To Date</label>
              <input type="date" id="filterToDate" class="w-full md:w-auto bg-white border border-violet-300 rounded-md px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-violet-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">Instructor</label>
              <div id="instructorFilterContainer" class="min-w-44"></div>
            </div>
            <div class="flex items-end gap-2">
              <button id="getDataBtn" class="px-4 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold transition-colors shadow-sm">Get Data</button>
              <button onclick="exportCsv()" class="px-3 py-1.5 rounded-md bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition-colors">Export CSV</button>
            </div>
          </div>
        </div>

        <!-- Summary Stats Cards - compact template design (#meeting-report-stats) -->
        <div id="meeting-report-stats" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-4 insight-section">
          <!-- Total -->
          <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-300 rounded-lg px-3 py-1.5 shadow-sm flex items-center justify-between">
            <p class="text-[10px] font-bold text-violet-900 uppercase tracking-wide">Total</p>
            <p class="text-base font-bold text-violet-950" id="totalMeetings">-</p>
          </div>
          <!-- Avg Duration -->
          <div class="bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-300 rounded-lg px-3 py-1.5 shadow-sm flex items-center justify-between">
            <p class="text-[10px] font-bold text-blue-900 uppercase tracking-wide">Avg Duration</p>
            <p class="text-base font-bold text-blue-950" id="avgDuration">-</p>
          </div>
          <!-- Active -->
          <div class="bg-gradient-to-br from-emerald-50 to-teal-100 border-2 border-emerald-300 rounded-lg px-3 py-1.5 shadow-sm flex items-center justify-between">
            <p class="text-[10px] font-bold text-emerald-900 uppercase tracking-wide">Active</p>
            <p class="text-base font-bold text-emerald-950" id="activeMeetings">-</p>
          </div>
          <!-- Participants -->
          <div class="bg-gradient-to-br from-amber-50 to-orange-100 border-2 border-amber-300 rounded-lg px-3 py-1.5 shadow-sm flex items-center justify-between">
            <p class="text-[10px] font-bold text-amber-900 uppercase tracking-wide">Participants</p>
            <p class="text-base font-bold text-amber-950" id="totalParticipants">-</p>
          </div>
        </div>

        <!-- Meetings Over Time (#meeting-report-trends) -->
        <div id="meeting-report-trends" class="bg-gradient-to-br from-indigo-50 to-blue-100 border-2 border-indigo-300 rounded-lg p-3 mb-4 shadow-md insight-section">
          <h3 class="text-[13px] font-bold text-indigo-900 mb-2 uppercase tracking-wide">Meetings Over Time</h3>
          <div class="overflow-x-auto overflow-y-auto max-h-64 custom-scrollbar">
            <table class="w-full text-left text-[11px]">
              <thead class="sticky top-0">
                <tr class="border-b-2 border-indigo-300 bg-indigo-200">
                  <th class="py-2 px-2 text-[10px] font-bold text-indigo-950 uppercase">Date</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-indigo-950 uppercase text-right">Meetings</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-indigo-950 uppercase text-right">Percentage</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-indigo-200" id="meetingsTrendTable">
                <tr><td colspan="3" class="py-2 text-center text-indigo-800 font-medium">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- All Meetings (#meeting-report-list) -->
        <div id="meeting-report-list" class="bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-300 rounded-lg p-3 shadow-md insight-section">
          <h3 class="text-[13px] font-bold text-blue-900 mb-2 uppercase tracking-wide">All Meetings</h3>
          <div class="overflow-x-auto overflow-y-auto max-h-[24rem] custom-scrollbar">
            <table class="w-full text-left text-[11px]">
              <thead class="sticky top-0">
                <tr class="border-b-2 border-blue-300 bg-blue-200">
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase">Title</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase">Platform</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase">Status</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase">Date</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase">Owner</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-blue-200" id="meetingsBody">
                <tr><td class="py-6 px-2 text-blue-800 text-center" colspan="5">Loading meetings...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/reports/meetings.js"></script>
</body></html>
