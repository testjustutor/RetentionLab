<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="reportsSessionQuality">
  <title>Session Quality Report | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
          <div>
          </div>
          <div class="flex flex-wrap gap-2 items-center">
            <select id="meetingSelect" class="bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs focus:border-violet-500 outline-none min-w-[200px]">
              <option value="">Select a meeting...</option>
            </select>
            <button id="refreshBtn" class="px-3 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold transition-colors">Refresh</button>
            <button id="downloadBtn" class="px-3 py-1.5 rounded-md bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition-colors">Download HTML</button>
          </div>
        </div>

        <div id="pageMessage" class="mb-4 px-4 py-3 rounded-lg bg-amber-500/10 text-amber-100 hidden"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4">
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
            <h2 class="text-sm font-semibold text-slate-200 mb-2">Session Snapshot</h2>
            <div class="space-y-2 text-sm text-slate-300" id="snapshotSection">Loading...</div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
            <h2 class="text-sm font-semibold text-slate-200 mb-2">Report Summary</h2>
            <div class="space-y-2 text-sm text-slate-300" id="summarySection">Loading...</div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
            <h2 class="text-sm font-semibold text-slate-200 mb-2">Status</h2>
            <div class="text-sm text-slate-300" id="metadataSection">Loading...</div>
          </div>
        </div>

        <div class="space-y-4" id="reportSections"></div>
      </main>
    </div>
  </div>

  <script src="../../js/common-ui.js"></script>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/reports/session-quality.js"></script>
</body>
</html>
