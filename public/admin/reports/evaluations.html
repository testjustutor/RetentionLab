<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="reportsEvaluations">
  <title>Evaluation Reports | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
          <div></div>
          <div class="flex gap-2">
            <select id="scoreTypeFilter" class="bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs focus:border-violet-500 outline-none">
              <option value="">All Scores</option>
              <option value="AI">AI Scores</option>
              <option value="HUMAN">Human Scores</option>
            </select>
            <button onclick="exportReport()" class="px-3 py-1.5 rounded-md bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition-colors">Export CSV</button>
          </div>
        </div>

        <!-- Summary Stats -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-2 mb-4" id="statsCards">
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-violet-500/10 border border-violet-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
              </div>
 <div><p class="text-[12px] text-slate-500">Meetings</p><p class="text-base font-bold " id="totalMeetings">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-blue-500/10 border border-blue-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
              </div>
 <div><p class="text-[12px] text-slate-500">Avg AI</p><p class="text-base font-bold " id="avgAiScore">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
 <div><p class="text-[12px] text-slate-500">Avg Human</p><p class="text-base font-bold " id="avgHumanScore">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-amber-500/10 border border-amber-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-amber-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </div>
 <div><p class="text-[12px] text-slate-500">Rubrics</p><p class="text-base font-bold " id="totalRubrics">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-rose-500/10 border border-rose-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
              </div>
 <div><p class="text-[12px] text-slate-500">Reviewers</p><p class="text-base font-bold " id="totalReviewers">-</p></div>
            </div>
          </div>
        </div>

        <!-- Evaluation Trend Chart -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-4">
 <h3 class="text-xs font-semibold mb-2">Score Trends Over Time</h3>
          <div class="h-56">
            <canvas id="trendsChart"></canvas>
          </div>
        </div>

        <!-- Evaluation Data Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead>
                <tr class="border-b border-slate-800 bg-slate-800/30">
                  <th class="py-2 px-3 text-[12px] text-slate-400 uppercase">Meeting</th>
                  <th class="py-2 px-3 text-[12px] text-slate-400 uppercase">Rubric</th>
                  <th class="py-2 px-3 text-[12px] text-slate-400 uppercase">AI Score</th>
                  <th class="py-2 px-3 text-[12px] text-slate-400 uppercase">Human Score</th>
                  <th class="py-2 px-3 text-[12px] text-slate-400 uppercase">Final Score</th>
                  <th class="py-2 px-3 text-[12px] text-slate-400 uppercase">Reviews</th>
                  <th class="py-2 px-3 text-[12px] text-slate-400 uppercase">Date</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800" id="evaluationBody">
                <tr><td class="py-6 px-3 text-slate-500 text-center" colspan="7">Loading evaluation data...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/reports/evaluations.js"></script>
</body></html>
