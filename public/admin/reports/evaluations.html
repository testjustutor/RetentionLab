<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <title>Evaluation Reports | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
          <div><h1 class="text-xl font-bold text-white">Evaluation Reports</h1><p class="text-xs text-slate-400 mt-1">Scores, rubrics, and reviewer feedback</p></div>
          <div class="flex gap-2">
            <select id="scoreTypeFilter" class="bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-white focus:border-violet-500 outline-none">
              <option value="">All Scores</option>
              <option value="AI">AI Scores</option>
              <option value="HUMAN">Human Scores</option>
            </select>
            <button onclick="exportReport()" class="px-3 py-1.5 rounded-md bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition-colors">Export CSV</button>
          </div>
        </div>

        <!-- Summary Stats -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-2 mb-4" id="statsCards">
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-violet-500/10 border border-violet-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
              </div>
              <div><p class="text-[10px] text-slate-500">Meetings</p><p class="text-base font-bold text-white" id="totalMeetings">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-blue-500/10 border border-blue-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
              </div>
              <div><p class="text-[10px] text-slate-500">Avg AI</p><p class="text-base font-bold text-white" id="avgAiScore">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
              <div><p class="text-[10px] text-slate-500">Avg Human</p><p class="text-base font-bold text-white" id="avgHumanScore">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-amber-500/10 border border-amber-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </div>
              <div><p class="text-[10px] text-slate-500">Rubrics</p><p class="text-base font-bold text-white" id="totalRubrics">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-rose-500/10 border border-rose-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
              </div>
              <div><p class="text-[10px] text-slate-500">Reviewers</p><p class="text-base font-bold text-white" id="totalReviewers">-</p></div>
            </div>
          </div>
        </div>

        <!-- Evaluation Trend Chart -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-4">
          <h3 class="text-xs font-semibold text-white mb-2">Score Trends Over Time</h3>
          <div class="h-56">
            <canvas id="trendsChart"></canvas>
          </div>
        </div>

        <!-- Evaluation Data Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead>
                <tr class="border-b border-slate-800 bg-slate-800/30">
                  <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Meeting</th>
                  <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Rubric</th>
                  <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">AI Score</th>
                  <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Human Score</th>
                  <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Final Score</th>
                  <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Reviews</th>
                  <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Date</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800" id="evaluationBody">
                <tr><td class="py-6 px-3 text-slate-500 text-center" colspan="7">Loading evaluation data...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script>
    let allScores = [];
    let allMeetings = [];
    let trendsChart = null;

    (async () => {
      await Promise.all([loadScores(), loadMeetings()]);
      updateStats();
      renderEvaluationTable();
      initChart();
    })();

    async function loadScores() {
      try {
        const data = await apiFetch('/api/scores');
        allScores = data.scores || [];
      } catch(e) {
        console.error('Failed to load scores:', e);
      }
    }

    async function loadMeetings() {
      try {
        const data = await apiFetch('/api/meetings/list');
        allMeetings = data.meetings || [];
        if (!allMeetings.length) {
          // Fallback to bot manager listing
          const fallback = await apiFetch('/api/meetings');
          allMeetings = fallback.data?.meetings || [];
        }
      } catch(e) {
        console.error('Failed to load meetings:', e);
      }
    }

    // Rubrics derived from meeting/rubric score data
    function getRubricsForMeeting(meetingId) {
      const meetingScores = allScores.filter(s => s.meeting_id === meetingId);
      const rubricIds = new Set(meetingScores.map(s => s.rubric_id || s.category_id).filter(Boolean));
      return Array.from(rubricIds);
    }

    function updateStats() {
      const aiScores = allScores.filter(s => s.score_type === 'AI');
      const humanScores = allScores.filter(s => s.score_type === 'HUMAN');

      const avgAi = aiScores.length ? (aiScores.reduce((sum, s) => sum + (+s.score || 0), 0) / aiScores.length).toFixed(1) : '0.0';
      const avgHuman = humanScores.length ? (humanScores.reduce((sum, s) => sum + (+s.score || 0), 0) / humanScores.length).toFixed(1) : '0.0';

      document.getElementById('totalMeetings').textContent = allMeetings.length;
      document.getElementById('avgAiScore').textContent = avgAi;
      document.getElementById('avgHumanScore').textContent = avgHuman;
      // Count unique indicator/category groups from scores
      const rubricGroups = new Set(allScores.map(s => s.category_id || s.rubric_id).filter(Boolean));
      document.getElementById('totalRubrics').textContent = rubricGroups.size || 0;

      // Count unique reviewers
      const reviewerIds = new Set(allScores.map(s => s.reviewer_id).filter(Boolean));
      document.getElementById('totalReviewers').textContent = reviewerIds.size;
    }

    function renderEvaluationTable() {
      const tbody = document.getElementById('evaluationBody');
      const filterType = document.getElementById('scoreTypeFilter')?.value || '';

      // Group scores by meeting
      const byMeeting = {};
      allScores.forEach(score => {
        const mid = score.meeting_id || 'unknown';
        if (!byMeeting[mid]) byMeeting[mid] = { ai: [], human: [] };
        if (score.score_type === 'AI') byMeeting[mid].ai.push(+score.score || 0);
        else byMeeting[mid].human.push(+score.score || 0);
      });

      const meetings = allMeetings.filter(m => !filterType || byMeeting[m.meeting_id]);
      
      if (!meetings.length) {
        tbody.innerHTML = '<tr><td class="py-8 px-4 text-slate-500 text-center" colspan="7">No evaluation data found</td></tr>';
        return;
      }

      let html = '';
      meetings.forEach(m => {
        const ms = byMeeting[m.meeting_id];
        const rubrics = getRubricsForMeeting(m.meeting_id);
        const aiAvg = ms?.ai?.length ? (ms.ai.reduce((a,b) => a+b, 0) / ms.ai.length).toFixed(1) : '-';
        const humanAvg = ms?.human?.length ? (ms.human.reduce((a,b) => a+b, 0) / ms.human.length).toFixed(1) : '-';
        const finalScore = ms ? (((ms.ai.reduce((a,b) => a+b, 0) + ms.human.reduce((a,b) => a+b, 0)) / (ms.ai.length + ms.human.length)) || 0).toFixed(1) : '-';
        const totalReviews = (ms?.ai?.length || 0) + (ms?.human?.length || 0);

        html += `<tr class="hover:bg-slate-800/30">
          <td class="py-2 px-3 text-xs text-white">${escapeHtml(m.title || 'Untitled')}</td>
          <td class="py-2 px-3 text-[10px] text-slate-400">${rubrics.length} rubric${rubrics.length !== 1 ? 's' : ''}</td>
          <td class="py-2 px-3 text-[10px] font-medium ${+aiAvg >= 4 ? 'text-emerald-400' : +aiAvg >= 3 ? 'text-blue-400' : 'text-slate-400'}">${aiAvg}</td>
          <td class="py-2 px-3 text-[10px] font-medium ${+humanAvg >= 4 ? 'text-emerald-400' : +humanAvg >= 3 ? 'text-blue-400' : 'text-slate-400'}">${humanAvg}</td>
          <td class="py-2 px-3 text-xs font-bold text-white">${finalScore}</td>
          <td class="py-2 px-3 text-[10px] text-slate-400">${totalReviews}</td>
          <td class="py-2 px-3 text-[10px] text-slate-500">${formatDate(m.start_time)}</td>
        </tr>`;
      });

      tbody.innerHTML = html;
    }

    function initChart() {
      const ctx = document.getElementById('trendsChart').getContext('2d');
      
      // Group scores by date
      const byDate = {};
      allScores.forEach(s => {
        const date = new Date(s.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        if (!byDate[date]) byDate[date] = { ai: [], human: [] };
        if (s.score_type === 'AI') byDate[date].ai.push(+s.score || 0);
        else byDate[date].human.push(+s.score || 0);
      });

      const dates = Object.keys(byDate).sort((a,b) => new Date(a) - new Date(b));
      const aiAvgs = dates.map(d => byDate[d].ai.length ? (byDate[d].ai.reduce((a,b) => a+b, 0) / byDate[d].ai.length) : null);
      const humanAvgs = dates.map(d => byDate[d].human.length ? (byDate[d].human.reduce((a,b) => a+b, 0) / byDate[d].human.length) : null);

      trendsChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dates,
          datasets: [
            {
              label: 'AI Score',
              data: aiAvgs,
              borderColor: 'rgba(139, 92, 246, 1)',
              backgroundColor: 'rgba(139, 92, 246, 0.1)',
              tension: 0.4,
              pointRadius: 4
            },
            {
              label: 'Human Score',
              data: humanAvgs,
              borderColor: 'rgba(34, 197, 94, 1)',
              backgroundColor: 'rgba(34, 197, 94, 0.1)',
              tension: 0.4,
              pointRadius: 4
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#e2e8f0' } }
          },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
            y: { min: 0, max: 5, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
          }
        }
      });
    }

    async function exportReport() {
      try {
        const rows = allScores.map(s => ({
          meeting: s.meeting_title || 'Untitled',
          indicator: s.indicator_name || 'Unknown',
          type: s.score_type || 'HUMAN',
          score: (+s.score || 0).toFixed(1),
          reviewer: s.reviewer_name || 'System',
          date: formatDate(s.created_at)
        }));

        if (!rows.length) { showToast('No data to export', true); return; }

        const headers = Object.keys(rows[0]);
        const csv = [headers.join(',')].concat(rows.map(r => headers.map(k => `"${String(r[k]).replace(/"/g,'""')}"`).join(','))).join('\n');

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `evaluation-report-${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Report exported');
      } catch(e) { showToast('Export failed: ' + e.message, true); }
    }

    // Set up filter
    document.addEventListener('change', (e) => {
      if (e.target.id === 'scoreTypeFilter') renderEvaluationTable();
    });

    function formatDate(d) {
      if (!d) return 'N/A';
      return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function escapeHtml(s) {
      if (!s) return '';
      const div = document.createElement('div');
      div.textContent = String(s);
      return div.innerHTML;
    }
  </script>
</body></html>
