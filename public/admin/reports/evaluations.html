<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <meta name='dashboard-role' content='admin'>
  <meta name='header-page' content='reportsEvaluations'>
  <title>Evaluation Reports | RetentionLab</title>
  <script src='https://cdn.tailwindcss.com'></script>
  <link href='https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css' rel='stylesheet' />
  <link rel='stylesheet' href='../../css/shared.css'>
  <script src='https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js'></script>
  <script src='https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js'></script>
  <script src='../../js/common-ui.js'></script>
</head>
<body class='min-h-screen bg-slate-100 text-slate-900 antialiased'>
  <div class='flex h-screen'>
    <div id='sidebar-placeholder'></div>
    <div class='flex-1 flex flex-col overflow-hidden'>
      <div id='header-placeholder'></div>
      <main class='flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100'>
        <!-- Evaluation Filters (#evaluations-filters) -->
        <div id='evaluations-filters' class='bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-200 rounded-lg shadow-md p-3 mb-4 insight-section filters-section'>
          <div class='flex flex-wrap items-end gap-3'>
            <div>
              <label class='block text-[10px] font-bold text-blue-900 uppercase tracking-wide mb-1'>From Date</label>
              <input type='date' id='filterFromDate' class='w-full md:w-auto bg-white border border-blue-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-blue-500'>
            </div>
            <div>
              <label class='block text-[10px] font-bold text-blue-900 uppercase tracking-wide mb-1'>To Date</label>
              <input type='date' id='filterToDate' class='w-full md:w-auto bg-white border border-blue-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-blue-500'>
            </div>
            <div>
              <label class='block text-[10px] font-bold text-blue-900 uppercase tracking-wide mb-1'>Instructor</label>
              <div id='instructorFilterContainer'></div>
            </div>
            <div>
              <label class='block text-[10px] font-bold text-blue-900 uppercase tracking-wide mb-1'>Score Type</label>
              <select id='scoreTypeFilter' class='w-full md:w-auto bg-white border border-blue-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-blue-500'>
                <option value=''>All Scores</option>
                <option value='AI'>AI Scores</option>
                <option value='HUMAN'>Human Scores</option>
              </select>
            </div>
            <div class='flex items-end gap-2'>
              <button id='getDataBtn' class='px-4 py-1.5 rounded-md bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold transition-colors shadow-sm'>Get Data</button>
              <button onclick='exportCsv()' class='px-3 py-1.5 rounded-md bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition-colors shadow-sm'>Export CSV</button>
            </div>
          </div>
        </div>
        <!-- Evaluation Summary Stats (#evaluation-summary-stats) -->
        <div id='evaluation-summary-stats' class='grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 mb-4 insight-section'>
          <div class='bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-200 rounded-lg px-3 py-2 shadow-md'>
            <p class='text-[10px] font-bold text-blue-900 uppercase tracking-wide'>Meetings</p>
            <p class='text-xl font-bold text-blue-950' id='totalMeetings'>-</p>
          </div>
          <div class='bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-200 rounded-lg px-3 py-2 shadow-md'>
            <p class='text-[10px] font-bold text-violet-900 uppercase tracking-wide'>Avg AI</p>
            <p class='text-xl font-bold text-violet-950' id='avgAiScore'>-</p>
          </div>
          <div class='bg-gradient-to-br from-emerald-50 to-teal-100 border-2 border-emerald-200 rounded-lg px-3 py-2 shadow-md'>
            <p class='text-[10px] font-bold text-emerald-900 uppercase tracking-wide'>Avg Human</p>
            <p class='text-xl font-bold text-emerald-950' id='avgHumanScore'>-</p>
          </div>
          <div class='bg-gradient-to-br from-amber-50 to-orange-100 border-2 border-amber-200 rounded-lg px-3 py-2 shadow-md'>
            <p class='text-[10px] font-bold text-amber-900 uppercase tracking-wide'>Rubrics</p>
            <p class='text-xl font-bold text-amber-950' id='totalRubrics'>-</p>
          </div>
          <div class='bg-gradient-to-br from-rose-50 to-pink-100 border-2 border-rose-200 rounded-lg px-3 py-2 shadow-md'>
            <p class='text-[10px] font-bold text-rose-900 uppercase tracking-wide'>Reviewers</p>
            <p class='text-xl font-bold text-rose-950' id='totalReviewers'>-</p>
          </div>
        </div>
        <!-- Evaluation Score Trends (#evaluation-score-trends) -->
        <div id='evaluation-score-trends' class='bg-gradient-to-br from-indigo-50 to-blue-100 border-2 border-indigo-200 rounded-lg p-3 mb-4 shadow-md insight-section'>
          <h3 class='text-[13px] font-bold text-indigo-900 mb-2 uppercase tracking-wide'>Score Trends Over Time</h3>
          <div class='overflow-x-auto overflow-y-auto max-h-64 custom-scrollbar'>
            <table class='w-full text-left text-[11px]'>
              <thead class='sticky top-0'>
                <tr class='border-b-2 border-indigo-300 bg-indigo-200'>
                  <th class='py-2 px-2 text-[10px] font-bold text-indigo-950 uppercase'>Date</th>
                  <th class='py-2 px-2 text-[10px] font-bold text-indigo-950 uppercase text-right'>Avg AI</th>
                  <th class='py-2 px-2 text-[10px] font-bold text-indigo-950 uppercase text-right'>Avg Human</th>
                </tr>
              </thead>
              <tbody class='divide-y divide-indigo-200' id='scoreTrendBody'>
                <tr><td colspan='3' class='py-2 text-center text-indigo-800 font-medium'>Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <!-- Evaluation Data Table (#evaluations-table) -->
        <div id='evaluations-table' class='bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-200 rounded-lg p-3 shadow-md insight-section'>
          <h3 class='text-[13px] font-bold text-blue-900 mb-2 uppercase tracking-wide'>Evaluation Records</h3>
          <div class='overflow-x-auto overflow-y-auto max-h-96 custom-scrollbar'>
            <table class='w-full text-left text-[11px]'>
              <thead class='sticky top-0'>
                <tr class='border-b-2 border-blue-300 bg-blue-200'>
                  <th class='py-2 px-2 text-[10px] font-bold text-blue-950 uppercase'>Meeting</th>
                  <th class='py-2 px-2 text-[10px] font-bold text-blue-950 uppercase'>Rubric</th>
                  <th class='py-2 px-2 text-[10px] font-bold text-blue-950 uppercase text-right'>AI Score</th>
                  <th class='py-2 px-2 text-[10px] font-bold text-blue-950 uppercase text-right'>Human Score</th>
                  <th class='py-2 px-2 text-[10px] font-bold text-blue-950 uppercase text-right'>Final Score</th>
                  <th class='py-2 px-2 text-[10px] font-bold text-blue-950 uppercase text-right'>Reviews</th>
                  <th class='py-2 px-2 text-[10px] font-bold text-blue-950 uppercase'>Date</th>
                </tr>
              </thead>
              <tbody class='divide-y divide-blue-200' id='evaluationBody'>
                <tr><td class='py-6 px-2 text-blue-800 text-center' colspan='7'>Loading evaluation data...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type='module' src='../../js/auth.js'></script>
  <script src='../../js/load-components.js'></script>
  <script src='../../js/admin/reports/evaluations.js'></script>
</body>
</html>
