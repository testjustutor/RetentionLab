<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <title>Engagement | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
          <div><h1 class="text-xl font-bold text-white">Engagement</h1><p class="text-xs text-slate-400 mt-1">Participation rates and interaction levels</p></div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-4"><div class="bg-slate-900 border border-slate-800 rounded-lg p-3 text-center"><p class="text-[10px] text-slate-400">Participation Rate</p><p class="text-2xl font-bold text-violet-400 mt-1.5">78%</p></div><div class="bg-slate-900 border border-slate-800 rounded-lg p-3 text-center"><p class="text-[10px] text-slate-400">Avg Speaking Time</p><p class="text-2xl font-bold text-emerald-400 mt-1.5">12.4m</p></div><div class="bg-slate-900 border border-slate-800 rounded-lg p-3 text-center"><p class="text-[10px] text-slate-400">Interaction Level</p><p class="text-2xl font-bold text-amber-400 mt-1.5">High</p></div></div>
      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
</body>
</html>
