<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="insightsActions">
  <title>Action Items | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        
        <!-- Action Items Filters (#actions-filters) -->
        <div id="actions-filters" class="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-4 insight-section filters-section">
          <div class="grid grid-cols-1 md:grid-cols-6 gap-3">
            <!-- From Date -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">From Date</label>
              <input type="date" id="filterFromDate" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-slate-100 focus:border-indigo-500 focus:outline-none">
            </div>

            <!-- To Date -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">To Date</label>
              <input type="date" id="filterToDate" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-slate-100 focus:border-indigo-500 focus:outline-none">
            </div>

            <!-- Status Filter -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">Status</label>
              <div id="statusFilterContainer"></div>
            </div>
          </div>
        </div>

        <!-- Actions Summary Stats (#actions-summary-stats) -->
        <div id="actions-summary-stats" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-4 insight-section">
          <!-- Total Actions -->
          <div class="bg-gradient-to-br from-indigo-50 to-blue-100 border-2 border-indigo-400 rounded-lg px-3 py-2 shadow-md">
            <p class="text-[10px] font-bold text-indigo-900 uppercase tracking-wide">Total Actions</p>
            <p class="text-xl font-bold text-indigo-950" id="totalActions">-</p>
          </div>
          <!-- Pending -->
          <div class="bg-gradient-to-br from-amber-50 to-orange-100 border-2 border-amber-400 rounded-lg px-3 py-2 shadow-md">
            <p class="text-[10px] font-bold text-amber-900 uppercase tracking-wide">Pending</p>
            <p class="text-xl font-bold text-amber-950" id="pendingActions">-</p>
          </div>
          <!-- In Progress -->
          <div class="bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-400 rounded-lg px-3 py-2 shadow-md">
            <p class="text-[10px] font-bold text-blue-900 uppercase tracking-wide">In Progress</p>
            <p class="text-xl font-bold text-blue-950" id="inProgressActions">-</p>
          </div>
          <!-- Completed -->
          <div class="bg-gradient-to-br from-emerald-50 to-teal-100 border-2 border-emerald-400 rounded-lg px-3 py-2 shadow-md">
            <p class="text-[10px] font-bold text-emerald-900 uppercase tracking-wide">Completed</p>
            <p class="text-xl font-bold text-emerald-950" id="completedActions">-</p>
          </div>
        </div>

        <!-- Actions Priority Distribution (#actions-priority-distribution) -->
        <div id="actions-priority-distribution" class="bg-gradient-to-br from-orange-50 to-amber-100 border-2 border-orange-400 rounded-lg p-3 mb-4 shadow-md insight-section">
          <h3 class="text-[13px] font-bold text-orange-900 mb-2 uppercase tracking-wide">Priority Distribution</h3>
          <div class="flex items-center gap-3">
            <div class="flex-1 bg-red-100 border border-red-300 rounded-md px-3 py-1.5 flex items-center justify-between shadow-sm">
              <span class="text-[11px] font-bold text-red-800 uppercase tracking-wide">High</span>
              <span class="text-base font-bold text-red-950" id="highPriority">-</span>
            </div>
            <div class="flex-1 bg-amber-100 border border-amber-300 rounded-md px-3 py-1.5 flex items-center justify-between shadow-sm">
              <span class="text-[11px] font-bold text-amber-800 uppercase tracking-wide">Medium</span>
              <span class="text-base font-bold text-amber-950" id="mediumPriority">-</span>
            </div>
            <div class="flex-1 bg-slate-100 border border-slate-300 rounded-md px-3 py-1.5 flex items-center justify-between shadow-sm">
              <span class="text-[11px] font-bold text-slate-700 uppercase tracking-wide">Low</span>
              <span class="text-base font-bold text-slate-900" id="lowPriority">-</span>
            </div>
          </div>
        </div>

        <!-- Actions Instructor Performance (#actions-instructor-performance) -->
        <div id="actions-instructor-performance" class="bg-gradient-to-br from-indigo-50 to-blue-100 border-2 border-indigo-400 rounded-lg p-3 mb-4 shadow-md insight-section">
          <h3 class="text-[13px] font-bold text-indigo-900 mb-2 uppercase tracking-wide">Instructor Performance</h3>
          <div class="overflow-x-auto overflow-y-auto max-h-64 custom-scrollbar">
            <table class="w-full text-left text-[11px]">
              <thead class="sticky top-0">
                <tr class="border-b-2 border-indigo-300 bg-indigo-200">
                  <th class="py-2 px-2 text-[10px] font-bold text-indigo-950 uppercase">Instructor</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-indigo-950 uppercase text-right">Total</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-indigo-950 uppercase text-right">Pending</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-indigo-950 uppercase text-right">In Progress</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-indigo-950 uppercase text-right">Completed</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-indigo-950 uppercase text-right">Rate</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-indigo-200" id="instructorTable">
                <tr><td colspan="6" class="py-2 px-2 text-center text-indigo-800 font-medium">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Actions Recent Items (#actions-recent-items) -->
        <div id="actions-recent-items" class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-400 rounded-lg p-3 mb-4 shadow-md insight-section">
          <h3 class="text-[13px] font-bold text-violet-900 mb-2 uppercase tracking-wide">Recent Action Items</h3>
          <div class="overflow-x-auto overflow-y-auto max-h-80 custom-scrollbar">
            <table class="w-full text-left text-[11px]">
              <thead class="sticky top-0">
                <tr class="border-b-2 border-violet-300 bg-violet-200">
                  <th class="py-2 px-2 text-[10px] font-bold text-violet-950 uppercase">Priority</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-violet-950 uppercase">Status</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-violet-950 uppercase">Type</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-violet-950 uppercase">Action Item</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-violet-950 uppercase text-right">Date</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-violet-200" id="recentActionsTable">
                <tr><td colspan="5" class="py-2 px-2 text-center text-violet-800 font-medium">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/insights/actions.js"></script>
</body>
</html>
