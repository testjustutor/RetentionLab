<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="insightsActions">
  <title>Action Items | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        
        <!-- Filters Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-4">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <!-- From Date -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">From Date</label>
              <input type="date" id="filterFromDate" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-slate-100 focus:border-indigo-500 focus:outline-none">
            </div>

            <!-- To Date -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">To Date</label>
              <input type="date" id="filterToDate" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-slate-100 focus:border-indigo-500 focus:outline-none">
            </div>

            <!-- Status Filter -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">Status</label>
              <div id="statusFilterContainer"></div>
            </div>
          </div>
        </div>

        <!-- Summary Stats Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
          <!-- Total Actions -->
          <div class="bg-gradient-to-br from-indigo-600 to-indigo-700 border border-indigo-500/30 rounded-lg p-4 shadow-lg">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-[11px] text-indigo-100 uppercase tracking-wide">Total Actions</p>
                <p class="text-3xl font-bold text-white mt-1.5" id="totalActions">-</p>
              </div>
              <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                </svg>
              </div>
            </div>
          </div>

          <!-- Pending -->
          <div class="bg-gradient-to-br from-amber-600 to-amber-700 border border-amber-500/30 rounded-lg p-4 shadow-lg">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-[11px] text-amber-100 uppercase tracking-wide">Pending</p>
                <p class="text-3xl font-bold text-white mt-1.5" id="pendingActions">-</p>
              </div>
              <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </div>
            </div>
          </div>

          <!-- In Progress -->
          <div class="bg-gradient-to-br from-blue-600 to-blue-700 border border-blue-500/30 rounded-lg p-4 shadow-lg">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-[11px] text-blue-100 uppercase tracking-wide">In Progress</p>
                <p class="text-3xl font-bold text-white mt-1.5" id="inProgressActions">-</p>
              </div>
              <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
              </div>
            </div>
          </div>

          <!-- Completed -->
          <div class="bg-gradient-to-br from-emerald-600 to-emerald-700 border border-emerald-500/30 rounded-lg p-4 shadow-lg">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-[11px] text-emerald-100 uppercase tracking-wide">Completed</p>
                <p class="text-3xl font-bold text-white mt-1.5" id="completedActions">-</p>
              </div>
              <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Priority Distribution -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 mb-4">
          <h3 class="text-sm font-bold text-slate-100 mb-3 flex items-center gap-2">
            <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path>
            </svg>
            Priority Distribution
          </h3>
          <div class="grid grid-cols-3 gap-3">
            <div class="bg-red-500/10 border border-red-500/20 rounded-md p-3 text-center">
              <p class="text-[10px] text-red-300 uppercase tracking-wide">High Priority</p>
              <p class="text-2xl font-bold text-red-400 mt-1" id="highPriority">-</p>
            </div>
            <div class="bg-amber-500/10 border border-amber-500/20 rounded-md p-3 text-center">
              <p class="text-[10px] text-amber-300 uppercase tracking-wide">Medium Priority</p>
              <p class="text-2xl font-bold text-amber-800 mt-1" id="mediumPriority">-</p>
            </div>
            <div class="bg-slate-500/10 border border-slate-500/20 rounded-md p-3 text-center">
              <p class="text-[10px] text-slate-300 uppercase tracking-wide">Low Priority</p>
              <p class="text-2xl font-bold text-slate-400 mt-1" id="lowPriority">-</p>
            </div>
          </div>
        </div>

        <!-- Instructor Breakdown -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 mb-4">
          <h3 class="text-sm font-bold text-slate-100 mb-3 flex items-center gap-2">
            <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            Instructor Performance
          </h3>
          <div id="instructorBreakdown" class="space-y-2">
            <div class="animate-pulse space-y-2">
              <div class="h-20 bg-slate-800/50 rounded-md"></div>
              <div class="h-20 bg-slate-800/50 rounded-md"></div>
            </div>
          </div>
        </div>

        <!-- Recent Action Items -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
          <h3 class="text-sm font-bold text-slate-100 mb-3 flex items-center gap-2">
            <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
            Recent Action Items
          </h3>
          <div id="recentActions" class="space-y-2">
            <div class="animate-pulse space-y-2">
              <div class="h-24 bg-slate-800/50 rounded-md"></div>
              <div class="h-24 bg-slate-800/50 rounded-md"></div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/insights/actions.js"></script>
</body>
</html>
