<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="insightsDecisions">
  <title>Decisions | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        
        <!-- Filters Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-4">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <!-- From Date -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">From Date</label>
              <input type="date" id="filterFromDate" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-slate-100 focus:border-cyan-500 focus:outline-none">
            </div>

            <!-- To Date -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">To Date</label>
              <input type="date" id="filterToDate" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-slate-100 focus:border-cyan-500 focus:outline-none">
            </div>

            <!-- Decision Type Filter -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">Decision Type</label>
              <div id="typeFilterContainer"></div>
            </div>
          </div>
        </div>

        <!-- Summary Stats Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-4">
          <!-- Total Decisions -->
          <div class="bg-gradient-to-br from-cyan-600 to-cyan-700 border border-cyan-500/30 rounded-lg p-4 shadow-lg">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-[11px] text-cyan-100 uppercase tracking-wide">Total Decisions</p>
                <p class="text-3xl font-bold text-white mt-1.5" id="totalDecisions">-</p>
              </div>
              <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </div>
            </div>
          </div>

          <!-- Evaluation Decisions -->
          <div class="bg-gradient-to-br from-violet-600 to-violet-700 border border-violet-500/30 rounded-lg p-4 shadow-lg">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-[11px] text-violet-100 uppercase tracking-wide">From Evaluations</p>
                <p class="text-3xl font-bold text-white mt-1.5" id="evaluationDecisions">-</p>
              </div>
              <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                </svg>
              </div>
            </div>
          </div>

          <!-- Coaching Decisions -->
          <div class="bg-gradient-to-br from-amber-600 to-amber-700 border border-amber-500/30 rounded-lg p-4 shadow-lg">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-[11px] text-amber-100 uppercase tracking-wide">From Coaching</p>
                <p class="text-3xl font-bold text-white mt-1.5" id="coachingDecisions">-</p>
              </div>
              <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Performance Metrics & Rating Distribution -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
          <!-- Performance Metrics -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
            <h3 class="text-sm font-bold text-slate-100 mb-3 flex items-center gap-2">
              <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
              </svg>
              Performance Metrics
            </h3>
            <div class="space-y-3">
              <div class="flex items-center justify-between">
                <span class="text-xs text-slate-400">Avg Teacher Performance</span>
                <span class="text-sm font-bold text-cyan-400" id="avgTeacherPerformance">-</span>
              </div>
              <div class="flex items-center justify-between">
                <span class="text-xs text-slate-400">Avg Student Engagement</span>
                <span class="text-sm font-bold text-emerald-400" id="avgStudentEngagement">-</span>
              </div>
              <div class="flex items-center justify-between">
                <span class="text-xs text-slate-400">Avg Learning Impact</span>
                <span class="text-sm font-bold text-blue-400" id="avgLearningImpact">-</span>
              </div>
            </div>
          </div>

          <!-- Rating Distribution -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
            <h3 class="text-sm font-bold text-slate-100 mb-3 flex items-center gap-2">
              <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
              </svg>
              Rating Distribution
            </h3>
            <div class="grid grid-cols-2 gap-2">
              <div class="bg-emerald-500/10 border border-emerald-500/20 rounded-md p-2 text-center">
                <p class="text-[10px] text-emerald-300 uppercase">Excellent</p>
                <p class="text-lg font-bold text-emerald-600" id="excellentRating">-</p>
              </div>
              <div class="bg-blue-500/10 border border-blue-500/20 rounded-md p-2 text-center">
                <p class="text-[10px] text-blue-300 uppercase">Good</p>
                <p class="text-lg font-bold text-blue-400" id="goodRating">-</p>
              </div>
              <div class="bg-amber-500/10 border border-amber-500/20 rounded-md p-2 text-center">
                <p class="text-[10px] text-amber-300 uppercase">Average</p>
                <p class="text-lg font-bold text-amber-800" id="averageRating">-</p>
              </div>
              <div class="bg-red-500/10 border border-red-500/20 rounded-md p-2 text-center">
                <p class="text-[10px] text-red-300 uppercase">Needs Improvement</p>
                <p class="text-lg font-bold text-red-400" id="needsImprovementRating">-</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Instructor Breakdown -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 mb-4">
          <h3 class="text-sm font-bold text-slate-100 mb-3 flex items-center gap-2">
            <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            Instructor Decision Breakdown
          </h3>
          <div id="instructorBreakdown" class="space-y-2">
            <div class="animate-pulse space-y-2">
              <div class="h-20 bg-slate-800/50 rounded-md"></div>
              <div class="h-20 bg-slate-800/50 rounded-md"></div>
            </div>
          </div>
        </div>

        <!-- Recent Decisions -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
          <h3 class="text-sm font-bold text-slate-100 mb-3 flex items-center gap-2">
            <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
            Recent Decisions & Recommendations
          </h3>
          <div id="recentDecisions" class="space-y-2">
            <div class="animate-pulse space-y-2">
              <div class="h-28 bg-slate-800/50 rounded-md"></div>
              <div class="h-28 bg-slate-800/50 rounded-md"></div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/insights/decisions.js"></script>
</body>
</html>
