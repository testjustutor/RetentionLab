<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="insightsRisks">
  <title>Risks | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        
        <!-- Filters Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-4">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <!-- From Date -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">From Date</label>
              <input type="date" id="filterFromDate" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-slate-100 focus:border-rose-500 focus:outline-none">
            </div>

            <!-- To Date -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">To Date</label>
              <input type="date" id="filterToDate" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-slate-100 focus:border-rose-500 focus:outline-none">
            </div>

            <!-- Severity Filter -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">Severity</label>
              <div id="severityFilterContainer"></div>
            </div>
          </div>
        </div>

        <!-- Summary Stats Cards - Rose/Red Theme -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
          <!-- Total Risks -->
          <div class="bg-gradient-to-br from-rose-600 to-rose-700 border border-rose-500/30 rounded-lg p-4 shadow-lg">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-[11px] text-rose-100 uppercase tracking-wide">Total Risks</p>
                <p class="text-3xl font-bold text-white mt-1.5" id="totalRisks">-</p>
              </div>
              <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
              </div>
            </div>
          </div>

          <!-- High Risks -->
          <div class="bg-gradient-to-br from-red-600 to-red-700 border border-red-500/30 rounded-lg p-4 shadow-lg">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-[11px] text-red-100 uppercase tracking-wide">High Risk</p>
                <p class="text-3xl font-bold text-white mt-1.5" id="highRisks">-</p>
              </div>
              <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </div>
            </div>
          </div>

          <!-- Medium Risks -->
          <div class="bg-gradient-to-br from-amber-600 to-amber-700 border border-amber-500/30 rounded-lg p-4 shadow-lg">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-[11px] text-amber-100 uppercase tracking-wide">Medium Risk</p>
                <p class="text-3xl font-bold text-white mt-1.5" id="mediumRisks">-</p>
              </div>
              <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
              </div>
            </div>
          </div>

          <!-- Low Risks -->
          <div class="bg-gradient-to-br from-slate-600 to-slate-700 border border-slate-500/30 rounded-lg p-4 shadow-lg">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-[11px] text-slate-100 uppercase tracking-wide">Low Risk</p>
                <p class="text-3xl font-bold text-white mt-1.5" id="lowRisks">-</p>
              </div>
              <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Risk Type Distribution & Instructor Breakdown -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
          <!-- Risk Type Distribution -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
            <h3 class="text-sm font-bold text-slate-100 mb-3 flex items-center gap-2">
              <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2 2z"></path>
              </svg>
              Risk Type Distribution
            </h3>
            <div class="space-y-2">
              <div class="flex items-center justify-between p-2.5 bg-violet-500/10 border border-violet-500/20 rounded-md">
                <span class="text-xs text-slate-300">Quality Flags</span>
                <span class="text-sm font-bold text-violet-400" id="qualityFlagRisks">-</span>
              </div>
              <div class="flex items-center justify-between p-2.5 bg-cyan-500/10 border border-cyan-500/20 rounded-md">
                <span class="text-xs text-slate-300">Low Quality Scores</span>
                <span class="text-sm font-bold text-cyan-400" id="qualityScoreRisks">-</span>
              </div>
            </div>
          </div>

          <!-- Instructor Breakdown -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
            <h3 class="text-sm font-bold text-slate-100 mb-3 flex items-center gap-2">
              <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
              </svg>
              Instructor Risk Breakdown
            </h3>
            <div id="instructorBreakdown" class="space-y-2">
              <div class="animate-pulse space-y-2">
                <div class="h-20 bg-slate-800/50 rounded-md"></div>
                <div class="h-20 bg-slate-800/50 rounded-md"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Recent Risks -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
          <h3 class="text-sm font-bold text-slate-100 mb-3 flex items-center gap-2">
            <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
            Recent Risks & Issues
          </h3>
          <div id="recentRisks" class="space-y-2">
            <div class="animate-pulse space-y-2">
              <div class="h-28 bg-slate-800/50 rounded-md"></div>
              <div class="h-28 bg-slate-800/50 rounded-md"></div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/insights/risks.js"></script>
</body>
</html>
