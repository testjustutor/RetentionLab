<!doctype html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width,initial-scale=1">
   <meta name="dashboard-role" content="admin">
   <meta name="header-page" content="insightsRisks">
   <title>Risks | RetentionLab</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
   <link rel="stylesheet" href="../../css/shared.css">
   <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
   <script src="../../js/common-ui.js"></script>
 </head>
 <body class="min-h-screen bg-slate-100 text-slate-800 antialiased">
   <div class="flex h-screen">
     <div id="sidebar-placeholder"></div>
     <div class="flex-1 flex flex-col overflow-hidden">
       <div id="header-placeholder"></div>
       <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
         
         <!-- Risks Filters (#risks-filters) -->
         <div id="risks-filters" class="bg-gradient-to-br from-rose-50 to-pink-100 border-2 border-rose-200 rounded-lg shadow-md p-3 mb-4 insight-section filters-section">
           <div class="grid grid-cols-1 md:grid-cols-6 gap-3">
             <!-- From Date -->
             <div>
               <label class="block text-[10px] font-bold text-rose-900 uppercase tracking-wide mb-1">From Date</label>
               <input type="date" id="filterFromDate" class="w-full bg-white border border-rose-300 rounded-md px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-rose-500">
             </div>
             <!-- To Date -->
             <div>
               <label class="block text-[10px] font-bold text-rose-900 uppercase tracking-wide mb-1">To Date</label>
               <input type="date" id="filterToDate" class="w-full bg-white border border-rose-300 rounded-md px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-rose-500">
             </div>
             <!-- Severity Filter -->
             <div>
               <label class="block text-[10px] font-bold text-rose-900 uppercase tracking-wide mb-1">Severity</label>
               <div id="severityFilterContainer"></div>
             </div>
           </div>
         </div>

         <!-- Risks Summary Stats (#risks-summary-stats) -->
         <div id="risks-summary-stats" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-4 insight-section">
           <!-- Total Risks -->
           <div class="bg-gradient-to-br from-rose-50 to-pink-100 border-2 border-rose-200 rounded-lg px-3 py-2 shadow-md">
             <p class="text-[10px] font-bold text-rose-900 uppercase tracking-wide">Total Risks</p>
             <p class="text-xl font-bold text-rose-950" id="totalRisks">-</p>
           </div>
           <!-- High Risks -->
           <div class="bg-gradient-to-br from-red-50 to-orange-100 border-2 border-red-200 rounded-lg px-3 py-2 shadow-md">
             <p class="text-[10px] font-bold text-red-900 uppercase tracking-wide">High Risk</p>
             <p class="text-xl font-bold text-red-950" id="highRisks">-</p>
           </div>
           <!-- Medium Risks -->
           <div class="bg-gradient-to-br from-amber-50 to-orange-100 border-2 border-amber-200 rounded-lg px-3 py-2 shadow-md">
             <p class="text-[10px] font-bold text-amber-900 uppercase tracking-wide">Medium Risk</p>
             <p class="text-xl font-bold text-amber-950" id="mediumRisks">-</p>
           </div>
           <!-- Low Risks -->
           <div class="bg-gradient-to-br from-slate-50 to-gray-100 border-2 border-slate-200 rounded-lg px-3 py-2 shadow-md">
             <p class="text-[10px] font-bold text-slate-800 uppercase tracking-wide">Low Risk</p>
             <p class="text-xl font-bold text-slate-900" id="lowRisks">-</p>
           </div>
         </div>

         <!-- Risk Type Distribution & Instructor Risk Breakdown -->
         <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
           <!-- Risks Risk Type Distribution (#risks-type-distribution) -->
           <div id="risks-type-distribution" class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-200 rounded-lg p-3 shadow-md insight-section">
             <h3 class="text-[13px] font-bold text-violet-900 mb-2 uppercase tracking-wide">Risk Type Distribution</h3>
             <div class="overflow-x-auto overflow-y-auto max-h-64 custom-scrollbar">
               <table class="w-full text-left text-[11px]">
                 <thead class="sticky top-0">
                   <tr class="border-b-2 border-violet-300 bg-violet-200">
                     <th class="py-2 px-2 text-[10px] font-bold text-violet-950 uppercase">Type</th>
                     <th class="py-2 px-2 text-[10px] font-bold text-violet-950 uppercase text-right">Count</th>
                     <th class="py-2 px-2 text-[10px] font-bold text-violet-950 uppercase text-right">Percentage</th>
                   </tr>
                 </thead>
                 <tbody class="divide-y divide-violet-200" id="riskTypeTableBody">
                   <tr><td colspan="3" class="py-2 px-2 text-center text-violet-800 font-medium">Loading...</td></tr>
                 </tbody>
               </table>
             </div>
           </div>

           <!-- Risks Instructor Risk Breakdown (#risks-instructor-breakdown) -->
           <div id="risks-instructor-breakdown" class="bg-gradient-to-br from-red-50 to-orange-100 border-2 border-red-200 rounded-lg p-3 shadow-md insight-section">
             <h3 class="text-[13px] font-bold text-red-900 mb-2 uppercase tracking-wide">Instructor Risk Breakdown</h3>
             <div class="overflow-x-auto overflow-y-auto max-h-64 custom-scrollbar">
               <table class="w-full text-left text-[11px]">
                 <thead class="sticky top-0">
                   <tr class="border-b-2 border-red-300 bg-red-200">
                     <th class="py-2 px-2 text-[10px] font-bold text-red-950 uppercase">Instructor</th>
                     <th class="py-2 px-2 text-[10px] font-bold text-red-950 uppercase text-right">Total</th>
                     <th class="py-2 px-2 text-[10px] font-bold text-red-950 uppercase text-right">High</th>
                     <th class="py-2 px-2 text-[10px] font-bold text-red-950 uppercase text-right">Medium</th>
                     <th class="py-2 px-2 text-[10px] font-bold text-red-950 uppercase text-right">Low</th>
                     <th class="py-2 px-2 text-[10px] font-bold text-red-950 uppercase text-right">Risk %</th>
                   </tr>
                 </thead>
                 <tbody class="divide-y divide-red-200" id="instructorTable">
                   <tr><td colspan="6" class="py-2 px-2 text-center text-red-800 font-medium">Loading...</td></tr>
                 </tbody>
               </table>
             </div>
           </div>
         </div>

         <!-- Risks Recent Risks (#risks-recent) -->
         <div id="risks-recent" class="bg-gradient-to-br from-amber-50 to-orange-100 border-2 border-amber-200 rounded-lg p-3 shadow-md insight-section">
           <h3 class="text-[13px] font-bold text-amber-900 mb-2 uppercase tracking-wide">Recent Risks &amp; Issues</h3>
           <div class="overflow-x-auto overflow-y-auto max-h-80 custom-scrollbar">
             <table class="w-full text-left text-[11px]">
               <thead class="sticky top-0">
                 <tr class="border-b-2 border-amber-300 bg-amber-200">
                   <th class="py-2 px-2 text-[10px] font-bold text-amber-950 uppercase">Risk / Issue</th>
                   <th class="py-2 px-2 text-[10px] font-bold text-amber-950 uppercase">Severity</th>
                   <th class="py-2 px-2 text-[10px] font-bold text-amber-950 uppercase">Type</th>
                   <th class="py-2 px-2 text-[10px] font-bold text-amber-950 uppercase">Instructor</th>
                   <th class="py-2 px-2 text-[10px] font-bold text-amber-950 uppercase text-right">Date</th>
                 </tr>
               </thead>
               <tbody class="divide-y divide-amber-200" id="recentRisksTable">
                 <tr><td colspan="5" class="py-2 px-2 text-center text-amber-800 font-medium">Loading...</td></tr>
               </tbody>
             </table>
           </div>
         </div>

       </main>
     </div>
   </div>

   <script type="module" src="../../js/auth.js"></script>
   <script src="../../js/load-components.js"></script>
   <script src="../../js/admin/insights/risks.js"></script>
 </body>
</html>
