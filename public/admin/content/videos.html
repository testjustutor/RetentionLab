<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="contentVideos">
  <title>Videos | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">

        <!-- Filter Bar -->
        <div class="bg-white border border-slate-200 rounded-lg p-3 mb-4">
          <div class="flex flex-wrap items-end justify-between gap-3">
            <div class="flex flex-wrap items-end gap-3">
              <div>
                <label class="block text-[10px] text-slate-500 uppercase tracking-wide mb-1">From Date</label>
                <input type="date" id="filterFromDate" class="bg-white border border-slate-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-violet-500">
              </div>
              <div>
                <label class="block text-[10px] text-slate-500 uppercase tracking-wide mb-1">To Date</label>
                <input type="date" id="filterToDate" class="bg-white border border-slate-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-violet-500">
              </div>
              <div>
                <label class="block text-[10px] text-slate-500 uppercase tracking-wide mb-1">Instructor</label>
                <div id="instructorFilterContainer"></div>
              </div>
              <button onclick="loadVideos()" class="px-4 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-white text-xs font-medium transition-colors shadow-sm flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                Get Data
              </button>
            </div>
            <div>
              <label class="block text-[10px] text-slate-500 uppercase tracking-wide mb-1">Search</label>
              <input type="text" id="searchInput" placeholder="Search by title..." class="bg-white border border-slate-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-violet-500 min-w-[180px]">
            </div>
          </div>
        </div>

        <!-- Table Container (uses createTable from common-ui.js) -->
        <div id="videosContainer"></div>

      </main>
    </div>
  </div>

  <!-- Video Modal -->
  <div id="video-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/75">
    <div class="bg-white rounded-xl shadow-xl max-w-5xl w-full mx-4 max-h-[90vh] overflow-hidden flex flex-col">
      <div class="flex items-center justify-between p-4 border-b border-slate-200">
        <h3 id="modal-title" class="text-base font-semibold text-slate-900">Video Recording</h3>
        <button id="close-modal" class="text-slate-500 hover:text-slate-700 p-1 rounded-lg hover:bg-slate-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="p-4 overflow-y-auto flex-1">
        <video id="video-player" controls class="w-full rounded-lg bg-black">
          <source id="video-source" src="" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <div id="video-details" class="mt-4 grid grid-cols-2 gap-4 text-sm">
          <div>
            <span class="font-semibold text-slate-700">Instructor:</span>
            <span id="modal-instructor" class="text-slate-600 ml-1"></span>
          </div>
          <div>
            <span class="font-semibold text-slate-700">Platform:</span>
            <span id="modal-platform" class="text-slate-600 ml-1"></span>
          </div>
          <div>
            <span class="font-semibold text-slate-700">Date:</span>
            <span id="modal-date" class="text-slate-600 ml-1"></span>
          </div>
          <div>
            <span class="font-semibold text-slate-700">Duration:</span>
            <span id="modal-duration" class="text-slate-600 ml-1"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/content/videos.js"></script>
</body>
</html>
