<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="contentAssets">
  <title>Assets | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
          <div id="header-buttons-container"></div>
          <div class="flex items-center gap-2">
 <select id="userSelect" class="bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-xs focus:outline-none focus:border-violet-500 cursor-pointer min-w-[200px]" onchange="loadAssets()">
              <option value="">Loading instructors...</option>
            </select>
            <button onclick="loadAssets()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-white text-xs font-medium transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
              Load
            </button>
          </div>
        </div>

        <div id="assetsContainer">
          <div class="flex flex-col items-center justify-center py-12 text-slate-500">
            <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center mb-3">
              <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            </div>
            <p class="text-xs">Select an instructor to view AI assets</p>
            <p class="text-[12px] mt-1">All AI-generated analysis files for each meeting</p>
          </div>
        </div>

      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/content/assets.js"></script>
</body></html>
