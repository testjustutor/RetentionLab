<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="settingsIntegrations">
  <title>Integrations | RetentionLab</title>

  <link rel="stylesheet" href="../../css/shared.css">
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
          <div>

            <p class="text-sm text-slate-400 mt-1">Manage your calendar provider connections and credentials</p>

          <button id="refresh-integrations-btn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm rounded-lg transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

            Refresh
          </button>
        </div>
        
        <div id="integrations-container" class="bg-slate-900 border border-slate-800 rounded-lg p-3 max-w-2xl space-y-2">
          <!-- Dynamic content will be loaded here -->
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/settings/integrations.js"></script>

</html>
