<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <meta name='dashboard-role' content='admin'>
  <meta name='header-page' content='settingsNotifications'>
  <title>Notifications | RetentionLab</title>
  <script src='https://cdn.tailwindcss.com'></script>
  <link rel='stylesheet' href='../../css/shared.css'>
  <script src='../../js/common-ui.js'></script>
</head>
<body class='min-h-screen bg-slate-100 text-slate-900 antialiased'>
  <div class='flex h-screen'>
    <div id='sidebar-placeholder'></div>
    <div class='flex-1 flex flex-col overflow-hidden'>
      <div id='header-placeholder'></div>
      <main class='flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100'>
        <div class='flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4'>
          <div>
            <h2 class='text-lg font-bold text-slate-900'>Notification Settings</h2>
            <p class='text-xs text-slate-500'>Configure email, push and SMS notification defaults for each role</p>
          </div>
        </div>

        <!-- Role reach stats -->
        <div class='grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4'>
          <div class='bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-200 rounded-lg px-3 py-2 shadow-md'>
            <p class='text-[10px] font-bold text-blue-900 uppercase tracking-wide'>Admin Users</p>
            <p class='text-xl font-bold text-blue-950' id='rolAdmins'>-</p>
          </div>
          <div class='bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-200 rounded-lg px-3 py-2 shadow-md'>
            <p class='text-[10px] font-bold text-violet-900 uppercase tracking-wide'>Instructor Users</p>
            <p class='text-xl font-bold text-violet-950' id='rolInstructors'>-</p>
          </div>
          <div class='bg-gradient-to-br from-emerald-50 to-teal-100 border-2 border-emerald-200 rounded-lg px-3 py-2 shadow-md'>
            <p class='text-[10px] font-bold text-emerald-900 uppercase tracking-wide'>Reviewer Users</p>
            <p class='text-xl font-bold text-emerald-950' id='rolReviewers'>-</p>
          </div>
        </div>

        <!-- Notification preferences -->
        <div class='bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-200 rounded-lg p-4 mb-4 shadow-md'>
          <h3 class='text-[13px] font-bold text-blue-900 mb-3 uppercase tracking-wide'>Notification Preferences</h3>
          <div class='overflow-x-auto'>
            <table class='w-full text-left text-[12px]'>
              <thead>
                <tr class='border-b-2 border-blue-300 bg-blue-200'>
                  <th class='py-2 px-2 text-[10px] font-bold text-blue-950 uppercase'>Role</th>
                  <th class='py-2 px-2 text-[10px] font-bold text-blue-950 uppercase'>Email</th>
                  <th class='py-2 px-2 text-[10px] font-bold text-blue-950 uppercase'>Push</th>
                  <th class='py-2 px-2 text-[10px] font-bold text-blue-950 uppercase'>SMS</th>
                </tr>
              </thead>
              <tbody class='divide-y divide-blue-200' id='notifBody'>
                <tr><td colspan='4' class='py-3 text-center text-blue-800 font-medium'>Loading...</td></tr>
              </tbody>
            </table>
          </div>
          <div class='mt-4 flex items-center gap-2'>
            <button id='saveNotifBtn' class='px-4 py-1.5 rounded-md bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition-colors shadow-sm'>Save Settings</button>
            <span id='saveMsg' class='text-xs text-slate-500'></span>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type='module' src='../../js/auth.js'></script>
  <script src='../../js/load-components.js'></script>
  <script src='../../js/admin/settings/notifications.js'></script>
</body>
</html>
