<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <title>Notifications | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
          <div><h1 class="text-xl font-bold text-white">Notifications</h1><p class="text-xs text-slate-400 mt-1">Email alerts and reminder rules</p></div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 max-w-2xl space-y-3"><div class="flex items-center justify-between"><div><p class="text-xs text-white">Email Alerts</p><p class="text-[10px] text-slate-400">Receive email notifications</p></div><label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" checked class="sr-only peer"><div class="w-8 h-4.5 bg-slate-700 peer-checked:bg-violet-600 rounded-full after:absolute after:top-0.5 after:start-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:after:translate-x-4"></div></label></div><button class="bg-violet-600 hover:bg-violet-500 text-white text-xs font-medium px-3 py-1.5 rounded-md transition-colors">Save</button></div>
      </main>
    </div>
  </div>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
</body>
</html>
