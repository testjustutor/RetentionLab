<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="evaluationPerformance">
  <title>Performance | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        <div class="flex items-center justify-between mb-4">
          <div id="header-buttons-container"></div>
          <div class="flex gap-2">
 <select id="timeRangeFilter" class="bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs focus:border-violet-500 outline-none">
              <option value="30">Last 30 Days</option>
              <option value="90">Last 90 Days</option>
              <option value="180">Last 6 Months</option>
              <option value="365">Last Year</option>
            </select>
 <select id="userFilter" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-violet-500 outline-none">
              <option value="">All Users</option>
            </select>
          </div>
        </div>

        <!-- Performance Overview -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 mb-3">
          <!-- Individual Progress Chart -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
 <h3 class="text-sm font-semibold mb-2">Individual Progress</h3>
            <div class="h-48">
              <canvas id="individualChart"></canvas>
            </div>
          </div>

          <!-- Team Progress Chart -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
 <h3 class="text-sm font-semibold mb-2">Team Progress</h3>
            <div class="h-48">
              <canvas id="teamChart"></canvas>
            </div>
          </div>
        </div>

        <!-- Historical Trends -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-3">
 <h3 class="text-sm font-semibold mb-2">Historical Trends</h3>
          <div class="h-56">
            <canvas id="trendsChart"></canvas>
          </div>
        </div>

        <!-- Performance Leaderboard -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
          <!-- Top Performers -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
 <h3 class="text-sm font-semibold mb-2">Top Performers</h3>
            <div id="topPerformers">
              <div class="animate-pulse space-y-3">
                <div class="h-12 bg-slate-800/50 rounded"></div>
                <div class="h-12 bg-slate-800/50 rounded"></div>
                <div class="h-12 bg-slate-800/50 rounded"></div>
              </div>
            </div>
          </div>

          <!-- Most Improved -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
 <h3 class="text-sm font-semibold mb-2">Most Improved</h3>
            <div id="mostImproved">
              <div class="animate-pulse space-y-3">
                <div class="h-12 bg-slate-800/50 rounded"></div>
                <div class="h-12 bg-slate-800/50 rounded"></div>
                <div class="h-12 bg-slate-800/50 rounded"></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/evaluation/performance.js"></script>
</body></html>
