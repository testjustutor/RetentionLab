<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="evaluationPerformance">
  <title>Performance | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        <!-- Filters Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-4">
          <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
            <!-- From Date -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">From Date</label>
              <input type="date" id="fromDate" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-slate-100 focus:border-violet-500 focus:outline-none">
            </div>

            <!-- To Date -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">To Date</label>
              <input type="date" id="toDate" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-slate-100 focus:border-violet-500 focus:outline-none">
            </div>

            <!-- Instructor Filter -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">Instructor</label>
              <div id="instructorFilterContainer"></div>
            </div>

            <!-- Meeting Filter -->
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">Meeting</label>
              <div id="meetingFilterContainer"></div>
            </div>

            <!-- Get Data Button -->
            <div class="flex items-end">
              <button onclick="getPerformanceData()" class="w-full px-4 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-slate-100 text-xs font-semibold transition-colors">Get Data</button>
            </div>
          </div>
        </div>

        <!-- Header Buttons -->
        <div class="flex items-center justify-between mb-4">
          <div id="header-buttons-container"></div>
        </div>

        <!-- Performance Overview Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-2 mb-4">
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-violet-500/10 border border-violet-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
              </div>
              <div><p class="text-[12px] text-slate-500">Total Scores</p><p class="text-base font-bold text-slate-100" id="totalScores">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-blue-500/10 border border-blue-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                </svg>
              </div>
              <div><p class="text-[12px] text-slate-500">Average</p><p class="text-base font-bold text-slate-100" id="avgScore">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
              <div><p class="text-[12px] text-slate-500">Highest</p><p class="text-base font-bold text-slate-100" id="highestScore">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-amber-500/10 border border-amber-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-amber-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </div>
              <div><p class="text-[12px] text-slate-500">Evaluations</p><p class="text-base font-bold text-slate-100" id="evalCount">-</p></div>
            </div>
          </div>
        </div>

        <!-- Charts Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 mb-3">
          <!-- Score Distribution Chart -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
            <h3 class="text-sm font-bold text-slate-100 mb-3">Score Distribution</h3>
            <div class="h-64">
              <canvas id="distributionChart"></canvas>
            </div>
          </div>

          <!-- Category Performance Chart -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
            <h3 class="text-sm font-bold text-slate-100 mb-3">Category Performance</h3>
            <div class="h-64">
              <canvas id="categoryChart"></canvas>
            </div>
          </div>
        </div>

        <!-- Historical Trends -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 mb-3">
          <h3 class="text-sm font-bold text-slate-100 mb-3">Performance Trends Over Time</h3>
          <div class="h-72">
            <canvas id="trendsChart"></canvas>
          </div>
        </div>

        <!-- Performance Leaderboard -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
          <!-- Top Performers -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
            <h3 class="text-sm font-bold text-slate-100 mb-3">Top Performers</h3>
            <div id="topPerformers"></div>
          </div>

          <!-- Category Rankings -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
            <h3 class="text-sm font-bold text-slate-100 mb-3">Category Rankings</h3>
            <div id="categoryRankings"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/evaluation/performance.js"></script>
</body></html>
