<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="evaluationScores">
  <title>Session Scores | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">

        <!-- Summary Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-2 mb-4" id="statsCards">
          <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-200 rounded-lg p-2.5 shadow-md">
            <div class="flex items-center gap-2">
              <div class="w-9 h-9 rounded-lg bg-violet-500/10 border border-violet-500/20 flex items-center justify-center flex-shrink-0">
                <svg class="w-4 h-4 text-violet-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
              </div>
              <div class="min-w-0">
                <p class="text-[11px] font-bold text-violet-900 uppercase tracking-wider truncate">Total</p>
                <p class="text-xl font-bold text-violet-950" id="totalScores">-</p>
              </div>
            </div>
          </div>
          <div class="bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-200 rounded-lg p-2.5 shadow-md">
            <div class="flex items-center gap-2">
              <div class="w-9 h-9 rounded-lg bg-blue-500/10 border border-blue-500/20 flex items-center justify-center flex-shrink-0">
                <svg class="w-4 h-4 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
              </div>
              <div class="min-w-0">
                <p class="text-[11px] font-bold text-blue-900 uppercase tracking-wider truncate">Average</p>
                <p class="text-xl font-bold text-blue-950" id="avgScore">-</p>
              </div>
            </div>
          </div>
          <div class="bg-gradient-to-br from-emerald-50 to-teal-100 border-2 border-emerald-200 rounded-lg p-2.5 shadow-md">
            <div class="flex items-center gap-2">
              <div class="w-9 h-9 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center flex-shrink-0">
                <svg class="w-4 h-4 text-emerald-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
              <div class="min-w-0">
                <p class="text-[11px] font-bold text-emerald-900 uppercase tracking-wider truncate">AI</p>
                <p class="text-xl font-bold text-emerald-950" id="aiScores">-</p>
              </div>
            </div>
          </div>
          <div class="bg-gradient-to-br from-amber-50 to-orange-100 border-2 border-amber-200 rounded-lg p-2.5 shadow-md">
            <div class="flex items-center gap-2">
              <div class="w-9 h-9 rounded-lg bg-amber-500/10 border border-amber-500/20 flex items-center justify-center flex-shrink-0">
                <svg class="w-4 h-4 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
              </div>
              <div class="min-w-0">
                <p class="text-[11px] font-bold text-amber-900 uppercase tracking-wider truncate">Human</p>
                <p class="text-xl font-bold text-amber-950" id="humanScores">-</p>
              </div>
            </div>
          </div>     
        </div>
        <!-- Cascading Filters -->
        <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-200 rounded-lg shadow-md p-3 mb-4">
          <!-- Filters Row -->
          <div class="grid grid-cols-1 md:grid-cols-7 gap-3">
            <!-- From Date -->
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">From Date</label>
              <input type="date" id="filterFromDate" class="w-full bg-white border border-violet-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-violet-500">
            </div>

            <!-- To Date -->
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">To Date</label>
              <input type="date" id="filterToDate" class="w-full bg-white border border-violet-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-violet-500">
            </div>

            <!-- Instructor Filter -->
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">Instructor</label>
              <div id="instructorFilterContainer"></div>
            </div>

            <!-- Session Filter -->
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">Session</label>
              <div id="sessionFilterContainer"></div>
            </div>

            <!-- Reviewer Filter -->
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">Reviewer</label>
              <div id="reviewerFilterContainer"></div>
            </div>

            <!-- Get Data Button -->
            <div class="flex items-end">
              <button id="getDataBtn" class="w-full px-3 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold transition-colors shadow-sm flex items-center justify-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Get Data
              </button>
            </div>

          </div>
        </div>


        <div id="scoresRoot">
          <div class="animate-pulse space-y-4">
            <div class="h-20 bg-slate-200 rounded-xl"></div>
            <div class="h-20 bg-slate-200 rounded-xl"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/evaluation/scores.js"></script>
</body></html>
