<!doctype html>
<html lang="en">
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="evaluationReviews">
  <title>Reviews | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        <div class="flex items-center justify-between mb-4">
          <div id="header-buttons-container"></div>
          <button onclick="showAssignModal()" class="px-4 py-2 rounded-md bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-500 hover:to-purple-500 text-white text-xs font-bold transition-colors shadow-md flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a7 7 0 1114 0"></path></svg>
            Assign Reviewer
          </button>
        </div>

        <!-- Status Tabs -->
        <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-400 rounded-lg p-1.5 mb-4 shadow-md inline-flex gap-1">
          <button onclick="setFilter('')" class="filter-tab px-4 py-2 text-xs font-bold rounded-md transition-colors" data-filter="">All</button>
          <button onclick="setFilter('pending')" class="filter-tab px-4 py-2 text-xs font-bold rounded-md transition-colors" data-filter="pending">Pending</button>
          <button onclick="setFilter('in_progress')" class="filter-tab px-4 py-2 text-xs font-bold rounded-md transition-colors" data-filter="in_progress">In Progress</button>
          <button onclick="setFilter('completed')" class="filter-tab px-4 py-2 text-xs font-bold rounded-md transition-colors" data-filter="completed">Completed</button>
        </div>

                        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4" id="statsCards">
          <!-- Pending Card -->
          <div class="bg-gradient-to-br from-amber-50 to-orange-100 border-2 border-amber-400 rounded-lg p-3 shadow-md">
            <div class="flex items-center gap-2">
              <div class="w-10 h-10 rounded-md bg-amber-100 border-2 border-amber-300 flex items-center justify-center">
                <svg class="w-5 h-5 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </div>
              <div>
                <p class="text-[10px] font-bold text-amber-900 uppercase tracking-wide">Pending</p>
                <p class="text-lg font-bold text-amber-950" id="pendingCount">-</p>
              </div>
            </div>
          </div>

          <!-- In Progress Card -->
          <div class="bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-400 rounded-lg p-3 shadow-md">
            <div class="flex items-center gap-2">
              <div class="w-10 h-10 rounded-md bg-blue-100 border-2 border-blue-300 flex items-center justify-center">
                <svg class="w-5 h-5 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
              </div>
              <div>
                <p class="text-[10px] font-bold text-blue-900 uppercase tracking-wide">In Progress</p>
                <p class="text-lg font-bold text-blue-950" id="inProgressCount">-</p>
              </div>
            </div>
          </div>

          <!-- Completed Card -->
          <div class="bg-gradient-to-br from-emerald-50 to-teal-100 border-2 border-emerald-400 rounded-lg p-3 shadow-md">
            <div class="flex items-center gap-2">
              <div class="w-10 h-10 rounded-md bg-emerald-100 border-2 border-emerald-300 flex items-center justify-center">
                <svg class="w-5 h-5 text-emerald-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
              <div>
                <p class="text-[10px] font-bold text-emerald-900 uppercase tracking-wide">Completed</p>
                <p class="text-lg font-bold text-emerald-950" id="completedCount">-</p>
              </div>
            </div>
          </div>

          <!-- Total Card -->
          <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-400 rounded-lg p-3 shadow-md">
            <div class="flex items-center gap-2">
              <div class="w-10 h-10 rounded-md bg-violet-100 border-2 border-violet-300 flex items-center justify-center">
                <svg class="w-5 h-5 text-violet-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
              </div>
              <div>
                <p class="text-[10px] font-bold text-violet-900 uppercase tracking-wide">Total</p>
                <p class="text-lg font-bold text-violet-950" id="totalCount">-</p>
              </div>
            </div>
          </div>
        </div><div id="reviewsRoot">`n          <div class="bg-gradient-to-br from-slate-50 to-slate-100 border-2 border-slate-300 rounded-lg p-4 shadow-md">`n            <div class="animate-pulse space-y-4">`n              <div class="h-20 bg-slate-200 rounded-lg"></div>`n              <div class="h-20 bg-slate-200 rounded-lg"></div>`n            </div>`n          </div>`n        </div>
      </main>
    </div>
  </div>

  <!-- Assign Reviewer Modal -->
  <div id="assignModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden">`n    <div class="flex items-center justify-center min-h-screen p-4">`n      <div class="bg-gradient-to-br from-amber-50 to-orange-100 border-2 border-amber-400 rounded-lg p-5 w-full max-w-lg shadow-md">
        <h3 class="text-base font-bold text-amber-900 mb-4 uppercase tracking-wide">Assign Reviewer</h3>
        
        <div class="space-y-3">
          <!-- Instructor Selection -->
          <div>
            <label class="block text-[10px] font-bold text-amber-900 mb-1.5 uppercase tracking-wide">Select Instructor</label>
            <div id="instructorSelectContainer"></div>
          </div>

          <!-- Meeting Selection -->
          <div>
            <label class="block text-[10px] font-bold text-amber-900 mb-1.5 uppercase tracking-wide">Select Meeting</label>
            <div id="meetingSelectContainer"></div>
          </div>

          <!-- Reviewer Selection -->
          <div>
            <label class="block text-[10px] font-bold text-amber-900 mb-1.5 uppercase tracking-wide">Select Reviewer</label>
            <div id="reviewerSelectContainer"></div>
          </div>

          <!-- Bulk Assignment Option -->
          <div class="bg-amber-100 border-2 border-amber-300 rounded-md p-3">
            <label class="flex items-start gap-2 cursor-pointer">
              <input type="checkbox" id="bulkAssign" class="mt-0.5 w-4 h-4 rounded border-slate-600 bg-slate-700 text-violet-600 focus:ring-violet-500 focus:ring-offset-slate-900">
              <div class="flex-1">
                <span class="text-sm font-bold text-amber-950">Assign to all meetings</span>
                <p class="text-xs text-amber-800 mt-0.5">Assign selected reviewer to all meetings of the selected instructor (last 90 days)</p>
              </div>
            </label>
          </div>
        </div>

        <div class="flex gap-2 mt-5">
          <button onclick="hideAssignModal()" class="flex-1 px-4 py-2 rounded-md bg-slate-200 border-2 border-slate-300 text-slate-700 hover:bg-slate-300 transition-colors text-sm font-bold">Cancel</button>
          <button onclick="assignReviewer()" class="flex-1 px-4 py-2 rounded-md bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white font-bold shadow-md transition-colors text-sm">Assign Reviewer</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/admin/evaluation/reviews.js"></script>
</body></html>
