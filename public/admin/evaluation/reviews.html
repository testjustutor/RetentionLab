<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <title>Reviews | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/shared.css">
  <script src="../../js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
        <div class="flex items-center justify-between mb-4">
          <div><h1 class="text-xl font-bold text-white">Reviews</h1><p class="text-xs text-slate-400 mt-1">Human review management</p></div>
          <button onclick="showAssignModal()" class="px-3 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold transition-colors">Assign Reviewer</button>
        </div>

        <!-- Status Tabs -->
        <div class="flex gap-1 mb-4 bg-slate-900 p-1 rounded-md w-fit">
          <button onclick="setFilter('')" class="filter-tab px-3 py-1.5 text-xs rounded-md transition-colors" data-filter="">All</button>
          <button onclick="setFilter('pending')" class="filter-tab px-3 py-1.5 text-xs rounded-md transition-colors" data-filter="pending">Pending</button>
          <button onclick="setFilter('in_progress')" class="filter-tab px-3 py-1.5 text-xs rounded-md transition-colors" data-filter="in_progress">In Progress</button>
          <button onclick="setFilter('completed')" class="filter-tab px-3 py-1.5 text-xs rounded-md transition-colors" data-filter="completed">Completed</button>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-2 mb-4" id="statsCards">
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-amber-500/10 border border-amber-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </div>
              <div><p class="text-[10px] text-slate-500">Pending</p><p class="text-base font-bold text-white" id="pendingCount">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-blue-500/10 border border-blue-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
              </div>
              <div><p class="text-[10px] text-slate-500">In Progress</p><p class="text-base font-bold text-white" id="inProgressCount">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
              <div><p class="text-[10px] text-slate-500">Completed</p><p class="text-base font-bold text-white" id="completedCount">-</p></div>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-md bg-violet-500/10 border border-violet-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
              </div>
              <div><p class="text-[10px] text-slate-500">Total</p><p class="text-base font-bold text-white" id="totalCount">-</p></div>
            </div>
          </div>
        </div>

        <div id="reviewsRoot">
          <div class="animate-pulse space-y-4">
            <div class="h-20 bg-slate-800/50 rounded-xl"></div>
            <div class="h-20 bg-slate-800/50 rounded-xl"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Assign Reviewer Modal -->
  <div id="assignModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden">
    <div class="flex items-center justify-center min-h-screen p-4">
      <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 w-full max-w-md">
        <h3 class="text-base font-semibold text-white mb-3">Assign Reviewer</h3>
        <div class="space-y-2">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Meeting</label>
            <select id="meetingSelect" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-white focus:border-violet-500 outline-none">
              <option value="">Select meeting...</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Reviewer</label>
            <select id="reviewerSelect" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-white focus:border-violet-500 outline-none">
              <option value="">Select reviewer...</option>
            </select>
          </div>
        </div>
        <div class="flex gap-2 mt-4">
          <button onclick="hideAssignModal()" class="flex-1 px-3 py-1.5 rounded-md bg-slate-800 border border-slate-700 text-slate-300 hover:text-white transition-colors text-xs">Cancel</button>
          <button onclick="assignReviewer()" class="flex-1 px-3 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-white font-semibold transition-colors text-xs">Assign</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script>
    let currentFilter = '';
    let allReviews = [];
    let allMeetings = [];
    let allReviewers = [];

    (async () => {
      await loadData();
      updateStats();
      renderReviews();
      await loadMeetingsAndReviewers();
    })();

    async function loadData() {
      try {
        const data = await apiFetch('/api/reviews/queue' + (currentFilter ? `?status=${currentFilter}` : ''));
        allReviews = data.reviews || [];
      } catch(e) {
        document.getElementById('reviewsRoot').innerHTML = `<p class="text-red-400">Failed to load reviews: ${e.message}</p>`;
      }
    }

    async function loadMeetingsAndReviewers() {
      try {
        const [meetingsData, reviewersData] = await Promise.all([
          apiFetch('/api/meetings/list'),
          apiFetch('/api/reviews/reviewers')
        ]);
        allMeetings = meetingsData.meetings || [];
        allReviewers = reviewersData.reviewers || [];
        
        // Populate meeting select
        const meetingSelect = document.getElementById('meetingSelect');
        meetingSelect.innerHTML = '<option value="">Select meeting...</option>';
        allMeetings.forEach(m => {
          meetingSelect.innerHTML += `<option value="${m.meeting_id}">${escapeHtml(m.title)} - ${formatDate(m.start_time)}</option>`;
        });

        // Populate reviewer select
        const reviewerSelect = document.getElementById('reviewerSelect');
        reviewerSelect.innerHTML = '<option value="">Select reviewer...</option>';
        allReviewers.forEach(r => {
          reviewerSelect.innerHTML += `<option value="${r.id}">${escapeHtml(r.first_name)} ${escapeHtml(r.last_name || '')} (${escapeHtml(r.email)})</option>`;
        });
      } catch(e) {
        console.error('Failed to load meetings/reviewers:', e);
      }
    }

    function updateStats() {
      const pending = allReviews.filter(r => r.review_status === 'pending').length;
      const inProgress = allReviews.filter(r => r.review_status === 'in_progress' || r.review_status === 'in-progress').length;
      const completed = allReviews.filter(r => r.review_status === 'completed').length;
      
      document.getElementById('pendingCount').textContent = pending;
      document.getElementById('inProgressCount').textContent = inProgress;
      document.getElementById('completedCount').textContent = completed;
      document.getElementById('totalCount').textContent = allReviews.length;
    }

    function renderReviews() {
      const root = document.getElementById('reviewsRoot');
      const filtered = currentFilter ? allReviews.filter(r => r.review_status === currentFilter) : allReviews;

      if (!filtered.length) {
        root.innerHTML = '<p class="text-slate-500 text-center py-16">No reviews found</p>';
        return;
      }

      let html = '<div class="space-y-4">';
      filtered.forEach(review => {
        const statusColor = getStatusColor(review.review_status);
        const statusText = getStatusText(review.review_status);
        
        html += `<div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
          <div class="flex items-start justify-between mb-2">
            <div class="flex-1">
              <h3 class="text-sm font-semibold text-white">${escapeHtml(review.meeting_title || 'Untitled Meeting')}</h3>
              <p class="text-xs text-slate-400 mt-0.5">${formatDate(review.start_time)} • ${review.platform || 'Unknown Platform'}</p>
            </div>
            <span class="px-1.5 py-0.5 rounded text-[10px] font-medium ${statusColor}">${statusText}</span>
          </div>
          
          <div class="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs">
            <div>
              <p class="text-[10px] text-slate-500">Reviewer</p>
              <p class="text-white">${escapeHtml(review.reviewer_name || 'Unknown')}</p>
              <p class="text-[10px] text-slate-400">${escapeHtml(review.reviewer_email || '')}</p>
            </div>
            <div>
              <p class="text-[10px] text-slate-500">Assigned By</p>
              <p class="text-white">${escapeHtml(review.assigned_by_name || 'System')}</p>
              <p class="text-[10px] text-slate-400">${formatDate(review.assigned_at)}</p>
            </div>
            <div>
              <p class="text-[10px] text-slate-500">Progress</p>
              <p class="text-white">${review.score_count || 0} scores</p>
              ${review.reviewed_at ? `<p class="text-[10px] text-slate-400">Completed: ${formatDate(review.reviewed_at)}</p>` : ''}
            </div>
          </div>

          <div class="flex gap-1.5 mt-2">
            ${review.review_status === 'pending' ? `
              <button onclick="updateReviewStatus(${review.id}, 'in_progress')" class="px-3 py-1 rounded bg-blue-600 hover:bg-blue-500 text-white text-xs transition-colors">Start Review</button>
            ` : ''}
            ${review.review_status === 'in_progress' ? `
              <button onclick="updateReviewStatus(${review.id}, 'completed')" class="px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white text-xs transition-colors">Mark Complete</button>
            ` : ''}
            ${review.review_status !== 'completed' ? `
              <button onclick="updateReviewStatus(${review.id}, 'rejected')" class="px-3 py-1 rounded bg-red-600 hover:bg-red-500 text-white text-xs transition-colors">Reject</button>
            ` : ''}
          </div>
        </div>`;
      });
      html += '</div>';
      root.innerHTML = html;
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(tab => {
        if (tab.dataset.filter === filter) {
          tab.classList.add('bg-violet-600', 'text-white');
          tab.classList.remove('text-slate-400', 'hover:text-white');
        } else {
          tab.classList.remove('bg-violet-600', 'text-white');
          tab.classList.add('text-slate-400', 'hover:text-white');
        }
      });
      renderReviews();
    }

    async function updateReviewStatus(reviewId, status) {
      try {
        await apiFetch(`/api/reviews/${reviewId}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        showToast('Review status updated');
        await loadData();
        updateStats();
        renderReviews();
      } catch(e) {
        showToast(e.message, true);
      }
    }

    function showAssignModal() {
      document.getElementById('assignModal').classList.remove('hidden');
    }

    function hideAssignModal() {
      document.getElementById('assignModal').classList.add('hidden');
      document.getElementById('meetingSelect').value = '';
      document.getElementById('reviewerSelect').value = '';
    }

    async function assignReviewer() {
      const meetingId = document.getElementById('meetingSelect').value;
      const reviewerId = document.getElementById('reviewerSelect').value;
      
      if (!meetingId || !reviewerId) {
        showToast('Please select both meeting and reviewer', true);
        return;
      }

      try {
        await apiFetch('/api/reviews/assign', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ meeting_id: meetingId, reviewer_id: reviewerId })
        });
        showToast('Reviewer assigned successfully');
        hideAssignModal();
        await loadData();
        updateStats();
        renderReviews();
      } catch(e) {
        showToast(e.message, true);
      }
    }

    function getStatusColor(status) {
      switch(status) {
        case 'pending': return 'bg-amber-500/10 text-amber-400 border border-amber-500/20';
        case 'in_progress': 
        case 'in-progress': return 'bg-blue-500/10 text-blue-400 border border-blue-500/20';
        case 'completed': return 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
        case 'rejected': return 'bg-red-500/10 text-red-400 border border-red-500/20';
        default: return 'bg-slate-500/10 text-slate-400 border border-slate-500/20';
      }
    }

    function getStatusText(status) {
      switch(status) {
        case 'pending': return 'Pending';
        case 'in_progress': 
        case 'in-progress': return 'In Progress';
        case 'completed': return 'Completed';
        case 'rejected': return 'Rejected';
        default: return 'Unknown';
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      return new Date(dateStr).toLocaleDateString('en-US', { 
        month: 'short', day: 'numeric', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function escapeHtml(s) {
      if (!s) return '';
      const div = document.createElement('div');
      div.textContent = String(s);
      return div.innerHTML;
    }

    // Initialize filter
    setFilter('');
  </script>
</body></html>
