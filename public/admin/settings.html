<!-- root/public/admin/settings.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <title>Admin — Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="mx-auto p-0">    
    <div id="header-placeholder"></div>
<section class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4">
      
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
        <h2 class="text-base font-semibold text-white mb-2">Preferences</h2>
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <div class="text-xs font-medium text-slate-200">Email Notifications</div>
              <div class="text-[10px] text-slate-500">Receive pipeline status logs via email.</div>
            </div>
            <input type="checkbox" checked class="accent-violet-500 h-4 w-4 bg-slate-950 border-slate-800 rounded">
          </div>

          <div class="flex items-center justify-between border-t border-slate-800/60 pt-3">
            <div>
              <div class="text-xs font-medium text-slate-200">Maintenance Mode</div>
              <div class="text-[10px] text-slate-500">Redirect active users to fallback screens.</div>
            </div>
            <input type="checkbox" class="accent-violet-500 h-4 w-4 bg-slate-950 border-slate-800 rounded">
          </div>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
        <h2 class="text-base font-semibold text-white mb-2">API Configurations</h2>
        <div class="space-y-3">
          <div>
            <label class="block text-slate-400 text-[11px] font-medium mb-1">Session Timeout Interval</label>
            <select class="w-full bg-slate-950 border border-slate-800 focus:border-violet-500 rounded-lg px-2.5 py-1.5 text-xs text-slate-300 outline-none transition-colors">
              <option value="15">15 Minutes</option>
              <option value="60" selected>1 Hour</option>
              <option value="1440">24 Hours</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 text-[11px] font-medium mb-1">Max Upload Rate Limit</label>
            <input type="text" value="100 req/min" class="w-full bg-slate-950 border border-slate-800 focus:border-violet-500 rounded-lg px-2.5 py-1.5 text-xs text-slate-300 outline-none transition-colors">
          </div>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 md:col-span-2">
        <div class="flex items-start justify-between gap-4 mb-2">
          <div>
            <h2 class="text-base font-semibold text-white">Sidebar Menu Config</h2>
            <p class="text-xs text-slate-500">Edit the stored sidebar JSON for a selected role.</p>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-xs text-slate-300">Role</label>
            <select id="sidebarConfigRole" class="bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-lg px-2 py-1 outline-none">
              <option value="super_admin">super_admin</option>
              <option value="admin">admin</option>
              <option value="reviewer">reviewer</option>
              <option value="employee">employee</option>
            </select>
          </div>
        </div>
        <textarea id="sidebarConfigJson" class="w-full min-h-[320px] bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-slate-200 outline-none resize-none" spellcheck="false"></textarea>
        <div class="mt-4 flex flex-wrap gap-2">
          <button id="sidebarConfigLoad" class="px-4 py-2 rounded-xl bg-violet-600 hover:bg-violet-500 transition text-white text-sm">Load</button>
          <button id="sidebarConfigSave" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 transition text-white text-sm">Save</button>
          <div id="sidebarConfigStatus" class="text-xs text-slate-400 self-center"></div>
        </div>
      </div>

    </section>
  </div>

  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="/js/header-role-common.js"></script>
  <script type="module" src="../js/sidebar-config-editor.js"></script>
  <script>
    window.addEventListener('load', function () {
      if (typeof window.initRoleHeaderCommon === 'function') {
        window.initRoleHeaderCommon({ baseRolePath: '/admin' });
      }
    });
  </script>
  <script src="../js/load-components.js"></script>
</body>
</html>
