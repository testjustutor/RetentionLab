<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="profile">
  <title>Profile | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css">
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
          <div id="header-buttons-container"></div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 max-w-2xl">
          <div id="profile-content" class="space-y-4">
            <!-- Profile header with avatar -->
            <div class="flex items-center gap-4 pb-4 border-b border-slate-700">
              <div id="profile-avatar" class="w-16 h-16 rounded-full bg-violet-600 flex items-center justify-center text-xl font-bold text-slate-100">?</div>
              <div>
                <h2 id="display-name" class="text-base font-semibold text-slate-100">Loading...</h2>
                <p id="display-role" class="text-xs text-slate-400">Loading...</p>
              </div>
            </div>
            <!-- Profile details -->
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-[12px] text-slate-400 mb-1">First Name</label>
                <p id="field-first_name" class="text-sm text-slate-100 bg-slate-800 rounded-md px-3 py-2">-</p>
              </div>
              <div>
                <label class="block text-[12px] text-slate-400 mb-1">Last Name</label>
                <p id="field-last_name" class="text-sm text-slate-100 bg-slate-800 rounded-md px-3 py-2">-</p>
              </div>
            </div>
            <div>
              <label class="block text-[12px] text-slate-400 mb-1">Email</label>
              <p id="field-email" class="text-sm text-slate-100 bg-slate-800 rounded-md px-3 py-2">-</p>
            </div>
            <div>
              <label class="block text-[12px] text-slate-400 mb-1">Phone</label>
              <p id="field-phone" class="text-sm text-slate-100 bg-slate-800 rounded-md px-3 py-2">-</p>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-[12px] text-slate-400 mb-1">Role</label>
                <p id="field-role" class="text-sm text-slate-100 bg-slate-800 rounded-md px-3 py-2">-</p>
              </div>
              <div>
                <label class="block text-[12px] text-slate-400 mb-1">Status</label>
                <p id="field-status" class="text-sm text-slate-100 bg-slate-800 rounded-md px-3 py-2">-</p>
              </div>
            </div>
            <div>
              <label class="block text-[12px] text-slate-400 mb-1">Profile Image</label>
              <p id="field-profile_image" class="text-sm text-slate-100 bg-slate-800 rounded-md px-3 py-2">-</p>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-[12px] text-slate-400 mb-1">Email Verified</label>
                <p id="field-email_verified" class="text-sm text-slate-100 bg-slate-800 rounded-md px-3 py-2">-</p>
              </div>
              <div>
                <label class="block text-[12px] text-slate-400 mb-1">Last Login</label>
                <p id="field-last_login" class="text-sm text-slate-100 bg-slate-800 rounded-md px-3 py-2">-</p>
              </div>
            </div>
            <div>
              <label class="block text-[12px] text-slate-400 mb-1">Account Created</label>
              <p id="field-created_at" class="text-sm text-slate-100 bg-slate-800 rounded-md px-3 py-2">-</p>
            </div>
          </div>
          <div id="profile-error" class="hidden text-red-400 text-sm p-4 text-center">Failed to load profile data.</div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/auth.js"></script>
  <script src="../js/load-components.js"></script>
  <script>
    (async function loadProfile() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        const data = await res.json();
        if (!data.success || !data.user) {
          document.getElementById('profile-content').classList.add('hidden');
          document.getElementById('profile-error').classList.remove('hidden');
          return;
        }
        const u = data.user;

        // Set avatar initials
        const initial = (u.first_name || u.email || '?')[0].toUpperCase();
        document.getElementById('profile-avatar').textContent = initial;

        // Display name and role
        document.getElementById('display-name').textContent = [u.first_name, u.last_name].filter(Boolean).join(' ') || u.email || 'Unknown';
        document.getElementById('display-role').textContent = (u.role_name || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

        // Fill fields
        const setField = (id, val) => {
          const el = document.getElementById(id);
          if (el) el.textContent = val || '-';
        };
        setField('field-first_name', u.first_name);
        setField('field-last_name', u.last_name);
        setField('field-email', u.email);
        setField('field-phone', u.phone || 'Not provided');
        setField('field-role', (u.role_name || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()));
        setField('field-status', u.status || 'active');
        setField('field-profile_image', u.profile_image || 'Not set');
        setField('field-email_verified', u.email_verified ? 'Yes' : 'No');
        setField('field-last_login', u.last_login_at ? new Date(u.last_login_at).toLocaleString() : 'Never');
        setField('field-created_at', u.created_at ? new Date(u.created_at).toLocaleString() : '-');
      } catch (err) {
        console.error('Profile load error:', err);
        document.getElementById('profile-content').classList.add('hidden');
        document.getElementById('profile-error').classList.remove('hidden');
      }
    })();
  </script>
</body>
</html>
