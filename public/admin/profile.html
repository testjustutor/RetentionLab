<!doctype html>
<html lang='en'>
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <meta name='dashboard-role' content='admin'>
  <meta name='header-page' content='profile'>
  <title>My Profile | Admin</title>
  <script src='https://cdn.tailwindcss.com'></script>
  <link rel='stylesheet' href='../css/shared.css'>
  <script src='../js/common-ui.js'></script>
</head>
<body class='min-h-screen bg-slate-100 text-slate-900 antialiased'>
  <div class='flex h-screen'>
    <div id='sidebar-placeholder'></div>
    <div class='flex-1 flex flex-col overflow-hidden'>
      <div id='header-placeholder'></div>
      <main class='flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100'>
        <div class='flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4'>
          <div>
            <h2 class='text-lg font-bold text-slate-900'>My Profile</h2>
            <p class='text-xs text-slate-500'>View and update your account information</p>
          </div>
        </div>

        <div class='grid grid-cols-1 lg:grid-cols-3 gap-4'>
          <!-- Left Column -->
          <div class='lg:col-span-2 space-y-4'>
            <!-- Profile Information -->
            <div class='bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-200 rounded-lg p-4 shadow-md'>
              <h3 class='text-[13px] font-bold text-blue-900 mb-3 uppercase tracking-wide'>Profile Information</h3>
              <form id='profileForm' class='space-y-4'>
                <div class='grid grid-cols-1 md:grid-cols-2 gap-4'>
                  <div>
                    <label for='firstName' class='block text-[10px] font-bold text-blue-900 uppercase tracking-wide mb-1'>First Name <span class='text-red-500'>*</span></label>
                    <input type='text' id='firstName' required class='w-full bg-white border border-blue-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-blue-500' placeholder='Enter first name'>
                  </div>
                  <div>
                    <label for='lastName' class='block text-[10px] font-bold text-blue-900 uppercase tracking-wide mb-1'>Last Name <span class='text-red-500'>*</span></label>
                    <input type='text' id='lastName' required class='w-full bg-white border border-blue-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-blue-500' placeholder='Enter last name'>
                  </div>
                </div>
                <div>
                  <label for='email' class='block text-[10px] font-bold text-blue-900 uppercase tracking-wide mb-1'>Email Address</label>
                  <input type='email' id='email' disabled class='w-full bg-slate-100 border border-blue-200 rounded-md px-2.5 py-1.5 text-xs text-slate-700 cursor-not-allowed' placeholder='Enter email'>
                  <p class='text-[11px] text-blue-800/70 mt-1'>Email address cannot be changed</p>
                </div>
                <div>
                  <label for='phone' class='block text-[10px] font-bold text-blue-900 uppercase tracking-wide mb-1'>Phone Number</label>
                  <input type='tel' id='phone' class='w-full bg-white border border-blue-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-blue-500' placeholder='Enter phone number'>
                </div>
                <div class='flex items-center gap-2 pt-1'>
                  <button type='submit' class='px-4 py-1.5 rounded-md bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold transition-colors shadow-sm'>Save Changes</button>
                  <button type='button' id='cancelBtn' class='px-4 py-1.5 rounded-md bg-white border border-blue-300 hover:bg-blue-50 text-blue-900 text-xs font-semibold transition-colors'>Cancel</button>
                </div>
              </form>
            </div>

            <!-- Change Password -->
            <div class='bg-gradient-to-br from-amber-50 to-orange-100 border-2 border-amber-200 rounded-lg p-4 shadow-md'>
              <h3 class='text-[13px] font-bold text-amber-900 mb-3 uppercase tracking-wide'>Change Password</h3>
              <form id='passwordForm' class='space-y-4'>
                <div>
                  <label for='currentPassword' class='block text-[10px] font-bold text-amber-900 uppercase tracking-wide mb-1'>Current Password <span class='text-red-500'>*</span></label>
                  <input type='password' id='currentPassword' required class='w-full bg-white border border-amber-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500' placeholder='Enter current password'>
                </div>
                <div class='grid grid-cols-1 md:grid-cols-2 gap-4'>
                  <div>
                    <label for='newPassword' class='block text-[10px] font-bold text-amber-900 uppercase tracking-wide mb-1'>New Password <span class='text-red-500'>*</span></label>
                    <input type='password' id='newPassword' required class='w-full bg-white border border-amber-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500' placeholder='Enter new password'>
                    <p class='text-[11px] text-amber-900/70 mt-1'>Minimum 6 characters</p>
                  </div>
                  <div>
                    <label for='confirmPassword' class='block text-[10px] font-bold text-amber-900 uppercase tracking-wide mb-1'>Confirm New Password <span class='text-red-500'>*</span></label>
                    <input type='password' id='confirmPassword' required class='w-full bg-white border border-amber-300 rounded-md px-2.5 py-1.5 text-xs text-slate-900 focus:outline-none focus:border-amber-500' placeholder='Confirm new password'>
                  </div>
                </div>
                <div class='flex items-center gap-2 pt-1'>
                  <button type='submit' class='px-4 py-1.5 rounded-md bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold transition-colors shadow-sm'>Update Password</button>
                </div>
              </form>
            </div>
          </div>

            <!-- Right Column - Account Details -->
            <div class='lg:col-span-1'>
              <div class='bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-200 rounded-lg p-4 shadow-md sticky top-4'>
                <div class='flex items-center gap-3 mb-4'>
                  <div id='userAvatar' class='w-12 h-12 rounded-full bg-violet-600 text-white flex items-center justify-center text-lg font-bold'>?</div>
                  <div>
                    <p id='userName' class='text-sm font-bold text-slate-900'>User</p>
                    <p id='userRole' class='text-[11px] font-semibold text-violet-800 capitalize'>Role</p>
                  </div>
                </div>
                <h3 class='text-[13px] font-bold text-violet-900 mb-3 uppercase tracking-wide'>Account Details</h3>
                <div id='accountInfo'>
                  <p class='text-xs text-slate-500'>Loading account information...</p>
                </div>
                <div class='mt-4 pt-4 border-t border-violet-200'>
                  <h4 class='text-[11px] font-bold text-violet-900 uppercase tracking-wide mb-2'>Quick Actions</h4>
                  <a href='/admin' class='flex items-center gap-2 px-3 py-2 text-xs text-violet-900 bg-white/70 rounded-lg hover:bg-white transition-colors border border-violet-200'>
                    <svg class='w-4 h-4' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6'></path></svg>
                    Back to Dashboard
                  </a>
                </div>
              </div>
            </div>
          </div>
      </main>
    </div>
  </div>
  <script type='module' src='../js/auth.js'></script>
  <script src='../js/load-components.js'></script>
  <script src='../js/admin/profile.js'></script>
</body>
</html>
