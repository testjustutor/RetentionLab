<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <meta name="header-page" content="profile">
  <title>My Profile | Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 text-slate-900 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-6">
        <div class="mx-auto">

          <!-- Main Content Grid -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left Column - Profile Form -->
            <div class="lg:col-span-2 space-y-6">
              <!-- Profile Information Card -->
              <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <div class="flex items-center gap-2 mb-4">
                  <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center">
                    <svg class="w-4.5 h-4.5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                  </div>
                  <h3 class="text-base font-semibold text-slate-900">Profile Information</h3>
                </div>
                
                <form id="profileForm" class="space-y-4">
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label for="firstName" class="block text-sm font-medium text-slate-700 mb-1.5">
                        First Name <span class="text-red-500">*</span>
                      </label>
                      <input 
                        type="text" 
                        id="firstName" 
                        class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        placeholder="Enter first name"
                        required
                      >
                    </div>
                    <div>
                      <label for="lastName" class="block text-sm font-medium text-slate-700 mb-1.5">
                        Last Name <span class="text-red-500">*</span>
                      </label>
                      <input 
                        type="text" 
                        id="lastName" 
                        class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        placeholder="Enter last name"
                        required
                      >
                    </div>
                  </div>

                  <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">
                      Email Address
                    </label>
                    <div class="relative">
                      <input 
                        type="email" 
                        id="email" 
                        class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-slate-50 text-slate-100"
                        placeholder="Enter email"
                        disabled
                      >
                      <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                        <svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                      </div>
                    </div>
                    <p class="text-xs text-slate-500 mt-1.5 flex items-center gap-1">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                      </svg>
                      Email address cannot be changed
                    </p>
                  </div>

                  <div>
                    <label for="phone" class="block text-sm font-medium text-slate-700 mb-1.5">
                      Phone Number
                    </label>
                    <div class="relative">
                      <input 
                        type="tel" 
                        id="phone" 
                        class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        placeholder="Enter phone number"
                      >
                      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                        </svg>
                      </div>
                    </div>
                  </div>

                  <div class="flex items-center gap-3 pt-2">
                    <button 
                      type="submit" 
                      class="px-5 py-2.5 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all shadow-sm hover:shadow-md"
                    >
                      <span class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                        Save Changes
                      </span>
                    </button>
                    <button 
                      type="button" 
                      id="cancelBtn" 
                      class="px-5 py-2.5 bg-white text-slate-700 text-sm font-medium rounded-lg border border-slate-300 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2 transition-all"
                    >
                      Cancel
                    </button>
                  </div>
                </form>
              </div>

              <!-- Change Password Card -->
              <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <div class="flex items-center gap-2 mb-4">
                  <div class="w-8 h-8 rounded-lg bg-amber-50 flex items-center justify-center">
                    <svg class="w-4.5 h-4.5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                  </div>
                  <h3 class="text-base font-semibold text-slate-900">Change Password</h3>
                </div>
                
                <form id="passwordForm" class="space-y-4">
                  <div>
                    <label for="currentPassword" class="block text-sm font-medium text-slate-700 mb-1.5">
                      Current Password <span class="text-red-500">*</span>
                    </label>
                    <input 
                      type="password" 
                      id="currentPassword" 
                      class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all"
                      placeholder="Enter current password"
                      required
                    >
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label for="newPassword" class="block text-sm font-medium text-slate-700 mb-1.5">
                        New Password <span class="text-red-500">*</span>
                      </label>
                      <input 
                        type="password" 
                        id="newPassword" 
                        class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all"
                        placeholder="Enter new password"
                        required
                      >
                      <p class="text-xs text-slate-500 mt-1">Minimum 6 characters</p>
                    </div>
                    <div>
                      <label for="confirmPassword" class="block text-sm font-medium text-slate-700 mb-1.5">
                        Confirm New Password <span class="text-red-500">*</span>
                      </label>
                      <input 
                        type="password" 
                        id="confirmPassword" 
                        class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all"
                        placeholder="Confirm new password"
                        required
                      >
                    </div>
                  </div>

                  <div class="flex items-center gap-3 pt-2">
                    <button 
                      type="submit" 
                      class="px-5 py-2.5 bg-amber-600 text-white text-sm font-medium rounded-lg hover:bg-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 transition-all shadow-sm hover:shadow-md"
                    >
                      <span class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        Update Password
                      </span>
                    </button>
                  </div>
                </form>
              </div>
            </div>

            <!-- Right Column - Account Info -->
            <div class="lg:col-span-1">
              <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 sticky top-6">
                <div class="flex items-center gap-2 mb-4">
                  <div class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center">
                    <svg class="w-4.5 h-4.5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                  </div>
                  <h3 class="text-base font-semibold text-slate-900">Account Details</h3>
                </div>
                
                <div class="space-y-3" id="accountInfo">
                  <p class="text-sm text-slate-500">Loading account information...</p>
                </div>

                <div class="mt-6 pt-6 border-t border-slate-200">
                  <h4 class="text-sm font-semibold text-slate-900 mb-3">Quick Actions</h4>
                  <div class="space-y-2">
                    <a href="/admin" class="flex items-center gap-2 px-3 py-2 text-sm text-slate-700 bg-slate-50 rounded-lg hover:bg-slate-100 transition-colors">
                      <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                      </svg>
                      Back to Dashboard
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Load common-ui.js FIRST (defines apiFetch) -->
  <script src="../js/common-ui.js"></script>
  <!-- Then load auth and components -->
  <script type="module" src="../js/auth.js"></script>
  <script src="../js/load-components.js"></script>
  <!-- Finally load page-specific scripts that depend on apiFetch -->
  <script src="../js/admin/profile.js"></script>
</body>
</html>
