<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="admin">
  <title>Profile | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
          <div><h1 class="text-xl font-bold text-white">Profile</h1><p class="text-xs text-slate-400 mt-1">Personal information and preferences</p></div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 max-w-2xl">
          <form class="space-y-2">
            <div class="grid grid-cols-2 gap-2"><div><label class="block text-[10px] text-slate-400 mb-1">First Name</label><input type="text" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-violet-500"></div><div><label class="block text-[10px] text-slate-400 mb-1">Last Name</label><input type="text" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-violet-500"></div></div>
            <div><label class="block text-[10px] text-slate-400 mb-1">Email</label><input type="email" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-violet-500"></div>
            <div><label class="block text-[10px] text-slate-400 mb-1">New Password</label><input type="password" placeholder="Leave blank to keep current" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2.5 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-violet-500"></div>
            <button class="bg-violet-600 hover:bg-violet-500 text-white text-xs font-medium px-3 py-1.5 rounded-md transition-colors">Update Profile</button>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/auth.js"></script>
  <script src="../js/load-components.js"></script>
</body>
</html>
