<!DOCTYPE html>
<html lang="en" class="dark">
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="dashboard-role" content="student">
  <title>Student Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css">
  <script src="../js/student/tailwind-config.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex-1 flex flex-col overflow-hidden">
    <div id="header-placeholder"></div>
    <div class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
      <div class="flex-1 overflow-auto custom-scrollbar relative">
        <div class="p-4">
          <h1 class="text-xl font-bold mb-3">Student Dashboard</h1>
          <p class="text-slate-400 text-xs mb-4">Your sessions and learning progress at a glance.</p>

          <section class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
            <div class="bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-400 rounded-lg p-3 shadow-md">
              <h2 class="text-[13px] font-bold uppercase tracking-wide text-blue-900 mb-2">You</h2>
              <dl class="space-y-1.5 text-xs">
                <div class="flex items-center justify-between border-b border-blue-200 pb-1"><dt class="font-semibold text-blue-800">Name</dt><dd id="userName" class="font-bold text-blue-950">—</dd></div>
                <div class="flex items-center justify-between border-b border-blue-200 pb-1"><dt class="font-semibold text-blue-800">Email</dt><dd id="userEmail" class="font-bold text-blue-950 text-right break-all">—</dd></div>
                <div class="flex items-center justify-between"><dt class="font-semibold text-blue-800">Role</dt><dd id="userRole" class="font-bold text-blue-950 capitalize">—</dd></div>
              </dl>
            </div>

            <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-400 rounded-lg p-3 shadow-md">
              <h2 class="text-[13px] font-bold uppercase tracking-wide text-violet-900 mb-2">Quick Links</h2>
              <div class="flex flex-col gap-2">
                <a href="/student/reports" class="rounded-lg bg-violet-600 px-3 py-2 text-xs font-semibold text-white hover:bg-violet-500 transition">View My Reports</a>
                <a href="/student/profile" class="rounded-lg bg-blue-600 px-3 py-2 text-xs font-semibold text-white hover:bg-blue-500 transition">My Profile</a>
              </div>
            </div>
          </section>

          <div class="bg-gradient-to-br from-emerald-50 to-teal-100 border-2 border-emerald-400 rounded-lg p-3 shadow-md">
            <h3 class="text-[12px] font-bold text-emerald-900 mb-2 uppercase tracking-wide">Recent Sessions</h3>
            <div id="recentSessions" class="text-emerald-900 text-xs">
              <p class="text-emerald-800">No sessions to show yet.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/js/auth.js"></script>
  <script src="../js/load-components.js"></script>
  <script src="../js/student/dashboard.js"></script>
</body>
</html>
