<!DOCTYPE html>
<html lang="en" class="dark">
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="dashboard-role" content="student">
  <title>My Reports - Student</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css">
  <script src="../js/student/tailwind-config.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex-1 flex flex-col overflow-hidden">
    <div id="header-placeholder"></div>
    <div class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
      <div class="flex-1 overflow-auto custom-scrollbar relative">
        <div class="p-4">
          <h1 class="text-xl font-bold mb-3">My Reports</h1>
          <p class="text-slate-400 text-xs mb-4">Session quality and learning progress reports for your own sessions.</p>

          <div id="reportsEmpty" class="rounded-lg border border-dashed border-slate-700/70 bg-slate-900/40 px-4 py-10 text-center text-slate-500 text-xs">
            No reports available yet. Reports will appear here after your sessions have been reviewed.
          </div>

          <div id="reportsList" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-3"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/js/auth.js"></script>
  <script src="../js/load-components.js"></script>
  <script src="../js/student/reports.js"></script>
</body>
</html>
