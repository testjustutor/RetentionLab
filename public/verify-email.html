<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; } .card { max-width: 520px; margin: 72px auto; padding: 32px; border-radius: 24px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(148, 163, 184, 0.14); box-shadow: 0 32px 100px rgba(15, 23, 42, 0.55); }</style>
</head>
<body>
  <div class="card">
    <h1 class="text-3xl font-bold mb-3 text-white">Verify your email</h1>
    <p class="text-sm text-slate-400 mb-6">We are verifying your account. Please wait while we confirm your email address.</p>
    <div id="verifyMessage" class="text-sm text-slate-300 min-h-[2rem]"></div>
    <p class="text-xs text-slate-500 mt-5">If you are not redirected automatically, use the links below.</p>
    <div class="mt-4 space-x-3">
      <a href="/login.html" class="inline-flex items-center rounded-full bg-violet-600 px-4 py-2 text-sm font-semibold text-white hover:bg-violet-500">Sign in</a>
      <a href="/support" class="inline-flex items-center rounded-full border border-slate-700 bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:border-violet-500">Contact support</a>
    </div>
  </div>
  <script type="module" src="/js/verify-email.js"></script>
</body>
</html>
