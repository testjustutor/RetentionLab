<!-- root/public/super_admin/configuration/platforms.html -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="platforms">
  <title>Platforms Configuration — RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css">
</head>
<body class="antialiased font-sans p-2 sm:p-0">
    <div id="sidebar-placeholder"></div>
    <div class="mx-auto flex flex-col gap-2">
        <!-- Header -->
        <div id="header-placeholder"></div>

        <!-- Page Header -->
        <div class="bg-slate-950 border-b border-slate-800 px-4 py-2">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-base font-bold text-white">Platforms Configuration</h1>
                    <p class="text-xs text-slate-400 mt-0.5">Configure meeting platform integrations and bot settings</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="testAllPlatforms()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-medium transition">
                        Test All
                    </button>
                    <button onclick="saveAllPlatforms()" class="px-3 py-1.5 bg-violet-600 hover:bg-violet-500 text-white rounded text-xs font-medium transition">
                        Save Changes
                    </button>
                </div>
            </div>
        </div>

        <!-- Info Banner -->
        <div class="px-4 py-2 bg-slate-950 border-b border-slate-800">
            <div class="flex items-start gap-2">
                <svg class="w-4 h-4 text-blue-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <p class="text-xs text-slate-400">Configure your meeting platforms below. Each platform can be enabled/disabled independently. The bot will automatically join meetings based on the configured settings.</p>
            </div>
        </div>

        <!-- Platforms Grid -->
        <div class="p-3">
            <div id="platformsGrid" class="grid grid-cols-1 lg:grid-cols-3 gap-3">
                <!-- Dynamically loaded from database -->
                <div class="col-span-full text-center py-8 text-slate-400 text-sm">Loading platforms...</div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 border border-slate-700 rounded-lg p-3 shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <div class="flex items-center gap-2">
            <div id="toastIcon"></div>
            <p id="toastMessage" class="text-sm font-medium"></p>
        </div>
    </div>

    <script src="/js/common-ui.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script src="/js/load-components.js"></script>
    <script src="/js/super_admin/configuration/platforms.js"></script>
</body>
</html>
