<!-- root/public/super_admin/calendar-accounts.html -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar Accounts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background: radial-gradient(circle at top left, #1e293b 0%, #020617 42%), #020617; color: #e2e8f0; min-height: 100vh; font-family: 'Inter', sans-serif; }
    .scroll::-webkit-scrollbar { width: 5px; }
    .scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }

    /* Sidebar fixed */
    .sidebar { width: 280px; flex-shrink: 0; }

    /* Card grid */
    .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }

    /* User card */
    .user-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 14px;
      transition: border-color 0.15s, transform 0.15s;
      cursor: default;
      position: relative;
      overflow: hidden;
    }
    .user-card:hover { border-color: #4f46e5; transform: translateY(-1px); }
    .user-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(99,102,241,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Avatar */
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px; letter-spacing: 0.02em;
      flex-shrink: 0;
    }
    .avatar-indigo { background: rgba(99,102,241,0.15); color: #818cf8; border: 1px solid rgba(99,102,241,0.3); }
    .avatar-teal   { background: rgba(20,184,166,0.15); color: #2dd4bf; border: 1px solid rgba(20,184,166,0.3); }
    .avatar-pink   { background: rgba(236,72,153,0.15); color: #f472b6; border: 1px solid rgba(236,72,153,0.3); }
    .avatar-amber  { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
    .avatar-rose   { background: rgba(244,63,94,0.15);  color: #fb7185; border: 1px solid rgba(244,63,94,0.3); }

    /* Status badge */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; padding: 3px 9px;
      border-radius: 999px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    .badge-connected { background: rgba(16,185,129,0.12); color: #34d399; border: 1px solid rgba(16,185,129,0.25); }
    .badge-pending   { background: rgba(245,158,11,0.12); color: #fbbf24; border: 1px solid rgba(245,158,11,0.25); }

    /* Stat boxes */
    .stat-box {
      background: rgba(15,23,42,0.6);
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 6px 8px;
      flex: 1;
      min-width: 0;
    }
    .stat-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #64748b; margin-bottom: 2px; }
    .stat-value { font-size: 15px; font-weight: 700; color: #f1f5f9; line-height: 1; }
    .stat-sub   { font-size: 9px; color: #475569; margin-top: 1px; }

    /* Rating stars */
    .stars { display: flex; gap: 2px; }
    .star { font-size: 13px; }
    .star-full  { color: #fbbf24; }
    .star-empty { color: #334155; }

    /* Input/Button */
    .inp {
      width: 100%; background: rgba(2,6,23,0.8); border: 1px solid #1e293b;
      border-radius: 10px; padding: 9px 12px; font-size: 13px; color: #f1f5f9;
      outline: none; transition: border-color 0.15s;
    }
    .inp:focus { border-color: #4f46e5; }
    .inp::placeholder { color: #334155; }
    .btn-primary {
      width: 100%; border-radius: 10px; background: #4f46e5;
      color: #fff; font-weight: 600; font-size: 13px; padding: 10px;
      border: none; cursor: pointer; transition: background 0.15s;
    }
    .btn-primary:hover { background: #4338ca; }
    .btn-primary:disabled { background: #312e81; color: #6366f1; cursor: not-allowed; }

    /* Message box */
    .msg { border-radius: 10px; padding: 10px 12px; font-size: 12px; font-weight: 500; margin-top: 12px; }
    .msg-success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); color: #34d399; }
    .msg-error   { background: rgba(244,63,94,0.1);  border: 1px solid rgba(244,63,94,0.25);  color: #fb7185; }
    .msg-info    { background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.25); color: #818cf8; }

    /* Divider */
    .divider { border: none; border-top: 1px solid #1e293b; margin: 14px 0; }

    /* Empty state */
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; }

    /* Skeleton loader */
    .skeleton { background: linear-gradient(90deg, #1e293b 25%, #293548 50%, #1e293b 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Remove btn */
    .btn-remove {
      font-size: 11px; font-weight: 500; color: #64748b; background: none;
      border: none; cursor: pointer; padding: 3px 6px; border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .btn-remove:hover { color: #fb7185; background: rgba(244,63,94,0.1); }

    /* Platform pills */
    .platform-pill {
      font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
      background: rgba(99,102,241,0.1); color: #818cf8; border: 1px solid rgba(99,102,241,0.2);
      text-transform: uppercase; letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="mx-auto p-0 lg:p-0">

    <!-- Header -->    <div id="header-placeholder"></div>
<!-- Main layout -->
    <div class="flex gap-3 items-start p-3">

      <!-- LEFT SIDEBAR: Add User only -->
      <aside class="sidebar space-y-4">

        <!-- Add user form -->
        <div class="rounded-lg border border-slate-800 bg-slate-900/70 p-3">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-7 h-7 rounded-lg bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            </div>
            <h2 class="text-sm font-semibold text-slate-200">Connect Account</h2>
          </div>
          <div class="space-y-3">
            <div>
              <label class="text-xs text-slate-500 font-medium block mb-1.5">Email address</label>
              <input id="newUserEmail" type="email" placeholder="user@company.com" class="inp" />
            </div>
            <button id="connectBtn" onclick="connectNewUser()" class="btn-primary">
              Send Verification Link
            </button>
            <div id="connectMessage" class="hidden"></div>
          </div>
        </div>

        <!-- Quick tips -->
        <div class="rounded-lg border border-slate-800 bg-slate-900/70 p-3">
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">How it works</h3>
          <ol class="space-y-3">
            <li class="flex gap-3 text-xs text-slate-500">
              <span class="w-5 h-5 rounded-full bg-slate-800 border border-slate-700 text-slate-400 font-semibold text-[10px] flex items-center justify-center flex-shrink-0">1</span>
              Enter the user's email and send a verification link.
            </li>
            <li class="flex gap-3 text-xs text-slate-500">
              <span class="w-5 h-5 rounded-full bg-slate-800 border border-slate-700 text-slate-400 font-semibold text-[10px] flex items-center justify-center flex-shrink-0">2</span>
              User opens the link and completes Google OAuth.
            </li>
            <li class="flex gap-3 text-xs text-slate-500">
              <span class="w-5 h-5 rounded-full bg-slate-800 border border-slate-700 text-slate-400 font-semibold text-[10px] flex items-center justify-center flex-shrink-0">3</span>
              Account appears as <strong class="text-emerald-400 font-semibold">Connected</strong> in the grid.
            </li>
          </ol>
        </div>

        <!-- Filter / search -->
        <div class="rounded-lg border border-slate-800 bg-slate-900/70 p-3">
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Filter</h3>
          <input id="searchInput" type="text" placeholder="Search email..." class="inp mb-3" oninput="filterCards()" />
          <div class="space-y-1">
            <button onclick="setFilter('all')"       id="fAll"       class="filter-btn active w-full text-left px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 bg-slate-800">All accounts</button>
            <button onclick="setFilter('connected')" id="fConnected" class="filter-btn w-full text-left px-3 py-1.5 rounded-lg text-xs font-medium text-slate-500 hover:text-slate-300 hover:bg-slate-800">Connected only</button>
            <button onclick="setFilter('pending')"   id="fPending"   class="filter-btn w-full text-left px-3 py-1.5 rounded-lg text-xs font-medium text-slate-500 hover:text-slate-300 hover:bg-slate-800">Pending only</button>
          </div>
        </div>

      </aside>

      <!-- CENTER: User cards grid -->
      <div class="flex-1 min-w-0">

        <!-- Grid header -->
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <h2 class="text-sm font-semibold text-slate-300">Active Identities</h2>
            <span id="userCountBadge" class="text-xs px-2 py-0.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-400">0</span>
          </div>
          <button onclick="loadUsers()" class="flex items-center gap-1.5 text-xs text-slate-500 hover:text-slate-300 transition-colors">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            Refresh
          </button>
        </div>

        <!-- Cards grid -->
        <div id="userGrid" class="user-grid">
          <!-- Skeleton loaders -->
          <div class="user-card"><div class="skeleton h-4 w-3/4 mb-3"></div><div class="skeleton h-3 w-1/2 mb-2"></div><div class="flex gap-2"><div class="skeleton h-14 flex-1 rounded-xl"></div><div class="skeleton h-14 flex-1 rounded-xl"></div><div class="skeleton h-14 flex-1 rounded-xl"></div></div></div>
          <div class="user-card"><div class="skeleton h-4 w-3/4 mb-3"></div><div class="skeleton h-3 w-1/2 mb-2"></div><div class="flex gap-2"><div class="skeleton h-14 flex-1 rounded-xl"></div><div class="skeleton h-14 flex-1 rounded-xl"></div><div class="skeleton h-14 flex-1 rounded-xl"></div></div></div>
          <div class="user-card"><div class="skeleton h-4 w-3/4 mb-3"></div><div class="skeleton h-3 w-1/2 mb-2"></div><div class="flex gap-2"><div class="skeleton h-14 flex-1 rounded-xl"></div><div class="skeleton h-14 flex-1 rounded-xl"></div><div class="skeleton h-14 flex-1 rounded-xl"></div></div></div>
        </div>

      </div>
    </div>
  </div>

  <script>
    /* ── State ─────────────────────────────────────────── */
    let allUsers = [];
    let activeFilter = 'all';
    const AVATAR_COLORS = ['avatar-indigo','avatar-teal','avatar-pink','avatar-amber','avatar-rose'];

    /* ── Helpers ───────────────────────────────────────── */
    function initials(email) {
      const parts = email.split('@')[0].replace(/[._-]/g,' ').split(' ');
      return parts.length >= 2
        ? (parts[0][0] + parts[1][0]).toUpperCase()
        : email.substring(0,2).toUpperCase();
    }

    function avatarColor(email) {
      let h = 0;
      for (let i = 0; i < email.length; i++) h = (h * 31 + email.charCodeAt(i)) % AVATAR_COLORS.length;
      return AVATAR_COLORS[h];
    }

    function formatDuration(seconds) {
      if (!seconds || seconds === 0) return '—';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      if (h > 0) return `${h}h ${m}m`;
      return `${m}m`;
    }

    function renderStars(rating) {
      // rating expected 0-5; fall back gracefully
      const r = Math.round(parseFloat(rating) || 0);
      const stars = [];
      for (let i = 1; i <= 5; i++) {
        stars.push(`<span class="star ${i <= r ? 'star-full' : 'star-empty'}">★</span>`);
      }
      return `<div class="stars">${stars.join('')}</div>`;
    }

    function platformLabel(platform) {
      if (!platform) return '';
      const map = { 'google-meet': 'Meet', 'meet': 'Meet', 'zoom': 'Zoom', 'teams': 'Teams' };
      return map[platform.toLowerCase()] || platform;
    }

    function timeAgo(dateStr) {
      if (!dateStr) return 'Never';
      const diff = Date.now() - new Date(dateStr).getTime();
      const m = Math.floor(diff / 60000);
      if (m < 1)   return 'Just now';
      if (m < 60)  return `${m}m ago`;
      const h = Math.floor(m / 60);
      if (h < 24)  return `${h}h ago`;
      return `${Math.floor(h/24)}d ago`;
    }

    /* ── Render one card ───────────────────────────────── */
    function buildCard(u) {
      const connected = !!u.token_expiry;
      const av = avatarColor(u.email);
      const ini = initials(u.email);
      const name = u.email.split('@')[0];
      const domain = u.email.split('@')[1] || '';
      const totalMeetings = u.stats?.total_meetings ?? 0;
      const completed    = u.stats?.completed_meetings ?? 0;
      const totalSecs    = u.stats?.total_duration_seconds ?? 0;
      const avgRating    = u.stats?.avg_rating ?? 0;
      const lastMeeting  = u.stats?.last_meeting_at ?? null;
      const topPlatform  = u.stats?.top_platform ?? null;

      return `
        <div class="user-card" data-email="${u.email}" data-connected="${connected}">

          <!-- Card header -->
          <div class="flex items-start justify-between mb-2">
            <div class="flex items-center gap-3">
              <div class="avatar ${av}">${ini}</div>
              <div class="min-w-0">
                <div class="text-sm font-semibold text-white truncate max-w-[140px]" title="${u.email}">${name}</div>
                <div class="text-xs text-slate-500 truncate">@${domain}</div>
              </div>
            </div>
            <div class="flex flex-col items-end gap-1.5">
              <span class="badge ${connected ? 'badge-connected' : 'badge-pending'}">
                <span style="width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block"></span>
                ${connected ? 'Connected' : 'Pending'}
              </span>
              ${topPlatform ? `<span class="platform-pill">${platformLabel(topPlatform)}</span>` : ''}
            </div>
          </div>

          <!-- Role + last seen -->
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-slate-500">${u.role_name || 'instructor'}</span>
            <span class="text-xs text-slate-600">Last: ${timeAgo(lastMeeting)}</span>
          </div>

          <!-- Stats row -->
          <div class="flex gap-2 mb-2">
            <div class="stat-box">
              <div class="stat-label">Meetings</div>
              <div class="stat-value">${totalMeetings}</div>
              <div class="stat-sub">${completed} done</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Rec. Time</div>
              <div class="stat-value" style="font-size:15px">${formatDuration(totalSecs)}</div>
              <div class="stat-sub">total</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Rating</div>
              ${renderStars(avgRating)}
              <div class="stat-sub">${avgRating ? parseFloat(avgRating).toFixed(1) + ' / 5' : 'No data'}</div>
            </div>
          </div>

          <hr class="divider" />

          <!-- Actions -->
          <div class="flex items-center justify-between gap-2">
            <a target="_blank" href="/super_admin/calendar-events.html?email=${encodeURIComponent(u.email)}" class="flex-1 text-center rounded-lg py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 transition-colors">
              View Events
            </a>
            <a target="_blank" href="/super_admin/archives.html?email=${encodeURIComponent(u.email)}" class="flex-1 text-center rounded-lg py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 transition-colors">
              Archives
            </a>
            <button onclick="removeUser('${u.email}')" class="btn-remove" title="Remove account">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
          </div>

        </div>
      `;
    }

    /* ── Render grid ───────────────────────────────────── */
    function renderGrid(users) {
      const grid = document.getElementById('userGrid');
      const searchInput = document.getElementById('searchInput');
      const search = searchInput ? searchInput.value.trim().toLowerCase() : '';
      if (!grid) {
        console.warn('calendar-accounts: missing userGrid container, aborting render');
        return;
      }

      const filtered = users.filter(u => {
        const matchFilter =
          activeFilter === 'all' ? true :
          activeFilter === 'connected' ? !!u.token_expiry :
          !u.token_expiry;
        const matchSearch = !search || u.email.toLowerCase().includes(search);
        return matchFilter && matchSearch;
      });

      const userCountBadge = document.getElementById('userCountBadge');
      if (userCountBadge) {
        userCountBadge.textContent = filtered.length;
      }

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div style="width:48px;height:48px;border-radius:50%;background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div class="text-slate-400 font-semibold text-sm mb-1">${search ? 'No matching accounts' : 'No accounts yet'}</div>
            <div class="text-slate-600 text-xs">${search ? 'Try a different search term.' : 'Add a user email from the sidebar to get started.'}</div>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(buildCard).join('');

      // Update header stats
      const totalMeetings = users.reduce((s, u) => s + (u.stats?.total_meetings || 0), 0);
      const totalUsersEl = document.getElementById('hTotalUsers');
      const totalMeetingsEl = document.getElementById('hTotalMeetings');
      const headerStatsEl = document.getElementById('headerStats');

      if (totalUsersEl) totalUsersEl.textContent = users.length;
      if (totalMeetingsEl) totalMeetingsEl.textContent = totalMeetings;
      if (headerStatsEl) {
        headerStatsEl.classList.remove('hidden');
        headerStatsEl.style.display = 'flex';
      }
    }

    /* ── Load users from API ───────────────────────────── */
    async function loadUsers() {
      try {
        const res  = await fetch('/api/calendar/multi/users/stats');
        const data = await res.json();
        allUsers = data.data || [];
        renderGrid(allUsers);
      } catch (err) {
        document.getElementById('userGrid').innerHTML = `
          <div class="empty-state">
            <div class="text-rose-400 font-semibold text-sm">Failed to load accounts</div>
            <div class="text-slate-600 text-xs mt-1">${err.message}</div>
          </div>
        `;
      }
    }

    /* ── Filter ────────────────────────────────────────── */
    function setFilter(f) {
      activeFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', false);
        b.classList.remove('bg-slate-800', 'text-slate-300');
        b.classList.add('text-slate-500');
      });
      const active = document.getElementById('f' + f.charAt(0).toUpperCase() + f.slice(1));
      if (active) {
        active.classList.add('bg-slate-800', 'text-slate-300');
        active.classList.remove('text-slate-500');
      }
      renderGrid(allUsers);
    }

    function filterCards() { renderGrid(allUsers); }

    /* ── Connect new user ──────────────────────────────── */
    async function connectNewUser() {
      const email = document.getElementById('newUserEmail').value.trim();
      const msgEl = document.getElementById('connectMessage');
      const btn   = document.getElementById('connectBtn');

      if (!email) {
        showMsg(msgEl, 'error', 'Please enter a valid email address.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending…';
      showMsg(msgEl, 'info', 'Generating verification link…');

      try {
        const res  = await fetch('/api/calendar/multi/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (data.status !== 'success' || !data.verifyLink) throw new Error(data.message || 'Failed to generate link.');
        showMsg(msgEl, 'success', `✓ Verification link sent to ${email}. The user must open it to complete Google authorization.`);
        document.getElementById('newUserEmail').value = '';
        setTimeout(loadUsers, 1500);
      } catch (err) {
        showMsg(msgEl, 'error', err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Verification Link';
      }
    }

    function showMsg(el, type, text) {
      el.classList.remove('hidden');
      el.className = `msg msg-${type}`;
      el.textContent = text;
    }

    /* ── Remove user ───────────────────────────────────── */
    async function removeUser(email) {
      if (!confirm(`Remove ${email} from RetentionLab? This will not delete their meetings.`)) return;
      try {
        await fetch('/api/calendar/multi/users/disconnect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        allUsers = allUsers.filter(u => u.email !== email);
        renderGrid(allUsers);
      } catch(err) {
        alert('Failed to remove user: ' + err.message);
      }
    }

    /* ── Boot ──────────────────────────────────────────── */
    window.addEventListener('load', async () => {
      if (window.__rlHeaderReady) {
        await window.__rlHeaderReady;
      }
      loadUsers();
    });
    window.addEventListener('load', () => { if (typeof initProfileMenu === 'function') initProfileMenu(); });
  </script>

  <script>
    /* ── Profile dropdown ────────────────────────────── */
    function toggleProfileMenu() {
      const menu    = document.getElementById('profileMenu');
      const chevron = document.getElementById('profileChevron');
      const isOpen  = !menu.classList.contains('hidden');
      menu.classList.toggle('hidden', isOpen);
      chevron.style.transform = isOpen ? '' : 'rotate(180deg)';
    }

    // Close when clicking outside
    document.addEventListener('click', function(e) {
      const wrap = document.getElementById('profileMenuWrap');
      if (wrap && !wrap.contains(e.target)) {
        document.getElementById('profileMenu').classList.add('hidden');
        document.getElementById('profileChevron').style.transform = '';
      }
    });

    // Populate from localStorage/sessionStorage (set by auth-guard.js)
    function initProfileMenu() {
      try {
        const raw  = localStorage.getItem('rl_user') || sessionStorage.getItem('rl_user');
        const user = raw ? JSON.parse(raw) : null;
        if (user) {
          const name     = user.name  || user.email?.split('@')[0] || 'Super Admin';
          const email    = user.email || 'super_admin@local';
          const initials = name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
          document.getElementById('profileAvatar').textContent = initials;
          document.getElementById('profileName').textContent   = name;
          document.getElementById('profileEmail').textContent  = email;
          document.getElementById('dropdownName').textContent  = name;
          document.getElementById('dropdownEmail').textContent = email;
        }
      } catch(_) { /* silently ignore — HTML defaults already set */ }
    }

    async function handleLogout() {
      // Clear client-side session data
      localStorage.removeItem('rl_user');
      localStorage.removeItem('rl_token');
      sessionStorage.clear();
      try {
        // Hit server-side logout endpoint to invalidate session/token
        await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      } catch(_) {
        // Ignore network errors — client is already cleared
      }
      window.location.href = '/login.html';
    }
  </script>

  <script type="module" src="/js/auth.js"></script>
  <script src="../js/load-components.js"></script>
</body>
</html>
