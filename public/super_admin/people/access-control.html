<!DOCTYPE html>
<html lang="en">
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="accessControl">
  <title>Access Control — Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased font-sans p-2 sm:p-0">
    <div id="sidebar-placeholder"></div>
    <div class="mx-auto flex flex-col gap-2">
        <!-- Header -->
        <div id="header-placeholder"></div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 shrink-0 p-3">
            <div class="bg-gradient-to-br from-cyan-50 to-blue-100 border-2 border-cyan-400 rounded-lg p-2 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-cyan-700 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Total Users</p>
                    <p id="totalUsers" class="text-base font-bold font-sans text-cyan-950">0</p>
                </div>
                <div class="p-1.5 bg-cyan-100 text-cyan-700 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </div>
            </div>
            <div class="bg-gradient-to-br from-emerald-50 to-teal-100 border-2 border-emerald-400 rounded-lg p-2 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-emerald-700 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Active Users</p>
                    <p id="activeUsers" class="text-base font-bold font-sans text-emerald-950">0</p>
                </div>
                <div class="p-1.5 bg-emerald-100 text-emerald-700 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                </div>
            </div>
            <div class="bg-gradient-to-br from-amber-50 to-orange-100 border-2 border-amber-400 rounded-lg p-2 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-amber-700 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Inactive Users</p>
                    <p id="inactiveUsers" class="text-base font-bold font-sans text-amber-950">0</p>
                </div>
                <div class="p-1.5 bg-amber-100 text-amber-700 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
                    </svg>
                </div>
            </div>
            <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-400 rounded-lg p-2 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-violet-700 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Role Types</p>
                    <p id="totalRoles" class="text-base font-bold font-sans text-violet-950">0</p>
                </div>
                <div class="p-1.5 bg-violet-100 text-violet-700 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- User Directory Section -->
        <div class="p-3">
            <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-400 rounded-lg shadow-md overflow-hidden">
                <!-- Header with Search & Filters -->
                <div class="px-3 py-2 border-b border-violet-300 bg-violet-100 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-violet-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                        <h2 class="text-sm font-bold text-violet-950 uppercase tracking-wide">User Access Control</h2>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <input type="text" id="searchInput" placeholder="Search users..."
                            class="w-40 lg:w-52 bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500">
                        <select id="roleFilter" class="bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-violet-500">
                            <option value="">All Roles</option>
                        </select>
                        <select id="companyFilter" class="bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-violet-500">
                            <option value="">All Companies</option>
                        </select>
                        <select id="statusFilter" class="bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-violet-500">
                            <option value="">All Status</option>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                </div>

                <!-- User Table (centralized createTable mounts here) -->
                <div class="p-3">
                    <div id="userTableContainer"></div>
                </div>
            </div>
        </div>
    </div>


    <!-- Edit User Modal -->
    <div id="editAccessModal" class="hidden fixed inset-0 bg-black/60 z-[99999] flex items-center justify-center p-4">
        <div class="bg-white border border-slate-300 rounded-lg shadow-xl max-w-md w-full">
            <div class="p-3 border-b border-slate-300 bg-slate-100 flex items-center justify-between">
                <h3 class="text-sm font-semibold text-slate-900 flex items-center gap-2">
                    <svg class="w-4 h-4 text-violet-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                    </svg>
                    Edit Access Permissions
                </h3>
                <button onclick="closeEditModal()" class="text-slate-500 hover:text-slate-700 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="editAccessForm" class="p-3 space-y-2">
                <input type="hidden" id="editAccessUserId" value="">
                <div>
                    <label class="block text-[10px] font-medium text-slate-500 mb-0.5">Full Name</label>
                    <input type="text" id="editName" name="name" required
                        class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-violet-500"
                        placeholder="Enter user name">
                </div>
                <div>
                    <label class="block text-[10px] font-medium text-slate-500 mb-0.5">Role</label>
                    <select id="editRole" name="role_id" required
                        class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-violet-500">
                        <option value="">Select role</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-medium text-slate-500 mb-0.5">Company</label>
                    <select id="editCompany" name="company_id" required
                        class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-violet-500">
                        <option value="">Select company</option>
                    </select>
                </div>
                <div class="flex gap-2 pt-1.5">
                    <button type="submit" class="flex-1 px-3 py-1.5 bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold rounded transition">
                        Save Changes
                    </button>
                    <button type="button" onclick="closeEditModal()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>


    <!-- Reset Password Modal -->
    <div id="resetPasswordModal" class="hidden fixed inset-0 bg-black/60 z-[99999] flex items-center justify-center p-4">
        <div class="bg-white border border-slate-300 rounded-lg shadow-xl max-w-md w-full">
            <div class="p-3 border-b border-slate-300 bg-slate-100 flex items-center justify-between">
                <h3 class="text-sm font-semibold text-slate-900 flex items-center gap-2">
                    <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    Reset Password
                </h3>
                <button onclick="closeResetModal()" class="text-slate-500 hover:text-slate-700 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="resetPasswordForm" class="p-3 space-y-2">
                <input type="hidden" id="resetUserId" value="">
                <p class="text-[10px] text-slate-500">Set a new password for <span id="resetUserEmail" class="text-slate-900 font-mono"></span></p>
                <div>
                    <label class="block text-[10px] font-medium text-slate-500 mb-0.5">New Password</label>
                    <input type="password" id="newPassword" name="password" required minlength="6"
                        class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500"
                        placeholder="Min. 6 characters">
                </div>
                <div class="flex gap-2 pt-1.5">
                    <button type="submit" class="flex-1 px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold rounded transition">
                        Reset Password
                    </button>
                    <button type="button" onclick="closeResetModal()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>


    <!-- Confirm Toggle Status Modal -->
    <div id="confirmToggleModal" class="hidden fixed inset-0 bg-black/60 z-[99999] flex items-center justify-center p-4">
        <div class="bg-white border border-slate-300 rounded-lg shadow-xl max-w-sm w-full">
            <div class="p-3 border-b border-slate-300 bg-slate-100 flex items-center justify-between">
                <h3 id="confirmToggleTitle" class="text-sm font-semibold text-slate-900 flex items-center gap-2">
                    <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                    </svg>
                    Confirm Action
                </h3>
                <button onclick="closeConfirmModal()" class="text-slate-500 hover:text-slate-700 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="p-3">
                <p id="confirmToggleMessage" class="text-xs text-slate-600 mb-3">Are you sure you want to change this user's status?</p>
                <input type="hidden" id="confirmToggleUserId" value="">
                <input type="hidden" id="confirmToggleNewStatus" value="">
                <div class="flex gap-2">
                    <button onclick="executeToggleStatus()" id="confirmToggleBtn" class="flex-1 px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold rounded transition">
                        Confirm
                    </button>
                    <button type="button" onclick="closeConfirmModal()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded transition">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load common-ui-super-admin.js FIRST (defines createTable, escHtml, apiFetch, etc.) -->
    <script src="/js/common-ui-super-admin.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script src="/js/load-components.js"></script>
    <script src="/js/super_admin/people/access-control.js"></script>
</body>
</html>
