<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="addUser">
  <title>Admin Management — Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css" />
</head>
<body class="antialiased font-sans p-2 sm:p-0">
    <div id="sidebar-placeholder"></div>
    <div class="mx-auto flex flex-col gap-2">
        <!-- Header -->
        <div id="header-placeholder"></div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 shrink-0 p-3">
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg p-2 border border-violet-500/30 shadow-md shadow-violet-500/5 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Total Admins</p>
                    <p id="totalAdmins" class="text-base font-bold font-sans text-violet-400">0</p>
                </div>
                <div class="p-1.5 bg-violet-500/10 text-violet-400 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/>
                    </svg>
                </div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg p-2 border border-emerald-500/30 shadow-md shadow-emerald-500/5 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Total Users</p>
                    <p id="totalUsers" class="text-base font-bold font-sans text-emerald-400">0</p>
                </div>
                <div class="p-1.5 bg-emerald-500/10 text-emerald-400 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg p-2 border border-cyan-500/30 shadow-md shadow-cyan-500/5 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Role Types</p>
                    <p id="totalRoles" class="text-base font-bold font-sans text-cyan-400">0</p>
                </div>
                <div class="p-1.5 bg-cyan-500/10 text-cyan-400 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
                    </svg>
                </div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg p-2 border border-amber-500/30 shadow-md shadow-amber-500/5 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Companies</p>
                    <p id="totalCompanies" class="text-base font-bold font-sans text-amber-400">0</p>
                </div>
                <div class="p-1.5 bg-amber-500/10 text-amber-400 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Admin Management Section -->
        <div class="p-3">
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg border border-slate-800/80 shadow-md overflow-hidden">
                <!-- Header -->
                <div class="px-3 py-2 border-b border-slate-800 bg-slate-950/50 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/>
                        </svg>
                        <h2 class="text-sm font-semibold text-white">Admin Users</h2>
                    </div>
                    <button id="addAdminBtn" class="px-3 py-1.5 bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold rounded transition flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                        </svg>
                        Add Admin
                    </button>
                </div>

                <!-- Admin Table -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-[10px]">
                        <thead>
                            <tr class="border-b border-slate-800 bg-slate-800/30">
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Admin</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Email</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Company</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Users Managed</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Roles</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Status</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800" id="adminTableBody">
                            <tr>
                                <td colspan="7" class="py-4 text-center text-slate-500">Loading admin users...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Admin Modal -->
    <div id="addAdminModal" class="hidden fixed inset-0 bg-black/80 z-[99999] flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-lg shadow-xl max-w-md w-full">
            <div class="p-3 border-b border-slate-800 flex items-center justify-between">
                <h3 class="text-sm font-semibold text-slate-100 flex items-center gap-2">
                    <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                    Create New Admin
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="addAdminForm" class="p-3 space-y-2">
                <div>
                    <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Full Name</label>
                    <input type="text" id="name" name="name" required
                        class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500"
                        placeholder="Enter admin name">
                </div>
                <div>
                    <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Email Address</label>
                    <input type="email" id="email" name="email" required
                        class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500"
                        placeholder="admin@company.com">
                </div>
                <div>
                    <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Password</label>
                    <input type="password" id="password" name="password" required minlength="6"
                        class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500"
                        placeholder="Min. 6 characters">
                </div>
                <div>
                    <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Company</label>
                    <select id="company" name="company_id" required
                        class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500">
                        <option value="">Select a company</option>
                    </select>
                </div>
                <div class="flex gap-2 pt-1.5">
                    <button type="submit" class="flex-1 px-3 py-1.5 bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold rounded transition">
                        Create Admin
                    </button>
                    <button type="button" onclick="closeModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Admin Modal -->
    <div id="editAdminModal" class="hidden fixed inset-0 bg-black/80 z-[99999] flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-lg shadow-xl max-w-md w-full">
            <div class="p-3 border-b border-slate-800 flex items-center justify-between">
                <h3 class="text-sm font-semibold text-slate-100 flex items-center gap-2">
                    <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                    </svg>
                    Edit Admin
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-200 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="editAdminForm" class="p-3 space-y-2">
                <input type="hidden" id="editAdminId" value="">
                <div>
                    <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Full Name</label>
                    <input type="text" id="editName" name="name" required
                        class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500"
                        placeholder="Enter admin name">
                </div>
                <div class="flex gap-2 pt-1.5">
                    <button type="submit" class="flex-1 px-3 py-1.5 bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold rounded transition">
                        Save Changes
                    </button>
                    <button type="button" onclick="closeEditModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/js/auth.js"></script>
    <script src="/js/load-components.js"></script>
    <script src="/js/super_admin/people/add-user.js"></script>
</body>
</html>
