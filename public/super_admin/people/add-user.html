<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="addUser">
  <title>Add Admin — Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <div id="sidebar-placeholder"></div>

    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Header -->
      <div id="header-placeholder"></div>

      <!-- Main Content -->
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        <div class="max-w-6xl mx-auto">
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
            <form id="addUserForm">
              <div class="mb-1.5">
                <label for="name" class="block text-xs font-medium text-slate-300">Name</label>
                <input type="text" id="name" name="name" class="mt-1 block w-full rounded-md bg-slate-800 border-transparent focus:border-indigo-500 focus:ring-indigo-500  text-xs" required>
              </div>
              <div class="mb-1.5">
                <label for="email" class="block text-xs font-medium text-slate-300">Email</label>
                <input type="email" id="email" name="email" class="mt-1 block w-full rounded-md bg-slate-800 border-transparent focus:border-indigo-500 focus:ring-indigo-500  text-xs" required>
              </div>
              <div class="mb-1.5">
                <label for="password" class="block text-xs font-medium text-slate-300">Password</label>
                <input type="password" id="password" name="password" class="mt-1 block w-full rounded-md bg-slate-800 border-transparent focus:border-indigo-500 focus:ring-indigo-500  text-xs" required>
              </div>
              <div class="mb-2">
                <label for="company" class="block text-xs font-medium text-slate-300">Company</label>
                <select id="company" name="company_id" class="mt-1 block w-full rounded-md bg-slate-800 border-transparent focus:border-indigo-500 focus:ring-indigo-500  text-xs" required>
                  <option value="">Select a company</option>
                </select>
              </div>
              <button type="submit" class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-semibold rounded-md hover:bg-indigo-500 transition-colors">Add Admin</button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

<script src="../../js/load-components.js"></script>
  <script src="../../js/super_admin/people/add-user.js"></script>
</body>
</html>
