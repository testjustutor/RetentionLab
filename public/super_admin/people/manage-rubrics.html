<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="permissionRubrics">
  <title>Permission Rubrics — Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased font-sans p-2 sm:p-0">
    <div id="sidebar-placeholder"></div>
    <div class="mx-auto flex flex-col gap-2">
        <!-- Header -->
        <div id="header-placeholder"></div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 shrink-0 p-3">
            <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-400 rounded-lg p-2 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-violet-700 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Total Categories</p>
                    <p id="totalCategories" class="text-base font-bold font-sans text-violet-950">0</p>
                </div>
                <div class="p-1.5 bg-violet-100 text-violet-700 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                    </svg>
                </div>
            </div>
            <div class="bg-gradient-to-br from-cyan-50 to-blue-100 border-2 border-cyan-400 rounded-lg p-2 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-cyan-700 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Total Indicators</p>
                    <p id="totalIndicators" class="text-base font-bold font-sans text-cyan-950">0</p>
                </div>
                <div class="p-1.5 bg-cyan-100 text-cyan-700 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                    </svg>
                </div>
            </div>
            <div class="bg-gradient-to-br from-emerald-50 to-teal-100 border-2 border-emerald-400 rounded-lg p-2 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-emerald-700 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Active Items</p>
                    <p id="activeItems" class="text-base font-bold font-sans text-emerald-950">0</p>
                </div>
                <div class="p-1.5 bg-emerald-100 text-emerald-700 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
            </div>
            <div class="bg-gradient-to-br from-amber-50 to-orange-100 border-2 border-amber-400 rounded-lg p-2 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-amber-700 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Inactive Items</p>
                    <p id="inactiveItems" class="text-base font-bold font-sans text-amber-950">0</p>
                </div>
                <div class="p-1.5 bg-amber-100 text-amber-700 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
                    </svg>
                </div>
            </div>
        </div>

        <div class="p-3 grid grid-cols-1 xl:grid-cols-2 gap-3">
            <!-- Categories Card -->
            <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-400 rounded-lg shadow-md overflow-hidden">
                <div class="px-3 py-2 border-b border-violet-300 bg-violet-100 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-violet-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                        </svg>
                        <h2 class="text-sm font-bold text-violet-950 uppercase tracking-wide">Categories</h2>
                    </div>
                    <button onclick="openCategoryModal()" class="px-3 py-1.5 bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold rounded transition">
                        Add Category
                    </button>
                </div>
                <div class="p-3">
                    <div id="categoriesTableContainer"></div>
                </div>
            </div>

            <!-- Indicators Card -->
            <div class="bg-gradient-to-br from-cyan-50 to-blue-100 border-2 border-cyan-400 rounded-lg shadow-md overflow-hidden">
                <div class="px-3 py-2 border-b border-cyan-300 bg-cyan-100 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-cyan-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                        </svg>
                        <h2 class="text-sm font-bold text-cyan-950 uppercase tracking-wide">Indicators</h2>
                    </div>
                    <button onclick="openIndicatorModal()" class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold rounded transition">
                        Add Indicator
                    </button>
                </div>
                <div class="p-3">
                    <div id="indicatorsTableContainer"></div>
                </div>
            </div>
        </div>
    </div>


    <!-- Category Modal -->
    <div id="categoryModal" class="hidden fixed inset-0 bg-black/60 z-[99999] flex items-center justify-center p-4">
        <div class="bg-white border border-slate-300 rounded-lg shadow-xl max-w-md w-full">
            <div class="p-3 border-b border-slate-300 bg-slate-100 flex items-center justify-between">
                <h3 id="categoryModalTitle" class="text-sm font-semibold text-slate-900 flex items-center gap-2">
                    <svg class="w-4 h-4 text-violet-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                    </svg>
                    Add Category
                </h3>
                <button onclick="closeCategoryModal()" class="text-slate-500 hover:text-slate-700 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="categoryForm" class="p-3 space-y-2">
                <input type="hidden" id="categoryId" value="">
                <div>
                    <label class="block text-[10px] font-medium text-slate-500 mb-0.5">Category ID</label>
                    <input type="text" id="category_id" class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder="CAT_xxx">
                </div>
                <div>
                    <label class="block text-[10px] font-medium text-slate-500 mb-0.5">Name *</label>
                    <input type="text" id="categoryName" required class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder="Category name">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-medium text-slate-500 mb-0.5">Weight</label>
                        <input type="number" id="categoryWeight" step="0.1" min="0" class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder="0">
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-slate-500 mb-0.5">Status</label>
                        <select id="categoryStatus" class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-violet-500">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-2 pt-1.5">
                    <button type="submit" class="flex-1 px-3 py-1.5 bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold rounded transition">Save</button>
                    <button type="button" onclick="closeCategoryModal()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded transition">Cancel</button>
                </div>
            </form>
        </div>
    </div>


    <!-- Indicator Modal -->
    <div id="indicatorModal" class="hidden fixed inset-0 bg-black/60 z-[99999] flex items-center justify-center p-4">
        <div class="bg-white border border-slate-300 rounded-lg shadow-xl max-w-md w-full">
            <div class="p-3 border-b border-slate-300 bg-slate-100 flex items-center justify-between">
                <h3 id="indicatorModalTitle" class="text-sm font-semibold text-slate-900 flex items-center gap-2">
                    <svg class="w-4 h-4 text-cyan-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                    </svg>
                    Add Indicator
                </h3>
                <button onclick="closeIndicatorModal()" class="text-slate-500 hover:text-slate-700 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="indicatorForm" class="p-3 space-y-2">
                <input type="hidden" id="indicatorId" value="">
                <div>
                    <label class="block text-[10px] font-medium text-slate-500 mb-0.5">Indicator ID</label>
                    <input type="text" id="indicator_id" class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="IND_xxx">
                </div>
                <div>
                    <label class="block text-[10px] font-medium text-slate-500 mb-0.5">Name *</label>
                    <input type="text" id="indicatorName" required class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="Indicator name">
                </div>
                <div>
                    <label class="block text-[10px] font-medium text-slate-500 mb-0.5">Category *</label>
                    <select id="indicatorCategory" required class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                        <option value="">Select category...</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-medium text-slate-500 mb-0.5">Type</label>
                        <select id="indicatorType" class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                            <option value="HUMAN">HUMAN</option>
                            <option value="AI">AI</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-slate-500 mb-0.5">Value</label>
                        <input type="number" id="indicatorValue" step="0.1" min="0" class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="1">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-medium text-slate-500 mb-0.5">Status</label>
                        <select id="indicatorStatus" class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="flex items-end pb-1">
                        <label class="flex items-center gap-1.5 cursor-pointer">
                            <input type="checkbox" id="indicatorGate" class="w-3 h-3 rounded border-slate-300 bg-white text-cyan-600 focus:ring-cyan-500">
                            <span class="text-[10px] text-slate-600">Is Gate</span>
                        </label>
                    </div>
                </div>
                <div class="flex gap-2 pt-1.5">
                    <button type="submit" class="flex-1 px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold rounded transition">Save</button>
                    <button type="button" onclick="closeIndicatorModal()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded transition">Cancel</button>
                </div>
            </form>
        </div>
    </div>


    <!-- Load common-ui-super-admin.js FIRST (defines createTable, escHtml, apiFetch, etc.) -->
    <script src="/js/common-ui-super-admin.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script src="/js/load-components.js"></script>
    <script src="/js/super_admin/people/manage-rubrics.js"></script>
</body>
</html>
