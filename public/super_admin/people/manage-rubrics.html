<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="permissionRubrics">
  <title>Permission Rubrics — Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css" />
</head>
<body class="antialiased font-sans p-2 sm:p-0">
    <div id="sidebar-placeholder"></div>
    <div class="mx-auto flex flex-col gap-2">
        <!-- Header -->
        <div id="header-placeholder"></div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 shrink-0 p-3">
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg p-2 border border-violet-500/30 shadow-md shadow-violet-500/5 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Total Categories</p>
                    <p id="totalCategories" class="text-base font-bold font-sans text-violet-400">0</p>
                </div>
                <div class="p-1.5 bg-violet-500/10 text-violet-400 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                    </svg>
                </div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg p-2 border border-cyan-500/30 shadow-md shadow-cyan-500/5 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Total Indicators</p>
                    <p id="totalIndicators" class="text-base font-bold font-sans text-cyan-400">0</p>
                </div>
                <div class="p-1.5 bg-cyan-500/10 text-cyan-400 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                    </svg>
                </div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg p-2 border border-emerald-500/30 shadow-md shadow-emerald-500/5 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Active Items</p>
                    <p id="activeItems" class="text-base font-bold font-sans text-emerald-400">0</p>
                </div>
                <div class="p-1.5 bg-emerald-500/10 text-emerald-400 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg p-2 border border-amber-500/30 shadow-md shadow-amber-500/5 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Inactive Items</p>
                    <p id="inactiveItems" class="text-base font-bold font-sans text-amber-400">0</p>
                </div>
                <div class="p-1.5 bg-amber-500/10 text-amber-400 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Categories CRUD Section -->
        <div class="p-3">
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg border border-slate-800/80 shadow-md overflow-hidden">
                <div class="px-3 py-2 border-b border-slate-800 bg-slate-950/50 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                        </svg>
                        <h2 class="text-sm font-semibold text-white">Rubric Categories</h2>
                    </div>
                    <button onclick="openCategoryModal()" class="px-2 py-1 bg-violet-600 hover:bg-violet-500 text-white text-[10px] font-semibold rounded transition">
                        + Add Category
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-[10px]">
                        <thead>
                            <tr class="border-b border-slate-800 bg-slate-800/30">
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Category ID</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Name</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Weight</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Status</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800" id="categoriesTableBody">
                            <tr>
                                <td colspan="5" class="py-4 text-center text-slate-500">Loading categories...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Indicators CRUD Section -->
        <div class="p-3">
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg border border-slate-800/80 shadow-md overflow-hidden">
                <div class="px-3 py-2 border-b border-slate-800 bg-slate-950/50 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                        </svg>
                        <h2 class="text-sm font-semibold text-white">Rubric Indicators</h2>
                    </div>
                    <button onclick="openIndicatorModal()" class="px-2 py-1 bg-cyan-600 hover:bg-cyan-500 text-white text-[10px] font-semibold rounded transition">
                        + Add Indicator
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-[10px]">
                        <thead>
                            <tr class="border-b border-slate-800 bg-slate-800/30">
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Indicator ID</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Name</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Category</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Type</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Value</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Status</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800" id="indicatorsTableBody">
                            <tr>
                                <td colspan="7" class="py-4 text-center text-slate-500">Loading indicators...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    <!-- Category Modal -->
    <div id="categoryModal" class="hidden fixed inset-0 bg-black/80 z-[99999] flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-lg shadow-xl max-w-md w-full">
            <div class="p-3 border-b border-slate-800 flex items-center justify-between">
                <h3 class="text-sm font-semibold text-slate-100" id="categoryModalTitle">Add Category</h3>
                <button onclick="closeCategoryModal()" class="text-slate-400 hover:text-slate-200 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <form id="categoryForm" class="p-3 space-y-3">
                <input type="hidden" id="categoryId" value="">
                <div>
                    <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Category ID *</label>
                    <input type="text" id="category_id" required class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder="e.g., CAT001">
                </div>
                <div>
                    <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Name *</label>
                    <input type="text" id="categoryName" required class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder="Category name">
                </div>
                <div>
                    <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Weight (%)</label>
                    <input type="number" id="categoryWeight" step="0.01" min="0" max="100" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder="0">
                </div>
                <div>
                    <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Status</label>
                    <select id="categoryStatus" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 px-3 py-1.5 bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold rounded transition">
                        Save
                    </button>
                    <button type="button" onclick="closeCategoryModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Indicator Modal -->
    <div id="indicatorModal" class="hidden fixed inset-0 bg-black/80 z-[99999] flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-lg shadow-xl max-w-md w-full">
            <div class="p-3 border-b border-slate-800 flex items-center justify-between">
                <h3 class="text-sm font-semibold text-slate-100" id="indicatorModalTitle">Add Indicator</h3>
                <button onclick="closeIndicatorModal()" class="text-slate-400 hover:text-slate-200 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <form id="indicatorForm" class="p-3 space-y-3">
                <input type="hidden" id="indicatorId" value="">
                <div>
                    <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Indicator ID *</label>
                    <input type="text" id="indicator_id" required class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="e.g., IND001">
                </div>
                <div>
                    <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Name *</label>
                    <input type="text" id="indicatorName" required class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="Indicator name">
                </div>
                <div>
                    <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Category *</label>
                    <select id="indicatorCategory" required class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                        <option value="">Select category...</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Type</label>
                        <select id="indicatorType" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                            <option value="HUMAN">HUMAN</option>
                            <option value="AI">AI</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Value</label>
                        <input type="number" id="indicatorValue" step="0.1" min="0" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="1">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Status</label>
                        <select id="indicatorStatus" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="flex items-center">
                        <label class="flex items-center gap-1.5 cursor-pointer">
                            <input type="checkbox" id="indicatorGate" class="w-3 h-3 rounded border-slate-700 bg-slate-800 text-cyan-500 focus:ring-cyan-500">
                            <span class="text-[10px] text-slate-300">Is Gate</span>
                        </label>
                    </div>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold rounded transition">
                        Save
                    </button>
                    <button type="button" onclick="closeIndicatorModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/js/auth.js"></script>
    <script src="/js/load-components.js"></script>
    <script src="/js/super_admin/people/manage-rubrics.js"></script>
</body>
</html>
