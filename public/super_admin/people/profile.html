<!DOCTYPE html>
<html lang="en" class="dark">
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="profile">
  <title>My Profile — Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css">
</head>
<body class="antialiased font-sans p-2 sm:p-0 bg-slate-100 text-slate-900">
    <div id="sidebar-placeholder"></div>
    <div class="mx-auto flex flex-col gap-2">
        <div id="header-placeholder"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-2 p-3">
            <div class="bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-400 rounded-lg p-3 shadow-md flex flex-col items-center text-center">
                <div id="bigAvatar" class="w-14 h-14 rounded-xl bg-blue-100 border-2 border-blue-400 flex items-center justify-center text-blue-800 font-bold text-lg mb-1.5 select-none">RL</div>
                <h2 id="cardName" class="font-bold text-blue-950 uppercase tracking-wide text-lg mb-0.5">Admin</h2>
                <p id="cardEmail" class="text-blue-800 text-[11px] mb-1.5">admin@local</p>
                <div class="px-2 py-0.5 rounded-full bg-blue-200 border border-blue-300 text-blue-900 text-[10px] font-semibold uppercase tracking-wider">Super Admin</div>
            </div>

            <div class="bg-gradient-to-br from-emerald-50 to-teal-100 border-2 border-emerald-400 rounded-lg p-3 shadow-md">
                <h3 class="text-xs font-bold text-emerald-950 uppercase tracking-wide mb-2 flex items-center gap-2"><span class="text-emerald-700 text-sm">&#128100;</span> Personal Details</h3>
                <form id="profileForm" class="space-y-2">
                    <div><label class="block text-[10px] font-medium text-emerald-900 mb-0.5">Full Name</label><input type="text" id="inputName" required class="w-full bg-white border border-emerald-300 rounded px-2 py-1 text-xs text-emerald-950 focus:outline-none focus:ring-2 focus:ring-emerald-500"></div>
                    <div><label class="block text-[10px] font-medium text-emerald-900 mb-0.5">Email Address</label><input type="email" id="inputEmail" required class="w-full bg-white border border-emerald-300 rounded px-2 py-1 text-xs text-emerald-950 focus:outline-none focus:ring-2 focus:ring-emerald-500"></div>
                    <div class="flex justify-end pt-1"><button type="submit" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded transition">Save Changes</button></div>
                </form>
            </div>
                            <div class="bg-gradient-to-br from-amber-50 to-orange-100 border-2 border-amber-400 rounded-lg p-3 shadow-md">
                                <h3 class="text-xs font-bold text-amber-950 uppercase tracking-wide mb-2 flex items-center gap-2"><span class="text-amber-700 text-sm">&#128274;</span> Change Password</h3>
                                <form id="passwordForm" class="space-y-2">
                                    <div><label class="block text-[10px] font-medium text-amber-900 mb-0.5">Current Password</label><input type="password" id="currentPassword" required class="w-full bg-white border border-amber-300 rounded px-2 py-1 text-xs text-amber-950 focus:outline-none focus:ring-2 focus:ring-amber-500"></div>
                                    <div><label class="block text-[10px] font-medium text-amber-900 mb-0.5">New Password</label><input type="password" id="newPassword" required minlength="6" class="w-full bg-white border border-amber-300 rounded px-2 py-1 text-xs text-amber-950 focus:outline-none focus:ring-2 focus:ring-amber-500"></div>
                                    <div><label class="block text-[10px] font-medium text-amber-900 mb-0.5">Confirm New Password</label><input type="password" id="confirmPassword" required minlength="6" class="w-full bg-white border border-amber-300 rounded px-2 py-1 text-xs text-amber-950 focus:outline-none focus:ring-2 focus:ring-amber-500"></div>
                                    <div class="flex justify-end pt-1"><button type="submit" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold rounded transition">Update Password</button></div>
                                </form>
                            </div>
                        </div>

                        <div class="p-3">
                            <div class="bg-gradient-to-br from-indigo-50 to-blue-100 border-2 border-indigo-400 rounded-lg overflow-hidden shadow-md">
                                <div class="px-3 py-2 border-b-2 border-indigo-300 bg-indigo-100">
                                    <h3 class="text-xs font-bold text-indigo-950 uppercase tracking-wide flex items-center gap-2"><span class="text-indigo-700 text-sm">&#128196;</span> Recent Activity</h3>
                                </div>
                                <div class="overflow-x-auto overflow-y-auto max-h-64 custom-scrollbar">
                                    <table class="w-full text-left text-[10px]">
                                        <thead class="sticky top-0"><tr class="border-b-2 border-indigo-300 bg-indigo-200"><th class="py-1.5 px-2 text-[10px] text-indigo-950 uppercase font-bold">Event</th><th class="py-1.5 px-2 text-[10px] text-indigo-950 uppercase font-bold">IP Address</th><th class="py-1.5 px-2 text-[10px] text-indigo-950 uppercase font-bold">Timestamp</th></tr></thead>
                                        <tbody class="divide-y divide-indigo-200" id="activityLogBody">
                                            <tr><td colspan="3" class="py-3 px-2 text-center text-indigo-800 text-[10px]">Loading activity...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <script type="module" src="/js/auth.js"></script>
                    <script src="/js/load-components.js"></script>
                    <script src="/js/common-ui-super-admin.js"></script>
                    <script src="/js/super_admin/profile.js"></script>
                </body>
</html>
