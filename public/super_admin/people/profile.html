<!-- root/public/super_admin/profile.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="super_admin">
  <title>Super Admin — My Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css">
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="mx-auto p-0">    
    <div id="header-placeholder"></div>
<section class="grid grid-cols-1 lg:grid-cols-3 gap-3 p-4">
      
      <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col items-center text-center justify-center">
        <div id="bigAvatar" class="w-16 h-16 rounded-xl bg-violet-500/10 border-2 border-violet-500/30 flex items-center justify-center text-violet-400 font-bold text-xl shadow-[0_0_20px_rgba(139,92,246,0.1)] mb-1.5 select-none">
          RL
        </div>
        <h2 id="cardName" class="text-base font-bold  mb-0.5">Admin</h2>
        <p id="cardEmail" class="text-slate-400 text-[12px] mb-1.5">admin@local</p>
        <div class="px-2.5 py-0.5 rounded-full bg-violet-500/10 border border-violet-500/20 text-violet-300 text-[12px] font-semibold uppercase tracking-wider">
          System Administrator
        </div>
      </div>

      <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-lg p-3">
        <h2 class="text-sm font-semibold  mb-2 flex items-center gap-1.5">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 m1 1L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            Personal Details
        </h2>
        
        <form id="profileForm" onsubmit="saveProfile(event)" class="space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-slate-400 text-[12px] font-medium mb-1">Full Name</label>
              <input type="text" id="inputName" required class="w-full bg-slate-950 border border-slate-800 focus:border-violet-500 rounded-md px-2.5 py-1.5 text-xs text-slate-100 outline-none transition-colors">
            </div>
            <div>
              <label class="block text-slate-400 text-[12px] font-medium mb-1">Email Address</label>
              <input type="email" id="inputEmail" required class="w-full bg-slate-950 border border-slate-800 focus:border-violet-500 rounded-md px-2.5 py-1.5 text-xs text-slate-100 outline-none transition-colors">
            </div>
          </div>

          <div class="flex justify-end pt-1.5">
            <button type="submit" class="bg-violet-600 hover:bg-violet-500  font-medium rounded-md px-3 py-1.5 text-xs transition-colors">
              Save Changes
            </button>
          </div>
        </form>
      </div>

      <div class="lg:col-span-3 bg-slate-900 border border-slate-800 rounded-lg p-3">
        <h2 class="text-sm font-semibold  mb-2">Recent Activity Logs</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse">
            <thead>
              <tr class="border-b border-slate-800 text-slate-400">
                <th class="py-1.5 font-medium text-[12px]">Event</th>
                <th class="py-1.5 font-medium text-[12px]">IP Address</th>
                <th class="py-1.5 font-medium text-[12px]">Timestamp</th>
              </tr>
            </thead>
            <tbody class="text-slate-300 divide-y divide-slate-800/50">
              <tr>
                <td class="py-1.5 font-mono text-violet-400 text-[12px]">auth.login_success</td>
                <td class="py-1.5 text-[12px]">127.0.0.1</td>
                <td class="py-1.5 text-slate-500 text-[12px]">Just Now</td>
              </tr>
              <tr>
                <td class="py-1.5 font-mono text-violet-400 text-[12px]">dashboard.resource_export</td>
                <td class="py-1.5 text-[12px]">192.168.1.45</td>
                <td class="py-1.5 text-slate-500 text-[12px]">2 hours ago</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </section>
  </div>

  <script src="/js/super_admin/profile.js"></script>
  <script src="/js/load-components.js"></script>
</body>
</html>
