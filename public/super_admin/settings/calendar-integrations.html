<!DOCTYPE html>
<html lang="en" class="dark">
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="calendar-integrations">
  <title>Calendar Integrations — RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css">
</head>
<body class="antialiased font-sans p-2 sm:p-0 bg-slate-100 text-slate-900">
    <div id="sidebar-placeholder"></div>
    <div class="mx-auto flex flex-col gap-2">
        <!-- Header -->
        <div id="header-placeholder"></div>

        <!-- Page Header -->
        <div class="px-4 py-2 bg-gradient-to-r from-blue-50 to-sky-100 border-b-2 border-blue-300">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-sm font-bold text-blue-950">Calendar Integrations</h1>

                </div>
            </div>
        </div>

        <!-- Providers Grid -->
        <div class="p-3">
            <div id="providersGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-3">

        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 border border-slate-700 rounded-lg p-3 shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50">

        </div>
