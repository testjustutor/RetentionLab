<!-- root/public/super_admin/settings.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="super_admin">
  <title>Super Admin — Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css">
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="mx-auto p-0">    
    <div id="header-placeholder"></div>
<section class="grid grid-cols-1 md:grid-cols-2 gap-3 p-4">
      
      <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
 <h2 class="text-sm font-semibold mb-2">Preferences</h2>
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <div class="text-xs font-medium text-slate-200">Email Notifications</div>
              <div class="text-[12px] text-slate-500">Receive pipeline status logs via email.</div>
            </div>
            <input type="checkbox" checked class="accent-violet-500 h-3.5 w-3.5 bg-slate-950 border-slate-800 rounded">
          </div>

          <div class="flex items-center justify-between border-t border-slate-800/60 pt-2.5">
            <div>
              <div class="text-xs font-medium text-slate-200">Maintenance Mode</div>
              <div class="text-[12px] text-slate-500">Redirect active users to fallback screens.</div>
            </div>
            <input type="checkbox" class="accent-violet-500 h-3.5 w-3.5 bg-slate-950 border-slate-800 rounded">
          </div>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
 <h2 class="text-sm font-semibold mb-2">API Configurations</h2>
        <div class="space-y-2.5">
          <div>
            <label class="block text-slate-400 text-[12px] font-medium mb-1">Session Timeout</label>
            <select class="w-full bg-slate-950 border border-slate-800 focus:border-violet-500 rounded-md px-2 py-1.5 text-xs text-slate-300 outline-none transition-colors">
              <option value="15">15 Minutes</option>
              <option value="60" selected>1 Hour</option>
              <option value="1440">24 Hours</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 text-[12px] font-medium mb-1">Max Upload Rate</label>
            <input type="text" value="100 req/min" class="w-full bg-slate-950 border border-slate-800 focus:border-violet-500 rounded-md px-2 py-1.5 text-xs text-slate-300 outline-none transition-colors">
          </div>
        </div>
      </div>

    </section>
  </div>

  <script type="module" src="/js/header.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/super_admin/settings/settings.js"></script>
</body>
</html>
