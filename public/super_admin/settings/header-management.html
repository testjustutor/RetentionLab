<!DOCTYPE html>
<html lang="en" class="dark">
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="headerManagement">
  <title>Header Management â€” Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css" />
</head>
<body class="antialiased font-sans p-2 sm:p-0">
    <div id="sidebar-placeholder"></div>
    <div class="mx-auto flex flex-col gap-2">
        <!-- Header -->
        <div id="header-placeholder"></div>

        <!-- Header Management Section -->
        <div class="p-3">
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg border border-slate-800/80 shadow-md overflow-hidden">
                <!-- Header with controls -->
                <div class="px-3 py-2 border-b border-slate-800 bg-slate-950/50">
                    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                            </svg>
                            <h2 class="text-sm font-semibold text-white">Header Page Config Management</h2>
                        </div>
                        <div class="flex flex-wrap gap-2 items-center">
                            <!-- Role Filter -->
                            <select id="roleFilter" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500 min-w-[180px]">
                                <option value="">Select a role...</option>
                            </select>
                            <button onclick="refreshData()" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded border border-slate-700 transition flex items-center gap-1">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                </svg>
                                Refresh
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Table -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-[10px]">
                        <thead>
                            <tr class="border-b border-slate-800 bg-slate-800/30">
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Page Key</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Title</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Description</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Status</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800" id="headerConfigTableBody">
                            <tr>
                                <td colspan="5" class="py-4 text-center text-slate-500">Select a role to view header configurations</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Header Config Modal -->
    <div id="editHeaderModal" class="hidden fixed inset-0 bg-black/80 z-[99999] flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-lg shadow-xl max-w-lg w-full max-h-[80vh] overflow-y-auto">
            <div class="p-3 border-b border-slate-800 flex items-center justify-between sticky top-0 bg-slate-900">
                <h3 class="text-sm font-semibold text-slate-100 flex items-center gap-2">
                    <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                    </svg>
                    <span id="editModalTitle">Edit Header Config</span>
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-200 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="p-3">
                <form id="editHeaderForm" class="space-y-3">
                    <input type="hidden" id="editRoleId" value="">
                    <input type="hidden" id="editPageKey" value="">
                    
                    <div>
                        <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Page Title</label>
                        <input type="text" id="editTitle" required class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Description</label>
                        <textarea id="editDescription" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Role Title</label>
                        <input type="text" id="editRoleTitle" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500">
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="editShowStats" class="rounded bg-slate-800 border-slate-700 text-violet-500 focus:ring-violet-500">
                        <label for="editShowStats" class="text-[10px] font-medium text-slate-300">Show Stats on Page</label>
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="flex-1 px-3 py-1.5 bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold rounded transition">
                            Save Changes
                        </button>
                        <button type="button" onclick="closeEditModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded transition">
                            Cancel
                        </button>
                    </div>
                    <div id="editResult" class="text-xs"></div>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="/js/auth.js"></script>
    <script src="/js/load-components.js"></script>
    <script src="/js/super_admin/settings/header-management.js"></script>
</body>
</html>
