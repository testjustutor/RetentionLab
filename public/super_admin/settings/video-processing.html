<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="videoProcessing">
  <title>Video Processing — Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css" />
</head>
<body class="antialiased font-sans p-2 sm:p-0 bg-slate-100 text-slate-900">
  <div id="sidebar-placeholder"></div>
  <div class="mx-auto flex flex-col gap-2">
    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 shrink-0 p-3">
      <div class="bg-gradient-to-br from-cyan-50 to-sky-100 rounded-lg p-2 border-2 border-cyan-400 shadow-md flex items-center justify-between">
        <div>
          <p class="text-slate-700 text-[10px] font-mono font-bold uppercase tracking-widest mb-0.5">Total Videos</p>
          <p id="statTotalVideos" class="text-base font-bold font-sans text-cyan-700">-</p>
        </div>
        <div class="p-1.5 bg-cyan-500/10 text-cyan-400 rounded hidden sm:block">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        </div>
      </div>
      <div class="bg-gradient-to-br from-emerald-50 to-teal-100 rounded-lg p-2 border-2 border-emerald-400 shadow-md flex items-center justify-between">
        <div>
          <p class="text-slate-700 text-[10px] font-mono font-bold uppercase tracking-widest mb-0.5">Converted</p>
          <p id="statConverted" class="text-base font-bold font-sans text-emerald-700">-</p>
        </div>
        <div class="p-1.5 bg-emerald-500/10 text-emerald-400 rounded hidden sm:block">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        </div>
      </div>
      <div class="bg-gradient-to-br from-amber-50 to-yellow-100 rounded-lg p-2 border-2 border-amber-400 shadow-md flex items-center justify-between">
        <div>
          <p class="text-slate-700 text-[10px] font-mono font-bold uppercase tracking-widest mb-0.5">Pending</p>
          <p id="statPending" class="text-base font-bold font-sans text-amber-700">-</p>
        </div>
        <div class="p-1.5 bg-amber-500/10 text-amber-400 rounded hidden sm:block">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
      </div>
      <div class="bg-gradient-to-br from-violet-50 to-purple-100 rounded-lg p-2 border-2 border-violet-400 shadow-md flex items-center justify-between">
        <div>
          <p class="text-slate-700 text-[10px] font-mono font-bold uppercase tracking-widest mb-0.5">Processed</p>
          <p id="statProcessed" class="text-base font-bold font-sans text-violet-700">-</p>
        </div>
        <div class="p-1.5 bg-violet-500/10 text-violet-400 rounded hidden sm:block">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
      </div>
    </div>


    <!-- Videos Table -->
    <div class="p-3">
      <div class="bg-gradient-to-b from-cyan-50 to-teal-100 rounded-lg border-2 border-cyan-400 shadow-md overflow-hidden">
        <!-- Card Header -->
        <div class="px-3 py-2 border-b-2 border-cyan-300 bg-cyan-100 flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-cyan-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <div>
              <h2 class="text-sm font-bold text-cyan-950 uppercase tracking-wide">Video Recordings</h2>
              <p class="text-[10px] text-cyan-800">Convert MP4 recordings to MP3 audio and process them</p>
            </div>
          </div>
          <button id="refreshBtn" class="px-2 py-1 bg-teal-600 hover:bg-teal-500 text-white text-xs rounded transition flex items-center gap-1 font-semibold">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8 8 0 0 0 4.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 0 1-15.357-2m15.357 2H15"/></svg>
            Refresh
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-[10px]">
            <thead>
              <tr class="border-b-2 border-cyan-200 bg-cyan-200">
                <th class="py-1.5 px-2 text-[10px] text-cyan-950 uppercase font-bold">File Name</th>
                <th class="py-1.5 px-2 text-[10px] text-cyan-950 uppercase font-bold">Size</th>
                <th class="py-1.5 px-2 text-[10px] text-cyan-950 uppercase font-bold">Duration</th>
                <th class="py-1.5 px-2 text-[10px] text-cyan-950 uppercase font-bold">Status</th>
                <th class="py-1.5 px-2 text-[10px] text-cyan-950 uppercase font-bold">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-cyan-200" id="videosTableBody">
              <tr><td colspan="5" class="py-3 px-2 text-center text-cyan-800 text-[10px]">Loading videos...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Convert to Audio Modal -->
    <div id="convertModal" class="hidden fixed inset-0 bg-black/50 z-[99999] flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
      <div class="bg-white rounded-lg shadow-xl max-w-md w-full border-2 border-cyan-400 overflow-hidden">
        <div class="px-3 py-2 border-b-2 border-cyan-300 bg-cyan-100 flex items-center justify-between">
          <h2 class="text-sm font-bold text-cyan-950 uppercase tracking-wide">Convert to Audio</h2>
          <button type="button" data-close class="text-cyan-700 hover:text-cyan-900 text-sm leading-none">✕</button>
        </div>
        <div class="p-4 space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Video File</label>
            <input type="text" id="convertVideoFile" readonly class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1.5 text-xs text-slate-900 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">MP3 Status</label>
            <span id="convertMp3Status" class="text-xs text-cyan-700"></span>
          </div>
          <button id="convertBtn" class="w-full px-3 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold rounded transition flex items-center justify-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m0-16l-4 4m4-4l4 4"/></svg>
            Convert to MP3
          </button>
        </div>
      </div>
    </div>

    <!-- Process Audio Modal -->
    <div id="processModal" class="hidden fixed inset-0 bg-black/50 z-[99999] flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
      <div class="bg-white rounded-lg shadow-xl max-w-md w-full border-2 border-emerald-400 overflow-hidden">
        <div class="px-3 py-2 border-b-2 border-emerald-300 bg-emerald-100 flex items-center justify-between">
          <h2 class="text-sm font-bold text-emerald-950 uppercase tracking-wide">Process Audio</h2>
          <button type="button" data-close class="text-emerald-700 hover:text-emerald-900 text-sm leading-none">✕</button>
        </div>
        <div class="p-4 space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Video File</label>
            <input type="text" id="processVideoFile" readonly class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1.5 text-xs text-slate-900 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">MP3 Status</label>
            <span id="processMp3Status" class="text-xs text-emerald-700"></span>
          </div>
          <button id="processBtn" class="w-full px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded transition flex items-center justify-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            Process Audio
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-3 right-3 bg-slate-800 border border-slate-700 rounded p-3 shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50">
    <div class="flex items-center gap-2">
      <div id="toastIcon"></div>
      <div><p id="toastMessage" class="text-xs font-medium"></p></div>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
  <script src="/js/load-components.js"></script>
  <script src="/js/common-ui-super-admin.js"></script>
  <script src="/js/super_admin/settings/video-processing.js"></script>
</body>
</html>
