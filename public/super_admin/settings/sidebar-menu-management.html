<!DOCTYPE html>
<html lang="en">
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="sidebarMenuManagement">
  <title>Sidebar Menu Management — Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css" />

</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased font-sans">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4">
        <div class="max-w-4xl mx-auto space-y-2">
          <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-400 rounded-lg p-3 shadow-md">
            <p class="text-xs text-violet-800 mb-2">Choose a role, then show or hide each sidebar item for that role. Menu items themselves (label, icon, link, order) come from the database seeder — this page only controls visibility per role.</p>

            <!-- Role Selector -->
            <div class="bg-violet-50 border-2 border-violet-300 rounded-lg p-3">
              <div class="flex items-end gap-3">
                <div class="flex-1">
                  <label class="block text-xs font-bold text-violet-900 uppercase tracking-wide mb-1">Select Role</label>
                  <select id="roleSelector" class="w-full rounded-md bg-white border border-violet-300 focus:border-violet-500 focus:ring-violet-500 p-1.5 text-xs text-slate-900">
                    <option value="">Loading roles...</option>
                  </select>
                </div>
                <button id="resetBtn" type="button" class="px-3 py-1.5 text-xs font-semibold text-rose-700 bg-white border border-rose-300 rounded-md hover:bg-rose-50 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
                  Reset to Defaults
                </button>
                <button id="saveBtn" type="button" class="px-3 py-1.5 text-xs font-semibold text-white bg-violet-600 rounded-md hover:bg-violet-500 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
                  Save Changes
                </button>
              </div>
            </div>

            <!-- Menu Items (single tree view, one action: the visibility toggle) -->
            <div class="bg-violet-50 border-2 border-violet-300 rounded-lg p-3">
              <div class="flex items-center justify-between mb-1.5">
                <h3 class="text-sm font-bold text-violet-950 uppercase tracking-wide">Menu Items</h3>
                <span id="dirtyIndicator" class="hidden text-[10px] font-semibold text-amber-700 bg-amber-100 border border-amber-300 rounded px-2 py-0.5">Unsaved changes</span>
              </div>
              <div id="treeContainer" class="text-violet-800 text-xs">Select a role to view its menu items.</div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
  <script src="/js/load-components.js"></script>
  <script src="/js/common-ui-super-admin.js"></script>
  <script src="/js/super_admin/settings/sidebar-menu-management.js"></script>
</body>
</html>
