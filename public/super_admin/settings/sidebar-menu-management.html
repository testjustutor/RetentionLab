<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="dashboard-role" content="super_admin">
  <title>Sidebar Menu Management — Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css" />

</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        <div class="max-w-6xl mx-auto">
          <p class="text-xs text-slate-400 mb-2">Create, edit, and delete sidebar menu items for all roles. Changes take effect immediately.</p>

          <!-- Role Selector -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-2">
            <div class="flex items-end gap-3">
              <div class="flex-1">
                <label class="block text-xs font-medium text-slate-300 mb-1">Select Role</label>
  <select id="roleSelector" class="w-full rounded-md bg-slate-800 border-transparent focus:border-indigo-500 focus:ring-indigo-500 p-1.5 text-xs">
                  <option value="">Loading roles...</option>
                </select>
              </div>
<button class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-semibold rounded-md hover:bg-indigo-500 transition-colors" onclick="showAddForm()">+ Add</button>
              <button class="px-3 py-1.5 bg-amber-600 text-white text-xs font-semibold rounded-md hover:bg-amber-500 transition-colors" onclick="reseedMenu()">Reset</button>
            </div>
          </div>

          <!-- Tree View -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-2">
 <h3 class="text-sm font-semibold mb-1.5">Menu Structure (Tree View)</h3>
            <div id="treeContainer" class="text-slate-400 text-xs">Select a role to view menu items.</div>
          </div>

          <!-- Flat Table View -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
 <h3 class="text-sm font-semibold mb-1.5">All Menu Items (Flat)</h3>
            <div id="flatTableContainer">
              <p class="text-slate-400 text-xs">Select a role to view menu items.</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal -->
  <div id="modalOverlay" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 w-full max-w-lg mx-4 shadow-2xl">
 <h3 id="modalTitle" class="text-base font-bold mb-1.5">Add Menu Item</h3>
      <form id="modalForm" class="space-y-4">
        <input type="hidden" id="modalEditId" value="" />
        
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Menu ID (unique slug)</label>
 <input type="text" id="modalMenuId" class="w-full rounded-md bg-slate-800 border-transparent focus:border-indigo-500 focus:ring-indigo-500 p-2" required />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Label (visible text)</label>
 <input type="text" id="modalLabel" class="w-full rounded-md bg-slate-800 border-transparent focus:border-indigo-500 focus:ring-indigo-500 p-2" required />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Parent Item (for submenus)</label>
 <select id="modalParentId" class="w-full rounded-md bg-slate-800 border-transparent focus:border-indigo-500 focus:ring-indigo-500 p-2">
            <option value="">None (top-level item)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Icon</label>
 <input type="text" id="modalIcon" placeholder="e.g. grid, user, settings" class="w-full rounded-md bg-slate-800 border-transparent focus:border-indigo-500 focus:ring-indigo-500 p-2" />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Link URL (href)</label>
 <input type="text" id="modalHref" placeholder="/super_admin/page.html" class="w-full rounded-md bg-slate-800 border-transparent focus:border-indigo-500 focus:ring-indigo-500 p-2" />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Display Order</label>
 <input type="number" id="modalDisplayOrder" min="0" value="0" class="w-full rounded-md bg-slate-800 border-transparent focus:border-indigo-500 focus:ring-indigo-500 p-2" />
        </div>

        <div>
          <label class="inline-flex items-center">
            <input type="checkbox" id="modalIsActive" class="form-checkbox h-5 w-5 text-indigo-600 rounded" checked />
            <span class="ml-2 text-sm text-slate-300">Active</span>
          </label>
        </div>

        <div class="flex gap-3 justify-end pt-2">
          <button type="button" class="px-4 py-2 bg-slate-700 text-slate-300 font-semibold rounded-md hover:bg-slate-600 transition-colors" onclick="closeModal()">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-md hover:bg-indigo-500 transition-colors">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/load-components.js"></script>
  <script src="/js/super_admin/sidebar-menu-management.js"></script>
</body>
</html>
