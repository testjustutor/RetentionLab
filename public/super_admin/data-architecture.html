<!-- root/public/super_admin/data-architecture.html -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Architecture Console</title>
    
    <!-- Using Tailwind CDN for robust and modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        slate: {
                            850: '#141E33',
                            900: '#0F172A',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(37, 99, 235, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(124, 58, 237, 0.08) 0%, transparent 50%);
            color: #f8fafc;
            min-height: 100vh;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(71, 85, 105, 0.8); }

        /* Dynamic Table Overrides for Tailwind */
        #data table { width: 100%; border-collapse: collapse; text-align: left; }
        #data th { background-color: rgba(0, 0, 0, 0.2); padding: 0.75rem 1.25rem; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; font-weight: 700; border-bottom: 1px solid rgba(51, 65, 85, 0.8); }
        #data th small { display: block; font-size: 0.6rem; font-family: 'JetBrains Mono', monospace; color: #64748b; margin-top: 0.15rem; font-weight: 400; }
        #data td { padding: 0.75rem 1.25rem; border-bottom: 1px solid rgba(255, 255, 255, 0.03); font-size: 0.8rem; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #data tr:hover td { background: rgba(255, 255, 255, 0.02); }
        #data button { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); padding: 0.25rem 0.5rem; border-radius: 0.25rem; transition: all 0.2s; cursor: pointer; }
        #data button:hover { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .empty { padding: 3rem; text-align: center; color: #94a3b8; font-size: 0.9rem; font-family: 'JetBrains Mono', monospace; font-style: italic; opacity: 0.7; }
        #data h3 { font-size: 1.1rem; font-weight: 600; padding: 1rem 1.25rem; border-bottom: 1px solid rgba(51, 65, 85, 0.8); display: flex; align-items: center; gap: 0.75rem; background: rgba(0, 0, 0, 0.2); margin: 0; }
    </style>
</head>
<body class="antialiased font-sans p-2 sm:p-4">
    <div class="mx-auto flex flex-col gap-4">
        
        <!-- Header -->    <div id="header-placeholder"></div>
<!-- Stats Grid -->
        <div id="stats" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <!-- Dynamic stats card rendered here by admin.js -->
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
            
            <!-- Left Column: Controls -->
            <div class="lg:col-span-4 flex flex-col gap-4">
                <div class="bg-slate-900/60 backdrop-blur-md rounded-xl border border-slate-800/80 shadow-md overflow-hidden shrink-0">
                    <div class="px-4 py-2 border-b border-slate-800/60 bg-slate-800/30">
                        <h2 class="text-slate-200 font-semibold flex items-center gap-2 text-[11px] uppercase tracking-wide">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                            Controls
                        </h2>
                    </div>
                    <div class="p-3 flex flex-col gap-2">
                        <select id="tableSelect" class="w-full bg-slate-950/50 border border-slate-700/80 text-white rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 shadow-inner">
                            <option value="">Select table</option>
                        </select>
                        <button onclick="refreshData()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg p-2 text-xs font-semibold transition-colors flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                            Refresh
                        </button>
                        <button onclick="exportCSV()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg p-2 text-xs font-semibold transition-colors flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            Export CSV
                        </button>
                        <button onclick="executeQuery()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg p-2 text-xs font-semibold transition-colors flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                            Run SQL
                        </button>
                        <button onclick="clearTable()" class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg p-2 text-xs font-semibold transition-colors flex items-center justify-center gap-2 mt-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                            Truncate Table
                        </button>
                        
                        <div id="lastUpdated" class="text-[10px] text-slate-500 mt-2 text-center font-mono"></div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Table Viewer -->
            <div class="lg:col-span-8">
                <div class="bg-slate-900/60 backdrop-blur-md rounded-xl border border-slate-800/80 shadow-md h-[550px] lg:h-[calc(100vh-180px)] flex flex-col relative overflow-hidden">
                    
                    <div id="error" class="hidden bg-rose-500/10 border border-rose-500/20 text-rose-400 p-3 m-3 rounded-lg text-[11px] font-mono"></div>

                    <div id="loading" class="hidden absolute inset-0 bg-slate-900/80 backdrop-blur-sm flex flex-col items-center justify-center z-20">
                        <div class="w-8 h-8 border-[3px] border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-3"></div>
                        <p class="text-indigo-400 font-medium font-mono text-xs tracking-wider uppercase">Loading Database...</p>
                    </div>

                    <div id="data" class="flex-1 overflow-auto custom-scrollbar relative z-10 w-full mb-0 text-white p-0">
                        <!-- Table rendered here -->
                        <div class="flex flex-col items-center justify-center h-full text-slate-500 gap-3 opacity-60 min-h-[200px]">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                            <p class="text-xs">Select a table to view rows</p>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
    
    <script src="../js/admin.js"></script>

    <script>
        /* ── Common header: profile dropdown ─────────────── */
        function toggleProfileMenu() {
            const menu    = document.getElementById('profileMenu');
            const chevron = document.getElementById('profileChevron');
            const isOpen  = !menu.classList.contains('hidden');
            menu.classList.toggle('hidden', isOpen);
            chevron.style.transform = isOpen ? '' : 'rotate(180deg)';
        }

        // Close on outside click
        document.addEventListener('click', function(e) {
            const wrap = document.getElementById('profileMenuWrap');
            if (wrap && !wrap.contains(e.target)) {
                document.getElementById('profileMenu').classList.add('hidden');
                document.getElementById('profileChevron').style.transform = '';
            }
        });

        // Populate from auth-guard session store
        function initProfileMenu() {
            try {
                const raw  = localStorage.getItem('rl_user') || sessionStorage.getItem('rl_user');
                const user = raw ? JSON.parse(raw) : null;
                if (user) {
                    const name     = user.name  || user.email?.split('@')[0] || 'Admin';
                    const email    = user.email || 'admin@local';
                    const initials = name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
                    document.getElementById('profileAvatar').textContent = initials;
                    document.getElementById('profileName').textContent   = name;
                    document.getElementById('profileEmail').textContent  = email;
                    document.getElementById('dropdownName').textContent  = name;
                    document.getElementById('dropdownEmail').textContent = email;
                }
            } catch(_) { /* fallback to HTML defaults */ }
        }

        async function handleLogout() {
            localStorage.removeItem('rl_user');
            localStorage.removeItem('rl_token');
            sessionStorage.clear();
            try {
                await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            } catch(_) {}
            window.location.href = '/login.html';
        }

window.addEventListener('load', () => { if (typeof initProfileMenu === 'function') initProfileMenu(); });
    </script>

    <script type="module" src="/js/auth.js"></script>
  <script src="../js/load-components.js"></script>
</body>
</html>
