<!-- root/public/super_admin/profile.html -->
<!doctype html>
<html lang="en" class="dark">
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="profile">
  <title>My Profile — Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css">
</head>
<body class="antialiased font-sans p-2 sm:p-0 bg-slate-100 text-slate-900">
    <div id="sidebar-placeholder"></div>
    <div class="mx-auto flex flex-col gap-2">
        <!-- Header -->
        <div id="header-placeholder"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-2 p-3">
            <!-- Profile Card -->
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg border border-slate-800/80 shadow-md p-3 flex flex-col items-center text-center">
                <div id="bigAvatar" class="w-14 h-14 rounded-xl bg-violet-500/10 border-2 border-violet-500/30 flex items-center justify-center text-violet-400 font-bold text-lg shadow-[0_0_20px_rgba(139,92,246,0.1)] mb-1.5 select-none">
                    RL
                </div>
                <h2 class="font-bold text-slate-950 uppercase tracking-wider text-lg">My Profile</h2>
                <p id="cardEmail" class="text-slate-400 text-[11px] mb-1.5">admin@local</p>
                <div class="px-2 py-0.5 rounded-full bg-violet-500/10 border border-violet-500/20 text-violet-300 text-[10px] font-semibold uppercase tracking-wider">
                    Super Admin
                </div>
            </div>

            <!-- Personal Details -->
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg border border-slate-800/80 shadow-md p-3">
                <h3 class="text-xs font-semibold text-slate-200 uppercase tracking-wide mb-2 flex items-center gap-2">
                    <svg class="w-3.5 h-3.5 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    Personal Details
                </h3>
                <form id="profileForm" class="space-y-2">
                    <div>
                        <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Full Name</label>
                        <input type="text" id="inputName" required
                            class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Email Address</label>
                        <input type="email" id="inputEmail" required
                            class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500">
                    </div>
                    <div class="flex justify-end pt-1">
                        <button type="submit" class="px-3 py-1.5 bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold rounded transition">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>

            <!-- Change Password -->
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg border border-slate-800/80 shadow-md p-3">
                <h3 class="text-xs font-semibold text-slate-200 uppercase tracking-wide mb-2 flex items-center gap-2">
                    <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    Change Password
                </h3>
                <form id="passwordForm" class="space-y-2">
                    <div>
                        <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Current Password</label>
                        <input type="password" id="currentPassword" required
                            class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-slate-300 mb-0.5">New Password</label>
                        <input type="password" id="newPassword" required minlength="6"
                            class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-slate-300 mb-0.5">Confirm New Password</label>
                        <input type="password" id="confirmPassword" required minlength="6"
                            class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div class="flex justify-end pt-1">
                        <button type="submit" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold rounded transition">
                            Update Password
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="p-3">
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg border border-slate-800/80 shadow-md overflow-hidden">
                <div class="px-3 py-2 border-b border-slate-800 bg-slate-950/50">
                    <h3 class="text-xs font-semibold text-slate-200 uppercase tracking-wide flex items-center gap-2">
                        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        Recent Activity
                    </h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-[10px]">
                        <thead>
                            <tr class="border-b border-slate-800 bg-slate-800/30">
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Event</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">IP Address</th>
                                <th class="py-1.5 px-2 text-[10px] text-slate-400 uppercase font-medium">Timestamp</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800" id="activityLogBody">
                            <tr>
                                <td colspan="3" class="py-3 px-2 text-center text-slate-500 text-[10px]">Loading activity...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/js/auth.js"></script>
    <script src="/js/load-components.js"></script>
    <script src="/js/super_admin/profile.js"></script>
</body>
</html>
