<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="addUser">
  <title>Add Admin — Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <div id="sidebar-placeholder"></div>

    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Header -->
      <div id="header-placeholder"></div>

      <!-- Main Content -->
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
        <div class="max-w-4xl mx-auto">
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
            <form id="addUserForm">
              <div class="mb-2">
                <label for="name" class="block text-sm font-medium text-slate-300">Name</label>
                <input type="text" id="name" name="name" class="mt-1 block w-full rounded-md bg-slate-800 border-transparent focus:border-indigo-500 focus:ring-indigo-500 text-white" required>
              </div>
              <div class="mb-2">
                <label for="email" class="block text-sm font-medium text-slate-300">Email</label>
                <input type="email" id="email" name="email" class="mt-1 block w-full rounded-md bg-slate-800 border-transparent focus:border-indigo-500 focus:ring-indigo-500 text-white" required>
              </div>
              <div class="mb-2">
                <label for="password" class="block text-sm font-medium text-slate-300">Password</label>
                <input type="password" id="password" name="password" class="mt-1 block w-full rounded-md bg-slate-800 border-transparent focus:border-indigo-500 focus:ring-indigo-500 text-white" required>
              </div>
              <div class="mb-2">
                <label for="company" class="block text-sm font-medium text-slate-300">Company</label>
                <select id="company" name="company_id" class="mt-1 block w-full rounded-md bg-slate-800 border-transparent focus:border-indigo-500 focus:ring-indigo-500 text-white" required>
                  <option value="">Select a company</option>
                </select>
              </div>
              <button type="submit" class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-md hover:bg-indigo-500 transition-colors">Add Admin</button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/load-components.js"></script>
  <script>
    let adminRoleId = null;

    async function loadAdminRole() {
      try {
        const response = await fetch('/api/roles/admin', { credentials: 'include' });
        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || 'Failed to fetch admin role');
        }
        const role = await response.json();
        adminRoleId = role.id;
      } catch (err) {
        console.error('Error loading admin role:', err);
        alert('Failed to load admin role: ' + err.message);
      }
    }

    async function loadCompanies() {
      try {
        const response = await fetch('/api/companies', { credentials: 'include' });
        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || 'Failed to fetch companies');
        }
        const result = await response.json();
        const companies = result.data || [];
        const companySelect = document.getElementById('company');
        companySelect.innerHTML = '<option value="">Select a company</option>';
        companies.forEach(company => {
          const option = document.createElement('option');
          option.value = company.id;
          option.textContent = company.company_name;
          companySelect.appendChild(option);
        });
      } catch (err) {
        console.error('Error loading companies:', err);
        alert('Failed to load companies: ' + err.message);
      }
    }

    document.getElementById('addUserForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!adminRoleId) {
        alert('Admin role is not available. Refresh and try again.');
        return;
      }
      const formData = new FormData(event.target);
      const userData = Object.fromEntries(formData.entries());

      try {
        const response = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            email: userData.email,
            first_name: userData.name,
            password_hash: userData.password,
            role_id: adminRoleId,
            company_id: parseInt(userData.company_id, 10)
          })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || 'Failed to create admin user');
        }

        const created = await response.json();
        alert(`Admin user "${created.email}" created successfully!`);
        document.getElementById('addUserForm').reset();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });

    window.addEventListener('load', () => {
      loadAdminRole();
      loadCompanies();
    });
  </script>
</body>
</html>
