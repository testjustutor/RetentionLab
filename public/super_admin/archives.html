<!-- root/public/super_admin/archives.html -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completed Meetings & Transcripts</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        slate: {
                            850: '#141E33',
                            900: '#0F172A',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="../css/archives.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="../js/archives.js"></script>
</head>
<body class="antialiased font-sans p-2 sm:p-0">
    <div class="mx-auto flex flex-col gap-4">
        
        <!-- Header -->    <div id="header-placeholder"></div>
<!-- Main Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 h-[600px] lg:h-[calc(100vh-120px)]  pl-4 pr-4">
            
            <!-- Left Sidebar: Meetings List -->
            <div class="lg:col-span-4 bg-slate-900/60 backdrop-blur-md rounded-xl border border-slate-800/80 shadow-md flex flex-col h-full overflow-hidden">
                <div class="px-4 py-3 border-b border-slate-800/60 bg-slate-800/30 flex justify-between items-center shrink-0">
                    <h2 class="text-slate-200 font-semibold flex items-center gap-2 text-[11px] uppercase tracking-wide">

                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
                        Completed Sessions
                    </h2>
                    <span id="meetingCount" class="bg-slate-800 text-[10px] font-bold text-slate-300 px-1.5 py-0.5 rounded border border-slate-700">0</span>
                </div>
                
                <div class="px-4 py-3 border-b border-slate-800/60 bg-slate-800/20">
                    <div class="flex flex-col gap-2">
                        <div class="flex gap-2">
                            <input id="fromDate" type="date" class="w-1/2 bg-slate-950/50 border border-slate-700/80 text-white rounded px-2.5 py-1 text-xs focus:outline-none focus:border-emerald-500 transition-colors" />
                            <input id="toDate" type="date" class="w-1/2 bg-slate-950/50 border border-slate-700/80 text-white rounded px-2.5 py-1 text-xs focus:outline-none focus:border-emerald-500 transition-colors" />
                        </div>

                        <div class="flex gap-2">
                            <input id="meetingSearch" type="text" placeholder="Search meetings..." class="w-full bg-slate-950/50 border border-slate-700/80 text-white rounded px-2.5 py-1 text-xs focus:outline-none focus:border-emerald-500 transition-colors" />
                        </div>
                    </div>
                </div>

                <div id="loadingMeetings" class="flex-1 flex flex-col items-center justify-center gap-3">
                    <div class="w-6 h-6 border-2 border-emerald-500/30 border-t-emerald-500 rounded-full animate-spin"></div>
                    <span class="text-xs text-slate-400 font-mono">Loading records...</span>
                </div>

                <div id="meetingsList" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-2 hidden">
                    <!-- Meeting cards populate here -->
                </div>

            </div>

            <!-- Right Area: Details & Transcript -->
            <div id="mainViewArea" class="lg:col-span-8 bg-slate-900/60 backdrop-blur-md rounded-xl border border-slate-800/80 shadow-md flex flex-col h-full overflow-hidden">
                
                <!-- Empty State -->
                <div id="emptyState" class="flex-1 flex flex-col items-center justify-center gap-3 opacity-60">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    <p class="text-sm font-medium text-slate-400">Select a meeting to view its transcript</p>
                </div>

                <!-- Active View -->
                <div id="activeView" class="hidden flex-col h-full">
                    
                    <!-- Meeting Header Info -->
                    <div class="p-4 sm:p-4 border-b border-slate-800/60 bg-slate-800/20 shrink-0">
                        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                            <div>
                                <div class="flex items-center gap-2 mb-1.5">
                                    <span id="mtgPlatform" class="px-2 py-0.5 rounded text-[9px] uppercase font-bold tracking-wider border border-slate-500/30 bg-slate-500/10 text-slate-400">Platform</span>
                                    <span id="mtgDate" class="text-xs text-slate-400 font-mono font-medium">--</span>
                                </div>
                                <h2 id="mtgTitle" class="text-xl font-bold text-white tracking-tight">Meeting Title</h2>
                                <p id="mtgId" class="text-xs text-slate-500 font-mono mt-1">ID: ---</p>
                            </div>
                            
                            <div class="flex flex-col items-end justify-between bg-slate-950/40 p-3 rounded-lg border border-slate-800 min-w-[250px]">
                                <div class="flex mb-2 items-center gap-2 w-full">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
                                    <span class="text-xs text-slate-300 font-medium">Recording</span>
                                </div>
                                <div class="w-full">
                                    <audio id="audioPlayer" controls class="w-full">
                                        Your browser does not support the audio element.
                                    </audio>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Transcript Area -->
                    <div class="flex-1 overflow-hidden flex flex-col relative">
                        <div class="absolute top-0 right-0 w-64 h-64 bg-emerald-500/5 blur-[80px] pointer-events-none rounded-full"></div>
                        
                        <div class="px-6 py-3 border-b border-slate-800/30 flex justify-between items-center shrink-0 bg-slate-900/50">
                            <h3 class="text-xs font-semibold text-slate-300">Transcript</h3>
                            <div class="flex gap-2">
                                <input type="text" id="searchTranscript" placeholder="Search..." class="bg-slate-950/50 border border-slate-700/80 text-white rounded px-2.5 py-1 text-xs focus:outline-none focus:border-emerald-500 transition-colors w-40">
                            </div>
                        </div>

                        <!-- Transcript List -->
                        <div id="transcriptList" class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-6">
                            <!-- Populated dynamically -->
                            <div class="flex justify-center py-10 opacity-50">
                                <span class="text-xs font-mono text-slate-400">Select a meeting...</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
<script type="module" src="/js/auth.js"></script>
  <script src="../js/load-components.js"></script>
</body>
</html>
