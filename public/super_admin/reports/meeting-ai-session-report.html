<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="reportsMeetingAiSession">
  <title>Meeting AI Session Report | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">

        <!-- Session Context -->
        <div id="sessionMeta" class="bg-gradient-to-br from-indigo-50 to-blue-100 border-2 border-indigo-300 rounded-lg p-3 mb-4 shadow-md">
          <div class="flex items-center gap-2 text-indigo-800 text-xs">Loading session details...</div>
        </div>

        <!-- Summary Stats -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-4" id="sessionStats">
          <div class="bg-gradient-to-br from-indigo-50 to-blue-100 border-2 border-indigo-300 rounded-lg px-3 py-2 shadow-sm">
            <p class="text-[10px] font-bold text-indigo-900 uppercase tracking-wide">Indicators</p>
            <p class="text-xl font-bold text-indigo-950" id="statIndicators">-</p>
          </div>
          <div class="bg-gradient-to-br from-emerald-50 to-teal-100 border-2 border-emerald-300 rounded-lg px-3 py-2 shadow-sm">
            <p class="text-[10px] font-bold text-emerald-900 uppercase tracking-wide">Avg Score</p>
            <p class="text-xl font-bold text-emerald-950" id="statAvgScore">-</p>
          </div>
          <div class="bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-300 rounded-lg px-3 py-2 shadow-sm">
            <p class="text-[10px] font-bold text-blue-900 uppercase tracking-wide">OQI Score</p>
            <p class="text-xl font-bold text-blue-950" id="statOqi">-</p>
          </div>
          <div class="bg-gradient-to-br from-rose-50 to-pink-100 border-2 border-rose-300 rounded-lg px-3 py-2 shadow-sm">
            <p class="text-[10px] font-bold text-rose-900 uppercase tracking-wide">Gate Fails</p>
            <p class="text-xl font-bold text-rose-950" id="statGateFailed">-</p>
          </div>
          <div class="bg-gradient-to-br from-amber-50 to-orange-100 border-2 border-amber-300 rounded-lg px-3 py-2 shadow-sm">
            <p class="text-[10px] font-bold text-amber-900 uppercase tracking-wide">With Evidence</p>
            <p class="text-xl font-bold text-amber-950" id="statEvidence">-</p>
          </div>
        </div>
<!-- AI Audit Data Table -->
        <div class="bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-300 rounded-lg p-3 shadow-md">
          <h3 class="text-[13px] font-bold text-blue-900 mb-2 uppercase tracking-wide">AI Audit Results</h3>
          <div class="overflow-x-auto overflow-y-auto max-h-[32rem] custom-scrollbar">
            <table class="w-full text-left text-[11px]">
              <thead class="sticky top-0">
                <tr class="border-b-2 border-blue-300 bg-blue-200">
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase">Category</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase">Indicator</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase text-right">Weight</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase text-right">Score</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase text-right">Max</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase text-right">%</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase">AI Evidence</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase">Evidence Quote</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase">Scored At</th>
                </tr>
              </thead>
              <tbody id="auditBody" class="divide-y divide-blue-200">
                <tr><td colspan="9" class="py-6 px-2 text-blue-800 text-center">Loading AI audit results...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- common-ui-super-admin.js FIRST (defines apiFetch, showToast, escHtml) -->
  <script src="/js/common-ui-super-admin.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script src="/js/load-components.js"></script>
  <script src="/js/super_admin/reports/meeting-ai-session-report.js"></script>
</body>
</html>
