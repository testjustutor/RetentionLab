<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="reportsMeetingAiEvaluation">
  <title>Meeting AI Evaluation | RetentionLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">

        <!-- Filters -->
        <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-200 rounded-lg shadow-md p-3 mb-4">
          <div class="flex flex-wrap items-end gap-3">
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">From Date</label>
              <input type="date" id="filterFromDate" class="w-full md:w-auto bg-white border border-violet-300 rounded-md px-2.5 py-1.5 text-xs focus:outline-none focus:border-violet-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">To Date</label>
              <input type="date" id="filterToDate" class="w-full md:w-auto bg-white border border-violet-300 rounded-md px-2.5 py-1.5 text-xs focus:outline-none focus:border-violet-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-violet-900 uppercase tracking-wide mb-1">Instructor</label>
              <div id="instructorFilterContainer" class="min-w-52"></div>
            </div>
            <div class="flex items-end gap-2">
              <button id="getDataBtn" class="px-4 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold transition-colors shadow-sm">Get Data</button>
              <button onclick="exportCsv()" class="px-3 py-1.5 rounded-md bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition-colors">Export CSV</button>
            </div>
          </div>
        </div>
<!-- Summary Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
          <div class="bg-gradient-to-br from-violet-50 to-purple-100 border-2 border-violet-300 rounded-lg px-3 py-2 shadow-sm flex items-center justify-between">
            <p class="text-[10px] font-bold text-violet-900 uppercase tracking-wide">Total Meetings</p>
            <p class="text-base font-bold text-violet-950" id="statTotalMeetings">-</p>
          </div>
          <div class="bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-300 rounded-lg px-3 py-2 shadow-sm flex items-center justify-between">
            <p class="text-[10px] font-bold text-blue-900 uppercase tracking-wide">Total Sessions</p>
            <p class="text-base font-bold text-blue-950" id="statTotalSessions">-</p>
          </div>
          <div class="bg-gradient-to-br from-emerald-50 to-teal-100 border-2 border-emerald-300 rounded-lg px-3 py-2 shadow-sm flex items-center justify-between">
            <p class="text-[10px] font-bold text-emerald-900 uppercase tracking-wide">AI Reports</p>
            <p class="text-base font-bold text-emerald-950" id="statWithReport">-</p>
          </div>
          <div class="bg-gradient-to-br from-amber-50 to-orange-100 border-2 border-amber-300 rounded-lg px-3 py-2 shadow-sm flex items-center justify-between">
            <p class="text-[10px] font-bold text-amber-900 uppercase tracking-wide">No AI Report</p>
            <p class="text-base font-bold text-amber-950" id="statWithoutReport">-</p>
          </div>
        </div>

        <!-- Sessions / AI Report Table -->
        <div class="bg-gradient-to-br from-blue-50 to-cyan-100 border-2 border-blue-300 rounded-lg p-3 shadow-md">
          <h3 class="text-[13px] font-bold text-blue-900 mb-2 uppercase tracking-wide">Meeting Sessions &amp; AI Reports</h3>
          <div class="overflow-x-auto overflow-y-auto max-h-[28rem] custom-scrollbar">
            <table class="w-full text-left text-[11px]">
              <thead class="sticky top-0">
                <tr class="border-b-2 border-blue-300 bg-blue-200">
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase">Meeting</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase">Instructor</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase">Session</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase text-right">Status</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase text-right">AI Score</th>
                  <th class="py-2 px-2 text-[10px] font-bold text-blue-950 uppercase">AI Report</th>
                </tr>
              </thead>
              <tbody id="sessionsBody" class="divide-y divide-blue-200">
                <tr><td colspan="6" class="py-6 px-2 text-blue-800 text-center">Loading meeting sessions...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- common-ui-super-admin.js FIRST (defines apiFetch, showToast, createDateFilter, createSearchableSelect, escHtml) -->
  <script src="/js/common-ui-super-admin.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script src="/js/load-components.js"></script>
  <script src="/js/super_admin/reports/meeting-ai-evaluation-report.js"></script>
</body>
</html>
