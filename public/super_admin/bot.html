<!-- root/public/super_admin/bot.html -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Engine Terminal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        slate: { 850: '#141E33', 900: '#0F172A', 950: '#020617' }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="../css/bot.css">
    <script src="../js/bot.js"></script>
</head>
<body class="antialiased font-sans p-2 sm:p-0">
    <div class="mx-auto flex flex-col gap-3">
        <!-- Header -->    <div id="header-placeholder"></div>
<!-- KPI Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 shrink-0 p-4">
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg p-2.5 border border-indigo-500/30 shadow-md shadow-indigo-500/5 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Status</p>
                    <p class="text-white text-lg font-bold font-sans flex items-center gap-1.5">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                        </span>
                        <span id="statusText"></span>
                    </p>
                </div>
                <div class="p-2 bg-indigo-500/10 text-indigo-400 rounded-lg hidden sm:block">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
                </div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg p-2.5 border border-slate-800/80 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Active Bots</p>
                    <p id="kpiActiveBots" class="text-white text-lg font-bold font-sans">3 / 50</p>
                </div>
                <div class="p-2 bg-blue-500/10 text-blue-400 rounded-lg hidden sm:block">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/></svg>
                </div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg p-2.5 border border-slate-800/80 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">GPU Compute</p>
                    <p id="kpiGpuCompute" class="text-white text-lg font-bold font-sans text-emerald-400">14%</p>
                </div>
                <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-lg hidden sm:block">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                </div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg p-2.5 border border-slate-800/80 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Task Queue</p>
                    <p id="kpiTaskQueue" class="text-white text-lg font-bold font-sans">0</p>
                </div>
                <div class="p-2 bg-amber-500/10 text-amber-400 rounded-lg hidden sm:block">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                </div>
            </div>
        </div>

        <!-- Terminal & Active Bots -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-3 h-[400px] lg:h-[calc(100vh-180px)] p-4">
            <!-- Left: Live Terminal -->
            <div class="lg:col-span-8 bg-black/80 backdrop-blur-md rounded-lg border border-slate-800/80 shadow-md flex flex-col h-full overflow-hidden relative group">
                <div class="absolute inset-0 bg-gradient-to-b from-blue-500/5 to-transparent pointer-events-none opacity-50"></div>
                <div class="p-2 border-b border-slate-800/80 flex items-center justify-between bg-slate-900/50 z-10 shrink-0">
                    <div class="flex items-center gap-2">
                        <div class="flex gap-1.5 ml-1 mr-2">
                            <div class="w-2 h-2 rounded-full bg-rose-500/50"></div>
                            <div class="w-2 h-2 rounded-full bg-amber-500/50"></div>
                            <div class="w-2 h-2 rounded-full bg-emerald-500/50"></div>
                        </div>
                        <span class="text-[10px] font-mono text-slate-400 font-medium tracking-wide">engine_tty1</span>
                    </div>
                    <div class="flex gap-1.5">
                        <button class="px-2 py-1 text-[10px] uppercase tracking-wider font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 rounded flex items-center gap-1 hover:bg-emerald-500/20 transition">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg> Run
                        </button>
                        <button class="px-2 py-1 text-[10px] uppercase tracking-wider font-bold text-rose-400 bg-rose-500/10 border border-rose-500/30 rounded flex items-center gap-1 hover:bg-rose-500/20 transition">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg> Halt
                        </button>
                    </div>
                </div>
                <div id="terminal" class="p-3 font-mono text-[10px] leading-relaxed overflow-y-auto terminal-scroll flex-1 z-10 relative">
                    <!-- Logs injection -->
                </div>
            </div>

            <!-- Right: Active Bots List -->
            <div class="lg:col-span-4 bg-slate-900/60 backdrop-blur-md rounded-lg border border-slate-800/80 shadow-md flex flex-col h-full overflow-hidden">
                <div class="p-2 border-b border-slate-800/60 bg-slate-800/30 shrink-0">
                    <h2 class="text-slate-200 font-semibold flex items-center gap-2 text-[10px] uppercase tracking-wide">
                        <svg class="w-3 h-3 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        Workers Fleet
                    </h2>
                </div>
                <div id="workersList" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1.5 relative">
                    <!-- Dynamic workers rendered here -->
                </div>
            </div>
        </div>
    </div>
<script type="module" src="/js/auth.js"></script>
  <script src="../js/load-components.js"></script>
</body>
</html>
