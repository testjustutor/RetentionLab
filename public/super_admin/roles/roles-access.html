<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="rolesAccess">
  <title>Roles & Access — Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css" />
</head>
<body class="antialiased font-sans p-2 sm:p-0">
    <div id="sidebar-placeholder"></div>
    <div class="mx-auto flex flex-col gap-2">
        <!-- Header -->
        <div id="header-placeholder"></div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 shrink-0 p-3">
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg p-2 border border-violet-500/30 shadow-md shadow-violet-500/5 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Total Roles</p>
                    <p id="totalRoles" class="text-base font-bold font-sans text-violet-400">0</p>
                </div>
                <div class="p-1.5 bg-violet-500/10 text-violet-400 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
                    </svg>
                </div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg p-2 border border-emerald-500/30 shadow-md shadow-emerald-500/5 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Total Users</p>
                    <p id="totalUsers" class="text-base font-bold font-sans text-emerald-400">0</p>
                </div>
                <div class="p-1.5 bg-emerald-500/10 text-emerald-400 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg p-2 border border-cyan-500/30 shadow-md shadow-cyan-500/5 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Companies</p>
                    <p id="totalCompanies" class="text-base font-bold font-sans text-cyan-400">0</p>
                </div>
                <div class="p-1.5 bg-cyan-500/10 text-cyan-400 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                    </svg>
                </div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg p-2 border border-amber-500/30 shadow-md shadow-amber-500/5 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-0.5">Avg Users/Role</p>
                    <p id="avgUsersPerRole" class="text-base font-bold font-sans text-amber-400">0</p>
                </div>
                <div class="p-1.5 bg-amber-500/10 text-amber-400 rounded hidden sm:block">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Roles Section -->
        <div class="p-3">
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg border border-slate-800/80 shadow-md overflow-hidden">
                <!-- Header -->
                <div class="px-3 py-2 border-b border-slate-800 bg-slate-950/50 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
                        </svg>
                        <h2 class="text-sm font-semibold text-white">Roles & Access Management</h2>
                    </div>
                    <button onclick="openAddRoleModal()" class="px-3 py-1.5 bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold rounded transition flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                        Add Role
                    </button>
                </div>

                <!-- Roles Table -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="border-b border-slate-800 bg-slate-800/30">
                                <th class="py-2 px-3 text-xs text-slate-400 uppercase font-medium">Role</th>
                                <th class="py-2 px-3 text-xs text-slate-400 uppercase font-medium">Description</th>
                                <th class="py-2 px-3 text-xs text-slate-400 uppercase font-medium">Users</th>
                                <th class="py-2 px-3 text-xs text-slate-400 uppercase font-medium">Distribution</th>
                                <th class="py-2 px-3 text-xs text-slate-400 uppercase font-medium">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800" id="rolesTableBody">
                            <tr>
                                <td colspan="5" class="py-4 text-center text-slate-500">Loading roles...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Users by Role Section -->
        <div class="p-3">
            <div class="bg-slate-900/60 backdrop-blur-md rounded-lg border border-slate-800/80 shadow-md overflow-hidden">
                <div class="px-3 py-2 border-b border-slate-800 bg-slate-950/50 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <h2 class="text-sm font-semibold text-white">Users by Role</h2>
                    </div>
                    <div class="flex gap-2">
                        <select id="roleUserFilter" onchange="renderUsersByRole()" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                            <option value="">All Roles</option>
                        </select>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="border-b border-slate-800 bg-slate-800/30">
                                <th class="py-2 px-3 text-xs text-slate-400 uppercase font-medium">User</th>
                                <th class="py-2 px-3 text-xs text-slate-400 uppercase font-medium">Email</th>
                                <th class="py-2 px-3 text-xs text-slate-400 uppercase font-medium">Role</th>
                                <th class="py-2 px-3 text-xs text-slate-400 uppercase font-medium">Company</th>
                                <th class="py-2 px-3 text-xs text-slate-400 uppercase font-medium">Status</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800" id="usersByRoleBody">
                            <tr>
                                <td colspan="5" class="py-4 text-center text-slate-500">Select a role to view users</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Role Modal -->
    <div id="addRoleModal" class="hidden fixed inset-0 bg-black/80 z-[99999] flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-lg shadow-xl max-w-md w-full">
            <div class="p-3 border-b border-slate-800 flex items-center justify-between">
                <h3 class="text-sm font-semibold text-slate-100 flex items-center gap-2">
                    <svg class="w-4 h-4 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    Add New Role
                </h3>
                <button onclick="closeAddRoleModal()" class="text-slate-400 hover:text-slate-200 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <form id="addRoleForm" class="p-3 space-y-2">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Role Name *</label>
                    <input type="text" id="roleName" required
                        class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500"
                        placeholder="e.g., manager">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Description</label>
                    <textarea id="roleDescription" rows="2"
                        class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500"
                        placeholder="Brief description of this role..."></textarea>
                </div>
                <div class="flex gap-2 pt-1.5">
                    <button type="submit" class="flex-1 px-3 py-1.5 bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold rounded transition">
                        Create Role
                    </button>
                    <button type="button" onclick="closeAddRoleModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/js/auth.js"></script>
    <script src="/js/load-components.js"></script>
    <script src="/js/super_admin/roles/roles-access.js"></script>
</body>
</html>
