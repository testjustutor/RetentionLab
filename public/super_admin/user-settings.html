<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="userSettings">
  <title>User Settings — Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <div id="sidebar-placeholder"></div>

    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Header -->
      <div id="header-placeholder"></div>

      <!-- Main Content -->
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
        <div class="max-w-4xl mx-auto">
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
            <p class="text-xs text-slate-300 mb-2">Configure global user-related settings.</p>
            <!-- User settings form will be loaded dynamically -->
            <form id="userSettingsForm">
              <div class="mb-1.5">
                <label for="defaultRole" class="block text-xs font-medium text-slate-300">Default New User Role</label>
                <select id="defaultRole" name="defaultRole" class="mt-1 block w-full rounded-md bg-slate-800 border-transparent focus:border-indigo-500 focus:ring-indigo-500 text-white text-xs">
                  <!-- Roles will be loaded dynamically from DB -->
                  <option value="">Select a default role</option>
                </select>
              </div>
              <div class="mb-2">
                <label for="allowRegistration" class="inline-flex items-center">
                  <input type="checkbox" id="allowRegistration" name="allowRegistration" class="form-checkbox h-4 w-4 text-indigo-600 rounded">
                  <span class="ml-2 text-xs text-slate-300">Allow New User Registration</span>
                </label>
              </div>
              <button type="submit" class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-semibold rounded-md hover:bg-indigo-500 transition-colors">Save Settings</button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/load-components.js"></script>
  <script>
    // Load roles and settings dynamically from backend API
    async function loadUserSettings() {
      const defaultRoleSelect = document.getElementById('defaultRole');
      try {
        // Load roles
        const rolesResponse = await fetch('/api/roles');
        if (!rolesResponse.ok) throw new Error('Failed to fetch roles');
        const rolesResult = await rolesResponse.json();
        const roles = rolesResult.data || [];

        defaultRoleSelect.innerHTML = '<option value="">Select a default role</option>';
        roles.forEach(role => {
          const option = document.createElement('option');
          option.value = role.id;
          option.textContent = role.role_name;
          defaultRoleSelect.appendChild(option);
        });

        // Load current settings
        const defaultRoleSetting = await fetch('/api/settings/global/user_default_role').then(r => r.ok ? r.json() : null);
        const allowRegSetting = await fetch('/api/settings/global/user_allow_registration').then(r => r.ok ? r.json() : null);

        if (defaultRoleSetting && defaultRoleSetting.setting_value) {
          defaultRoleSelect.value = defaultRoleSetting.setting_value;
        }
        document.getElementById('allowRegistration').checked = (allowRegSetting && allowRegSetting.setting_value === 'true');
      } catch (err) {
        console.error('Error loading user settings:', err);
      }
    }

    // Handle form submission
    document.getElementById('userSettingsForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const formData = new FormData(event.target);
      const settingsData = {
        default_role: formData.get('defaultRole') || '',
        allow_registration: formData.get('allowRegistration') === 'on' ? 'true' : 'false'
      };

      try {
        // Save default role setting
        await fetch('/api/settings/global', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: 'user_default_role', value: settingsData.default_role, type: 'string' })
        });

        // Save allow registration setting
        await fetch('/api/settings/global', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: 'user_allow_registration', value: settingsData.allow_registration, type: 'string' })
        });

        alert('User settings saved successfully!');
      } catch (err) {
        alert('Error saving settings: ' + err.message);
      }
    });

    loadUserSettings(); // Load settings when the page loads
  </script>
</body>
</html>
