<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="dashboard-role" content="super_admin">
  <meta name="header-page" content="rolesAccess">
  <title>Roles & Access — Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <div id="sidebar-placeholder"></div>

    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Header -->
      <div id="header-placeholder"></div>

      <!-- Main Content -->
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
        <div class="max-w-4xl mx-auto">
          <h2 class="text-lg font-bold text-white mb-2">Roles & Access</h2>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-3">
            <p class="text-slate-300 text-xs mb-2">Define and manage user roles and access permissions.</p>
            <!-- Roles and permissions management will be loaded dynamically -->
            <div id="rolesAccessContainer">
              <p class="text-slate-400 text-xs">Loading roles and permissions...</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/load-components.js"></script>
  <script>
    // Load roles dynamically from backend API
    async function loadRolesAndPermissions() {
      const rolesAccessContainer = document.getElementById('rolesAccessContainer');
      try {
        const response = await fetch('/api/roles');
        if (!response.ok) throw new Error('Failed to fetch roles');
        const result = await response.json();
        const roles = result.data || [];

        if (roles.length === 0) {
          rolesAccessContainer.innerHTML = '<p class="text-slate-400">No roles found.</p>';
          return;
        }

        let contentHtml = `
          <div class="mb-3">
            <h3 class="text-sm font-semibold text-white mb-2">Roles & Descriptions</h3>
            <table class="min-w-full divide-y divide-slate-700">
              <thead>
                <tr>
                  <th class="px-3 py-2 text-left text-[10px] font-medium text-slate-400 uppercase tracking-wider">ID</th>
                  <th class="px-3 py-2 text-left text-[10px] font-medium text-slate-400 uppercase tracking-wider">Role Name</th>
                  <th class="px-3 py-2 text-left text-[10px] font-medium text-slate-400 uppercase tracking-wider">Description</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800">
        `;
        roles.forEach(role => {
          contentHtml += `
            <tr>
              <td class="px-3 py-2 whitespace-nowrap text-xs text-slate-300">${role.id}</td>
              <td class="px-3 py-2 whitespace-nowrap text-xs font-medium text-white">${role.role_name}</td>
              <td class="px-3 py-2 whitespace-nowrap text-xs text-slate-300">${role.description || 'No description'}</td>
            </tr>
          `;
        });
        contentHtml += `
              </tbody>
            </table>
          </div>
          <button class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-semibold rounded-md hover:bg-indigo-500 transition-colors" onclick="addRole()">Add Role</button>
        `;
        rolesAccessContainer.innerHTML = contentHtml;
      } catch (err) {
        console.error('Error loading roles:', err);
        rolesAccessContainer.innerHTML = '<p class="text-red-400">Failed to load roles. ' + err.message + '</p>';
      }
    }

    async function addRole() {
      const roleName = prompt('Enter new role name:');
      if (roleName !== null && roleName.trim() !== '') {
        try {
          const response = await fetch('/api/roles', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role_name: roleName.trim() })
          });
          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error || 'Failed to create role');
          }
          alert('Role "' + roleName.trim() + '" created successfully!');
          loadRolesAndPermissions();
        } catch (err) {
          alert('Error: ' + err.message);
        }
      }
    }

    loadRolesAndPermissions(); // Load roles when the page loads
  </script>
</body>
</html>
