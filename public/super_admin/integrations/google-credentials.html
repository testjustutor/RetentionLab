<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="super_admin">
  <title>Google OAuth Credentials | Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/shared.css">
  <script src="/js/common-ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
        
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
          <div>
            <h1 class="text-xl font-bold text-slate-900">Google OAuth Credentials</h1>
            <p class="text-xs text-slate-500 mt-0.5">Manage Google Calendar API credentials for instructor calendar integration</p>
          </div>
          <button onclick="openAddModal()" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-500 text-white text-sm font-medium transition-colors shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></svg>
            Add Credentials
          </button>
        </div>

        <div id="credentialsList" class="space-y-3">
          <div class="flex items-center justify-center py-20">
            <div class="w-8 h-8 border-3 border-violet-500 border-t-transparent rounded-full animate-spin"></div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div id="credentialModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between p-4 border-b border-slate-200">
        <h2 class="text-lg font-semibold text-slate-900" id="modalTitle">Add Credentials</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="credentialForm" class="p-4 space-y-4">
        <input type="hidden" id="editId" value="">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Client ID *</label>
            <input id="client_id" required class="w-full border border-slate-300 rounded-md px-3 py-2 text-xs focus:outline-none focus:border-violet-500" placeholder="365220553177-xxx.apps.googleusercontent.com">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Client Secret *</label>
            <input id="client_secret" required class="w-full border border-slate-300 rounded-md px-3 py-2 text-xs focus:outline-none focus:border-violet-500" placeholder="GOCSPX-xxx">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Project ID</label>
            <input id="project_id" class="w-full border border-slate-300 rounded-md px-3 py-2 text-xs focus:outline-none focus:border-violet-500" placeholder="quickstart-xxx">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Auth URI</label>
            <input id="auth_uri" class="w-full border border-slate-300 rounded-md px-3 py-2 text-xs focus:outline-none focus:border-violet-500" value="https://accounts.google.com/o/oauth2/auth">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Token URI</label>
            <input id="token_uri" class="w-full border border-slate-300 rounded-md px-3 py-2 text-xs focus:outline-none focus:border-violet-500" value="https://oauth2.googleapis.com/token">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Auth Provider Cert URL</label>
            <input id="auth_provider_x509_cert_url" class="w-full border border-slate-300 rounded-md px-3 py-2 text-xs focus:outline-none focus:border-violet-500" value="https://www.googleapis.com/oauth2/v1/certs">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Redirect URIs (one per line)</label>
          <textarea id="redirect_uris" rows="3" class="w-full border border-slate-300 rounded-md px-3 py-2 text-xs focus:outline-none focus:border-violet-500" placeholder="http://localhost:3000/api/calendar/callback">http://localhost:3000/api/calendar/callback
http://localhost:3000/api/instructor-calendar/callback</textarea>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">JavaScript Origins (one per line)</label>
          <textarea id="javascript_origins" rows="2" class="w-full border border-slate-300 rounded-md px-3 py-2 text-xs focus:outline-none focus:border-violet-500" placeholder="http://localhost:3000">http://localhost:3000</textarea>
        </div>

        <div class="flex items-center gap-2">
          <input type="checkbox" id="is_active" checked class="accent-violet-600 h-4 w-4">
          <label for="is_active" class="text-xs text-slate-700">Set as active credentials</label>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-200">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors">Cancel</button>
          <button type="submit" class="px-4 py-2 text-xs font-medium text-white bg-violet-600 hover:bg-violet-500 rounded-md transition-colors">Save Credentials</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
  <script src="../../js/load-components.js"></script>
  <script src="../../js/super_admin/integrations/google-credentials.js"></script>
</body>
</html>
