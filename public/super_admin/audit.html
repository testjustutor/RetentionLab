<!-- root/public/super_admin/audit.html -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="dashboard-role" content="super_admin">
    <title>System Audit Logs</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        slate: { 850: '#141E33', 900: '#0F172A', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/audit.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="../js/audit.js"></script>
</head>
<body class="antialiased font-sans p-2 sm:p-0">
    <div class="mx-auto flex flex-col gap-3">
        <!-- Header -->    <div id="header-placeholder"></div>
<!-- Main View -->
        <div class="bg-slate-900/60 backdrop-blur-md rounded-lg border border-slate-800/80 shadow-md h-[450px] lg:h-[calc(100vh-100px)] flex flex-col overflow-hidden  p-4">
            
            <!-- Toolbar -->
            <div class="px-3 py-2 border-b border-slate-800/60 bg-slate-800/20 flex flex-col sm:flex-row gap-2 justify-between items-center shrink-0 ">
                <div class="flex flex-wrap items-center gap-1.5 w-full sm:w-auto">
                    <input id="auditSearchInput" type="text" placeholder="Search..." class="bg-slate-950/50 border border-slate-700/80 text-white rounded-md px-2 py-1 text-[10px] focus:outline-none focus:border-amber-500/50 transition-colors w-full sm:w-48">
                    <input id="auditFromDate" type="date" class="bg-slate-950/50 border border-slate-700/80 text-slate-300 rounded-md px-2 py-1 text-[10px] focus:outline-none focus:border-amber-500/50 transition-colors w-full sm:w-32" title="From">
                    <input id="auditToDate" type="date" class="bg-slate-950/50 border border-slate-700/80 text-slate-300 rounded-md px-2 py-1 text-[10px] focus:outline-none focus:border-amber-500/50 transition-colors w-full sm:w-32" title="To">
                    <select id="auditLevelSelect" class="bg-slate-950/50 border border-slate-700/80 text-slate-300 rounded-md px-2 flex-1 py-1 text-[10px] focus:outline-none focus:border-amber-500/50">
                        <option value="ALL">All</option>
                        <option value="INFO">INFO</option>
                        <option value="WARN">WARN</option>
                        <option value="ERROR">ERROR</option>
                        <option value="CRITICAL">CRITICAL</option>
                    </select>
                </div>
                <div class="flex items-center gap-2 text-slate-400">
                    <span id="auditCountSummary" class="text-[10px] font-mono tracking-wider uppercase">Loading...</span>
                </div>
            </div>

            <!-- Table -->
            <div class="flex-1 overflow-auto custom-scrollbar relative">
                <table class="w-full text-left border-collapse min-w-[800px]">
                    <thead class="sticky top-0 bg-slate-850/95 backdrop-blur-sm z-10">
                        <tr class="text-[10px] font-mono uppercase tracking-wider text-slate-500 border-b border-slate-800">
                            <th class="px-3 py-2 font-medium w-32">Timestamp</th>
                            <th class="px-3 py-2 font-medium w-20">Level</th>
                            <th class="px-3 py-2 font-medium w-28">Module</th>
                            <th class="px-3 py-2 font-medium">Event</th>
                            <th class="px-3 py-2 font-medium w-24">User</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/50 text-[#cbd5e1] font-mono text-[10px]" id="logTableBody">
                        <!-- Populated randomly for layout visualization -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination block -->
            <div class="px-3 py-1.5 border-t border-slate-800/60 bg-slate-800/30 flex flex-col sm:flex-row justify-between items-center gap-1.5 shrink-0">
                <span id="auditBottomSummary" class="text-[10px] text-slate-500 font-mono">Showing all logs</span>
                <div class="flex items-center gap-1.5">
                    <button id="auditPrevBtn" class="px-2 py-1 bg-slate-800 text-slate-400 rounded hover:bg-slate-700 transition text-[10px]">Prev</button>
                    <button id="auditNextBtn" class="px-2 py-1 bg-slate-800 text-slate-400 rounded hover:bg-slate-700 transition text-[10px]">Next</button>
                </div>
            </div>
        </div>
    </div>
<script type="module" src="/js/auth.js"></script>
  <script src="../js/load-components.js"></script>
</body>
</html>
