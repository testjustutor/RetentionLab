<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dashboard-role" content="super_admin">
  <title>Company Management | Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-screen">
    <div id="sidebar-placeholder"></div>
    <div class="flex-1 flex flex-col overflow-hidden">
      <div id="header-placeholder"></div>
      <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-950">
        <div class="flex items-center justify-between mb-4">
          <div><h1 class="text-xl font-bold text-white">Company Management</h1><p class="text-xs text-slate-400 mt-0.5">Create, manage, and monitor organizations</p></div>
          <button onclick="showAddCompany()" class="px-3 py-1.5 rounded-md bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold">+ Add</button>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4">
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <p class="text-[10px] text-slate-400">Total</p>
            <p class="text-lg font-bold text-white" id="totalCompanies">-</p>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <p class="text-[10px] text-slate-400">Active</p>
            <p class="text-lg font-bold text-emerald-400" id="activeCompanies">-</p>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <p class="text-[10px] text-slate-400">Suspended</p>
            <p class="text-lg font-bold text-red-400" id="suspendedCompanies">-</p>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5">
            <p class="text-[10px] text-slate-400">Users</p>
            <p class="text-lg font-bold text-blue-400" id="totalUsers">-</p>
          </div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-1 mb-4 bg-slate-900 p-1 rounded-md w-fit">
          <button onclick="switchTab('list')" class="tab-btn px-3 py-1.5 text-xs rounded-md bg-violet-600 text-white" data-tab="list">Companies</button>
          <button onclick="switchTab('admins')" class="tab-btn px-3 py-1.5 text-xs rounded-md text-slate-400 hover:text-white" data-tab="admins">Admins</button>
          <button onclick="switchTab('usage')" class="tab-btn px-3 py-1.5 text-xs rounded-md text-slate-400 hover:text-white" data-tab="usage">Usage</button>
        </div>

        <!-- Companies Table -->
        <div id="tab-list" class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead><tr class="border-b border-slate-800 bg-slate-800/30">
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Name</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Code</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Domain</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Status</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Users</th>
                <th class="py-2 px-3 text-[10px] text-slate-400 uppercase">Actions</th>
              </tr></thead>
              <tbody class="divide-y divide-slate-800" id="companiesTableBody">
                <tr><td colspan="6" class="py-6 text-center text-slate-500">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Admins Tab -->
        <div id="tab-admins" class="hidden bg-slate-900 border border-slate-800 rounded-lg p-3">
          <p class="text-slate-400 text-xs">Assign and manage company administrators.</p>
          <div id="adminsContent" class="mt-3"></div>
        </div>

        <!-- Usage Tab -->
        <div id="tab-usage" class="hidden bg-slate-900 border border-slate-800 rounded-lg p-3">
          <p class="text-slate-400 text-xs">Monitor company usage and set limits.</p>
          <div id="usageContent" class="mt-3"></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/auth.js"></script>
  <script src="../js/load-components.js"></script>
  <script>
    let companies = [];
    let allUsers = [];

    async function init() {
      await loadCompanies();
      await loadUsers();
      renderStats();
      renderTable();
      activeTabFromUrl();
    }

    async function loadCompanies() {
      try {
        const data = await apiFetch('/api/companies');
        companies = data.data || data.companies || [];
      } catch(e) { console.error(e); }
    }

    async function loadUsers() {
      try {
        const data = await apiFetch('/api/users');
        allUsers = data.users || data.data || [];
      } catch(e) { console.error(e); }
    }

    function renderStats() {
      document.getElementById('totalCompanies').textContent = companies.length;
      document.getElementById('activeCompanies').textContent = companies.filter(c => c.status === 'active').length;
      document.getElementById('suspendedCompanies').textContent = companies.filter(c => c.status === 'suspended').length;
      document.getElementById('totalUsers').textContent = allUsers.length;
    }

    function renderTable() {
      const tbody = document.getElementById('companiesTableBody');
      if (!companies.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="py-6 text-center text-slate-500">No companies found</td></tr>';
        return;
      }
      let html = '';
      companies.forEach(c => {
        const statusColor = c.status === 'active' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400';
        const userCount = allUsers.filter(u => u.company_id === c.id).length;
        html += `<tr class="hover:bg-slate-800/30">
          <td class="py-2 px-3 text-white font-medium">${escapeHtml(c.company_name || c.name || 'Unnamed')}</td>
          <td class="py-2 px-3 text-[10px] font-mono text-violet-400">${escapeHtml(c.company_code || '-')}</td>
          <td class="py-2 px-3 text-[10px] text-slate-400">${escapeHtml(c.domain || '-')}</td>
          <td class="py-2 px-3"><span class="text-[10px] px-1.5 py-0.5 rounded ${statusColor}">${c.status || 'unknown'}</span></td>
          <td class="py-2 px-3 text-xs text-white">${userCount}</td>
          <td class="py-2 px-3">
            <button onclick="editCompany(${c.id})" class="text-[10px] text-violet-400 hover:text-violet-300 mr-1.5">Edit</button>
            <button onclick="toggleCompanyStatus(${c.id})" class="text-[10px] ${c.status === 'active' ? 'text-red-400' : 'text-emerald-400'} hover:underline">${c.status === 'active' ? 'Suspend' : 'Activate'}</button>
          </td>
        </tr>`;
      });
      tbody.innerHTML = html;
    }

    function activeTabFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const tab = params.get('tab') || 'list';
      switchTab(tab);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('bg-violet-600', b.dataset.tab === tab);
        b.classList.toggle('text-white', b.dataset.tab === tab);
        b.classList.toggle('text-slate-400', b.dataset.tab !== tab);
      });
      ['list','admins','usage'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab);
      });
    }

    function showAddCompany() { showToast('Add company form - coming soon'); }
    function editCompany(id) { showToast(`Edit company #${id} - coming soon`); }
    async function toggleCompanyStatus(id) {
      try {
        await apiFetch(`/api/companies/${id}/toggle-status`, { method: 'POST' });
        showToast('Status updated');
        await loadCompanies();
        renderTable();
      } catch(e) { showToast(e.message, true); }
    }

    function escapeHtml(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
    init();
  </script>
</body></html>
