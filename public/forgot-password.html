<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; } .card { max-width: 480px; margin: 72px auto; padding: 32px; border-radius: 24px; background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(148, 163, 184, 0.14); box-shadow: 0 32px 100px rgba(15, 23, 42, 0.55); }</style>
</head>
<body>
  <div class="card">
    <h1 class="text-3xl font-bold mb-3 text-white">Forgot password?</h1>
    <p class="text-sm text-slate-400 mb-6">Enter your email address and we’ll send you a secure reset link.</p>
    <form id="forgotPasswordForm" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-300 mb-2" for="forgotEmail">Email</label>
        <input id="forgotEmail" type="email" required class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-white outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20">
      </div>
      <div id="forgotError" class="text-sm text-red-400 min-h-[1.25rem]"></div>
      <button type="submit" class="w-full rounded-2xl bg-violet-500 px-4 py-3 text-sm font-semibold text-white hover:bg-violet-400 transition">Send reset link</button>
    </form>
    <p class="text-xs text-slate-500 mt-5">Remembered your password? <a href="/login.html" class="text-violet-400 hover:text-violet-300 underline">Sign in</a></p>
  </div>
  <script type="module" src="/js/forgot-password.js"></script>
</body>
</html>
