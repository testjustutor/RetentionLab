<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Engine Terminal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        slate: { 850: '#141E33', 900: '#0F172A', 950: '#020617' }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="./css/bot.css">
    <script src="./js/bot.js"></script>
</head>
<body class="antialiased font-sans p-2 sm:p-4">
    <div class="max-w-6xl mx-auto flex flex-col gap-4">
        <!-- Header -->
        <header class="flex items-center gap-3 bg-slate-900/60 backdrop-blur-md rounded-xl border border-slate-800/80 shadow-md p-3 shrink-0">
            <div class="inline-flex items-center justify-center p-2 bg-indigo-500/10 rounded-lg border border-indigo-500/20 shadow-[0_0_15px_rgba(99,102,241,0.15)] shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
            </div>
            <div class="flex-1">
                <h1 class="text-lg font-bold tracking-tight text-white mb-0.5 leading-tight">Bot Engine Console</h1>
                <p class="text-slate-400 text-xs truncate">Monitor real-time orchestrator instances, system telemetry, and active recording bots.</p>
            </div>
            <div class="flex gap-2">
                <a href="/schedule-intelligence.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg transition-colors text-xs font-semibold flex items-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    Schedule
                </a>
            </div>
        </header>

        <!-- KPI Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 shrink-0">
            <div class="bg-slate-900/60 backdrop-blur-md rounded-xl p-4 border border-indigo-500/30 shadow-md shadow-indigo-500/5 flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-1">Status</p>
                    <p class="text-white text-xl font-bold font-sans flex items-center gap-2">
                        <span class="relative flex h-2.5 w-2.5">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                        </span>
                        <span id="statusText"></span>
                    </p>
                </div>
                <div class="p-2.5 bg-indigo-500/10 text-indigo-400 rounded-lg hidden sm:block">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
                </div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-md rounded-xl p-4 border border-slate-800/80 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-1">Active Bots</p>
                    <p id="kpiActiveBots" class="text-white text-xl font-bold font-sans">3 / 50</p>
                </div>
                <div class="p-2.5 bg-blue-500/10 text-blue-400 rounded-lg hidden sm:block">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/></svg>
                </div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-md rounded-xl p-4 border border-slate-800/80 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-1">GPU Compute</p>
                    <p id="kpiGpuCompute" class="text-white text-xl font-bold font-sans text-emerald-400">14%</p>
                </div>
                <div class="p-2.5 bg-emerald-500/10 text-emerald-400 rounded-lg hidden sm:block">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                </div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-md rounded-xl p-4 border border-slate-800/80 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-[10px] font-mono font-medium uppercase tracking-widest mb-1">Task Queue</p>
                    <p id="kpiTaskQueue" class="text-white text-xl font-bold font-sans">0</p>
                </div>
                <div class="p-2.5 bg-amber-500/10 text-amber-400 rounded-lg hidden sm:block">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                </div>
            </div>
        </div>

        <!-- Terminal & Active Bots -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 h-[550px] lg:h-[calc(100vh-220px)]">
            <!-- Left: Live Terminal -->
            <div class="lg:col-span-8 bg-black/80 backdrop-blur-md rounded-xl border border-slate-800/80 shadow-md flex flex-col h-full overflow-hidden relative group">
                <div class="absolute inset-0 bg-gradient-to-b from-blue-500/5 to-transparent pointer-events-none opacity-50"></div>
                <div class="p-3 border-b border-slate-800/80 flex items-center justify-between bg-slate-900/50 z-10 shrink-0">
                    <div class="flex items-center gap-2">
                        <div class="flex gap-1.5 ml-1 mr-3">
                            <div class="w-2.5 h-2.5 rounded-full bg-rose-500/50"></div>
                            <div class="w-2.5 h-2.5 rounded-full bg-amber-500/50"></div>
                            <div class="w-2.5 h-2.5 rounded-full bg-emerald-500/50"></div>
                        </div>
                        <span class="text-xs font-mono text-slate-400 font-medium tracking-wide">engine_tty1</span>
                    </div>
                    <div class="flex gap-2">
                        <button class="px-2.5 py-1 text-[10px] uppercase tracking-wider font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 rounded flex items-center gap-1 hover:bg-emerald-500/20 transition">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg> Run
                        </button>
                        <button class="px-2.5 py-1 text-[10px] uppercase tracking-wider font-bold text-rose-400 bg-rose-500/10 border border-rose-500/30 rounded flex items-center gap-1 hover:bg-rose-500/20 transition">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg> Halt
                        </button>
                    </div>
                </div>
                <div id="terminal" class="p-4 font-mono text-[11px] leading-relaxed overflow-y-auto terminal-scroll flex-1 z-10 relative">
                    <!-- Logs injection -->
                </div>
            </div>

            <!-- Right: Active Bots List -->
            <div class="lg:col-span-4 bg-slate-900/60 backdrop-blur-md rounded-xl border border-slate-800/80 shadow-md flex flex-col h-full overflow-hidden">
                <div class="p-3 border-b border-slate-800/60 bg-slate-800/30 shrink-0">
                    <h2 class="text-slate-200 font-semibold flex items-center gap-2 text-[11px] uppercase tracking-wide">
                        <svg class="w-3.5 h-3.5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        Workers Fleet
                    </h2>
                </div>
                <div id="workersList" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2 relative">
                    <!-- Dynamic workers rendered here -->
                </div>
            </div>
        </div>
    </div>
</body>
</html>
