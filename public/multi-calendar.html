<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-User Google Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .auth-section, .users-section {
            background: #f0f4ff;
            border: 2px solid #667eea;
        }

        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin: 5px 5px 5px 0;
            transition: background 0.3s;
        }

        .button:hover {
            background: #764ba2;
        }

        .button.secondary {
            background: #6c757d;
        }

        .button.secondary:hover {
            background: #5a6268;
        }

        .button.danger {
            background: #dc3545;
        }

        .button.danger:hover {
            background: #c82333;
        }

        .button.success {
            background: #28a745;
        }

        .status {
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
        }

        .status.success {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            border: 1px solid #dc3545;
            color: #721c24;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            border: 1px solid #0c5460;
            color: #0c5460;
            display: block;
        }

        .user-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            flex: 1;
        }

        .user-email {
            font-weight: bold;
            color: #333;
        }

        .user-status {
            font-size: 0.9em;
            color: #666;
        }

        .meeting-card {
            background: #f8f9fa;
            border-left: 4px solid #28a745;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .meeting-title {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }

        .meeting-details {
            color: #666;
            font-size: 0.95em;
            margin: 8px 0;
        }

        .meeting-details span {
            display: inline-block;
            margin-right: 15px;
        }

        .meeting-platform {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.85em;
            font-weight: bold;
            margin-top: 10px;
        }

        .platform-zoom { background: #0b5cff; color: white; }
        .platform-teams { background: #6264a7; color: white; }
        .platform-google { background: #ea4335; color: white; }
        .platform-webex { background: #00c8d7; color: white; }
        .platform-gotomeeting { background: #ff6b35; color: white; }
        .platform-unknown { background: #999; color: white; }

        .meetings-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .form-group {
            margin: 15px 0;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-style: italic;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👥 Multi-User Google Calendar</h1>
        <p class="subtitle">Manage multiple Google accounts independently</p>

        <!-- Connect New User -->
        <div class="section auth-section">
            <h2>➕ Connect New Google Account</h2>
            <div class="form-group">
                <label for="newUserEmail">Google Account Email:</label>
                <input type="email" id="newUserEmail" placeholder="user@gmail.com" required>
            </div>
            <button class="button" onclick="connectNewUser()">Connect Account</button>
            <div id="connectMessage" class="status"></div>
        </div>

        <!-- Connected Users -->
        <div class="section users-section">
            <h2>📋 Connected Accounts (<span id="userCount">0</span>)</h2>
            <div id="usersList"></div>
        </div>

        <!-- Per-User Calendar View -->
        <div id="userCalendarView" class="section hidden">
            <h2 id="currentUserTitle">Select a user to view calendar</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="hoursAhead">Look Ahead (hours):</label>
                    <input type="number" id="hoursAhead" value="24" min="1" max="168">
                </div>
                <div class="form-group">
                    <label for="platformFilter">Filter Platform:</label>
                    <select id="platformFilter">
                        <option value="">All</option>
                        <option value="zoom">Zoom</option>
                        <option value="teams">Teams</option>
                        <option value="google-meet">Google Meet</option>
                        <option value="webex">Webex</option>
                        <option value="gotomeeting">GoTo</option>
                    </select>
                </div>
            </div>
            <button class="button" onclick="fetchUserMeetings()">🔄 Refresh Meetings</button>
            <div id="loadingIndicator" class="loading hidden">
                <span>⏳ </span><span id="loadingText">Loading...</span>
            </div>
            <div id="meetingsList" class="meetings-list"></div>
            <div id="quickJoinArea" style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
                <h3>Bot Status</h3>
                <div id="quickJoinMessage" class="status"></div>
            </div>
        </div>
    </div>

    <script>
        let users = []; // Loaded from /api/calendar/multi/users
        let currentUser = null;

        function updateUserList() {
            const countEl = document.getElementById('userCount');
            const listEl = document.getElementById('usersList');
            countEl.textContent = users.length;

            if (users.length === 0) {
                listEl.innerHTML = '<p style="text-align: center; color: #999;">No connected accounts. Connect your first Google account above.</p>';
                return;
            }

            let html = '';
            users.forEach((user, index) => {
                html += `
                    <div class="user-card">
                        <div class="user-info">
                            <div class="user-email">${user.email}</div>
                            <div class="user-status">Account: ${user.accountName} ${user.authorized ? '✅ Authorized' : '⚠️ Pending'}</div>
                        </div>
                        <div>
                            <button class="button" onclick="selectUser(${index})">👁️ View Calendar</button>
                            <button class="button danger" onclick="disconnectUser(${index})">❌ Disconnect</button>
                            <button class="button secondary" onclick="checkUserStatus(${index})">🔍 Status</button>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        async function connectNewUser() {
            const email = document.getElementById('newUserEmail').value.trim();
            if (!email) {
                showMessage('connectMessage', 'error', 'Enter email first');
                return;
            }

            if (users.find(u => u.email === email)) {
                showMessage('connectMessage', 'error', 'Account already connected');
                return;
            }

            try {
                showMessage('connectMessage', 'info', 'Generating auth URL...');
                const response = await fetch('/api/calendar/multi/auth', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ email })
                });
                const data = await response.json();

                if (data.status === 'success' && data.url) {

                    const width = 600, height = 700;
                    const left = (window.innerWidth / 2) - (width / 2);
                    const top = (window.innerHeight / 2) - (height / 2);

                    const popup = window.open(
                                    data.url, 
                                    'googleAuth', 
                                    `width=${width},height=${height},left=${left},top=${top}`
                                );
                    if (!popup) {
                        showMessage('connectMessage', 'error', 'Popup blocked! Allow popups.');
                        return;
                    }

                    // Add pending user
                    const newUser = { 
                        email: email, 
                        accountName: email.split('@')[0], 
                        authorized: false, 
                        connectedAt: Date.now() 
                    };
                    users.push(newUser);
                    const userIndex = users.length - 1; // Store current index
                    updateUserList();

                    // Poll status
                    const poll = setInterval(async () => {
                        await checkUserStatus(userIndex);
                        if (users[userIndex].authorized) {
                            clearInterval(poll);
                            showMessage('connectMessage', 'success', 'Account connected!');
                        }
                    }, 3000);
                    setTimeout(() => clearInterval(poll), 60000);

                } else {
                    showMessage('connectMessage', 'error', data.message);
                }
            } catch (err) {
                showMessage('connectMessage', 'error', err.message);
            }
        }

        async function checkUserStatus(index) {
            try {
                const res = await fetch('/api/calendar/multi/users');
                const data = await res.json();
                const remoteUser = data.data.find(u => u.email === users[index].email);
                if (remoteUser && remoteUser.tokenExpiry) {
                    users[index].authorized = true;
                    updateUserList();
                }
            } catch (e) { console.error(e); }
        }

        function selectUser(index) {
            currentUser = users[index];
            document.getElementById('currentUserTitle').textContent = `📅 ${currentUser.email}'s Calendar`;
            document.getElementById('userCalendarView').classList.remove('hidden');
            fetchUserMeetings();
        }


        function handleQuickJoin(el) {
            const meetingId = el.dataset.id;
            const passcode = el.dataset.pass;
            const meetingUrl = el.dataset.link;
            const platform = el.dataset.platform;

            quickJoinMeeting(meetingId, passcode, meetingUrl, platform);
        }

        // --- QUICK JOIN LOGIC (Integrated) ---

        async function quickJoinMeeting(meetingId, passcode, meetingUrl, platform) {
            try {
                // We use the email of the currently selected user
                const account = currentUser.email;
                
                console.log('Quick Join Debug:', { meetingId, passcode, platform, account });
                
                showMessage('quickJoinMessage', 'info', 'Sending credentials to bot...');

                const response = await fetch('/api/bot/start-bot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        platform: platform, 
                        meetingId: meetingId,
                        passcode: passcode,
                        meetingUrl: meetingUrl
                    })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    showMessage('quickJoinMessage', 'success',
                        `✅ Bot Started!\nMeeting ID: ${meetingId}\nAccount: ${account}`);
                    
                    setTimeout(() => fetchUserMeetings(), 2000);
                } else {
                    showMessage('quickJoinMessage', 'error', data.message);
                }
            } catch (err) {
                showMessage('quickJoinMessage', 'error', 'Error: ' + err.message);
            }
        }

        async function fetchUserMeetings() {
            if (!currentUser) return;
            try {
                showLoading('loadingIndicator', 'Loading meetings for ' + currentUser.email);
                const hours = document.getElementById('hoursAhead').value;
                const platform = document.getElementById('platformFilter').value;
                let url = '/api/calendar/multi/events';
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: currentUser.email,
                        hoursAhead: hours,
                        platform: platform || ''
                    })
                });
                const data = await res.json();
                hideLoading('loadingIndicator');
                if (data.status === 'success') {
                    displayMeetings(data.events || data.data?.meetings || []);
                } else {
                    document.getElementById('meetingsList').innerHTML = `<div class="status ${data.status}">${data.message}</div>`;
                }
            } catch (err) {
                hideLoading('loadingIndicator');
                document.getElementById('meetingsList').innerHTML = `<div class="status error">Error: ${err.message}</div>`;
            }
        }

        function displayMeetings(meetings) {
            let html = '';
            const listEl = document.getElementById('meetingsList');

            if (!meetings || meetings.length === 0) {
                listEl.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">No upcoming meetings found for this period.</p>';
                return;
            }

            // Sort meetings by start time just in case the API doesn't
            meetings.sort((a, b) => new Date(a.start) - new Date(b.start));

            meetings.forEach(meeting => {
                // 1. Better Date Formatting (Cleaner than default toLocaleString)
                const dateObj = new Date(meeting.start);
                const startTime = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const startDate = dateObj.toLocaleDateString([], { month: 'short', day: 'numeric' });

                const platform = (meeting.platform || 'unknown').toLowerCase();
                const platformClass = `platform-${platform}`;
                
                // 2. Safely handle missing IDs/Passcodes
                const meetingId = meeting.meetingId || "";
                const passcode = meeting.passcode || "";
                const meetingLink = meeting.link || "";
                
                const meetingInfo = meetingId 
                    ? `ID: ${meetingId}${passcode ? ` (pwd: ${passcode})` : ''}` 
                    : 'Join via link';

                html += `
                    <div class="meeting-card">
                        <div class="meeting-title">${meeting.title || 'Untitled Meeting'}</div>
                        <div class="meeting-details">
                            <span>📅 <strong>${startDate}</strong> at ${startTime}</span>
                            <span class="meeting-platform ${platformClass}" style="margin-top:0; font-size: 0.75em;">${platform.toUpperCase()}</span>
                        </div>
                        <div class="meeting-details">
                            <span style="font-family: monospace; background: #eee; padding: 2px 5px; border-radius: 3px;">🔑 ${meetingInfo}</span>
                        </div>
                        
                        <div style="margin-top: 12px; display: flex; gap: 10px; align-items: center;">
                            ${meetingLink ? `
                                <a href="${meetingLink}" target="_blank" class="button secondary" style="text-decoration: none; padding: 5px 12px; font-size: 0.85em;">
                                    🔗 Open Link
                                </a>` : ''}
                            
                            ${/* 3. Enable Bot Join for Zoom and Teams (if supported) */
                            (platform === 'zoom' || platform === 'google-meet' || platform === 'teams') ? `
                                <button class="button success"
                                    data-id="${meetingId}"
                                    data-pass="${passcode}"
                                    data-link="${meetingLink}"
                                    data-platform="${platform}"
                                    onclick="handleQuickJoin(this)">
                                    ⚡ Join Bot
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
            
            listEl.innerHTML = html;
        }

        function disconnectUser(index) {
            if (!confirm(`Disconnect ${users[index].email}?`)) return;

            const email = users[index].email;

            fetch('/api/calendar/multi/users/disconnect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            }).then(() => {

                users = users.filter(u => u.email !== email);

                if (currentUser?.email === email) {
                    currentUser = null;
                    document.getElementById('userCalendarView').classList.add('hidden');
                }

                updateUserList();
            });
        }

        function showMessage(id, type, msg) {
            const el = document.getElementById(id);
            el.className = `status ${type}`;
            el.textContent = msg;
        }

        function showMessageForUser(index, type, msg) {
            showMessage('connectMessage', type, `${users[index].email}: ${msg}`);
        }

        function showLoading(id, text) {
            const el = document.getElementById(id);
            el.classList.remove('hidden');
            document.getElementById('loadingText').textContent = text;
        }

        function hideLoading(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // Load users from API on page load
        window.addEventListener('load', async () => {
            try {
                const res = await fetch('/api/calendar/multi/users');
                const data = await res.json();
                if (data.status === 'success') {
                    users = data.data.map(u => ({
                        email: u.email,
                        authorized: u.tokenExpiry !== null,
                        accountName: u.email.split('@')[0]
                    }));
                }
                updateUserList();
            } catch (err) {
                console.error('Failed to load users:', err);
            }
        });
    </script>
</body>
</html>
