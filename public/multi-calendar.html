<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Manager</title>
    <link rel="stylesheet" href="css/calendar.css">
</head>
<body>
    <div class="container">
        <header class="main-header">
            <h1>Independent Calendars</h1>
            <p class="subtitle">Securely manage multiple Google Workspace accounts</p>
        </header>

        <div class="section auth-section">
            <div class="section-header">
                <span class="icon">➕</span>
                <h2>Add Account</h2>
            </div>
            <div class="input-group">
                <input type="email" id="newUserEmail" placeholder="Enter Google email address" required>
                <button class="button primary" onclick="connectNewUser()">Connect</button>
            </div>
            <div id="connectMessage" class="status"></div>
        </div>

        <div class="content-grid">
            <div class="section list-section">
                <h3>Connected Accounts (<span id="userCount">0</span>)</h3>
                <div id="usersList" class="user-stack"></div>
            </div>

            <div id="userCalendarView" class="section view-section hidden">
                <div class="view-header">
                    <h2 id="currentUserTitle">Agenda</h2>
                    <button class="refresh-btn" onclick="fetchUserMeetings()">Refresh</button>
                </div>

                <div class="filters">
                    <div class="filter-item">
                        <label>Range</label>
                        <input type="number" id="hoursAhead" value="24">
                    </div>
                    <div class="filter-item">
                        <label>Platform</label>
                        <select id="platformFilter">
                            <option value="">All Meetings</option>
                            <option value="zoom">Zoom</option>
                            <option value="teams">Teams</option>
                            <option value="google-meet">Meet</option>
                        </select>
                    </div>
                </div>

                <div id="loadingIndicator" class="loading hidden">
                    <div class="spinner"></div>
                </div>
                
                <div id="meetingsList" class="meetings-container"></div>
            </div>
        </div>
    </div>
    <script src="js/calendar.js"></script>
</body>
</html>
