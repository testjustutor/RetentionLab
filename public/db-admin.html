<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗄️ Database Admin</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="container">
  <div class="header">
    <h2>🗄️ Database Admin</h2>
    <p>Live DB Viewer</p>
  </div>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <select id="tableSelect"></select>
    <button onclick="loadTables()">Load</button>
    <button class="refresh" onclick="refreshData()">Refresh</button>
    <button class="danger" onclick="clearTable()">Clear</button>
    <button onclick="exportCSV()">Export</button>
    <button onclick="executeQuery()">SQL</button>
    <span id="lastUpdated"></span>
  </div>
  <div class="table-container">
    <div id="loading" class="loading" style="display:none">
      <div class="spinner"></div>
      Loading...
    </div>
    <div id="error" class="error" style="display:none"></div>
    <div id="data"></div>
  </div>
</div>
<script src="js/admin.js"></script>
</body>
</html>
