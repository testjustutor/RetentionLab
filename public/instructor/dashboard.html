<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="dashboard-role" content="solo_instructor">
    <title>Dashboard - Instructor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="../js/instructor/tailwind-config.js"></script>
    <link rel="stylesheet" href="../css/shared.css">
</head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
    <div class="flex-1 flex flex-col overflow-hidden">
        <div id="header-placeholder"></div>
        <div class="flex-1 overflow-x-hidden overflow-y-auto p-6 bg-slate-950">
            <div class="flex-1 overflow-auto custom-scrollbar relative">
                <div class="p-6">
 <h1 class="text-2xl font-bold mb-4">Dashboard</h1>
                    <p class="text-slate-400 mb-6">Provides a complete overview of meeting activity, generated content, evaluations, and performance metrics.</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                        <div class="bg-slate-800/50 border border-slate-700/50 rounded-lg p-4">
                            <h3 class="text-sm font-medium text-slate-400 mb-2">Upcoming Meetings</h3>
 <p class="text-2xl font-bold ">0</p>
                        </div>
                        <div class="bg-slate-800/50 border border-slate-700/50 rounded-lg p-4">
                            <h3 class="text-sm font-medium text-slate-400 mb-2">Meetings This Week</h3>
 <p class="text-2xl font-bold ">0</p>
                        </div>
                        <div class="bg-slate-800/50 border border-slate-700/50 rounded-lg p-4">
                            <h3 class="text-sm font-medium text-slate-400 mb-2">Average Score</h3>
 <p class="text-2xl font-bold ">-</p>
                        </div>
                        <div class="bg-slate-800/50 border border-slate-700/50 rounded-lg p-4">
                            <h3 class="text-sm font-medium text-slate-400 mb-2">Content Generated</h3>
 <p class="text-2xl font-bold ">0</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-slate-800/50 border border-slate-700/50 rounded-lg p-4">
 <h3 class="text-lg font-semibold mb-3">Recently Processed Meetings</h3>
                            <p class="text-slate-400 text-sm">No recent meetings</p>
                        </div>
                        <div class="bg-slate-800/50 border border-slate-700/50 rounded-lg p-4">
 <h3 class="text-lg font-semibold mb-3">Recent Evaluations</h3>
                            <p class="text-slate-400 text-sm">No recent evaluations</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/js/auth.js"></script>
    <script src="../js/load-components.js"></script>
</body>
</html>
