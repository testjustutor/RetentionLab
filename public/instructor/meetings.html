<!DOCTYPE html>
<html lang="en" class="dark">
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="dashboard-role" content="solo_instructor">
  <title>Meetings - Instructor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/shared.css">
  </head>
<body class="min-h-screen bg-slate-100 text-slate-100 antialiased">
<div class="flex h-screen"><div id="sidebar-placeholder"></div>
<div class="flex-1 flex flex-col overflow-hidden">
<div id="header-placeholder"></div>
<main class="flex-1 overflow-x-hidden overflow-y-auto p-4 bg-slate-100">
<div class="flex items-center justify-between mb-4"><div>
<h1 class="text-2xl font-bold ">Meetings</h1>
<p class="text-sm text-slate-400">All meetings synced from your connected Google Calendar</p>
</div></div>
<div id="statsRow" class="grid grid-cols-3 gap-3 mb-4">
<div class="rounded-xl bg-slate-900 border border-slate-800 p-4">
<p class="text-[12px] text-slate-400 uppercase tracking-wide">Upcoming</p>
<h3 class="text-2xl font-bold text-violet-400 mt-1" id="stat-upcoming">-</h3>
</div>
<div class="rounded-xl bg-slate-900 border border-slate-800 p-4">
<p class="text-[12px] text-slate-400 uppercase tracking-wide">Live Now</p>
<h3 class="text-2xl font-bold text-amber-800 mt-1" id="stat-live">-</h3>
</div>
<div class="rounded-xl bg-slate-900 border border-slate-800 p-4">
<p class="text-[12px] text-slate-400 uppercase tracking-wide">Completed</p>
<h3 class="text-2xl font-bold text-emerald-400 mt-1" id="stat-completed">-</h3>
</div>
</div>
<div class="flex gap-2 mb-4">
<button data-tab="upcoming" class="tab-btn active text-xs font-medium px-4 py-2 rounded-md transition-colors">Upcoming</button>
<button data-tab="live" class="tab-btn text-xs font-medium px-4 py-2 rounded-md transition-colors">Live</button>
<button data-tab="completed" class="tab-btn text-xs font-medium px-4 py-2 rounded-md transition-colors">Completed</button>
</div>
<div id="meetingsList" class="space-y-3"><p class="text-sm text-slate-500">Loading...</p></div>
<div id="emptyState" class="hidden text-center py-12"><p class="text-slate-400 text-sm">No meetings found for this period.</p></div>
</main></div></div>
  <script type="module" src="/js/auth.js"></script>
  <script src="../js/load-components.js"></script>
  <!-- FIX: this page-specific logic used to be an inline <script type="module">
       block here; extracted to js/instructor/meetings.js to match the
       one-external-file-per-page convention used everywhere else. -->
  <script type="module" src="../js/instructor/meetings.js"></script>
</body>
</html>
